body:
  text: 第六十四卷墓志銘資政殿學士李公墓銘右朝議大夫致仕朝公墓志銘朝奉大夫提舉京東路保馬兼保甲事楊公墓志銘朝請大夫致仕陳君墓志銘朝散大夫提舉河北糴便糧草高公墓志銘太常少卿分司西京石君墓志銘文安郡君陳氏墓志銘安康郡君龐氏墓志銘錢唐縣君葉氏墓志銘駕部員外郎李君墓志銘濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第六十四墓志銘資政殿學士李公墓銘惟天生才於世之平氣蒸為祥卿雲景星降而在人中和炳明仁宗大德好生如天天為衮衮生才與賢如泉不盡遺其後昆逮於英宗旁招洽聞公於是時海運鵬騫神宗稽古出百王上上以文求公以儒往國有誥令公口出之國有政事公手裁之公豈能然曰上所知至於哲宗亦再用公惟天子聖我祖􅊲同三朝是毗歷三省闥小心長慮白首一節不流於信不躓於疑皇建其極五福是施惟君舟之柔是胡越又何濟之惟公其楫開是大同至於式序天子萬年公有令譽右朝議大夫致仕朝公墓志銘元祐元年三月甲戌右朝議大夫致仕上柱國南陽縣開國伯食邑七百户賜紫金魚袋朝公卒卜紹聖三年正月丙申吉葬于濟州任城縣諫議鄉呂村之原諸孤聚而言曰我君樂善好義而畏人知詩固有之曰相在爾室尚不愧于屋漏又曰君子無昜􅒘言耳屬于垣圖我君之言行雖州閭懼莫之盡惟垣屋漏其不可欺諸孤尚識之乃相與諉公之壻承議郎知開封府祥符縣事王仲博敘次世家爵里行事而以告其族孫補之使銘曰凡親者亦不可欺也補之涕泣言曰以屬卑且不肖則何敢謂宜抑毋使公之事墜于地則誄且稱諱亦不得辭也公諱仲熙字子政其先澶州清豐人後徙開封祥符贈太師中書令諱某曽王父也贈太師中書令諡文元諱某王父也贈金紫光祿大夫諱某父也光祿娶趙氏南安郡夫人繼趙氏南陽郡夫人而公南安出也文元公以儒宗耆老令德事真宗為翰林學士賞延其孫初授公將作監主簿遷太常寺太祝監單州酒即以才稱故宰相王公圭為三司判官亟薦之再監鄧州酒歷評事光祿大理丞撤酤區復牆鈎撿出入摘其積年姧蠧皆不得隱課乃大登應賞不自言且當為縣矣而以南陽夫人隨季官河間復監瀛州倉便養嵗得圭田粟數百斛以分其同列之無者又監泗州稅淮溢浸城且壞守以下皆乘城捍淮公力居多以勞選通判憲州州近塞守武臣喜爭公獨與歡而於事未始屈凡金榖犴獄纖悉疑似皆隂為辨而守不知也徙通判鄭州復州皆有聲歷太子右贊善大夫國子博士虞部比部駕部員外郎監店宅務左藏庫遷虞部比部郎中知均州改朝散朝請大夫民有偽稱官者自云給事公府齎供武當山飰僧所過邀饋犒初謁見公公即知其欺語吏隨至館捕之得偽御寶文書以抵法逺近皆驚判南京國子監遷右朝議大夫管句鴻慶宫監東嶽南嶽廟皆寓濉陽凡十餘年杜門蕭散幅巾燕坐樵蘇不入而幾微未嘗見於色故人親戚過者為公歎息而公意不在是怡然自得若顧南山言爽氣者聞之莊周稱北郭順子使人之意也消補之不能名順子何如人而對公未語胸中之膠擾者已定譬諸飲氷內熱立解順塗而往知古人之所以近於道者必有在也享年六十有八娶張氏崇德縣君男端弼登進士弟朝請郎端介宣德郎端修太平令端粹虞城尉端厚假承務郎女長適王仲博狀公行者也次適通直郎通判安州鄭猛次適羅田尉高道華次適相州録事參軍高公秉孫十人曰資之登進士弟相州司理參軍順之完之頌之葵之述之疑之頡之蓻之槱之未仕曽孫一人曰公紹公少孤事南陽以孝聞篤愛其弟有人所難能者為人忠信平夷寬裕不矜伐趨事靜以敏自奉養儉薄而遇人之急至解衣賙之恐不足其罷均州尚強即求散局不以家空竭為慮尤不喜權其樂彼與此同而自謂得於此者多也昔文元公嘗言吾自幼及老歷官臨事未嘗挾情害物傾人售進其晚節著書垂訓多慎刑戒殺之意而公性中和敬人而愛物蓋近文元之風自南陽殁凡三十年其院無期喪康寧令終人以為積善之報云銘曰道不可知而恬愈者常近之不偽者幾得之其嗜欲深者其天機淺鷗舞不下肺肝已見若此者其生世役役沒世有餘患嗚呼公乎厚性近仁誠應乎真生無纍於明其安者身沒無責於幽其安者神粵天所以爵人者不惟其貴惟其德視後之人朝奉大夫提舉京東路保馬兼保甲事楊公墓志銘公楊氏諱景芬字祖德河南府洛陽人也其系蓋出漢太尉震而坊州司馬贈尚書左丞慶者生子偕少知名其學長於論議剛直廉潔而愛人事昭陵為翰林侍讀學士其弟任幼而樂誼不及仕以卒生子恂為奉寧節度推官贈通議大夫退儉不矜伐兩世宜大矣皆以不期人知人亦莫知之以鍾其慶于後而生公公端靜而開警內剛而外和敏於從政善與人交薰然忠厚君子也少治春秋未嘗與人言遇事發其論議亹亹不可窮以侍讀任為試挍書郎調定陶主簿曹州司理真符今改大理丞七遷至朝奉大夫勳上輕車都尉服三品嘗知永城縣事知化州事通判亳定二州擢石塘催綱都水句當公事提舉淮南折納河北東路常平京東保馬保甲皆有能聲化州並海亡城郭嵗賦竹葦為藩颶風至飄卷為虛居者不安民疲于賦且土疏不可城君奏乞庫錢百萬陶甓城之嵗以無患海旁諸州皆圖去為式宣徽馮公京守亳事無大小皆諉公公為一二裁處而隂推其意於守若不自己出者馮公心善之定守多重臣尚威通判視簿書無可否公曰州事吾職也豈出位者有害于理戾于法者爭之帥憲肅韓公絳亦深知公其領淮南折納諸路皆有使及還爭求對冀得遷公曰事隸有司且復命矣尚求對何為獨不求對河北前常平官庸人騖功文檄山委州縣不能應則被譴去公至省十七八諭州縣以法如此户部反詆其不如法請罷公然朝廷益知之會得疾卒元祐二年正月十一日也享年六十一以元祐七年某月某日葬于河南府洛陽縣平洛鄉張封村從通議公之兆夫人張氏某縣君子規雲安軍司理夫郊社齋郎二女長適進士孟安幼未行公事後母以孝聞廩入不私楊氏之吉凶禮事皆資焉尤為太師文公司空呂公所知補之聞之孔子曰士任重而道逺仁以為巳任不亦重乎死而後已不亦逺乎天下之求於聖人之言者過而期於士者薄曰仁必伯夷必顔淵故後世之為仁者微孔子不云乎茍能一日用其力於仁矣乎我未見力不足者夫能一日用其力於仁而孔子與其無不足則自斯而往曰是可與為士矣可與任重而道逺矣何不可哉楊公始於事親而親安之以施其族人而稱慈行已則人愛其政之在民者民不忘也其庶乎所謂求仁莫近者非邪補之先君與公善初補之教授北京國子監貧無以葬先君公問所乏賙其半乃克葬而公未始以為德也今公葬矣補之不能身相事尚忍銘公然以謂其故舊銘之耶則非公之故舊有信之者矣銘曰德藏于中故人不知人不知者天知之天實知之其後昌有時朝請大夫致仕陳君墓志銘君陳氏諱知和字德時按其譜博州人也六世祖翔唐末從事成都府王建有異志翔屢沮之廢居閬州之西水孟昶以蜀歸曽祖諱省華始來自蜀為祥符人仕本朝為左諫議大夫有能聲贈太師尚書令兼中書令秦國公秦公生三子皆以儒學擢高第位將相有勳勞於國樞密使尚書右僕射同中書門下平章事贈太師尚書令兼中書令英國公諡文忠諱堯叟君祖也英公生尚書都官郎中贈金紫光祿大夫諱師古光祿生君光祿前夫人賈氏永年縣君後夫人潘氏安福縣君而君寧國縣太君賀氏出也光祿當任子以與其族人而君從祖太尉康肅公方觀察宿州任君右班殿直及長知書歎曰吾家世如是吾父教我以學何如而吾可用此進耶乃上書願易所得官從左選仁宗嘉其意且以其文忠後從之初調河陽節度推官事四守梁適李淑張觀蘇紳皆當時顯人其趣操不必同而君介然若一四人者皆賢之再調寧國軍節度推官竄卒誘耕民剽里中卒殺人民從旁止之傷而免守欲并論民死君爭之力守怒而入君立廡下不去守悟為讞諸朝民果不死遭安福憂免喪擢衛尉丞知硤石縣事縣當陜衝卒苦於役作偽印帖隱民間前令比獲以要賞君一日執六人且嘗度關法應死既不忍以要賞見其尫然誠苦於役者為移文所從來無他過取偽印帖焚之還其役戍兵道縣中羣博犯法邏者執于庭數百人譟縣門且奪之吏趣閉門君徐出坐堂上命開門衆莫敢入因陽叱邏者解縱之既行密疏其名河南府皆正其罪改簽書彰德軍節度判官事未行遭寧國憂免喪遷大理丞知緱氏縣事英宗即位遷右贊善大夫昭陵採石聚兵緱氏城中萬人倉無儲粟而輸者未至君度不可俟報乃下令借富人停粟約與之息匿者沒官令出而辦比輸者至則兵仰食縣者十五日矣事已旁縣吏皆遷而君不自言賞亦不及遷殿中丞又遷國子博士通判果州事神宗即位遷尚書虞部員外郎賜五品服還朝用薦監左藏庫不就通判趙州事遷比部員外郎曽孝寬察訪河北奏君偕行朝廷方議省郡縣寬力役吏希旨爭言可省而乾寧保定順安三軍在議中俾君往視還言沿邉城犬牙相制以利守禦而便轉輸此祖宗深意不可改朝廷然之為不廢三軍中人程昉建言徙漳河洺州使者以君權知洺州董其事漳河役大昉欺朝廷以易集務減人徒人徒以故怨之百餘人燒民廬為暴君盡捕得誅其始謀者八人事且畢會新守至君還趙州昉以君為暴其短乃歸功新守而君亦不辨也丞相王公安石雅知君可用使人諭君歙故難治而朝廷方行法欲以倚君君不得辭擢知歙州事遷駕部員外郎自以不能當執政意至則求間局差管句嵩山崇福宮民上書願留者以千數房州地僻守屢以贓敗又擢知房州事郡阻山城西有溪所從來高望之洶洶在城上舊有堤圯不治餘三十年君議增築不欲調民乃以術招竄卒廩之益以州兵凡用工萬高其舊丈二尺而廣如之人初以為煩會明年溪大漲得堤而定人乃服君奏課京西第一遷虞部郎中擢知泗州事郡當水衝屬霖潦君度淮汳洙泗滿必大下因預為守城備水至浸城且壞吏倉猝不知所為而君規畫素定語吏如此如此城既無虞而民賴以活萬計璽詔奬諭擢提點廣南東路刑獄事改朝奉大夫番禺南粵都會守俸月七萬守方對詔獄君攝州事竟八月當得錢六十萬君不取曰我豈緣人不幸而自裕耶宴賓客為徹樂其忠厚如此遷朝散大夫盜起梅州去治所更四郡君以為道驛而往恐後乃自南雄州絶山倍道﨑嶇茆竹間蒙霧得疾幾殆後良愈因求上印紱時方六十一上即位遷朝請大夫賜三品服勳上柱國為人清慎退約不干權貴善與人交自以無怨惡於人明白立斷所至民愛之善楷隸喜為詩既謝事作燕譽堂於第之西北隅蓋以訓辭名之日從賓客飲酒談笑其間以疾卒夀六十四元祐二年五月丁巳也夫人鄭氏安居縣君男曰適寧鄉縣尉逾鄭州司户適臨河主簿女長適朝散郎潘行次適通直郎王鎮次適道州録事楚沖次適宣德郎周昕幼在室孫男女七人諸孤以君卒之明年七月壬申葬于河南府密縣義臺鄉之武泰岡來求銘銘曰仕可以藉其世而公不賴之進可以遇合而公不競之時未可以去也而公去之事取其先得取其後名處其薄功處其厚造物者報其天不報其人其人不亡在其後子孫朝散大夫提舉河北糴便糧草高公墓志銘君高氏諱旦字子明其先真定府元氏人有諱化者事昭陵為武安軍節度使贈太師中書令尚書令諡恭壯始自元氏徙家祥符贈其父圭左領軍衛上將軍恭壯生莊宅副使惟慶莊宅生君以君贈左武衛上將軍而君亦幼用恭壯蔭為左侍禁世將家喜兵而君不樂以武名自力讀書為文辭遂以皇祐五年及進士第擢太常寺奉禮郎未幾以親憂去免喪知新鄭縣事並郭有瀦水嵗比溺人人以為神祠之君塞焉人以不惑而其患除簽書奉寧軍判官事盜殘人以母篤疾應減死守宋公祁議不貸君曰法如是不可重宋公悟乃止繇此知君纍遷光祿寺丞著作佐郎知臨城縣事臨城人不知學為興庠序教以學來者常百數縣大治至比嵗無死罪囚年飢勸鄉豪貸貧人粟約秋償之人相率赴令纍遷祕書丞太常博士簽書荆南判官事又遷尚書屯田員外郎熙寧中舊臣有薦其才者會復將作監執政議擇丞上曰高旦可既不出執政意而君論事不能阿同列旋以讒去通判保定軍事雄州戍兵過保定邀中使求請銀錢至閉門不得行君往執其為首者喻使去事聞安撫使檄治之君為言衆不可驚卒論為首者而止通判保州事遷都官員外郎元豐中以階易官改朝散郎擢提舉河北常平事初君在荆南嘗論役法非是不報至是復撰成德軍役法上之又不報然朝廷卒改役法纍遷朝散大夫還朝擢提舉河北糴便糧草未行以元祐元年五月十八日感疾卒夀五十七為人孝弟恭寬敏於技能殆其天性得之工為室成指其翼曰是却三寸引繩度之不差人服其精尤長於吏事數上書治平間言契丹所以固吾盟者利幽薊耳願姑無求邉功以俟之又言河北屯田議者欲一切募民耕出租不如倣古以卒耕嵗入厚且及其暇時教以戰其計皆深逺為今太師文公丞相司馬公所知未及用而君亡矣娶馮氏仙源縣君繼楊氏仙居縣君繼文氏福昌縣君今夫人夀安縣君王氏治內有儀法五男子省華卒道華茂華沖華禮華皆未仕三女子長歸蔡州録事參軍張紱餘在室諸孤以君卒之年九月癸酉葬君開封府開封縣大邉村之原補之先君於君為同年進士而王夫人朝出也以是求銘銘曰高奮北方維恭壯虎臣乃及大夫以其文發身而世其昌粵有功在人自昔恭壯卜浚都之南曰考降無有近悔尚爾世不忘視樅柏之美太常少卿分司西京石君墓志銘君石氏諱輅字君乘濮州范縣人也曽祖諱溫祖諱文舉皆不仕考諱嵩益州司理參軍贈工部侍郎工部以明經入官而好文自君幼學則諄諄語之曰汝當以文顯即大感發晝夜誦讀貧無燭至梯屋就月視書無幾何則以詞藝中進士乙科調青州推官改知萊陽縣事縣負海民習為姧利君治明恕賊民多改或遁去康定中夏英公經略西邉奏掌永興書記管句機宜文字方元昊叛君時獻䇿畫多見聽用再從辟涇州渭州用特敕薦改著作佐郎賊圍鎮戎急後騎日益諸將以謂利疾戰且深入牽其勢君起席末言曰賊鋒鋭未可大將葛懷敏怒曰兵因敵而制勝石君安能逆知往先馳之軍盡沒或走入塞者猶道懷敏臨死而悔曰坐以書生待石君至此君既從軍母老與諸子安土不肯行欲解官歸帥惜其才使部尉氏還戍因督送軍衣京東間從范縣過問母或欲以事疵帥者擲其違法坐責監長葛酒稅稍徙知崑山縣事簽書陳州判官通判綿州卭州事會嘉祐間朝廷以諸路計不入詔三司薦可任吏君在書中擢廣濟河輦運廣濟輸尤不計數十年或置或罷君究知其弊奏更法數事軍大將有罪不敢決三司得專治自君始明年東州之粟至京師者百萬石擢知真州又改虔州韓魏公聞其名召至中書與議鹽事以便宜措置虔十邑綿地千里民狡善訟文案如山守堇堇不能省君治不煩而威甚行三獄為空以疾求北歸知光化軍復領輦運移梓州路運判改提點兩浙路刑獄事疾病分司西京熙寧二年七月十八日卒年六十二自佐著作九遷為太常少卿階朝奉郎勳輕車都尉爵河東縣開國男食邑三百户娶孟氏長夀縣君四男子伯宗古內黃尉仲宗彛通直郎季宗彭皆前卒而叔宗夀揚州録事參軍廉平而文能裕其蠱者也君少孤事兄悌遇族人恩嘗請于朝願納兩官授兄一致仕官不行乃以任子恩任兄之孫宗夀卜以元祐八年十月十七日葬君河南府澠池縣大塢鄉鳯皇山之原屬補之銘銘曰親教以學雖淺以聞推此而往可與事親君任以事雖輕以成推此而往可與事君小試必立豈大不能夀貴不稱短窮亦福寧此有餘而彼不足惟此有餘小人無知惟彼不足聖賢有之文安郡君陳氏墓志銘太中大夫權判北京留司御史臺韓公璹之夫人陳氏泉州晉江縣人三司户部副使尚書兵部員外郎贈兵部尚書諱詁之女夫人幼警惠嘗閲白居易詩一過能誦其兄汝奭異之韓公未冠舉進士有聲尚書曰吾女宜歸斯人乃妻韓公丞相申國呂公當朝夫人母家隆盛嵗時集會內外命婦十數環坐綺紈曄然夫人以儒者妻在末座衣無繢繡語言容止不矜慕一座皆聳舅苦風痺侍疾憂見於色居舅喪盡禮焉韓公以材遇主仕􅎊顯再封夫人潁川仁夀二縣君閨門雍穆福祿美矣而不幸感疾卒熙寧元年二月十八日也享年五十有六初夫人未筓嘗事僧伽像嘗病劇像見夢曰無苦既而遂瘳晚尤燕靜將沒無戚容曰生必有終也韓公後貴為右諫議大夫追封夫人潁川郡君又追封文安郡君以元豐六年八月甲申葬于衛州汲縣招賢鄉之原七男子祗祖奉議郎祗師宣德郎祇嚴瀛洲推官祇德奉議郎祇勤鎮東軍推官祇言祇諫承務郎皆有才技諸孫男女三十七人盛矣補之少貧賤韓公辱知之又與夫人諸子遊屬補之銘銘曰猗嗟夫人女德少成十嵗鏘鏘見異其兄匪惟其兄父曰實難卜所宜嬪乃從于韓于韓斯令舅曰孝我夫曰匪豫豫妻助我燕及其子以惠宗人曰夫人慈于我有恩凡民有生莫愛惟死死能不憂男子之美我為此詩質于幽宮惡乎大之有昭管彤安康郡君龎氏墓志銘國子博士彭城陳侯之夫人安康郡君龎氏紹聖二年三月壬戌卒年七十有七將以其秋七月丁酉祔于彭城白鶴之呂柵博士之兆其子江州彭澤令師道以書來曰師道不幸先君之喪也高郵秦觀嘗銘矣不克葬今舉夫人以祔惟子實銘吾母補之曰唯龎氏單州成武人故丞相贈司空兼侍中潁國莊敏公籍忠厚有謀功在王室夫人􅊲也妣邉氏秀國夫人初潁公從其􅊲魏公格宦于彭城魏公始見夫人之舅三司鹽鐡副使贈工部侍郎洎而賢之語潁公必與厚故夫人歸于博士陳氏故儒者有家法夫人宜之始封南安縣君徙封郡皆潁公恩也三子二女皆令孝師黯光山令師仲河中府司録師道其季也淑嫁張舜民媛嫁章珙皆先卒舜民今以直祕閣為陜西轉運使而師道好古自修而有文恥以其技干時將老焉鄉人推之士嘗與遊者扳而出之其在位有力者以其行聞于天子而官之乃以亳州司户參軍教授其州又教授頻州既迎夫人還自潁已疾病夜次東阿步星墮其旁賈人舟上如丹如槖出芒下尾無幾何而夫人沒且瞑西向臥諷彌陀不絶口亦異矣為人慈儉所知甚逺蔡女子于不嫁稱師聚徒傳一世以為仙自大人顯族爭奔向之夫人獨不然曰道貴清淨反此禍也後于卒敗博士推資以業羣弟夫人安之不以纍其夫既從其子仕州縣御菲而甘不以纍其子人皆曰生貧賤若是固易以大家子為此而泰可哉銘曰嘗儉而為奢一飽已多􅒘豐而得約則難以樂居難而裕惟龎公有女惟陳侯有婦士不其爾或養以移志我銘夫人以愧世之士錢唐縣君葉氏墓志銘元祐元年夏六月戊子補之從父朝散郎太僕寺丞以母夫人夀安縣太君公孫氏喪去職將以其逺日歸柩魚山祔舒州府君之兆問吉于史史曰天德在日辰加大明七月乙酉葬不觸禁無有後囏先是太僕之夫人葉氏以元豐三年七月壬戌卒太僕泣語補之曰昔我不天先君棄諸孤諸孤尚幼所與朝夕事吾母吾母安之不知有貧賤憂者實葉夫人豫助將並舉其喪於魚山諸父咸曰宜爾銘補之尚安得辭葉氏江南大姓自縉雲徙錢唐有諱曖者舉進士得桂州司法參軍以卒贈光祿卿二子昌言昌齡同年進士皆以朝奉大夫老于家夫人父兄也光祿殁時夫人未筓事母萬年縣太君宋氏能致其孝而於二兄順資慧淑纂組音樂凡女子之事無不工年二十二來嬪太僕太僕少有高材篤學不遑暇家事夫人躬儉菲以養少有則以奉宗黨賓客故太僕得一意于業遂中甲科成令名夀安蚤多疾夫人侍側不以勞苦懈至已有疾不欲以憂夀安起居笑語如平時竟以殁得年四十有七追封錢唐縣君四子損之臨之晉之渙之一女未嫁聞之卑不誄尊然婦人無外事非其家人孰信故粗撰所知以成太僕之志而慰其子之思太僕兄弟伯仲叔季以仁義禮智四端名皆冠以端太僕伯也因使後有考云銘曰蕙茝可充幃誰使有此丰也椅梓則為器物各求所同也錡釜以湘之又甚宜其宗也副筓其委他獨不見此容也魚山兮岑岑屬綆兮及深松為城兮石馬吾宮旁兮乘者下作好歌兮以謂來者為可窮兮如此大野駕部員外郎李君墓志銘君李氏諱太字用之冀州信都人沈厚尚氣節既冠以通禮中第調鄆州司法參軍開封縣尉王畿賦省民墯不力穡急則椎埋為姦利君行野必喻民本業知盜所舍止發輒得遂以知名徙洋州録事參軍服喪不赴再調澤州推官太師潞公為轉運使亟稱其能州獲盜十餘人獄具且論死矣君摘案謂守曰此為首應死此應減守執之力君以狀議其不可會潞公至視之驚曰微推官民死無訴矣吾知人不繆也守亦竟從君議時元昊擾邉轉輸深入多覆通判懦不肯行君請代之綏御甚恩人急而不離亦不遇冦守與使者爭薦之改大理寺丞知寃朐縣事就差知藤州遷太子中書藤夷獠吏北人不相通訟或十年不決君因其俗為條理民大悅不欲其去遷國子博士知雷澤縣事雷澤嵗苦水田不入君教民作堤乃屢登民于今賴之遷尚書虞部員外郎通判兗州又簽書永康軍判官遷比部知軍悍不恤事戍兵以糧惡譟營中欲為亂君聞遽馳入諭其長曰倉儲惡非知軍一人罪也速往自陳尚可免不者當殺我而後起事衆皆伏泣曰某誤我某誤我因得其倡者氏名執送知軍斬之遷駕部潞公當國記其澤州時事差催發諸道錢帛又差監在京麴院且用之會疾卒嘉祐六年六月二十有六日也為人質厚不茍合既仕盡推其田園資用以與兄弟族人人稱其長者焉娶劉氏封某縣君二子希罕罕舉進士中第左宣德郎知某縣事四孫宜進士中第恩州司户參軍丕亘至皆學問自立罕以君嘗官于兗而樂之兗人又思君不忘既卜居矣乃奉君之匶以紹聖元年某月日葬于仙源縣大庭鄉壇山之隂而以左朝奉郎太祝蔡君申之狀來乞銘罕宜補之場屋舊銘曰仕豈不遇名既以聞世豈不昌視子若孫生樂其土死藏其原使過者泫然而語曰此故吾愛人之李君嗚呼雖亡不其存濟北朝先生雞肋集卷第六十四
