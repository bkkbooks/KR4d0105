front:
  text: 濟北晁先生雞肋集目錄
  hash: sha256:221dfe13869a24a5a924bbf1455c86ba537ad199042976343042fd90ded837c3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0105_SBCK_021-1a}
body:
  text: 第二十一卷絶句東皋十首即事望金陵金陵南數十里江心烈山崪然特起猶金山也家人云安得隠於此作一絶采石李白墓宿采石追懐沈丘叔父過銅陵南望九華連日順風皖口遭風馬當風濤中大風過彭浪磯題彭郎小姑祠江心望彭澤作過分江口湖口大孤山祠題廬山開先寺前望􅓬布栖賢寺三峽橋舊說廬山有紫芝田百畮人莫得見偶於開先栖賢林中步兩日各得一枚正紫如玉戯成宫亭神甚靈云有婢名如願以借客有所求叩如願即獲神又能於湖心分風使上下各得順風故劉刪詩云囘艫椉派水舉掉逐分風彦魯􅾭字號巻余擢為開封第三用彦魯韵孔雀院後䝉泉貴溪徐氏招隠園㫺王表避亂居此山依之者數千家其詩云逍遙入南斗者也遇赦北㱕移笇山五杉㱕植里弟皖口寄懐前太守陳公度鍾山有石故名初上安仁灘清見毛髮其中奇石五色可掇拾也從縣令借圖經溪曰雲錦溪村曰玉石村弋陽道中齊山怪石森聳其西峯曰小九華次韵無極以道寄金山寺佛鑑五絶清口懷應書時雪中舟行舟中即事魚溝遇大水祝家墩阻水旦起舟人云天上風花順矣作一絶懷緡居欲求閑局理舊學作初望廬山由開先萬杉栖賢羅漢入城南康守云惜君未至紫霄峯也因以此荅望香爐峯題周廉彦所収李甲畫三首鵲雁鴨松菊堂讀史五首仲光寄紵袍寄家人濟北晁先生雞肋集目錄終濟北晁先生雞肋集巻第二十一七言絶句東皋十首屋名盡掛陶家牓人物應慙菊畔身解作文章肯㱕去不應陶後說無人郭外朝陽一巷斜青槐㕔事帶丘麻路逢扶轡雙童問不是城東太尉家小閣高原最上頭下床莫遣許公羞如今老罷欄邊意不是元龍百尺樓壁間最好營丘筆臥看三峯憶舊過夢入幽林小谿去絶勝千騎向南柯新植青桐小逕成兩行萱草一時榮春風百卉芳菲盡長夏幽花却稱情登登策策不須呼時動圓荷觸短蒲五步濠梁亦堪樂相㤀何必是江湖四海萍逢兩弟兄百年膠漆幾張陳紅塵陌上相逢子華髮林間偶坐身斁屬无尺五城南未足高只今小杜更飄颻􅇀煙疎雨從君勝玉子文楸聴我饒達屬天李君禪味詩情裏解作黄金不潤身目斷白衣檐酒闃何妨聊破一罏春宜屬子城市何妨亦隠淪賈君無意向紅塵東皋瓜豆如雲處慊我幽棲不卜鄰叔屬煥即事半刺還為權刺史朝衙不坐坐鈴齋按頭通事通何事昨夜東園芍藥開望金陵龍盤虎踞望南津餘烈崢嶸尚霸陳醉著不知風揭屋可能楊素是江神金陵南數十里江心烈山崪然特起猶金山也家人云安得隠於此作一絶山如浮玉一峯立江似海門千頃開我欲此中成小隠莫敎山腳有􅂳來采石李白墓客星一㸃太㣲傍談笑青蠅玉失光載酒五湖狂到死只今天地不能藏宿采石追懐沈丘叔父同應詔渡此今二十七年矣而叔父謝世補之方逺適泣涕成篇二十七年前應詔黄昏同上木蘭舟江山依舊人琴寂白首南遷涙迸流過銅陵南望一山高出雲上奇秀可駭余未嘗至江南遽曰此九華也問之言是雲端忽露碧孱顔如髻如簪縹緲間驚駭舟中齊舉首不言知是九華山連日順風㫺日肩吾上國行魚龍黑浪自堪驚我今顦顇西風隠却是江神不世情皖口遭風歘起驚濤渺去程扁舟三日滯長汀無心坐使羣鷗舞莽眇吾知未可椉鳥出六合之外莊周云椉莽眇之馬當風濤中從祖㫺為州别駕上書嘗欲徑樅陽椉危更覺思遺跡慙愧篙師戒馬當大風過彭浪磯山束江竆方崪起江盤山過却重囘無風此水常呼洶正用風狂水鬭來題彭郎小姑祠山與磯名從地志姑兼郞號出江民世間稱謂無眞實聞說雙祠自有神江心望彭澤作青山缺處大江奔江口山顔見縣門一世定無紆轡處故應來此著琹罇過分江口不行盆口更湖口明日廬山自此過猶恨西江不竆覽沅湘聞道亦無波湖口彭蠡宫亭浸全楚號呼噴吐出喉中此間曠蕩無竆水何處還容地火風大孤山祠江吞湖巻氣俱豪崛起孤峯百仞高㱕為嬋娟買絲屨却應還我所㤀刀題廬山南康南麓江州北五百僧房綴蜜脾盡是廬山佳絶處不知何處合題詩開先寺前望􅓬布白虹晝下崑崙頂半入青林久不囘下洞水輪穿地厎冰崖吼怒却重來栖賢寺三峽橋絶壁秋標天外劒深溪冬吼地中雷上宫未信無人到朱閣飛從頂上來舊說廬山有紫芝田百畮人莫得見偶於開先栖賢林中步兩日各得一枝正紫如玉戲成一首千古芝田人不到深林繼日拾瓊瑰從今為記晁夫子曽到芝田百畮來宫亭神甚靈云有婢名如願以借客有所求叩如願即獲神又能於湖心分風使上下各得順風故劉刪詩云囘艫椉派水舉棹逐分風同舟自古無胡越南北東西路不同不問宫亭借如願只求四面與分風彦魯􅾭字號巻余擢為開封第三用彦魯韻寂寂醒醒誰得知萬重故紙壓須彌不縁饒舌豐干道拾得山間厎小兒孔雀院後䝉泉檐頭山作屛當砌石眼泉為鏡照窗我亦困䝉如可擊此泉從户到西江貴谿徐氏招隠園㫺王表避亂居此山依之者數千家其詩云逍遙入南斗者也鬼谷西來一丈清三山箕拱慰高情時平尚欲依王表南斗逍遙畢此生遇赦北㱕山猶故險水猶奔無復前年濺淚痕自是人心隨境别櫓聲帆色盡君恩移笇山五杉㱕植里弟一丘一壑感㱕心過盡青山㡬茂林自載五杉如碧鳳欲看春雨舞庭陰皖口寄懐前太平守陳公度人龍舒常愛東陵早拂衣我行曽不叩荆扉慿君天柱峯頭望看我扁舟㡬日㱕鍾山有石故名江上秋濤噴玉巖風鎪月鍊白雲緘為君一叩無人境要聽洪鐘出萬杉初上安仁灘清見毛髪其中奇石五色可掇拾也從縣令借圖經溪曰雲錦溪村曰玉石村行盡江南最逺山却尋干越上清灘秋晴雲錦溪中過玉石瑰奇一萬般弋陽道中千日千程不厭行一丘一壑可隣生常憂束縛名韁死聞健尋山却稱情齊山怪石森聳其西峯曰小九華山上有山俱巃嵸谷中通谷更唅呀借君笻杖穿奇嶮直至西峯小九華次韵無極以道寄金山寺佛鑑五絶埋頭塵土欲㤀年重過初禪第一天唯有兒童見河性不將老面共蒼然不應無手是無拳且看毛端現四天似向吾家得消息鼓山餘響尚轟然鶖子猶應昧此縁室中􅃚有久如天饒師擲過三千界浮玉西津故儼然無極世縁如嚼蠟人言當住夜摩天此郎久學無生忍此事吾知否不然鼔角聲中特地傳只今鼻孔已撩天不應常作裴休諾揜口何妨也黙然清口懷應書時雪中舟行蚤歲單舟此水濱雲花都蔽引舟人重來五馬眞何事笑雪空成鬢上春舟中卽事終日平沙望渺瀰青林何許近漁磯波衝側岸㴱蒲靡一㸃穿人翠碧飛魚溝遇大水沙行水㝛幾江南石鬬龍求久巳諳秋水故應旋面目順流東望爲君慙祝家墩阻水旦起舟人云天上風花順矣作一絶依依牛馬辨平沙三日扁舟近祝家明日􅀭颿應復駛蒸雲散亂作風花懷緡居自種雙桐已四年秋來匏瓠小籬穿上床不怕陳登歎我欲㱕求許汜田欲求閑局理舊學作莫求致仕且分司此等劉伶笑婦兒投老寸隂如寸玉從君了事只名癡故園歴歴眼中分非禹誰教不入門何處功名有成遂玉初不獻足猶存初望廬山休說江南青未了一菴一徑可容身宦程正迫西風急未是廬山竚足人􅒘開先萬杉栖賢羅漢入城南康守云惜君未至紫霄峯也因以此荅南康南麓江州北五百伽籃似蜜脾萬室千門俱面勢不應獨是紫霄竒望香罏峯危樓曲徑羣岩遍蠟屐青鞵到處逢更上五峯雙劒表香罏依舊半天中題周廉彦所収李甲畫三首上林花妥逐鶯飛愁絶江南雪裏時嚄唶何須旁檐喜毰毸相對雨寒枝右鵲網羅無限稻梁㣲憐爾㝠㝠亦庶㡬戲鴨眠鳬滿中沚衡陽無意更南飛右雁急風吹雪滿汀洲迎臘淮南憶倦游小鴨枯荷野艇冷去年今日凍高郵右鴨松菊堂讀史五首不作文饒將相官野人亦罣黨人間籌邊措國俱無用空對平泉草木閑吾慕斯人不以官㑹昌一夢中興間何須更作竆愁誌秋雨長時睡正閑明光甲挫三言内悉怛謀虧一算間成敗關心不瞑目我今無此只應閑平生精爽皋夔内一世功名貝錦間再夢令狐亦何事可能到死未心閑當年伏地全楊李公亦何知愛惡間千古論心許公近百年㱕意與誰閑仲光寄紵袍手裁白紵製新袍犢鼻應憐犬子勞倚仗衡門􅊃服此良人身不屬臨洮寄家人孟光家世自清芬鴻亦幽情慕隴雲汲水挽車㱕去好茯苓日日長松根濟北晁先生雞肋集卷第二十一
