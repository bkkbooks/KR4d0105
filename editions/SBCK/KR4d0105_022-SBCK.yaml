body:
  text: 第二十二卷絶句子固席上雪得芟字泊舟山陽偶題及第後將謁告先㱕畱贈成甫貴溪在信州城南其水西流七百里入江遊龍虎山舟中望仙巖壁立千仞者不可上其髙處穴中往往如囷倉棺槨云葢仙人所居也余意大水人宅山上所作泊思禪寺呈廖明略其地葢干越寺在琵琶洲上和雒酒十二弟見隆羌赴闕和洛笋小發叔與戯云謂我竆我嘗傷食從而嘲之將别歴下二首將行陪貳車觀燈定陶舟中栗區村與无斁别與子真諸人飲求仁不預作怨詩因戲荅題榖熟驛舍二首送永嘉縣君囘至鹿邑東門外作謫宋徙亳初聞周璠琵琶題伯時畫虹縣逢无斁自玉山㱕二首省曹夢游山示无斁東坡公以種松法授杜子師為作詩子師求同賦自畫山水畱春堂大屏題其上自畫山水寄正受題其上次韵芸叟文潛體之觀音院題名贈許體之呈毅父提刑十月九日初謁衞眞大清宫二首寄李成季累得周同年鍔書譙都對酒憶玉函山題段吉先小景三首綴古詩懐家題僧曇秀鍾山雜詠後赴齊州道中題袁耕道所収小飛來讀藺相如傳贈李甥師藺濟北晁先生雞肋集目錄終濟北晁先生雞肋集目錄終濟北晁先生雞肋集卷第二十二七言絶句子固席上雪得芟字新霜一夜草如芟午酌臨軒雪㸃衫不怕夷門清著骨故教詩句聳巉巗泊舟山陽偶題五歳淮山一夢新扁舟曾繫市橋春津亭石磴雙垂桺見我依依似故人及第後將謁吿先㱕畱贈成甫濟北晁先生雞肋集卷第二十二七言絶句子固席上雪得芟字新霜一夜草如芟午酌臨軒雪㸃衫不怕夷門清著骨故教詩句聳巉巗泊舟山陽偶題五歳淮山一夢新扁舟曾繫市橋春津亭石磴雙垂桺見我依依似故人及第後將謁吿先㱕畱贈成甫還家消息約薔薇眼看薔薇日日稀不踏龍頭逰碧落君恩許伴晚鸎㱕貴溪在信州城南其水西流七百里入江玉山東去不通州萬壑千巖隘上游應㑹逐臣西望意故敎溪水只西流出逰龍虎山舟中望仙巗壁立千仞者不可上其髙處􅔙中往往如囷倉棺槨云葢仙人所居也余意大水人宅山上所作稽天巨浸洗南荒尚有千峰骨立彊民未降丘應宅此舉頭天壁有囷倉泊思禪寺呈廖明略其地葢干越寺在琵琶洲上遟君干越思禪寺彌月忘㱕住翠嵐忽見琵琶洲上月始驚全室在天南和雒酒十二弟見降羌赴闕二鳥䝉恩豈有知車書混一是昌期知君不化伊川祭右倚門牆恐見麾和洛筍小發叔夜青山肯長往不應石髓化山堅君㑹籜龍纔小發恐君心未老伊川叔與戲云謂我竆我嘗傷食從而嘲之羊踏胸中昨夜蔬不應捫腹怪如壺婦家得餔猶須忍莫索㯽榔笑爾臞將别歴下二首來見紅蕖隘渚香㱕塗未變桺梢黄殷勤趵突溪中水相送扁舟向汶陽鴛鴦鸂鶒繞漁梁揺漾山光與水光不管使君征掉逺依然飛下舊池塘將行陪貳車觀燈行歌紅粉滿城歡猶作常時五馬看忽憶使君身是客一時揮淚逐金鞍安陶舟中繚繞春堤去欲竆參差煙塢到還通依依潤桺侵晨雨細細吹花傍午風栗區村與無斁别十年投分皆卿相四海論心只弟昆老憶躬耕困隨牒春風揮淚栗區村與子真諸人飲求仁不與作怨詩因戲荅結習徐看蕩劫灰天花從自落空堦似聞滿室唯澄水投礫何因出定來題糓熟驛舍二首驛後新籬接短牆枯荷衰桺小池塘倦游對此忘行路徙倚軒窗看夕陽一官南北鬢將華數畞荒池淨水花埽地開窗置書几此生隨處便為家送永嘉君囘至鹿邑東門外作冬温榆桺未全彫黄蝶飛飛綴野蒿華髮不堪悲世故斜川㱕興滿東臯謫宋徙亳初聞周璠琵琶棗園憭慄檜㕔寒醉倚琵琶倒鶡冠不似江州白司馬只成怨恨不成歡題伯時画單于射獲明妃笑勸酌蒲萄跪小胡不恨别宫昆莫老應憐超椉子南夫虹縣逢無斁二首山㱕自玉清河摻執汴河逢萬里悲歡一夢中不作常情問京雒魚山好在故園松千載昌期尚此逢詢謀多在布韋中南㱕已後鍾山集猶憶君王代麈松主與松枝令代麈尾鄭譏對陳主鍾山陳省曹夢游山示無斁萬里㱕來兄弟樂百年多病井廬思如何騎馬穿靴地只夢登山著屐時東坡公以種松法授都梁杜子師并為作詩子師求余同賦不學栽榿業種松未慙履狶笑屠龍許君盡得東坡術巳與先生一事同長錐散子巖巖遍短竹扶條歲歲添待得烹茶有松葉不應更課木奴縑佩牛未敢邀君出射虎何當許我從要看堂堂冠劎叟蒼然十萬甲夫中自画山水畱春堂大屛題其上胸中正可吞雲夢盞裏何妨對聖賢有意清秋作一笻扶入衡霍為君毛錐一作無盡寫江天自画山水寄正受題其上虎觀它年青汗手白頭田畝未能閑自嫌麥隴無佳思戲作南齋百里山次韵芸叟文潛體之觀音院題名壁上棲鵶粉剝紅萍游無定得風同故人妙墨何人識文豹依依霧雨中贈許體之樓下無心卧許公求田已約􅇀年同詩來正值花如雪心事春風浩蕩中呈毅父提刑不酌公榮有意哉可能元亮此公儕但讀離騷政須酒不應須為菊花來十月九日初謁衛真太清宫二首虛庭下拜初形肅祕殿瞻容更魄驚何必囊函窺至妙始知塵垢負平生帷間角麈千年白庭下髥羱一㸃青當日椉雲無馬跡只今遺木盡龍形寄李成季聞驅傳節向秦關何日重來玉筍班猶勝譙都拙司馬苦無官况不敎閑累得周同年鍔書譙都司馬拙依然翻手為雲絶可憐唯有鳳翔周録事手書連月寄同年譙都對酒憶玉函山對此山齊州西樓不遣西樓對玉函宋譙頻綴副車銜今年重汙花前酒猶是揚州别駕衫題段吉先小景三首慘澹天雲欲雨低秋山人静鳥聲稀似聞谷響飛黄葉恐有孫登半􅊐㱕人生何事踏塵埃閒處胸襟足自開不作終南養髙價小山幽桂好㱕來碧天無際日悠悠風静沙平不見洲彭浪磯邊亦如此危峯獨木繫扁舟綴古詩懐家二月已破三月來蝴蝶忽然滿芳草正是㱕時君不㱕及至君來花又少題僧曇秀鍾山雜詠二十首後明珠出袖四百琲坐有煙霞草木香斷取鍾山擎石掌􅄼知不下浄名床赴齊道中淮南䝉召鬢毛斑乞得東秦慰病顔曉整輕鞍汶陽北却衝微雨看青山題袁耕道所収小飛來藏山常恐負而走壺中九華安在哉憶似冷泉亭畔見為君題作小飛來讀藺相如傳贈李甥師藺蚩蚩六國共憂秦獨有相如智不羣完璧東㱕何足道最賢能下怒將軍濟北晁先生雞肋集卷第二十二
