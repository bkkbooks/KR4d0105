body:
  text: 第五卷古詩視田五首贈八弟无斁即事一首次韵祝朝奉十一丈謁岱祠即事游信州南巖北京水後往棣州試進士次韵王宗正定國與蘇翰林先生黄挍書魯直唱和次韵孔著作常父館中喜雪次韵文潛休日不出二首次韵文潛病中作時方求補外再次韵文潛病起濟北晁先生雞肋集目錄終濟北晁先生雞肋集卷第五古詩視田五首贈八弟無斁河流之所濡一斛泥數斗我莊當水竆乃比石田瘦尚無東陵瓜況有南山豆天雨不可期且復鞭牛後蘇秦不願印廼在二頃田東臯五十畝力薄荆􅂎填擇高種苜蓿不溼牛口涎拙計安足爲朝徃而􅇀旋薄遊廢家務待子營糗糧莊奴不入租報我田久荒凌矜馬到門硉兀牛臥場立苗蒼耳根此䇿殊未長家世不為農長安有大第官糧弗充口萬里聊自庇一從學聱牙世事百色廢賣牛姑補屋歲晚霜雪至居貧廢文字銚鎒學苦耕怪子獨伶俜久與地力争苦耕又不時狐虺日縱横髙原一釋耒歎息心怦怦即事一首次韵祝朝奉十一丈平生交游情獨處不可乍􅄼為一馬飲濁水噴百馬弦歌髙樓上但恨知者寡丈人遺世心口語儻能借不然抱幽璞終歲褁幞帊坐令青蠅繁暫出刑兩踝儒冠成自誤歸去無屋瓦賴逢里中賢築室各蕭洒及時秫麥賤樽酒得同把安能効乾没肩與市人亞居然邑里號曾墨為還駕况在竈奥間欲恥王孫賈東方錢二百得米稚啼嗄嘲笑坐竆辰無肉飽伏假尚聞剝啄聲聊復屣屐迓子常妙工詩蘇李掩曹謝有時醉酕醄大笑飜盞斝倒床鼻息惡喚起對殘灺復古志尚竒衆競方獨暇捫蝨與人言豈不逢譴訝崇朝潔腹坐徃徃食旁舍子固業少成議論嫓風雅嘗聞莊生説乃慕巨魚化平居似晏子志念能自下而我獨迂疎通人所譏罵正賴觴詠中得意自陶寫畱連接清晤欲起不能罷是時春雨餘桑宻鳩鳴野城隅園圃近欵段亦時跨便恐百卉闌晼晩侵朱夏人生形骸累未免俗情詐此理豈外求猶煩詹尹卦清風穆然在如渴啗甘蔗況我自散材谷口躳耕者去年秋不在匏瓠緣庭架低囘迫榮利妻子憐王霸横經亦彊顔巳取或人捨但慮宰我愚松柏談三社翛然一室内黄巻開佳話尺璧競寸隂寧復當論價吟哦愁肝腎蟋蟀吊長夜鄙俚頗近情持用自悲詫功名與道義熊掌偕魚炙二事良難兼夫子賢點也謁岱祠即事澤南三百里極望横天雲雲端色凝黛諦視初可分峥嶸介丘像澒洞元氣屯頃刻有變化慘澹殊明昬天行帝出震其位生物元不周僨西北川乃東南奔寧知六鼇死竟使二山淪不有是難傾孰維大塊根嘗聞周官説實惟天帝孫神靈所鎮守民物斯芘存幽明脗一理有道惟常尊不覺下馬拜僮奴亦蹲循廼知正直理足使冥頑敦三王有損益商人所尊神明法或不懼夜行安得逡以此輔世敎庶幾驅驁民􅇀㝛太平驛不眠慮絲棼明朝好天色萬象開胚渾勢横恒碣盡支壓齊魯蹲五色冒日觀一握通帝閽恢拓下嶊嶉青蒼上氤氲泉石競沮洳煙嵐互紛綸髙舉躐風海深蹯跆火輪濤波巻堆阜一一􅈚渤吞棊枰視井邑􅍰箸藏松椿碧瓦峙雙闕紅牆繚長闉願瞻巖閟客内滌邪垢魂賜臣登絶頂一覽神秀原萬壑射窈窕三壇矗嶙峋莽不覩項領何能竆䏶跟稍稍指鳬繹依依數亭云松列大夫爵驘識將軍墳瑣屑澗花麗霏微崖藥􅝪廣大良有以竒險安足論瑰詭有形上頽然德彌惇得無希夷子倣世逃深蓁亦有黄冠士相對如麖麏此曹嚙草木語道良未聞解榻坐中觀洗心馳大鈞形氣要得一不然隨物泯是事亦姑置幽尋聊可勤初疑無字碑瑩潔誰敢文又怪玉女井髙絶何由奫俯穿鬭仙巖鳥下天壁垠側度五賢堂熊經背逡廵劎石危數履女蘿柔屢捫揮斥八極逺風來袂軒軒廖廓自無梯猶疑天可賓隂谷不敢視恐落魑魅羣安得遂獨徃身如黄鵠飜周流遍五嶽採掇芝英繁即欲憩圓嶠或當止崐崘衆真迎我語一笑顔玉温是中差可樂子胡戀塵樊荅此太遺物身閒猶事君重華迹巳逺秦漢事方煩成功屬吾宋五禮垂後昆皇帝二載春臣備太史貟紬繹自帝典頗識康哉言泥金白玉字願頌無前勳有志類韓愈無書愧文園臣髮將雪素臣心猶日暾今此在林藪跳身同玃猿徒觀衆山小愁絶下天門遊信州南巖南巖夫何為山作天倚葢山南豁山腹飛頂覆其外初如鵬將翔膺擊羣麓背乍似海大魚呀口噞而嘬當空横廣頟架屋喉舌内仰窺駭憑凌俯進愁壓墜嘗聆釋氏説仰覆各世界千間未可著五畞良不隘清泠氣射人熱惱從此潰崖奔木疎瘦谷逺鳥幽怪問僧何年居投老四五輩問客何人來官滿或一再而予與二子高興偶相戒松舟下清江毛髮數鰕蟹藍輿上峻嶺幢節望杉檜李侯勛門胄文采山作繪趙君儒林孫嫮美蘭結珮不爲城郭遊繼月此于邁寧知老逾拙意在精賞退得居溪南山食飲與山對夔魈入奥穾雲雨出巾襘古人戒賤目慣覩誰復貴顧此誠未逢欣然與心㑹彭湖兩崖蹙泉作一線霈禪月古臺空靈山自明晦搜竒獲三勝趣嬾同一慨但憂久聱牙尚喜無蔕芥平生所驅使詩酒俱好在天涯得吾侶物外從所快便欲登赤城一觀天宇大北京水後往棣州試進士晡時北京城行李上客槎二更無人聲騎馬黄河沙誤緣桺灘中尋炬知田家道有轉徙人襁負依丘麻雞鳴不安枕髣髴墟里斜秋瓜抱子母蕎麥亦已華賴兹野物登爾輩生有涯夜㝛冠氏驛旅衾魂夢嘉明發縈長坂晚開堂邑衙秋陽此方熾流汗霑巾紗處隂甘吾願􅊃逸豈在多有風東北來􅃤􅃤飛雨加頃時異晦明稍矚天表霞僕夫為我言塗梗絶行車且還解吾褚中林侣羣鴉詩書維永夕蚤作從復賖豈不有王事奈此僕夫何次韵王宗正定國與蘇翰林先生黄挍書魯直唱和東國寬市征西山休騎屯時清詩人喜洗濯出佳言淵源蘇夫子河入莆菖飜􅁤轍挍書君駕驂盜驪奔後來得濬沖它人孰窺藩譬余學禮素婦祭盛於盆不應麾門牆尚許酌衢樽夢天九門開燦然列星繁羣公顧我喜顔若白璧溫赤城何足躡愁絶永嘉孫次韵孔著作常父館中喜雪冬旱及兹雪都人銷百憂牆根有㝛草餘綠尚去秋新陽解薄冰大潤升介丘夜聞窗響紗高雲正綢繆明旦天津望寒花翳川流宮中聖人喜癘氣一夕収史占上日祥知欲遍九州敢任肉食謀官閑欣歲休雖無山隂舩竆巷窘若囚却幸葛翁來湯餅有麥牟仙傳見神孔矦金閨彦平㫺慕追遊延閣排霄起登臨忘我愁何當聯轡鐶城苑佳氣浮春郊日可望桑野聽行謳次韵張著作文潛休日不出二首張侯經濟術見遇未容心揚子執㦸老蔣生開徑深予亦拙造請素懷愛園林閉門鳥雀喜朝日上駸駸文史平㫺契淮山别離心省中竝日直天上靑春深買屋近城塢往來成竹林詩模黄著作吾亦意駸駸次韵文潛病中作時方求補外貧爐初著灰濁酒寒不溫鄰張病未來獨負南窗暄昨日往過之歡喜能兩餐酲醲淟然解愧無枚乗言祝君抱虛一邪氣襲無門今晨有起色迎笑睂宇軒扶掖兩男兒總丱佳弟昆遣誦寄我詩妙可白玉刋平生俱豪氣見酒渴驥奔賜休常苦稀晨謁良不閑約君向南邦勿厭敲扑諠公餘未忘飲何必釂十分時平但行樂臥治安足論琵琶五十面雷雨出鵾絃再次韵文潛病起淮浦見之子春風初䇿名頗訝謫仙人有籍白玉京晚遇廣文直老交心愈傾同升芸香府偶坐華髮生斯人自龍性意變難章程耆酒不疵吝身如秋葉輕自言士處世何必冰雪淸交游滿臺省毁譽半王城不肯効俯仰畏髙侮鰥􅑏常思老伊潁紫蠏羞吳秔我輒抵掌和音同磬隨笙小人奉慈親皆嘗小人羮寒衣婦補綻學績女娉婷日欲江海去心期楊桺靑衆木構大厦豫章倚孤撐如子足醫國可容移疾行丹書紫皇告玉篆五嶽形何必陶隠居吞霞養純精訪道自素約諧心期􅇀齡但恐牽俗緣志大功不成息交屏妻子此語不須驚濟北晁先生雞肋集卷第五
