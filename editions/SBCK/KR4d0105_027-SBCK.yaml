body:
  text: 第二十七卷雜著五行說齊物論學說勤說儆陋烏戒濟北晁先生雞肋集目錄終濟北晁先生雞肋集卷第二十七雜著五行說洪範初一曰五行金木水火土而已何以爲十哉易曰天一地二天三地四天五地六天七地八天九地十水生天一成地六火生地二成天七木生天三成地八金生地四成天九土生天五成地十去其生成之數以言則其嬴皆五五土也物非土不育故太玄曰中和莫盛於五故稼穡作甘五之所生十之所成也生於陽者成於陰生於耦者成於奇一三五七九皆乾之竒也二四六八十皆坤之耦也天地父母也金木水火土天地之五子也天有此五氣故爲天五行地有此五氣故爲地五行故一三五七九天之五氣也二四六八十地之五氣也五位相得而各有合故其辨則十其合則五潤下作醎炎上作苦曲􅀡作酸從革作辛稼穡作甘合四方中央而五位定由是大撓以生甲子容成以生曆黃帝以迎日推策堯以閏月定四時成歲辛壬癸甲甲子之見於經者也陰陽家流不見於經日官居經以厎日日御不失日以授百官於朝此陰陽家流之見於傳者也故太史公曰因之列於九流記曰播五行於四時或謂支幹配合以言吉凶起於唐呂才五行甲子自堯舜有之物生皆受氣於五行陰陽相摩八卦相盪五氣之自然盈虛消息孰能逃之才能用此以推之非起於才也自五行之爲物皆合陰陽冲氣而生坎水也而含陽离火也而含陰故有陰中之陽陽中之陰十日之有剛柔猶陰陽之有老少也有老陽又有少陽有老陰又有少陰故甲乙皆木丙丁同火庚辛咸金壬癸俱水而戊巳偕土也是五位相得而各有合也朞三百六旬有六日者一晝一夜然後成一日一盈一虧然後成一月故卽太陽之日以名百刻之日卽太陰之月以名三十日之月假令合璧起於牽牛十一月爲正行周之時也則子丑寅爲春卯辰巳爲夏午未申爲秋酉戌亥爲冬然而孔子曰行夏之時夏正人統授人時從聖人爲正故寅卯辰爲春巳午未爲夏申酉戌爲秋亥子丑爲冬以一日爲歲則夜半子陽生冬至之􅁚也日南午陰生夏至之􅁚也甲至癸十日也子至亥十二辰也十日所以爲五行也十二辰所以爲四時也播五行於四時故陰陽之運無竆如易之六十四卦終之以未濟周而復始旋相爲六十日日辰易位而納音之說生焉然而子丑一定之位也甲乙循環之氣也是其所謂播之於此者也十二辰之於晝夜四時晦明寒暑一定而不可亂也播甲乙於子丑周則復起丙丁播丙丁於子丑周則復起戊巳辰有定而日惟新惟新者猶人也一定者猶位也譬日於百官之人譬辰於百官之位各以其剛柔緩急施設於事皆其人之所爲無人而虛其位位能自爲哉以此人居此位然後有此事以彼人居彼位則事亦如彼故人得位而爲事猶日得辰而生納音也日者人也辰者位也納音者此人此位所成之事也故觀吉凶者日爲事之主納音爲事之成皆日之所爲待位以行之而觀成於納音如是甲子爲木人而不爲金人所謂天元一氣五行所播之氣本盛衰觀此而納音者要其成耳珞琭子所謂天元一氣定侯伯之遷榮觀貴賤有無必以氣要行事成敗則以納音尊吉卑凶是其本說而或者專用納音故時差也五星則五行之氣也二十八舍卽四時之位也播五行於四時猶之運五星於二十八舍也角至箕東方之㝛也春也斗至壁北方之㝛也冬也奎至參西方之㝛也秋也井至軫南方之㝛也夏也五星之好廟猶十日之盛德各有在也播五行於四時運五星於二十八舍五行逢其用事猶五星得其所樂處也吉凶可知也播而無竆運而不已五行反其所用事五星悖其所樂居則其凶可知大略如此參之以其氣運合會吉而凶凶而吉上下無常猶之易爻不可爲典要珞琭所謂妙在識其通變拙說由神也然亦以五星爲人二十八舍爲位以此星居此舍以彼星居彼舍而災祥易矣是星能爲之也非舍能爲之也然由此而有逆順所成災祥各殊猶之納音之所成也亦不同然旣曰十日合而爲五行而氣之老少日之剛柔判然異用至於五星則五而已不爲十也何以合之曰五氣以剛柔爲十日五星以逆順爲十用就術之一論之克我者爲官鬼夫克我者一氣也乃或好而爲官或惡而爲鬼則陰陽相求而言耳夫陽之所求者陰也陰之所求者陽也陰而得陽陽而得陰則爲咸常夫婦相感以通相與以久也陽而逢陽陰而逢陰則爲二女同居其志不相得曰睽是易之義也陰陽之性也故十日以陰幹克陽陽幹克陰則天地相合以降甘露如水得土而有防範金得火而成方圓雖克也相得而不相勝故更爲用若以陽幹克陽陰幹克陰則志敵而力抗則兩雄必爭二主必危如一勺水之少土盛則堙一鈞金之輕火熾則飛此其常理也如甲陽木之得辛陰乙陰木之得庚陽故夫婦爲用若甲而遇庚乙而遇辛則爲志敵而力抗然甲彊而庚弱乙盛而辛衰則雖鬼不能爲之災猶之捧土不可以塞盟津不勝故也雖金亦然故論其常欲以陰陽之相求不欲其陽陽陰陰之相敵通其變則陽爲陽助陰爲陰益千變萬化而未始有極也故五星之逆順似之術曰金木相逢極爲美土火二星爲惡曜是以其常也然而金木豈不可以爲殃土火豈不可以爲祥水亦然也順則水爲飮爲漿漑田畮浮舟航逆則墊溺金爲鍾鐸爲槃盂反則刀劎鼎鑊誅木爲宮室爲舟車反則與桎梏棺柩俱土生用於稼穡果蔬死用於墳墓覆壓之虞火生用於烹飪爟燎死用於災其室燔其軀以五物而反之於逆順是五星猶十日視其好惡而變化隨之陳昉所載陰陽四時有若干神者隨六十日而運各有其次亦有吉凶或曰實無至此之虛也善者習五行之精華氣惡者皆五行之繆盭氣其理或然記言天地之仁氣義氣溫厚氣嚴凝氣亦各有方易言帝出乎震成言乎艮亦各有位啟閉生殺隨之術家之神位理出於此然經簡而術繁繁用則疎簡用則密記之說易之義皆在矣齊物論此篇論齊物然物之理齊而情故自彼是莫得其隅而要之以天地之一指萬物一馬而後物無彼是道泯乎無成虧矣莛楹厲施極異而皆同故言唯達者知通爲一通爲一則不齊之論近不用也然而衆理相承彼是未始不用聖人欲泯用之迹故爲是不用而寓諸庸寓諸庸則我雖不用而物量無竆默然而自用殊施而各得若此通矣故曰用也者通也通也者得也適得而幾矣不用則理阻而不通故用爲通通則物各得其理故通爲得得則各適其所而盡矣故適爲幾而聖人非有心爲之也特因物之自庸也故曰因是以有成與虧故昭氏之鼓琴也無成與虧昭氏之不鼓琴也猶之七竅未鑿而渾沌不死也過此以往則反乎無物其爲無成虧也至矣故師曠之杖策也惠子之據梧也皆爲者敗之也皆非所明而明之也故雖竭其智而理終不可竆謂之堅白同異名實之辨若此其察矣然要於不察而以昧終其爲滑疑也不甚矣乎若夫天地雖大要之一指萬物雖多要之一馬一指一馬爲論省矣則雖衆理相承默用而常通尚安有滑疑之耀者哉然其始也恢詭譎怪未通乎一故有滑者焉有疑者焉無滑無疑則其際㝠㝠昧而不耀有滑有疑則長短之相形前後之相隨不昧而耀矣耀也者明也而此非明也以夫衆理之相椉也滑亂而疑似反以炫聖人聖人欲爲人解紛而辨惑則嘗圖之矣故曰滑疑之耀聖人之所圖也物之情不齊而其理齊聖人竆理衆人役情聖人欲反情之異合理之同所以圖滑疑之耀使無疑無滑而泯乎㝠㝠者莫要於此矣故重言爲是不用而寓諸庸此之詣以明然則聖人泯用之跡而物未始不用無意於明物而物常自此明故曰此之謂以明也若昭氏師曠惠子者知盡於此以非所明而明之祗以爲昧非此之謂以明也故曰三子之知幾乎猶曰知盡於此而終不足以明也幾盡也猶幾希也然非夫以道泛觀而備萬物之應則以不齊齊其齊也不齊乃若莊周則以齊不齊其不齊也齊矣而猶以爲未也故又曰今有言於此不知其與是類乎其與是不類乎類與不類相與爲類則與彼無異矣夫類則齊不類則不齊類與不類相與爲類則齊與不齊相與爲齊夫有所謂齊有所謂不齊則與彼誠何以異哉故推而上之極於物之無曰有未始有夫未始有無者此要言無物無物則無齊矣推而下之竆於物之有曰自無適有以至於三而况自有適有乎此要言有物有物則有不齊矣故於是重言無適也因是巳因是巳者葢齊物之要論盡此矣何以知其盡此也曰以因因則無適也故入之爲無非或使之無也因是以出之爲有非或使之有也因是巳夫號物之數自一至萬遠矣夫無未始適有何以自一而語萬有未始適無何以自萬而語一之二者泯而無物無物而無齊矣雖然非刳心喪我不能觀物而知無故此篇始之以南郭子綦之喪我而齊物之論開非觀物同我不能知化而竆有故終之以不知周之爲蝴蜨蝴蜨之爲周而齊物之論閉學說學不可已惟知之然後能好之記曰雖有嘉肴弗食不知其旨也雖有至道弗學不知其善也而孟子亦曰理義之悅我心猶芻豢之悅我口葢飮食旦旦之所須故譬學於飮食爲最易知然猶曰人莫不飮食鮮能知味也天下豈有不習而能察者哉㫺野人有甘葈莖芹萍子者對鄕豪稱之取而嘗焉蜇口而慘腹夫口腹人所同也而野人至甘人之所不甘此非未嘗知甘所謂甘者而以夫巳甘謂人甘者止此哉至於百工衆技皆學也下至跳劎弄丸緣竿踏索旣爲之終身不得已非特利所在也習而知其味故樂也若廼對君子稱之則如野人之甘葈莖芹萍子其於不足味也不特慘蜇而後方知之也故嘉肴世皆知其旨必食者而後益知其爲㫖至道世皆知其善必學者而後益知其爲善曰聞而知其旨且善者意之也或曰道之出口淡乎其無味而飲食人所甘似不類夫以人之所甘者弗食猶不知其旨而道又淡而難好則不知者不其愈多乎然終猶是也病弗學耳學而入之安知其淡乎大觀四年四月旦日書付姪公秉俾以語諸小道云勤說送甥李師藺游學道無勤物無不勤夫旣謂之物矣物必有所事有所事必勤故物莫大於天地其次曰人而三者同以才稱才之爲言物量之所能也能必有所事故天有四時地載神氣皆謂之無非敎無非敎者有所事也日月如爭其所乎雲者爲雨乎雨者爲雲乎意者其有機緘而不能已耶其有所運轉而不能自止耶則天地之事亦勤矣人見其四時行百物生也以謂天地未嘗勤焉不知夫有道焉範圍乎其外莫或使之日夜以造偲偲然若有與之計其期而不得暇者是能成千歲之積而開萬化之原人以其才參諸天地有誠焉㝠極於道不息而善成古之聖賢惟孔子顔淵能知此故孔子之語子貢而曰生無所息顔淵之贊孔子而曰欲罷不能夫以有涯逐無涯必墯故欲罷而願息皆人之情也然回非不欲罷而曰不能罷賜非不願息而曰息無所夫求斯須之晝至於念兹之􅂩其暫無幾也猶曰不能而無所此非有所畏慕勉彊而驅之也性不能已也是天地人之所以均不能無事而皆勤也雖然天地以無心莫之爲而爲故久人以有心知而爲之故怠嘗試語怠之所從起譬道爲萬里塗而以勤爲馬繕性之始如適舉趾其弛於負檐未知其以曷月止斯殆已故欲從事于此必自夫誠其意者始焉夫人何可以確然隤然如天地之無心而常運能誠其意則幾矣誠者非義襲而取之也閑其邪則存嘗又請實之以誠爲我我欲至於萬里孰禦之哉以其孰禦之者爲策以臨馬不至於萬里馬終日躞蹀而不得止􅒘不怠故能久久則疑於神矣聖人之事業所以弊天地而疑於神則自其孰禦之者積之耳雖然此亦非聖人獨能之也百工之賤預能焉承蜩者猶掇之也夫豈惟其精之至自五六月纍垸二而不墜至於纍三而不墜至於纍五而不墜則其勤之積可知已而世不知者方且曰勤者事也道無所用勤其知者則將曰事者勤也天地不能無事而况於學者乎余甥師藺年少而彊文采曄然其所學又中庸也故告以其無息者自誠其意始而余老矣不復能自彊猶樂以靜觀動日出而開吾牖以臨交衢之内四民亹亹各各以其業趣利鳥嚶翔而獸嗥騖意各有所􅈻蜂螘之至細迕行旁逝營宅室而競食事亦維以卒歲至於物之無情者山日夜出雲流水之不停甲拆而勾申木不崇朝而其華敷榮竝行若爭小積而大盈而天地乃司其成功及其至也皆日損於是以觀復而見天地之心則萬物何莫猶斯道謂道無勤道亦未嘗息也而其勤見於天地天地亦未嘗勤也而其勤見於萬物萬物各以其勤自成而天地終其功故成能者爲聖人學之積􅒘是師藺勉之儆陋有覩於其里而自儆也且以儆其子及甥姪焉子欲居九夷或曰陋如之何子曰君子居之何陋之有吾非君子安能不顧蠻貊之陋而欲居居之不唯不能革彼陋吾未免於陋也里仁爲美擇不處仁焉得智吾非智者安能知里之不仁而擇處處之不惟不能遷彼之不仁吾未免於不仁也與君子游苾乎如入芝蘭之室久而不聞則與之化矣與小人游膩乎如入鮑魚之肆久而不聞則與之化矣吾不幸遠君子而近小人近之不惟不能洗彼膩吾未免於膩也一薰一蕕十年猶有其臭吾薰也蕕尚能臭之吾惡夫久而不聞也不惟不能薰彼蕕吾未免於蕕也四累者吾憂之見賢􅋠齊焉見不賢而内自省也壤陋里不仁鮑漬蕕與藂也引領而望夫安得賢者而齊之而不賢者乃日夜相與輩而詠且游乎吾之邦囂塵雜起千變萬化在人目前苟見此而恥者炟然肺熱濈然顙泚而内自省曰吾不幸無乃類之其庶乎居與之同里出與之同闀吾不能捨以逃也使跡近而心逺焉雖不得賢者而齊之日儆此亦賢已尹鐸為趙鞅戒晉陽之辱而不墮其壘培又增之鞅怒郵無正曰委土可以爲師保何爲不增夫里無仁賢則􅋠吾一日之嘗辱焉如晉陽之委土非耳目能言之類也修而存之如見叅於前倚於衡也亦可以爲吾師何必師人烏戒語居鄕挍中安期少行四方道關中所余初偕鄕書時有水丘安期者以講論烏戒時年二十矣見如此余以其說作烏於禽甚黠伺人音色小異輒去不畱非彈射所能得也關中民狃烏黠以爲物無不以其黠見得則之野設餅食楮錢哭冢間若祭者然哭竟裂錢棄餠而去烏則爭下啄啄且盡哭者已立他冢裂錢棄餠如初烏雖黠不疑其誘也益鳴􅅮爭食至三四皆飛從之稍狎迫於網因舉而獲焉今夫世之人自謂智足以周身而不知禍藏於所伏者幾何其不見賣於哭者哉亦或不知周身之術而以愚觸死則其爲智曾不若是烏之能靈於彈射也韓非作說難卒以說難死於秦天下哀其以智死楚人不知沐猴而謂人沐猴天下哀其以愚死是兩人者其爲智愚則異而其於取死則同矣寗武子邦有道則智邦無道則愚智愚觀時而動禍其可及哉濟北晁先生雞肋集卷第二十七
