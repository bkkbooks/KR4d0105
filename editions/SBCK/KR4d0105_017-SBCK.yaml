front:
  text: 濟北晁先生雞肋集目錄
  hash: sha256:221dfe13869a24a5a924bbf1455c86ba537ad199042976343042fd90ded837c3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0105_SBCK_017-1a}
body:
  text: 第十七卷律詩和二叔父少監入館見賜詩次韵四叔父寄賀二叔父入館并見寄詩送歐誠發守蒲次新安先寄府教授之道弟再用前韵荅之道弟府教授澠池道中寄福昌令張景良通直次韵毅父提刑將至蒲見寄次韵毅父戸部兄游栖巖寺廬山叙舊感懐呈提刑毅父幷再和六首用評字韵和荅府教授十二弟次韵邠倅王正夫蠖軒孤坐寄曹南教授八弟次韵袁疇耕道見貽寄懐八弟三首感興次韵畱守王公喜春游華嶽㱕道中望仙掌潼關道中自蒲赴湖早行作罷蒲乾濠道中寄府教授之道弟次韵文潛尉福昌日壁間清暑亭詩水竹亭在中赴蒲道中寄洛倅王定國役永安時定國董再寄定國荅閎中順之濟北晁先生雞肋集目錄終濟北晁先生雞肋集卷第十七律詩七言和二叔父少監入館見賜詩楩柟要是晩方成雄朔遺風世共驚屑去未驚容必去逃名還自得高名歌行元白辭濤壯書畫鍾王筆勢精椉馬輜車何足算不將稽古愧桓榮次韵四叔父寄賀二叔父少監入館幷見寄詩琅邪太守魯儒英典挍還高劉更生已似諸荀竝才子復如羣竇占詩名尚吟河水憐孤姪應與鄉人痛伯兄老鶴長鳴近天漢可容叢灌和驪庚送歐誠發春風共載揚州路屈指都疑夢夜闌可是重來俱白髮只堪㱕去却黄冠為郎我賴文書少作邑君逢政令寛自古江山勝塵土莫輕故步愛邯鄲守蒲次新安西先寄府教授之道弟文章之子日翹翹恐不能如豈有超助我彤襜問民俗煩君泮水採風謡預知薄宦妨同處且可清樽約屢招十月驅車漢函谷冷雲高處望中條安新函谷也漢所徙再用前韵荅之道弟府教授文辭便是升堂賈談辯寧非入幕超已謂嚢中能出穎􅄼知車下正哀謡但從袁盎無何飲莫笑馮公不見招伴我河山訪陳迹明年紅紫滿陽條澠池道中寄福昌令張景良通直十年一夢間湖湘欲往從之道阻長可但知君愛彭澤不應言我薄淮陽馬穿崤底流泉白鳥下關頭落照黄愁作驛亭寒不寐懐人思古九􅅆腸次韵毅父提刑將至蒲見寄騎報山雲見旗腳吏趨原雪沒靴翁朅來定坐玄猶白㨗去還憂昜又東他日江湖空白首只今關隴有清風登瀛契分南遷夢十五年來事事同次韵毅父戸部兄游栖巖寺恐是初禪弟一天千秋龍象鎮危巔坐看玉井蓮飄葉絶勝香罏日照煙點點蟻封知晉甸紛紛雁背向秦川要須浩蕩竒言稱付與南華舊老仙廬山丹碧沈沈虎豹閑松幢引度九重關人間未覺渾無路天上還驚更有山瑶草紅泉供挹酌金風白露送躋攀良游自歎平生誤便作㱕來鬢已斑敘舊感懐呈提刑毅父幷再和六首兒童豪氣自堪驚未入鄉人月旦評叔向亦聞呼使上子將一見便知名平生蘭省追高步老去秦川共此行賴有蒲城桑落酒高樓條華慰人情之補為考官即首送初舉進士毅父賦成庚子尚魂驚往事如風未暇評長樂鐘前偶相對凌煙圖上等浮名登車豈是君無意襆被何妨我自行更許心親遺貌敬老來尤見舊交情二人射䇿幾人驚要與三蘇共入評先聖子孫多異稟累朝圖牒有高名書傳科斗猶須定國安釣拂􅃢瑚未可行父巢子墨文章豪氣在登臨懐古一含情須彌納芥事堪驚千嵗聊堪一日評世上相逢俱夢寐古來何處是功名簿書聽我依俙了雲水陪君浩蕩行便與此山同不朽不應惆悵復牽情郎潛如我未宜驚戸部須推宰相評部不可無孔曾丞相云户中郎他日碧山思却走當年紫府已収名共知白髮生青鬢未廢長歌續短行樽酒不空多坐客君家餘事足陶情親見揚雄自不驚吾人要使後人評白圭未可輕三復小草須防得二名太華聳天如劒立黄河蹙野似軍行栖遲自憶衡門後可是登樓不稱情用評字韵和荅府教授十二弟君詩飄舉似鴻驚書入揚州子弟評聖世􅒘來升俊造少年已自得聲名六經正可三冬足萬里聊堪一日行更約彌敦同姓樂能來觸詠暢幽情次韵邠倅王正夫函谷雞鳴滿面塵夫君泛愛尚為親清時有味俱吾黨黄髮相看更幾人物理未驚翁喪馬世情應笑子知津似聞絶塞風沙苦只約觥舩莫負春蠖軒孤坐寄曹南教授八弟畏暑經旬不涉街蠖軒孤坐壁生苔出檐碧筍猶爭長映戸丹橊故後開雙蝶風前愁夜去一蟬雨外送秋來曹南瘦弟應相憶白首遷兄未放囘次韵袁疇耕道見貽閲世紛紛共旅亭㱕來眼為里人明老夫未歎嘗三已吾子何憂取一名仁義夙心成自誤文章小道得高評曲池逺市偏宜暑㩦巻同來看月生寄懐八弟三首君好作官容我隠我專築室待君㱕古來奇特俱安用老去疎慵自不違五府交書何怪宻雙林白社未嫌稀先君門戶觀之子葵藿吾今遯益肥平日鴒原左右手蟨反居衞卭前後未須論清秋淮上多詩句白首籬邊近酒樽杜舅高情篤兄弟先君至性厚閨門兩公與爾同師法相待㱕來老此園揚州全盛吾能説鴨脚瓊花五百年忽見山光好詩軸却思淮浦舊漁舩柴荆故俗眞虚老松菊幽齋巳重遷便作扶藜望衡霍清秋隨分有風煙感興淵明褊志迷㱕去叔夜支辭謬養生道有竆通千世運命無夭夀四時行我能為蝶斯同化子亦知魚乃至情謂馬謂牛無不可楚肝越膽太分明次韵畱守王公喜春午窗罏火不應殘春許花期特地寛塞雁初驚池藻㬉谷鸎猶怯井梧寒未須園裏幽尋去且更樓前逺望看四牡行春定何日亦聞鐘鼓滿城歡游華嶽㱕道中望仙掌深巖踏遍尋㱕路仙掌依然在碧虛無限游人重駐馬豈惟狂客倒騎驢挂圖天漢朝霞上落影秦關夕照餘千古全生纔一士可憐登覽盡丘墟夷希觀中祠堂在潼關道中塵土長安古道㴱潼關依舊接桃林使君驄馬來何後道士青牛去莫尋春半河山猶寂莫日長坑阪正﨑􅋂平生冷笑元龍誤老覺求田負寸心自蒲赴湖早行作小隠幽情薄宦身五更騎馬夀安塵春如流水行隨客曉與青山氣逼人報國丹心千載事對花霜鬢一番新秦吳絶域從來恨我已能知莫問津罷蒲乾濠道中寄府教授之道弟衝寒到郡待花開花未開時却遣囘敢意三年容我隠只如千里訪君來二崤轂擊何為者五老雲霾安在哉更約劖詩猿虎谷它年重過埽莓苔次韵文潛尉福昌時壁間清暑亭詩竹中亭在水梅福當年守此官荆山誰見韞琅玕人如脩竹三冬好詩與清溪九夏寒未信簪裳妨小隠蚤時雷雨起㴱蟠春風攬轡河陽縣痛飲狂歌憶舊年赴蒲道中寄洛倅王定國役永安時定國董莫嫌馬上過春風得句桃溪栁澗中王事勤君急星火客程驅我正萍蓬朅來尚可輕千里㱕去何妨共兩翁學道如今有微力作官求了不求功再寄定國河南少尹古臞僊銷盡新縁窘舊縁草字更無千載聖談言自有一家天遠游輕世唯何甚少貶求容否不然選壯坐狂俱齟齬社樗元自可忘年荅閎中順之黄巻翛然遇古人千秋遺恨一朝伸乆乾文舉尊中酒虛負淵明頭上巾纓冠未暇念同室閉眼自欲觀吾身幸有元和文似錦不妨白雪和陽春濟北晁先生雞肋集卷第十七
