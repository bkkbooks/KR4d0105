body:
  text: 第五十卷雜論五代雜論十五篇濟北晁先生雞肋集目録終濟北晁先生雞肋集巻第五十五代雜論李克用追黄巢於宛胊不及而還過汴休軍封禪寺朱全忠饗克用於上源驛醉卧伏兵發郭景銖滅燭以水醒面而告以難隨電光縋尉氏門出還軍中天復元年全忠大舉擊晉晉人大懼㑹天大雨霖梁兵多疾解去二年梁軍遂圍太原克用大懼謀出奔雲州又欲奔匈奴而梁軍大疫解去右新史唐紀第四巻全忠所忌惟克用幾危者數矣而卒免而李氏果代朱氏豈非天耶乾寧元年冬李克用攻幽州李匡儔棄城走追至景城見殺以劉仁恭為畱後四年仁恭叛晉克用以兵五萬擊仁恭戰于安塞克用大敗天復六年梁攻燕滄州燕王仁恭來乞師克用恨仁恭反覆欲不許其子存朂諫曰此吾復振之時也今天下之勢㱕梁者十七八彊如趙魏中山無不聽命是自河以北無為梁患者其所憚惟我與仁恭耳若燕晉合勢非梁之福也夫為天下者不顧小怨且彼常困我而我急其難可因以徳而懷之是謂一舉而兩得此不可失之機也克用以為然乃為燕出兵梁圍乃解去右新史唐紀第四巻莊宗之得天下此其機也人情快目前之忿而暗耳後之利其察不察間不容髮惜其雄勇有逺畧如此至其得天下而為之殆今日不為明日計而蔽於所好權在近習國將顛而不知至身死人手為天下笑夫性習之相逺不至於是將夷狄之情困則忍而思深樂則不圖後理固然哉李嗣源勸莊宗入汴嗣源以千騎先攻封丘門王瓚開門降莊宗後至見嗣源大喜手攬其衣以頭觸之曰天下與爾共之拜中書令右新史唐紀第六巻自李克用力戰伐與梁為敵國莊宗能繼其業遂得天下斯亦難矣方莊宗之入汴梁固未滅也㑹其得意遽思與人共之唐社稷未立天下之定於我未可知而所以許嗣源者已極矣夷狄尚氣喜於意外一旦之獲而不圖後日無以復加之弊其兦非不幸也明宗家夷狄太宗養以為子賜名嗣源莊宗遣嗣源討趙在禮於魏軍變遂入汴廢帝本姓王氏明宗掠得之養以為子名曰從珂愍帝以為北京留守遂據城反以兵入京師右新史唐紀第六第七巻莊宗之入汴也嗣源先攻封丘門克之即拜中書令明宗之南也得從珂兵在後而軍聲大振即封潞王夫養非族類以為巳姓而用其功以取天下功髙位迫而不知圖之禍可勝言哉然莊宗始與梁戰河上明宗功為多晚節溺於倡樂明宗取之其理固宜至明宗春秋已髙從珂之勢既迫大臣屢言忍而不斷以貽後患為可惜也夫雖然明宗與從珂所以簒人而有之其跡畧同而明宗於五代享國差久而從珂不旋踵而敗則亦各其才之分也明宗與梁人戰徳勝橋晉髙祖馬甲斷梁兵㡬及劉知逺以所椉馬授之復取髙祖馬殿而還髙祖徳之愍帝出奔髙祖遇帝於衛州知逺盡殺帝左右留帝傳舍而去耶律徳光送髙祖至潞州臨決指知逺曰此都軍甚操刺無大故勿棄之後徙知逺領㱕徳恥與杜重威同制杜門不出髙祖怒欲罷其兵職趙瑩以為不可遣和凝就梁宣喻乃受命右新史第十巻五代惟梁唐竝立夾河百戰而唐得之梁又内亂其失國固無可疑者晉取於唐漢取於晉周取於漢皆勲臣阻兵以危疑促禍惟其草昧君臣之分未定而藉人之力以取大寳一人得之一人従後而伺之至其已迫反為所取曾不旋踵悲夫徳不足以相君臣又牽於舊恩以不早辯其失也尚誰咎哉故必有聖人出而後天下大定非數也理也王檀字衆美京兆人事梁為天平軍節度使嘗招納兦盜居帳下帳下兵亂入殺檀右新史第二十三巻古姦雄擁地阻兵招納逋逃茍須其力以濟者多矣檀事梁無貳且納盜以爲爪牙歟則恩不足懷威不足制而養虎自遺患可爲世之姦豪戒也王䖍裕琅邪人邢州孟遷降梁爲晉所圍太祖遣䖍裕以精兵百人疾馳晉圍入邢州遟明立梁旗幟於城上晉人以爲救兵至乃退已而晉兵復來䖍裕不能支遷執䖍裕以降於晉見殺右新史第二十三巻韓信用市人戰所以能變化若神者其技惟不竆於披旗立幟之間故也䖍裕以百人入晉圍晉遽為解去亦竒矣得其一說而不知所以善其後至其復來安坐而受縛真兒戯哉昭宗以宰相徐彦若鎮鳯翔李茂貞不奉詔昭宗以茂貞不遜不能忍以問宰相杜讓能讓能以謂茂貞地大兵彊而唐力未可以致討鳯翔又近京師昜以自危而難於後悔昭宗怒曰吾不能孱孱坐受凌弱乃責讓能治兵而以覃王嗣昭為京西招討使令下京師市人皆知其不可茂貞遂犯京師昭宗為殺兩樞宻賜讓能死讓能曰臣固先言之矣唯殺臣可以紓國難昭宗泣下霑襟右新史第四十巻唐之衰也以六軍之士不能當一鎮其所由來漸矣其患如大疽之著要害終潰而死而讓能曰姑忍之以待其自潰而已夫豈無一朝之䇿徼幸於復全乎史稱昭宗為人明儁初亦有志於興復而外患已成内無賢佐頗亦慨然思得非常之才而用匪其人徒以益亂夫國之將兦雖有天命然拱手而待滅亦良可惜夫茂貞與韓建王行瑜犯京師謀廢昭宗立吉王保未果而李克用亦舉兵茂貞懼乃殺宰相韋昭度等而去晉兵已破王行瑜請擊茂貞昭宗詔罷晉軍克用歎曰唐不誅茂貞憂未已也右新史第四十巻唐所以未即兦正以彊藩自相持也使克用遂滅茂貞唐之兦更速云梁末帝以魏兵素驕難制乃分相澶衛三州建昭徳軍魏博貝仍為天雄軍以賀徳倫為節度使分牙兵之半入昭徳効節軍將張彦執徳倫縦兵大掠末帝諭以詔書彦裂詔書抵于地乃迫徳倫降晉徳倫惶恐曰惟將軍命乃奉書莊宗莊宗入魏徳倫以彦逼已隂訴於莊宗莊宗斬彦於臨清而後入徙徳倫為大同軍節度使右新史第四十四巻莊宗所以得入魏由彦叛梁而降晉也其迫徳倫以降晉於梁則負矣而宜無以得罪於晉也然而徳倫訴之莊宗莊宗終以逼其長為不順而斬彦彦死而魏人之心滋益服嗚呼莊宗可謂有君天下之度矣張全義臨濮人兦入黄巢賊中後仕梁為魏主莊宗入汴自洛來朝泥首請罪改封齊王初莊宗欲掘梁太祖墓斲棺戮屍全義以謂仇敵今已屠滅其家剖棺之戮非王者以大度示天下也莊宗以為然右新史第四十五巻全義草賊耳其諌莊宗意雖徳梁而為此説亦庶乎長者之言也王守恩為静難軍節度使西京畱守加同中書門下平章事時周太祖以樞宻使將白文珂等軍西平三叛還過雒陽守恩以使相自處肩輿出迎太祖怒即日以頭子命文珂代守恩留守守恩方詣館謁坐於客次以竢見而吏馳報新畱守視事於府矣守恩大驚不知所為遂罷去奉朝請於京師右新史第四十六巻周太祖雖時已貴方將兵有功而守恩亦位髙悍倨難制至以尺紙自外昜畱守頃刻而代而守恩束手從命上下怗息不敢有一言其取天位非一日之勢也唐制樞宻使常以宦者為之自梁用敬翔李振至莊宗始用武臣而權重將相髙祖時以宰相桑維翰李崧兼樞宻使劉處讓與宦者心不平之楊光逺之討范延光也以晉重兵在巳掌握舉動多驕恣其所求請髙祖頗裁抑之處讓言此非上意皆維翰崧等嫉公耳兵罷光逺訴之髙祖不得已罷維翰等以處讓爲樞宻使凡所陳述多不稱旨處讓丁母憂遂以其印付中書而廢其職右新史第四十七巻劉處讓傳樞宻使自唐以宦者爲之内持權脅制人主其患非一日之故也莊宗改用武臣而安重誨之徒實制朝廷髙祖奪以付宰相名實稱矣雖其初宦者武臣不悦至爲罷維翰等然卒廢樞宻使不畀近習握兵之人自此始可謂有逺慮者也荆南髙季興初為汴州富人李讓家僮梁祖竒其才開平中為荆南節度使同中書門下平章事唐莊宗時其下勸季興入朝京師既㱕莊宗心悔遣之季興曰吾行有二失來朝一失放還一失且主上百戰以取河南對功臣誇手抄春秋又曰我於手指上得天下其自矜伐如此吾可無慮矣右新史第六十九巻莊宗能嗣其先志復仇攘敵遂滅梁而有天下當此之時威震諸侯季興惶懼首以身朝如莊宗之言未大失也而季興遽知其無能為自此遂安枕無勤王意而莊宗不終其業亦卒如其所料觀季興雖始以奴隸椉時亂離至擁旄鉞然智識如此其跨有十州傳子若孫豈偶然哉契丹初常推一大人建旗鼔以統八部某部大人遥輦立時劉仁恭據有幽州數出兵攻之每嵗秋霜落則出兵燒其野草契丹馬多饑死即以良馬賂仁恭求市牧地請聴盟約惟謹右新史第七十二巻論者謂戰國時如燕趙小國内禦彊敵外攘戎虜孤立而無患不聞其以幣賂事人而偷安也其説信然觀仁恭非有英傑之才内困太原之討且殫其力以求附梁慮亾不暇而猶能外病契丹至反以馬賂仁恭求不侵擾惟恐不得然後知昔燕趙之所以守其國者亦必有説而後世猥曰虜益彊大非古者比至以中國全力不能一日㤀北顧憂夫使邉臣慮國如燕趙仁恭之圖已事而朝廷不預此唐之盛時所以用三節度捍邉而無憂也濟北晁先生雞肋集巻第五十
