body:
  text: 第五十九卷啟赴揚州上太守王資政正仲啟與交代范峒啟與淮南提刑賈殿院啟與淮南監司啟答揚州教授曾旼啟上揚守王正仲啟與淮東提刑王司諫啟答揚守判官趙奉議啟答致仕劉敏大夫啟與京東漕張道順啟與京東提刑趙景仁啟答淄守啟與淄倅啟與提舉鄭彦能啟與京東漕吕直父啟答滑守李孝純啟賀知府趙待制移鎮啟謝提刑上官正言啟畱臺韓朝請到狀啟答濰守啟揚州泛用賀冬啟元日賀啟元日賀啟答交代中散啟代謝求親啟許親啟送幣啟求親啟濟北晁先生雞肋集目録終濟北晁先生雞肋集巻第五十九啟赴揚州上太守王資政正仲啟比者得請宸廷備員州佐蚤在陶鈞之内久辤牆屏之嚴寅縁庇依欣喜幸會恭惟某官道徳世範文詞儒宗龍虎之得風雲主威益重山淵之有珠玉國勢增華加以仁厚不矜直方有體倦經為於機政􅋠宴息於藩維而補之册府後来書生孤立慙梧鼠之五技窘侏儒之一􅇸江海之􅋠日縈魂夢麾符之䕃與有光榮春水已生吳艎當具尚曹裝之未促儻荀御之可容鄉往之誠倍百常品與交代范峒啟䝉恩外補承乏後塵惟慕誼之素勤獲趨風而自慶恭以某官夙懐賢業藹有令名行已不撓而衆推居官所至而民願尚淹器幹屈佐藩維補之質薄自憐學迂寡與陪英髦於中秘非所宜堪奉甘㫖於宴閑葢其私便企青雲而雖舊繼白雪以良難行造門牆粗窺矩範欣愉幸㑹悃幅奚殫與淮南提刑賈殿院啟䝉恩外補竊禄便親望履幕以良勤去門牆之未久敢圖官守遂在部封恭惟某官道業古人之期風聲列位之冠以義出處繫時重輕雖雅意不忘於本朝而直諫自難於居内久傾公議尚屈逺猷補之質薄自憐學迂寡用糜丹􅉢於􅉺府固乏毫氂佐條教於藩城足殫駑蹇趨叅良邇庇賴爲榮瞻詠欣愉併㴱悃愊與淮南監司啟䝉恩補外竊禄便親仰風望之素隆傾誠心之固久敢圖官守遂在部封恭惟某官賢業藹聞公才屢試奉行寛大之令威亦暢於屬城愛養疲瘵之甿財不虧於成賦尚淹使指行副褒延補之質薄自憐學迂寡用糜丹鉛於􅉺府固乏毫氂佐條教於藩城足殫駑蹇趨叅良邇庇賴為榮瞻詠欣愉併㴱悃愊答揚州教授曾旼啟比者請外便親䝉恩佐郡往歳周旋之舊彌年契闊之懷又此從遊良爲幸會恭以某官精智洞物髙才邁羣倚相讀書博洽竆於世表正平作賦敏捷出於坐中科甲先登名譽早立當居要近寧久宴閑補之自以拙艱安於疎逖青雲魏闕初驚日月之遥春水隋河已夢江湖之上聊復爾耳慙爲米之淵明于時言言喜班荆之聲子清和在􅀱導養適宜先辱音題尤增感刻上揚守王正仲啟近承恩撿叨備府僚嘗貢郵牋僣塵台几敢謂謙尊之盛徳曾無疎賤之遐遺飭書記以染修付􅀱兵而傳致奨收踰分感愧幷心伏審得請過家方春展墓散黄金之百鎰見白髮之故人鷁舟㱕濟於晴江虎莭還臨於治部即日鎮撫多暇神明用休補之蚤被陶甄久辤牆屏載勤舟楫奉甘㫖以知榮適及郊圻聽歌謡而自慰意行調於元鼎難久託於後車用此傾馳不忘魂寐清和當􅀱拜伏可期與淮東提刑王司諫啟被選中宸改臨東部獲趍風之良舊􅋠去徳之未遥側聆除音尤喜幸會恭以某官學術知古才謀適時直莭在於諫垣能聲聞於省闥訪民恫苦姑暫屈於登車副上褒延已久虚於前席補之才質人後趣操衆違比縁將母之求偶遂佐州之請敢圖官守預占提封庶自竭於疲駑蘄永依於庇頼欣愉鄉往併劇下情答揚州判官趙奉議啟辟書畫可賔幕改除惟􅉥慕之素勤獲從游而私幸恭以某官美才自立佳譽藹傳鳳穴一翰殊有超宗之質龍門獨上早膺元禮之知念契闊之未遥辱音題而尤喜炎歊方熾款晤可期答致仕劉敏大夫啟竊啟風聲未親晤語枉書郵之先貺審舟御之將臨即日順履凝嚴茂迎福祉某官賢誼甚美公才素髙浮榮如過於蚊䖟苦莭自期於松柏幸縁寓止當遂從游載惟欣慰之多非復敘陳之究與京東漕張道順啟念趨風之良舊復去徳之未遥遂託部封實爲幸會恭以某官博學知古通才適時揚歴省闈名獨髙於羣彦從容使指威自讋於屬城方聖政之又新豈賢猷之久屈補之内慙竊禄自乞試州歳比不登民逃未復撫循有道在躬守於詔條施舍不煩可面承於教約炎歊方熾叅奉有期與京東提刑趙景仁啟光膺帝制出領使權已次封圻初交印節伏惟慶慰以某官髙才敏達雅操靖嘉玉立班行固朝廷之妙選風生羣聽藹臺省之休聲尚屈逺猷俯臨一道行著澄清之績亟㱕侍從之華而補之請外便親得官屬郡竊伺張􅎶之邇將申守土之恭欣抃之誠倍百常品答淄守啟去闕廷之伊邇㢮負擔之云初畫界相望親仁良幸補之世家單系􅉺府後来文無取於將明武不足以捍衛每自慙於索米姑求試於長民伏遇某官忠藎事君中和布政顧何功於製錦竊自喜於分光未暇染修先承慶問感銘殊厚敷述難竆與淄倅啟著述寡功迂疎畏罪輙自陳於將母偶得請於為州敢圖弛負之初乃辱馳書之貺感銘殊厚傾詠益勤恭惟某官懿行温良公才敏邵題輿以俟偉仲舉之髙名投傳而歸小巨卿之獨操宜入聨於省寺寧久困於簿書而補之曩㫺宦游寅縁晤接回首十年之舊相忘數舍之間尚阻合并重增鄉往與提舉鄭彦能啟頃寓都城偶連牆仭自惟疎拙方力請於郡章亦值髙明將出宣於使指幸趨風之頗數復去徳之未遥間關行路之勤倥傯交符之始仰依大庇内激愚衷伏念補之素不逮人猶知信已少時薄技誠何取於屠龍長歳虚名固無堪於挹酒窘中塗之㚄䟦賴十手之輓推矧在仁賢最為知舊當法令再行之際屬疲駑承乏之時庶幾平均未廢詢採恭惟某官忠以事上恵於撫民嘗力學夫古人知為政之大體清河恃孺文之故敢有是心渤海遇勝之之賢儻縁今日官曹冗甚書牘闕然尚阻叅承重增延􅉥與京東漕呂直父啟被㫖中宸改臨東部凡居庥庇舉集欣愉恭以某官業履忠純才謀敏達當先朝之慎柬在羣俊之上游使指屢將守麾荐擁居有顯効去常見􅋠方聖政之又新豈賢猷之尚屈而補之自惟疎拙頃辱交承復幸提封獲依刺舉恵畱多袴民借宼以無由威暢連城盜奔秦而先改趨叅甫邇頌詠尤㴱答滑守李孝純啟久託姻盟未親賢度一麾假守釋負檐之云初千里贈言想音容而如接媿慙既厚欣喜幷㴱恭以某官懿行自將髙才挺出蚤踐揚於要宦方烜赫於能名列㦸映門固大家之流澤褰帷行部有循吏之遺風側聆交符幸此授館將獲踵門求見之便以慰慕義無竆之心契闊未間傾馳尤劇賀知府趙待制移鎮啟光被制書改司京鑰凡居庥庇舉集歡愉恭以某官中正而通優游以法藴經邦之逺業在志學之妙年入奉清光文采昭囘之上出臨方面折衝燕笑之間自當綱紀朝廷訏謨帷幄尚茲均佚咸謂非宜補之疎拙守藩乖違得罪敢圖恩宥乃佐畱居仰大厦之足依俯孤蹤而自慰妍和取道順履逢休謝提刑上官正言啟奉法不䖍䝉恩薄譴何意拙疎之跡乃依刺舉之嚴莅事云初省躬㴱幸恭以某官風猷甚逺徳操不囘學葢在於誠身仕不蘄於遇合少馳妙譽蚤掇上科夷􅊲平生實皆餘事尚出將於使指行㱕侍於禁垣而補之樗杇無堪萍蓬惟寄去門牆之滋久備官屬以爲榮収堂下之言雖仰煩於大雅効囊中之穎茲方窘於末塗更願須以歳時寛其轡䇿庶幾報稱可積毫釐感愧之懷倍百常品畱臺韓朝請到狀啟奉法不䖍䝉恩薄譴敢圖佐守遂隸分臺眷言離索之情獲此從游之幸恭以某官慶傳累世譽滿本朝子産知然明之心殊非今日文舉待正平之少固與忘年馬伏櫪而長􅋠萍因風而相值人生投分勢豈偶然念布敘以未遑辱音題之良厚欣愉感荷倍百鄙懷答濰守啟自以拙艱安於疎逖抗章得請交印云初傾心徳誼之勤引領疆圻之邇願馳書之固久特攖事而未遑恭惟某官慈恵為春清明可鑑帶牛縁畝不但格於頑民渡虎去封已先柔於異類將入補公卿之缺豈惟錫車劔之榮慙製錦之難工幸分光之無損首貽慶問倍荷眷私屬守郡符阻親履幕揚州泛用賀冬啟銅儀軫轉肈南陸之景長緹室飄颻知黄宫之氣至人惟剛徳天與介休恭以某官篤實方中柔嘉暢外世大来而小往時陽息而隂消用此進為孰量事業悵坐縻於官局阻趨慶於賔墀欣頌之誠倍越常品元日賀啟羊雞祓惡導四氣之始和椒柏泛醇薦百年之難老惟人視履與物咸新恭以某官中正以通柔嘉維則入陪嚴禁屢輸竭於忠猷出總連城暫布宣於恵澤順迎端月茂擁介休悵拘縶於郡章阻叅承於戎幕永言善頌數倍常情元日賀啟羊雞祓惡道四氣之始和椒柏薦醇介百年之難老惟人視履與物咸新恭以某官中正以通柔嘉維則佩牛還畝知警夜之可虚竹馬迎郊想班春之方暇順迎端月茂擁殊休悵拘縶於郡章阻叅承於賔幕永言善頌數倍常情答交代中散啟拜恩中禁假守瀕河念仳别之尚新獲交承而自幸恭以某官徳誼粹美材猷敏彊久柬在於班聨暫屈臨於刺舉將聞顯用諸大夫皆曰賢固有規摹舊令尹必以告未遑修問先辱流音叅晤可期欣愉良劇與李中大啟倦游郎省得請藩麾平居慕望之勤今此晤承之便恭以某官德履端潔才能敏長學穉齒而蚤成志耆年而彌邵踐揚臺閣葢政事之猶存穎脱雲泉固風聲之可尚馳書尚闕流問辱先傾葢足榮驅車竊抃謝呂大夫啟請外便私䝉恩補郡去闕庭之伊邇弛負檐之云初問俗何先聞風增慕補之世家單系册府後来文無取於將明武不足以捍衛每内慙於索米姑求試於長民伏遇某官脱畧軒裳燕居里第顧何功於報國竊自喜於親仁未暇染修先承榮問感銘良劇敷述奚殫答通判朝奉啟得請宸庭出分郡寄惟傾風之素切偶聨事以為榮恭惟某官徳誼致修聲猷自奮揚歴閨臺之舊囘翔藩閫之游咸謂非宜安能久屈庶幾有政賴別駕以不空固願無何如淮陽之髙臥叅承良邇欣幸尤㴱代韓太中賀徐中丞啟躋榮螭陛進總霜臺恭惟慶慰伏以某官天才俊良神氣宏偉起于磐之鴻漸爲溟海之鵬摶操行古人之期謨謀當代之映賈誼之遭文帝千載所難馬周之遇太宗一言而合亟任掌綸之選迅陞專席之雄光華儒林洋溢士論側聆新命俯愜素誠限繋外官阻申慶謁永言欣忭曷罄敘陳與淮南監司啟罪譴佐州親嫌昜地倚門牆之良舊託封部之云初内顧迂疎尤㴱幸會伏念補之少而孤立壯不適時誤貼職於書林本無學業濫承流於藩郡秪用資塗敢攀鵷鵠之髙嬉自笑缾罌之昜滿黑生白犢寧論無妄之災醜效美顰宜取求全之毁賴聖時之忠厚俾愚分以便安每自揣循惟知憐惕伏遇某官至誠樂育大雅不羣恕常用於一言威自行於千里尚寛刺舉小假歳時儻不重於悔尤或粗收於毫末謝解啟伏覩解牓偶被薦送者廹彊敵以當前初虞逐北挈孤軍而冒戰遽預先登進叨非據之榮退積循涯之愧竊以治非一道三代之所同功學非一師百聖之所竝宇更末流於淺鮮之後追大本於芒忽之為五官猶具於天根六鑿未仍於物偽行義忠信粹乎常得於固存言語文章卓然皆出於可用教化之所被及風俗之所影随中國無異於四方野人知學於君子王者之迹未熄古人之體尚存少變而為晚周大壞而為戰國處士以詖行自售公子以得人相傾離騷濫於辭章兵法竆於威武禁游説者縱横以辯顯任使者推理以雄俗僻則吳越無秀民照奇則鄒魯無異行陵夷百世鹵莽一塗漢㳂秦餘而莫醇唐因隋舊而未善際真人之撫運混雜霸之餘墟英宗廣於規謨仁祖備乎文物今上闢圖書之府重禮樂之司息誦數為腐儒廢雕蟲為土苴奮乎百世之後覩此六經之難以是取人謂宜得士如補之者拙非世用僻與衆違有轉喉觸諱之竆無炙手可熱之助流離百狀辜負寸心搢紳之所未信而無庸鄉黨之所共輕而竊笑踽踽自守無意於舍􅀛倀倀何從迨同於即鹿亦嘗側聞長者之論庶幾得上君子之堂十載屬文七年論學蚤濫舉首輒困退飛託患難之餘生守迂疎之舊習仰箕裘而莫繼俯蓬甕以增羞望絶亨嘉分投竆籍詩常招隠書或絶交它人誚其逆施智者以謂非異不覺歳月之昜失竊省功名而自驚逺舉何為聞虚絃之已怯相忘可樂忘芳餌以復来然而學不能偶當世之方圓材不足當大人之取舍僶俛自力攣拳莫堪一字固㣲屢經營於燥吻萬言良富愧滂沛於搖毫尚賴庶明過辱題品掇其片善躋以上游斯葢伏遇某官大雅不羣至誠樂與譬之水正錯而不動與夫衡誠陳而不欺有形焉得而茍藏無物不可以自試故容蕞陋亦預甄收某敢不增益淺聞激昂壯節鵬摶有待固未忘九萬之程狗盜為功猶不愧三千之客公為求親啟慶長舊望雖懷齊鄭之殊投分明時實許晁張之竝輒恃㫁金之好曾忘倚玉之嫌仲孺姪孫吏部長男公為不逮於人粗教以義伏承賢弟龍圖位第十一小娘子閫儀世邵女美幼聞妄伸納采之誠私幸宜家之慶不忘故分終恵好音送弊啟近者輒布私誠仰希髙援愧山川之能受報金玉之好音不鄙單平更篤盟好及泮氷之未幾羞束鹿之惟時念孔李之通家寧慙於舊庶媯姜之五世殊未可量永言欣愉莫磬陳敘不腆禮弊具如別牋公似求親啟通家奕世如蘭未喻於夙心繼好諸孫投李敢期於厚報載敦合姓敢替問名伏承某人女善慶所鍾徳容兼茂某人男屬方幼學期以成人男既彼甥女惟此出契援踰於它族禮律可以通昏鳴鳳其昌已篤媯姜之舊同車信美不遑齊鄭之嫌􅉥望良勤好音無閟代謝求親啟近枉行媒特傳嘉命髙門絶企實懷賈詡之私見子良勤願附王謙之義仰慙眷厚敢布悃誠伏承某男蚤聞俊良自立孝悌無綺紈餘子之好有詩書寒士之風某女方妙年齡未􅐬警戒采蘋南澗雖法度之可追如舜同車顧徳音之未著承言感佩難遽遵承許親啟比念鄙宗難攀髙援輒布敢辤之義重煩同好之言詠魴鯉之詩雖有慙於齊宋􅋠冠冕之胄誠竊慕於崔盧矧繾綣之已勤欲逡廵而安可願言託附實有光榮感刻良㴱敷陳莫究送弊啟疊煩信紹申篤嘉盟煥然純帛之儀寵以問名之耗蘿施松柏後方昌而莫與京桃報瓊瑤物雖薄而用可重不腆實篚具如別牋求親啟台鼎髙門金蘭重義已幸趨風之舊矧煩繼好之修令弟某官制行孝恭稟資英爽幹蠱優於用譽視履宜於􅊲祥某房第幾孫女蚤慎閨儀粗知婦教乃求葑菲俾結絲蘿承命愧慙披詞榮耀竊欽慶善方膺五世之昌輒昧單平願布一言之諾其於銘感豈盡敷陳微物將誠具如别愊濟北晁先生雞肋集巻第五十九
