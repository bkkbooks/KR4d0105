body:
  text: 􅀙兄无􅰞平曰著述甚冨元祐末在館閣時嘗自製其序宣和以前世莫散傳今所得者古􅑝騷辭四十有三古律詩六百三十有三表􅢳雜文史評六百九十有三自捐館舍逮今二十八年始得編次爲七十卷刋于建陽紹興七年丁巳十一月旦日弟右朝奉郎權福建路轉運判官謙之謹題
