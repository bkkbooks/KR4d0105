body:
  text: 第十六卷律詩廷賢求賦先春亭送會稽關彦遠罷官河北己酉六月赴上饒之謫醇臣以詩送行次韵畱别對雪和王仲至春雨呈文潛魚溝懷家次韵金鄉宰韓宗恕寺丞見贈三首出都呈十五叔父贈歐陽成判官次韵蘇注承議天鉢元長老像前拈香次韵王正甫馬陵感事送顔長道客滑道士别關景輝二首送曹子方福建轉運判官二首飲挍理盛居中家次韵二首次韵挍理盛居中上元次韵蘇中丞喜文潛病間鎖試呈同舍三首試院呈文潛用前韵愼思聞家弟无斁㨗解見貽用前韵復用前韵寄題愼思壕塘居呈曹子方泗州王諫議明叟畱飲招縉雲寺彦遠教授曾彦和集平山堂次彦遠韵陪關彦逺曾彦和集龍興寺詠隋時雙鴨腳次彦遠韵閻醇老作默齋與曇秀師别垂二十年而後相㑹於金山作送曇秀師㱕廬山夢齋戊子六月十三日曝書得史院賜筆感懐相儀公也時監修丞濟北晁先生雞肋集目録終濟北晁先生雞肋集卷第十六律詩七言廷賢求賦先春亭築圃名亭盡可人東皋百卉故先春丘原滿目皆安在桃李成蹊又一新薙草煩君開蔣徑漱醪容我著陶巾青門瓜好平生事欲遣朱轓便卜鄰送會稽關彦逺罷官河北君年長我二十五偶以氣同均弟晜三嵗吹沙禹河曲一身飛艇越雲門未緣狗監知才思端向牛衣無涕痕秋月圓時應待我慧林孤磬澹朝曛巳酉六月赴上饒之謫醇臣以詩送行次韵畱别小雅思㴱志不悲反騷未與㫺人違五車謾苦君何益三徑都荒我未㱕要過香罏䨥履步􅁍從彭蠡一帆飛它年笑向張公子應帶煙霞滿客衣對雪和王仲至鸞鳳交橫逐雨華玉城銀澗共縈斜且㸔霧散千􅈐瘴未覺雷驚萬谷芽碧落高情元物外金閨清夢自天涯寧知夜半寒歌客煙斷鄰牆四五家春雨呈文潛倦將烏帽障黄日一雨新開春已融忽驚宮瓦出新碧更喜海棠舒小紅愛酒鄰張不可奈聽歌老謝無由同春如行客祗欲去若爲挽取須壺空魚溝懐家生涯身事任東西藥笥書囊偶自賫桺嫩桑柔鴉欲乳雪消冰動麥初齊沙頭晩日檣竿直淮上春風雁鶩低㱕去未應芳物老桃花如錦遍松溪次韵金鄉宰韓宗恕寺丞見贈三首椉濤無意犯星躔好在琴尊且樂全彭澤孤吟成小隠蘇門雙嘯劇登仙平時主父言多困晩節揚雄學始傳鮑叔可能知管子勞君相許寄忘年蜀客高詞詫割鮮直吞雲夢氣仍全自憐單閼竆爲賦不向元和共得仙子虚應恨不同年故以是求仁云若使漢廷重用賦荅嘉論一朝傾葢合新詩半夜叩關傳西窗却話巴山事它日相逢憶此年公子翩翩出世賢少時術業已成全閑中道義輕三事醉裏文章敵八仙客舍寒罏聊可擁縣樓昬鼓不須傳河陽花發期相過即是新年換故年出都呈十五叔父凌兢痩馬不堪驅塞眼紅塵暗九衢太學虀鹽聊樂只故園桃李且㱕歟上書北闕三年困種豆南山一半蕪忍志動心天相我莫慙關吏辱陳餘贈歐陽成判官一言子産識然明白首憐君獨抱經去馬來牛隨白日落花飛絮得浮名曵裾五府非良計發憤三書亦漫成便作㱕休豈無食木蘭埀露菊含英次韵蘇注承議天鉢元長老像前捻香蕭然方丈病儀成蓑笠忘來一境清應作是觀寧有相實無得度卽非情日當居士行時午月在生公講處明能識微言只夫子可憐惟我最初程次韵王正甫馬陵感事風雨關河浩蕩愁騷人憭慄對清秋追君舊事何堪聽投我新詩不昜酬紙上安知百年後酒中聊可一生浮言㱕欵段誰能約正有疎頑馬少游送長道客滑道士海山兜率事悠悠底處仍須著力修莫認箭邊曾有鹿安知蓑外是無牛社樗共作支離病園絮同爲汗漫游亦見顔公爲言此春風過盡不擡頭别關景暉二首鄴王臺上幾追陪臺上鴉鳴古甓摧每對燈前青玉笛不辭花下白銀柸家物皆彦逺九重幽夢驪駒近百卉佳時鷤䳏催更約歡呼須繼日從敎河漢卷星廻筆陳雲横未昜陪雁門端見壓城摧櫟中麋出君摶飯地上蛇成我奪柸好在田園心事嬾罷休簪組鬢毛催稽山爲有知章否欲泛扁舟定却廻送曹子方福建轉運判官二首談經草檄鬢華生初擁閩山傳節行江入桐廬青欲斷溪從劒浦碧來迎茶雖戸種租宜薄鹽不家煎價欲平要使祈招歌德意君恩不爲逺人輕侏儒未用笑先生孟博聊堪攬轡行學有人民可嘗試詩須山水與逢迎邊夷豈識朝廷治耕釣唯知吏政平臺閣時清多俊彦蕭生雅意未宜輕飲挍理盛居中家次韵二首騎鸞玉府盡仙眞短羽愁攀天漢濱詩嬾便應推老手飲豪獨未後諸賓宮壺銀箭剛知夜籠燭金華已報春倒載微吟笑兒稚時清寧是習池人一倒南齋玉宇醇絶勝不醉楚江濱驪駒且莫催㱕御鴝鵒何妨屬坐賓我尚少年新白髮君須痛飲敵青春未愁驅使無詩句怕遣壺空花笑人次韵挍理盛居中上元四見都城燈火春看驅肥馬走朱輪天傳九奏虛羣籟海踴三山跨萬鱗追賞謾逃㴱禁􅀡拜迎祗望屬車塵預知短髮非歡事只有觥舩未愧人次韵蘇中丞喜文潛病間㩦笻過子約朝朝况是門無百步遙午臥檐曦茶可煑夜談窗霰栗堪燒范魚何用驚生釡鄭鹿應知夢覆蕉試作文殊問居士從今一飯久如消鎖試呈同舍三首官局悠悠共此行來時庭菊未含英五更脱葉驚書几一夜寒砧滿禁城詩似凉風來有思酒如清露挹無聲何時驄馬催㱕去更有林端魄一生天街初月映天河拜敕東華走馬過解榻暫如􅀛遇木閉簾還似雉嬰羅倦依書冊工催睡悶倚詩篇足當歌可待紛紛厭朱墨晝閑唯有飲無何周行櫛比未應充薦廟方求古鼎鐘經眼乍愁千紙積解頤聊喜一言逢黄花庭檻時雖過白酒鄰槽願可從更促寄衣眞似旅曉堂初怯露寒濃試院呈文潛用前韵神交千古聖賢中尚想銅山應洛鐘傾葢十年唯子舊知音一世更誰逢天如蟻磨駸駸旦談似繰車斖斖從鄰榻鄧侯􅄼不共擁衾百首興方濃慎思聞家弟无斁㨗解見貽用前韵吾弟平生辛苦同匹雛志舉百鈞鐘自慙操瑟尚不斥勸使力田終有逢青眼故人欣捷報白頭老母喜占從書林儻預西城集釂子酣酣杏正濃復用前韵寄題愼思豪塘居玉泉飛落白霞􅈐散入山田畞十鐘鄧子結廬眞世外陶公脱屣更誰逢鶯啼春竹風煙近龍起秋堂雨雹從誰使山人空蕙帳蓬萊金殿興方濃呈曹子方曹子金門等陸沉壯年裘馬四方心檄傳白羽從沙井詩寫紅巾遍武林兵甲胸中無敵國絲桐世外有知音相逢不飲何爲者祗作寒㕔擁鼻吟泗州王諫議明叟畱飲雲水東遊蚤嵗懐半生塵土却教囘兩行堤桞關心在一㸃淮山入眼來北省主人誇酒好南風稚子喜帆開揚州底事牽行色端爲瓊花芍藥催招縉雲寺關彦逺教授曾彦和集平山堂次關韵蜀岡勢與蜀山通龍虎盤挐上紫空小語還憂驚太一高堂元自在天中少師楊栁無遺跡承㫖歌謡有舊風斜日蕪城昜興感忘懐猶喜故人同陪關彦逺曾彦和集龍興寺詠隋時雙鴨脚次關韵風起雷塘陵上塵雨荒苔院兩株春樓臺有跡皆餘燼草木無知尚見珍博士獨能名玉棐使君還許夀靈椿宣城此物常充貢誰與連艘送萬囷閻醇老作默齋淨名良久文殊歎此是如來不二門要識結瘖非是默應知分别亦無言一絃曾得嵇生愧三復能令孔子尊正復立談封萬户時清何害口瀾翻與曇秀師别垂二十年而後相㑹於金山作詩筆多生習氣牽老來經唄亦隨縁何妨偶入東坡夢未害閑依北固禪萬里波濤慿檻語一山風雨竝窗眠未甘白首塵埃地更約相逢二十年送曇秀師㱕廬山夢齋扁舟又過楚江東廬阜霜晴翠埽空四海五湖皆逆旅千巖萬壑正秋風㑹觀沙界無華處何必茅齋是夢中已悟三生舊知識不因天竺寺前逢戊子六月十三日曝書得史院賜筆感懐監時儀公也修丞相君王孝悌纂修意丞相忠良典領宜却恨身爲周柱史不令人識漢官儀當年請郡新進笑今日曝書陳迹迷猶有院中宣賜筆不妨林下醉題詩濟北晁先生雞肋集卷第十六
