body:
  text: 第十四卷古詩再用發字韵謝毅父送茶贈常州感慈邦長老門人大通及第東㱕將赴調寄李成季復用前韵荅明略并呈魯直復用前韵荅魯直并呈明略復用前韵并荅魯直明略且道見招不能往復用前韵荅唐公唐公有一日紙貴傳都城之句且訟其不知我也并呈魯直成季明略復荅唐公并呈魯直成季明略復用前韵呈明略家池雨中二首再用韵和陳伯比二首用寄成季韵呈魯直復用前韵遣懷呈魯直唐公成季明略復用前韵荅十五叔父任城相㑹見和詩任城有李白舊游處録於詩中聞文潛出試縣約毅父尋春次韵唐美述志湯村逢陳安性過熊耳山送公爲之淮南即事呈閎中順之二年兄二首順之將攜室行而苦雨用前韵戲之飲謝公輔家以蒼陵谷引水記呈毅父惠詩次韵春雪監中卽事二首晩春二首示張仲原秀才二首村居卽事夏夜雨意蒲萄謾成呈文潛五首試院中秋直廬聨句濟北晁先生雞肋集目録終濟北晁先生雞肋集卷第十四古詩再用發字韵謝毅父送茶開門覩雉不敢發滯思霾胸須澡雪煩君初試一槍旗救我將隳半輪月不應種木便甘棠清風自是萬夫望未須椉此蓬萊去明日論詩齒頰香贈常州感慈邦長老門人大通君不見大通方丈空無物亦不拈椎并竪拂本原自性未出喉已向頂門遭一咄感慈神駿渥洼流壁上高僧莫遣酬霹靂一聲龍破柱此中何處有裵休及第東㱕將赴調寄李成季先輩觀濤滄海口長嘯横槎拂牛斗野人醉著夢游天九門歷盡驚復還嘈嘈廣樂猶盈耳出門依舊重人間不知先輩今何往仙標玉骨天應賞千里東㱕􅇀景清桑麻暗地日銜城黄金宮闕初回望青草恩袍偶自榮㱕來澣濯親甘㫖却歎京塵誤遊子家人飰黍慰辛勤鄰媼壺漿佐歡喜君不見馮驩一劒星䦨干短歌慷慨不堪彈男兒得意貴穎脱功名有分勞躋攀折腰正爲五斗米得飽約君尋故山復用前韵荅明略并呈魯直廖君憤世談刺口人言寧食蔥三斗軒然齃鼻頤隠肩日日醉市驅驢還我初目病視髣髴望君有異大人間新豐兩行惜不上竹林風來虛自賞俯頭落筆千人驚一戰取齊餘兩城田生龍甲賴束葦詭勝尾熱安知榮盈盈府中誰憐此爲君愧慙黄夫子論功欲識非戰罪試使喑走楊喜君不見方朔高才良獨難割肉要令生自彈北軍給食誰致爾羊求平㫺安能攀偶然棒檄忽擲板鳥自知還雲出山復用前韵荅魯直并呈明略黄子人談不容口豈與常人計升斗文章屈宋中阻艱子欲一身追使還離騷憭慄悲草木幽音細出芒絲間陽春絶句自雲上折楊何煩嗑然賞横經高辯一室驚乍似遠人迷廣城隔河相和獨許我枯枿亦有條之榮廖君不但西南美誰見今人如是子多髯府掾正可謔蠻語叅軍寧素喜君不見古來皆醉餔糟難沐浴何須仍振彈斲冰無處用蘭拽芙容木末安能攀只無相報青玉案自有平子愁關山復用前韵并荅魯直明略且道見招不能往銅斗承糟醉張口口和漁陽拍銅斗去年抛却青竹竿女􅎐嬋媛呼我還我初不解世中語淡面􅄼乆王侯間未須頭出千人上要有廖君黄子賞竹林清風前日生豫章冥冥雲擁城二人不來草木長帶鋏陸離誰與榮步行奪馬從此起談笑封侯誰氏子平生不識笳鼓悲虚讀君詩舍然喜君不見大賢遠抱與俗難何須酒盤柔指鳴哀彈二人高韵巳廖廓黃鵠之飛􅄼得攀繩橋可度見可喜家貧馬骨高三山復用前韵荅唐公唐公有一日紙貴傳都城之句且訟其不知我也并呈魯􅀡成季明略諸公辯壯懸河口唾落紛紛珠百斗井陘酣戰我已慳赤幟忽立無由還唐公斷後不容北腹背未殊秦宛間明光侯印懸天上下有死夫縁重賞書生懦志安足驚饑死索米長安城獻君賜帛等優笑覆醬未知傳紙榮泮宮先生誠國士可是同年予二子雜吟未減聽匏竹能使竆愁發孤喜君不見新聲欲至舊聲難十指勞君千萬彈平生不遇感知己過此身外誰能攀它年常侍幸見訪不因豆落悲南山復荅唐公并呈魯直成季明略竆邦無以餬吾口嵗嵗荒山収橡斗商歌白石不勝寒非爲荆州三往還天下無人知我意得君相合一言間三書丞相何煩上再見客卿寧用賞願聞關中季布名何得此聲梁楚城論心四子誰許我百金一諾兹爲榮唐公才非今世士不見聖人見君子我今正似逃虛空聞人跫然已心喜君不見玉川月蝕詩律難不獨蝦蟇遭罵彈慿陵百怪付公等青天蜀道寧容攀它時鄒湛名亦好常在我知因峴山復用前韵呈明略茅焦逆訐磨虎口何似淳于飲一斗終軍椉傳驚漢關何似富春投組還天下同心乖出處豈徒黄白馬毛間鄙夫紛紛煩觖望負日可堪希國賞竹林居士亦何營江花無限老江城􅄼知橋上駟馬寵能作山間蕙帳榮興國寺中四月尾海棠雪落生紅子呼門日午醉不譍昨夜君恩賜聞喜君不見卒然佳㑹高歡難幸值野王聊一彈人生歧路昜南北明發雲散何由攀知君未試餐玉法我亦欲返焦城山家池雨中二首小池初鑿新得雨一部鼓吹從何來有蟾正碧亂草色時出汨没西南隈井榦跳梁百不少洞庭魚龍何有哉能歌得勝莫入月凉夜與爾俱忘回不作太白夢日邉還同樂天賦池上池上今年有荷葉細雨游魚噞輕浪教兒讀易不應舉幽人一爻吾得尚此池便可當長江欲榜茅齋來蕩漾再用韵和陳伯比二首田里馮生寧屑去湖海陳卿時肯來詩書好在家四壁蒲桺蓊然城一隈騎上下山益疎矣鯈從容出何樂哉市橋十步即塵土晩雨蕭蕭殊未回築臺危可瞰坰牧朝來小雨猶十上雖無峻嶺有脩竹不減山隂同放浪青門正爾堪邵平雲中何必須魏尚小池更廣勿近牆畏與濁渠同滉漾西牆通舟有渠用寄成季韵呈魯直懷英名高長史口獨以一人當北斗黄公崛起與之班奄有斯名唐以還文章破觚賴聖世筆墨未逃蹊徑間湖州太守諸儒長可獨進賢無上賞曽語黄公四坐驚競吟佳句汶陽城湖州於汶上座丁巳年余謁蘇魯直詩中爲余誦飲茶未勝薄酒傾若人所辱伊人榮鳯兮徳衰衆鳥恥陳蔡不憂顔氏子竆吟百軸傳未巳短髮頻搔爲君喜君不見富貴及時行樂難雖無趙女有秦彈夢中自古不識路月在雲際勞梯攀何時半嶺聞清嘯相值蘇門百尺山復用前韵遣懷呈魯直唐公成季明略涇水爲渠食萬口一石論功泥數斗嗟涇獨不似渭閑安流赴海又西還天下楩柟盡隆棟何如櫟社不材間無能飽食猶天上巧智憂勞縁利賞我無懋功突厥名横身爲國作長城又非石堡將軍勍帶刀奪取紫袍榮世上此身愚莫比霧縠翻慙漢童子壯心雖欲彊自挽鳬足元慳續非喜君不見西京對筞濟時難羞死王嬙馬上彈時平鳥雀須食爾鴻羽可用高難攀從今識路窘捷徑求我莫傍終南山復用前韵荅十五叔父任城相會見和詩任城有李白舊游處録於詩中太華玉蓮甘適口我欲求之青壁斗崑崙不覩覩大宛何異學射中涂還平生傲世予南阮臧否未容畱齒間七賢遠跡㝠鴻上咸也復幸青雲賞㱕來濁酒厭獨傾疲馬却走諸任城紅桃白李晩寂莫黃菊獨暴秋陽榮謫仙酒樓餘舊址明月年年飄桂子不見山東故小吏斗酒雙魚誰共喜慟哭竆涂自古難不應更待雍門彈瓜田今歲初自墾柴車後日復誰攀東阿下望有㱕意且爲子建畱魚山聞文潛舍人出試院約毅父考功尋春上界官府多文書我臞猶比山澤儒閒忙態異亾羊等一月不見霜侵鬚雖無京兆白花瀝還有太官青玉壺武安曽孫我外弟聞君得人助君喜可能餅果饜兒童不有柸槃到隣里去年南㱕飲王家把盞猶見黄梅花城南尋春成嵗事忍不省顧隨泥沙世事何須還刺口輕薄論交翻覆手自憐只似永州甿㱕喜虵存視吾缶爲太醫採虵者曰柳子厚説永州氓存則㢮然而臥視吾缶而吾虵尚次韵棠美述志仲子甘心織屨避萬鍾淵明不肯折腰爲五斗一年鴻雁識來往終日沐猴何去取甥詩意慕兩君閑讀書要在存心久平生所談性命奥長棄不憂金石朽我今頗習鶖子定猶復晨朝怖頭走刳心先擬謝聲名不作羊鄒悽峴首雲梯雨矢集無方我已心灰同墨守恐甥自是禹門鱗未可潛逃入吾藪琢磨晚覺孟光賢畏我放言時被肘甥能鋤我青門瓜正午時來休老手湯村逢陳安性束裝清曉來江浦痩馬羸童犯山雨解鞍入寺聞鐘聲堂上僧齋日初午故人聆我足音喜紗帽相逢坐東廡别來幾日頷生須相見驚疑更問語念昨與君俱隨書貧賤不爲人比數侍郎門館乏容悦舉子文章慙瞽言彊獻亦何有君去東州我之楚可憐今日江頭路草草逢君具雞黍我貧無䇿未容飽君祿雖微不猶愈如今未可計得失且作新詩致醇醑過熊耳山殺一不辜神所恫呂母何預於樊崇蜂螘無王求所止一朝積甲齊熊耳兩􅄘相向猶耽耽千載定林餘一龕我來捫石望荆杞此山閲人亦多矣送公爲之淮南且還讀我書此其意也陶靖節云既耕亦已種負米萬里緣其親運甓無度憂其身讀書莫學流麥士挾䇿勿比亾羊人乃翁辛苦到白髮今汝彊勉當青春㫺時管鮑以君霸此兩士賈寧非貧卽事呈閎中順之二年兄二首蠖軒屈首詩書人自喻適志非求伸聞蟬熟寐白竹簟見客一整烏紗巾語言無味竆鬼志香火有緣居士身明年得去不汲汲種竹待筍猶須春吾兩同年俱可人平生一爲知巳伸何由利口似虎圈應不拭吐煩龍巾卜鄰只約二三子看山擬分千百身綠鬢哦詩欲成雪朱顔得酒尚能春順之將㩦室行而苦雨用前韵戲之十旬九雨龍淫荒林蟬砌螾俱悲涼豐隆不閔行澤足猶喚脂車煩阿香我知此咎非風伯慿慿幕天爾勍敵王郎行李望秋晴莫汚北飛雙鳳翼飲謝公輔家皇天於春自著意安排未遣東皇家朝雨已教潤壓土曉風更將寒約花詩篇驅使到老得酒舩拍浮即生涯四年逢春今日好可是芳物年年加以蒼陵谷引水記呈毅父惠詩次韵與君􅇀從栖岩東有泉鏘然發湥谷人言祥符行幸城無水跨野疏泉此山足後來修廢吳與李誰其記者江休復我欲重銘章聖功借君巨筆鏨寒玉春雪監中卽事二首愁雲欲雪紛來族微霰錚鏦先入竹舞空蛺蝶殊未下迸瓦明珠正相逐僕夫無事困薪蘇烏鳥不鳴依室屋肺病惡寒望勸酬桔梗作湯良可沃白雲自非桃李族陽春且止聽黃竹江風吹葦暗天地鷗鳥紛紛起追逐請看萬瓦變璠璵平日塵寰無此屋閑居幽事亦堪論小逕苗生土増沃晩春二首春呼羣豔與偕藏殘英風勸作清狂消愁賢聖酬酢寡破睡槍旗幽興長春㱕風雨一朝盡畫靜園林諸趣嘉蜻蜓出水羣掠蚋鵯鵊衞巢雙趂鴉示張仲原秀才二首去年鉅野張狂瀾黄河水不到魚山焦城有屋仲子築它日能來相往還城頭急雨昬長川城邊清流鷗鷺閑城西雲黑電腳落斜日正在城東山村居即事小麥青青大麥稀蠶娘拾繭盈筐㱕放牛薄􅇀古堤角三四黄鸎相趂飛夏夜雨意凝雲遮漢月不舒微電時照東南隅風條不動柱礎溼初夜湥砌吟螻蛄蒲萄蒲萄新條昜扶疎椿花鎖碎滿庭除旱乾只喜雨破土潦潤不憂河決渠漫成呈文潛五首無心看春只欲坐偶騎馬傍春街行可憐愁以草得暖一寸心從何處生花如怨人不近眼㴱院一枝春得知東風不是不愛惜剛爲花愁眞是誰十年閉户不作舞爲客一整紅羅裙莫倚琵琶解寫怨朱簾垂下阿誰聞平時無歡苦昜醉自怪飲樂顔先酡乃知醉人不是酒眞是情多非酒多不是生情薄桃李廣陵一株名最高俱飛蛺蝶莫猜忌端爲蜻蜓避伯勞試院中秋秋風吹空雁旁午長天無雲月呈露爲須通曉照清樽莫遣中宵生薄霧直廬聯句上閤井泉甘若醴蓬山㸃茶竹隂底耒庾伏恩容午課休宮殿初凉朝雨洗之補身閑出飲官不嗔日長睡足長精神耒未慙便作蠧魚老拔毛濟世知何人之補濟北晁先生雞肋集卷第十四
