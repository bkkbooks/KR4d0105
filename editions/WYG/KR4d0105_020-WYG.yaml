body:
  text: 絶句新城塔山對雨二首同栁戒之夜過三學院汴堤莫雪懷徑山澄慧道人送李知章下第歸河北曉發長蘆晚雪示閻仲孺村居即事流民先塋治事歸陌上花八首外舅杜寺丞永城守水作詩寄呈都門甘雨約李令和胡戢七首坐進菴張傑以龍茶換蘇帖和王拱辰觀梨花二首次韵兩蘓公講筵唱和四首復至凝祥池上題工部文侍郎周翰郭熈平逺二首呈文潜和文潜謝王立之送蠟梅和文潜試院道舊夜聞慎思吟諷赴廣陵邑中三首出城三首揚州雜詠七首題僧法芝鍾山詩後復和定國恵竹皮枕謔句和荅曾敬之祕書見招能賦堂烹茶之句二首守蒲過洛思十嵗時侍先君寓居泣涕成詩二首澠池道中次韵提刑毅父送茶次韵閻仲父病起二首雞肋集巻二十目録欽定四庫全書雞肋集巻二十宋晁補之撰絶句七言新城塔山對雨二首山外圓天一鏡開山頭雲起似浮埃松吟竹舞水紋亂坐見溪南風雨来竹枝草履步蒼苔山上孤亭四牖開烟雨濛濛溪又急小篷時轉碧灘來同栁戒之夜過三學院步月尋溪過佛齋溪邊石蘚溼芒鞵虚窗獨卧聽松竹半夜一山風雨来汴堤莫雪懷徑山澄慧道人朔風吹雪亂霑襟走馬投村日向沈遙想道人敲石火冷杉寒竹五峯深送李知章下第歸河北鬭雞擊劎鄴王臺萬古英雄死不埋子去悲歌宜有和露螢白首亦常材晚發長蘆舩頭勾曲洪濤外舩尾長蘆白霧中千里山容初上日一江帆影盡椉風晚雪示閻仲孺拂檐㸃砌静如沙無限寒林頃刻花明日窮檐深一尺不知何處覓袁家村居即事十載京塵化客衣故園榆栁識春歸深村芳物無由覓蝴蜨雙尋麥隴飛流民生涯不復舊桑田瓦釡荆籃止道邊日莫榆園拾青莢可憐無數沈郎錢先塋治事歸先人㫺慕栖山樂賤子今懷陟岵悲柏葉初生石牆短况無金帶買豐碑補之方謀葬先子家貧未能故及也陌上花事見蘇先生詩郊外金軿歩帳随道邊逰女看王妃内官走馬傳書報陌上花開緩緩歸朝雲莫雨山頭宅暖日晴風陌上花絳幕何妨行緩緩送春歸盡妾還家娘子歌傳樂府悲當年陌上看芳菲曼聲更緩何妨緩莫似東風火急歸荆王夢罷已春歸陌上花随莫雨飛却喚江舩人不識杜秋紅淚滿羅衣呉歌白紵怨芳菲腸斷懷王去不歸陌上如今小花伴山前山後白鷴飛臨安城郭半池臺曽是香塵撲面来不見當時翠軿女今年陌上又花開雲母蠻牋作信来佳人陌上看花回妾行不似東風急為報花須緩緩開陌上偷来為看花饒聲鸎鵡莫夭斜犢車緩緩随芳草不去桃源阿母家外舅杜寺丞永城守水作詩寄呈雪消冰動看通津草長江南岸岸春莫唱龍舟五更曲揚州楊栁解愁人都門飄零何處是生涯瘦馬都門踏落花芳物攪心看不得綈袍遮眼畏風沙甘雨晻晻轟轟有物催端如鬼駕北溟来百昌一種得甘雨蛇不耆乾苕卵推古語云一蛇耆乾獨不得甘雨約李令茅檐明月夜蕭蕭殘雪晶熒在栁條獨約城隅閑李令一盃山芋校離騷和胡戢七首達則經綸隠著書㫺人於此孰親疎王通持厎荅揚素汾曲先人有敝廬相逢樽酒未辭深握手盱眙十載心車馬凄凉人夜别出門落月與横參聞說歸心已浩然蘇門况有子雲㕓廣文不去慙官長繫馬堂階要酒錢住近蘇門有白雲閉闗却埽道逾尊相逢不語忽長嘯今日豈無人姓孫時平未用入山深嵗晚何妨木秀林聞說熊羆參後椉可容牛下有哀吟千首清詩競夜長眞成蝴蜨為春忙莫教流落人間少雷電它時下取將少時豪氣恨沈淪繆意詩書可庇民長笑壮年無一事㣲吟只有故人親坐進庵海魚水擊三千里决起還須九萬程坐進菴中纔一歩初無行處若為行張傑以龍茶換蘇帖寄茶換字眞佳尚此事人間信亦稀它日封厨失雙牘應随癡顧畫俱飛和王拱辰觀梨花二首海棠十韵詫芬芳慙愧梨花冷似霜頼有樂天春雨句寂寥從此亦馨香壓沙寺裏萬株芳一道清流照雪霜銀闕森森廣寒曉僊人玉仗有天香次韵兩蘇公講筵唱和四首白髮歸聨侍從榮未應江海歎飄零禽魚不與鈞天觀想見群龍舞洞庭李公素譽壓朝端㑹泝龍門鬛未乾雖愧彭宣惟賜食未慙貢禹亦弹冠纘服憂勤未有言諸儒經術侍彤軒九疇咸叙今天錫三畫何人㫺夢呑金玉誰人詠徳音太平無象屬人心日髙初散露門講天上五雲宮殿深復至凝祥池上去嵗相攜此地逰西風垂果奉靈湫春工變化渾無跡紅滿枝條緑滿洲題工部文侍郎周翰郭熙平逺二首漁村半落楚江邊林外秋原雨外天誰倚竹樓邀大艑天涯莫色已蒼然洞庭木落萬波秋說與南人亦自愁欲指呉松何處是一行征雁海山頭呈文潛無計河西尋杜家海棠空詠去年花煩君為謝郭少尹欲買纒頭迎犢車郭明遠妓尤知名和文潛二首阮籍空貪步兵酒陽城猶戀集賢書飽知世事非人力可是因𤣥更泊如索米彊知當世䇿種芝欲訪隠人書未應只有鄰邦約投老相看事事如謝王立之送蠟梅五首未教落素混氷池且看輕黄綴雪枝越使可因千里致春風元自未曾知恐是凝酥染得黄月中清露滴来香定知何遜牽詩興借與穿簾一㸃光上林初就詔羣臣紫蒂同心各自新誰見小園深雪裏破春一蕚更驚人詩報蠟梅開最先小匲分寄雪中姸水村映竹家家有天漢橋邊絶可憐去年不見蠟梅開准擬新年恰恰来芳菲意淺姿容淡憶得素兒如此梅立之家小鬟和文潛試院道舊璧月照歌淮上舫姚花引醉福昌城何如閶闔門西北卧聽秋風枕畔聲夜聞慎思吟諷疎林小雨月朧明商頌琅琅半夜聲鄧子弓彊殊未發欲馳桑本犯堅城赴廣陵道中三首醉卧符籬太守亭别都絃筦記曾稱淮山楊栁春千里尚有多情憶小勝南都留守使雙鬟勸酒小勝其字也急鼓鼕鼕下泗州却瞻金塔在中流帆開朝日初生處舩轉春山欲盡頭楊栁青青欲哺烏一春風雨暗隋渠落帆未覺揚州逺已喜淮隂見白魚出城三首視邵伯埭新堤桃欲呈紅栁弄隂麥田青已没鞵深春堤細雨籃輿溼婆餅焦聲在竹林故國龍舟休水調高城雉堞尚雲間蜀岡朝雨如輕霧不見春江草外山堆案文書無了畢竝堤舩舫且縈囘非闗董役年年事自為春郊得得来揚州雜詠七首舶商不入古鹽溝疏鑿纔争土一抔未說興圩灌田事且還歌吹舊揚州雷陂新作麥田荒曾說風興没兩郎誰似當年李刺史春波還引句城塘欲穿九曲通淮水只費春夫數日工但見荷花三十里何須更有大雷宫蜀岡茶味圗經說不貢春芽向十年未惜青青藏馬鬛可能辜負大明泉皁莢村南三里許春江不隔一程遥雙堤鬬起如牛角知是隋家萬里橋龍興寺裏青雲榦后土祠中白雪葩五百年間城郭改空留鴨脚伴瓊花楊徐僭盜雄圗熾髙呂陵夷霸氣䦨猶有崐岡作龍虎千秋原廟奉衣冠題僧法芝鍾山詩後明珠出袖四百琲座有煙霞草木香斷取鍾山擎石掌􅄼知不下淨名床復和定國恵竹皮枕謔句老來山水興彌深不在長安俠少林它日只為林下計不將錦被作呻吟和荅曾敬之秘書見招能賦堂烹茶二首玉泉吟鼎月隳輪姑射風標兩絶塵只欠何郎忩畔雪戎葵為我作餘春一盌分來百越春玉溪小暑却宜人紅塵它日同囘首能賦堂中偶坐身守蒲過洛思十嵗時侍先君寓居泣涕成詩二首建春門外栁依依迸淚當年綵服嬉窮子更無逢父日匿王空記看河時先君欲築伊川意四十年間萬事非他日一㕓從可卜白頭持此欲安歸澠池道中虎狼敵國昜良圖望見将軍要引車不畏秦彊畏㢘鬬古来只有藺相如次韵提刑毅甫送茶炰羔煮餅漸宜秦愁絶江南一味真健歩逺梅安用插鷓鴣金盞有餘春次韵閻仲甫郎中病起二首伏波七十老鍪弧薏苡何曾適病軀髙臥輸公無一事評詩挍畵是功夫脫略軒裳陶隱居肘書百巻事寜軀茯苓日長東山澀早晚柴車命僕夫雞肋集巻二十欽定四庫全書雞肋集巻二十一目録
