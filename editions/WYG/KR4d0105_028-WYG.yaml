seq: 28
body:
  text: 二千里邑居牧聚蟻合蜂起髙城附之如帶繞指隐以為脊折以為尾因河塹華不足方比方城漢水胡敢競美當昔夫差之盛時内姑蘇以為心腹而外城此以為身革車千椉甲士萬人粟支十年帛散千屯洒汗成雨連衽成雲乃有大夫伯嚭行人伍貟之徒通其謀將軍孫武公子夫槩之徒用其衆嘗以國政之閒發徒截江命習戰事於是張翠羽之盖靡魚須之斿揚鵞足之楫曳龍尾之舟凌鱣黿之車戲賁獲之儔飄鼓吹乎下風隘戈矛乎上游乍往乍還乍後乍先若亂而若聨乍止乍馳乍合乍離迭唱而迭随驚鮫人立馮夷清江忽兮怒濤飇風為之揚歧怠而即次食具樂作三軍皆賀響震山壑其彊如此故姑蘇恃以為南蔽而能驅唐蔡蹂齊魯侵尋乎百粤隳突乎三楚栖句踐乎窮山鞭平王乎頹墓此亦天下之形勝也孺子欲聞乎孺子曰西河中流衞客之所能諫秦險百二亭長之所能入願先生廢此而語它先生曰呉越之有東南也實國于杭而杭呉越之大都也宫室之麗猶有存者其始也削山填谷叩石墾陸蹷林誅樾擢篠夷竹旋縁阿邱憑附隈隩千夫運畚萬役供築増増硜硜坎坎碌碌前呼後和逺近相屬卑者起之以有餘髙者損之以不足開曠朗乎䝉宻發瑰竒於潛伏然後工人之材陶人之瓦水輸陸運屬柁連輠縱横錯落山積其下其成也翼翼鱗鱗勃鬱輪囷若化若神上據百尺之巔下俯億尋之津雙闕髙張夐臨康莊門開房達乍隂乍陽中則複殿重樓砂版金鈎卑髙仰俯下上明幽峥嶸截嶭鼎峙林列吐吞雲霧虧見日月宏規偉度古曠今絶旁則曲臺深閨碧檻朱扉鱗差閾限奕布榱題栱盤白鳯壁戲青猊温風徐而吹座寒雨沐以霑帷列屋而侍者則妖嬙豓姝螓首冰膚清矑盧素齒既嫻而都乃服輕袿被華裳綴珠履揄鳴璫飾鈆英含若芳倩巧笑兮婉清揚縹緲兮如雛鸞之欲舞逍遥乎如飛雲之欲舉㜕姍姽嫿婉孌媚嫵流榮發色不可程度羽觴薦朱顔酡悲激楚妙陽阿詞曰陌上花開游女歸園南池北黄鸝飛曲房清閣夜更衣於是聞者恍然神揚意馳紛紛擾擾惑亂不怡此亦天下之雄觀殊樂也孺子欲聞乎孺子曰宫居閨處者寒燠之媒而疾癘之梯也且館娃成而麋鹿游願先生廢此而語它先生曰杭故王都俗上工巧家夸人闘窮麗殫好紛挐錯糾晃蕩精皛若八方之民車溱舟㑹角富而衍寶木則花棃美樅棁柏香檀陽平隂祕外澤中堅以斬以刋以剞以剜以漆以膠以墨以丹為床為匭為櫝為几為槃為巨為盂為簋嚴莊之佛慘烈之神詼怪之鬼頎姣之人塗以鈆英鏤以金文依以靈山椉以飛雲霞煙霧靄煥爛五采渠輸陸運投錢競買曽不若母猴木鳶三月而齊一日而敗衣則紈綾綺綈羅繡縠絺輕明柔纖如玉如肌竹窗軋軋寒絲手撥春風一夜百花盡發其製而服也或袍或鞶或紳或綸鱞或縁或表或縫或幱或紫或纁或紺或殷嚴以奉祠䙝以養安薄以却暑厚以禦寒以錫三軍以賚四國以供耳目之玩以備土木之飾曽不若窮邊絶漠不紡不絡衣狐而袖狢寶則璆琳珊瑚碼碯碔砆藥化之玉火化之珠琉璃之椀水精之盂紅黄白緑磊落滿櫝北商東賈百金不鬻沙河雨晴月照燈明席張案設左右煌熒逺而望之奪人目精遺英弃屑籮貯箱列曽不若宋人之拙三年而一葉於是彫床昜席地之野文衣後弋綈之儉玉杯鄙土鉶之啜此亦天下之妙工絶巧也孺子欲聞乎孺子曰書云玩物喪志紂為象箸而箕子歎願先生廢此而語它先生曰杭之為州負海帶山盖東南美味之所聚焉水羞陸品不待賈而足肉則封豲腯豕罝兔畋麂山狸白額竹犬青尾鶬鵝鸛鶩鵙秃鴻鵾園鷄池鴨隴雉田鶉陵收水截頭駢尾列磔肩裂趾飛毛灑血魚則鯔魴鱣鱮鱸鱖鯿鯉黄顙黒脊丹腮白齒江鱘之醯石首之羮或腊而枯或膾而生白鰻青鮝黄黿黑蠏鮔魚花蛤車蛾淡菜蛙白肖雞螺辛類芥鼎調甌餖牛呞狢嘬果則枇杷楊桃橘櫾柤棃青梅黄柿紫栗烏椑溪菱江蔍田苽湖藕壌肥水美天下無有冐以黄蜜漬以白醝芳香脆潔析酲觧痾菜則茼蒿茵陳紫蕨青蓴韭畦芋區茭首芹根藤花羞盤菊葉薦莒薑辛薤淡薺甘筍苦飰以姑蘇之粳薦以烏程之醴于以和五氣于以資百體此亦天下食飲之珍也孺子欲聞乎孺子曰揚雄有云弃常珍而嗜異饌烏覩其識味也且養身而尚乎味味則愚以聖人為不如昜牙願先生廢此而語它先生曰地不滿東南故八紘之水歸焉水之為物潤下作鹹溟渤蕩波海門莫緘駸駸脉布溢于江潭老濞席賚㸑山煑海豫章為舩萬斛更載一舩所受車數十量黄頭多錢富不可倣士之頑鈍不恥者皆餌其無厭之賞譬如山深而獸至木茂而鳥往故能収亡命借厮養連應髙之交合周邱之黨以北與中國争長則鹽之利也夫鹽者食肴之將五均賖貸斡在縣官僅法議籠不罅以完大農給費入助國計官與牢盆世擅其利民有盜鬻則釱徒計反左趾没入其器此為前古之所制嘗試觀乎江之濆葭葦不根淺草芸芸斥鹵無垠白花蘚文百里如雲鹽官千家匪柘匪麻匪漆匪茶規利乎泥沙蟻封蚓垤積土如截削剥剗刮不漏毛髮挾攜擔掲十歩一蹶偷趨竊走遺筐弃缶塗闗塞牖鼎釜雷吼皓然紛葩豐不盈斗姑以漬螺蛤而適口曽不比夫縣官冶鐵如山析竹為盤熾火以燔淵壑為乾峥嶸崷崪戍削律兀扶舒蕭勃煙氣滃出若滅若亡若失乍疑鹽陽之神翳乎與羣蟲朝飛而蔽天日立呼起諾百夫齊作紛紜揮霍千竈就涸光芒閃爍璀璨磊落小星迸躍鱗鱗新倉歛貯堆蔵如帛如糧國以是彊神變鬼化刀貝齊價獨不美夫算菱芰魚蝤之殫細及下者哉諺曰千金之子不死於市又曰人富而仁義附焉此先生所以教民知榮辱之時也孺子欲聞乎孺子曰猗氏之治智賢白圭而不監於道願先生廢此而語它先生曰江源所起濫觴之墟泓泓汪汪不漏不虚放而行之冒於川渠繚繞縈行左挾越右截呉以散以敷然後淫為大江以東合乎尾閭而潮生焉古今所論潮者日月伏見之所為也嘗讀沌天之說曰地浮水中天在水外水之消息坱圠無際一闔一闢若開天地一呼一吸若出元氣其始来也若毛若線若帶若練堂堂沓沓合聚離散須臾之間千化萬變其少進也敲磕鏗􅥁石號木鳴越岸包陵在谷滿谷在坑滿坑其為氣也或喣或呀或噫或噦瀰茫湠漫澎濞沸渭澒洞滉漾渤潏滂沛涵澹淋滲潗濈淫泄跳珠湧沫百里紛㑹沃焦蕩胷汨母陵背縱横絡繹飄忽争逝徐則按行緩則就隊連氛累祲陽景朝昧周天而旋踰八萬里不知其所憩於時元㝠収威海若振吼千溪崒立萬浦却走絶維推軸神母不守左驅天呉右拂九首淵客拒扉水夷潛牖江神海豨絶脰傷肘陽侯馬銜顛蹶前後其為象也則紛紜參差萬頃一迹禹不能知契不能識承光露怪不復潛匿或駃而蹄或森而㦸或美而􅎶或張而翼洶湧而奔以沃海門若土囊風怒驅屯雲辟昜而征以擊西陵如井陘戰酣出竒兵宛兮改容若蓐収素服駕白龍忽兮當前如歸墟泛溢浮五山一北一追一僨一起突然而逝餘勇未已於時呉兒獠工引檣掛席鐃鳴鼓動去若飛鷁風止雨息江清海碧此潮之大凡也傳曰上善若水又曰水㡬於道故古之人見大水必觀善利萬物似仁不畏彊似勇能方能圓似智萬折必東似信若是者孺子欲聞乎孺子曰㡬矣先生之所陳五事之上也姑欲聞其深於此者先生曰西湖之深北山之幽可舫可舟可巢可樓與鷗鳥居與鹿豕游漁蓑山屐煙雨悠悠寂寥長往可以忘憂風衫塵袂京洛何求不如西湖瀕不如北山阿白蘋緑芰紫栢青蘿反裘坐釣散髮行歌人生安樂孰知其它茫洋以為栁溪盤旋以為李谷巻軻辯乎三尺之喙擴夷隘乎十圍之腹此古君子所以蔵器于身待時而動也傳曰不怨天不尤人盖優哉游哉聊以卒嵗若是何如孺子竦然離席而立曰盖聞逹人不忘身而先利志士不貪時而後義隐之所尚得全於天也孺子不敏乃今得聞出處之際敬再拜受教醫言上醫醫國或曰不然醫曰譬國於身天地乃所寓之形元氣乃所恃而生堅骨脆肉山石壌墳也中列五蔵五材是營也風雲其衞百川其榮也闔闢運轉有神欲行也故昔之論養生者曰抱形以静神將自正无揺汝精乃可以長生盖天地亦物也其不壊亦然得一以清寜其析於一成虹而洩蔵祁寒暑雨災害乃生時則有陵鬭隕墜扎癘蟲螟歴象授時使氣行正不有聖人孰醫國疢以國觀身理自此知不有聖人人誰則醫譬醫有經黄帝二典岐伯猶謨浮沈生死帝俞伯都平章於變亦與氣俱盧鵲秦和王佐可蹈鵲猶伊訓和比虺誥漢淳于意如說作命說不自言于古其鏡華佗反經既不得已敿干礪刃如甘戰誓何異吾醫亦論其世堯湯水旱國豈無疾稽天焦土要不病粒五毒所攻痤發中古武砭已甚血流漂杵七雄裂之五蔵用争衡秦縱楚焦腑炭氷衞生匪經民中道夭至秦㬥蹶氣并則槁求諸身中一蔵彊勝四氣為㣲一安得競匪淳益漓醫斯用竒黄典岐謨安所救之鵲觀五㑹和參天命至佗而極刮脾濯腎聖有至言代斲傷手世復無佗矧敢佗又佗雖傷手猶漂杵然時周之命反商之顛過是益狂術亡不傳大疾始間漢與休息小廖未復唐用飲食何世無醫孰曰不知不培其生毒熨妄施曰我術聖望而知之緒餘帝伯卑鵲和意曰如漢唐又何足議何異魯連好髙自竒徒稱唐虞顧未知之鵲和得􅅓他何足議矧無佗術廼行佗事季良三醫一論其天不為何敗其平自然曷不卑之無甚髙論秦病可言釋之為近國有常治治不以智若烹小鮮時治之理生有常經亦不可擾損石益榖時醫近効滋彰法令盜賊乃多疾焉勿擾氣復則和何以休之惟勿益生築垣為室蚤作晦息平康有道醫於何力民有聖言有病不治起居惟常常得中醫作醫言雞肋集巻二十八欽定四庫全書雞肋集巻
