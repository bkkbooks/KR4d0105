body:
  text: 雜著五行說齊物論學說勤說儆陋烏戒雞肋集巻二十七目録欽定四庫全書雞肋集巻二十七宋晁補之撰雜著五行說洪範初一曰五行金木水火土而已何以為十哉昜曰天一地二天三地四天五地六天七地八天九地十水生天一成地六火生地二成天七木生天三成地八金生地四成天九土生天五成地十去其生成之數以言則其贏皆五五土也物非土不育故太元曰中和莫盛於五故稼穡作甘五之所生十之所成也生於陽者成於隂生於耦者成於竒一三五七九皆乾之竒也二四六八十皆坤之耦也天地父母也金木水火土天地之五子也天有此五氣故為天五行地有此五氣故為地五行故一三五七九天之五氣也二四六八十地之五氣也五位相得而各有合故其辨則十其合則五潤下作醎炎上作苦曲直作酸從革作辛稼穡作甘合四方中央而五位定由是大撓以生甲子容成以生歴黄帝以迎日推䇿堯以閏月定四時成嵗辛壬癸甲甲子之見於經者也隂陽家流不見於經日官居經以底日日御不失日以授百官於朝此隂陽家流之見於傳者也故太史公曰因之列於九流記曰播五行於四時或謂支幹配合以言吉凶起於唐吕才五行甲子自堯舜有之物生皆受氣於五行隂陽相摩八卦相盪五氣之自然盈虚消息孰能逃之才能用此以推之非起於才也自五行之為物皆合隂陽冲氣而生坎水也而含陽離火也而含隂故有隂中之陽陽中之隂十日之有剛柔猶隂陽之有老少也有老陽又有少陽有老隂又有少隂故甲乙皆木丙丁同火庚辛咸金壬癸俱水而戊巳偕土也是五位相得而各有合也朞三百六旬有六日者一晝一夜然後成一日一盈一虧然後成一月故即太陽之日以名百刻之日即太隂之月以名三十日之月假令合璧起於牽牛十一月為正行周之時也則子丑寅為春卯辰巳為夏午未申為秋酉戌亥為冬然而孔子曰行夏之時夏正人統授人時從聖人為正故寅卯辰為春巳午未為夏申酉戌為秋亥子丑為冬以一日為嵗則夜半子陽生冬至之象也日南午隂生夏至之象也甲至癸十日也子至亥十二辰也十日所以為五行也十二辰所以為四時也播五行於四時故隂陽之運無窮如昜之六十四卦終之以未濟周而復始旋相為六十日日辰昜位而納音之說生焉然而子丑一定之位也甲乙循環之氣也是其所謂播之於此者也十二辰之於晝夜四時晦明寒暑一定而不可亂也播甲乙於子丑周則復起丙丁播丙丁於子丑周則復起戊巳辰有定而日惟新惟新者猶人也一定者猶位也譬日於百官之人譬辰於百官之位各以其剛柔緩急施設於事皆其人之所為無人而虛其位位能自為哉以此人居此位然後有此事以彼人居彼位則事亦如彼故人得位而為事猶日得辰而生納音也日者人也辰者位也納音者此人此位所成之事也故觀吉凶者日為事之主納音為事之成皆日之所為待位以行之而觀成於納音如是甲子為木人而不為金人所謂天元一氣五行所播之氣本盛衰觀此而納音者要其成耳珞琭子所謂天元一氣定侯伯之遷榮觀貴賤有無必以氣要行事成敗則以納音尊吉卑凶是其本說而或者專用納音故時差也五星則五行之氣也二十八舍即四時之位也播五行於四時猶之運五星於二十八舍也角至箕東方之宿也春也斗至壁北方之宿也冬也奎至參西方之宿也秋也井至軫南方之宿也夏也五星之好廟猶十日之盛徳各有在也播五行於四時運五星於二十八舍五行逄其用事猶五星得其所樂處也吉凶可知也播而無窮運而不已五行反其所用事五星悖其所樂居則其凶可知大略如此參之以其氣運合㑹吉而凶凶而吉上下無常猶之昜爻不可為典要珞琭所謂妙在識其通變拙說由神也然亦以五星為人二十八舍為位以此星居此舍以彼星居彼舍而災祥昜矣是星能為之也非舍能為之也然由此而有逆順所成災祥各殊猶之納音之所成也亦不同然既曰十日合而為五行而氣之老少日之剛柔判然異用至於五星則五而已不為十也何以合之曰五氣以剛柔為十日五星以逆順為十用就術之一論之克我者為官鬼夫克我者一氣也乃或好而為官或惡而為鬼則隂陽求而言耳夫陽之所求者隂也隂之所求者陽也隂而得陽陽而得隂則為咸恒夫婦相感以通相與以久也陽而逢陽隂而逢隂則為二女同居其志不相得曰睽是昜之義也隂陽之性也故十日以隂幹克陽陽幹克隂則天地相合以降甘露如水得土而有防範金得火而成方圓雖克也相得而不相勝故更為用若以陽幹克陽隂幹克隂則志敵而力抗則兩雄必争二主必危如一勺水之少土盛則堙一鉤金之輕火熾則飛此其常理也如甲陽木之得辛隂乙隂木之得庚陽故夫婦為用若甲而遇庚乙而遇辛則為志敵而力抗然甲彊而庚弱乙盛而辛衰則雖鬼不能為之災猶之捧土不可以塞盟津不勝故也雖金亦然故論其常欲以隂陽之相求不欲其陽陽隂隂之相敵通其變則陽為陽助隂為隂益千變萬化而未始有極也故五星之逆順似之術曰金木相逢極為美土火二星為惡曜是以其常也然而金木豈不可以為殃土火豈不可以為祥水亦然也順則水為飲為漿溉田畮浮舟航逆則墊溺金為鍾鐸為槃盂反則刀劎鼎鑊誅木為宫室為舟車反則與桎梏棺柩俱土生用於稼穡果蔬死用於墳墓覆壓之虞火生用於烹飪爟燎死用於災其室燔其軀以五物而反之於逆順是五星猶十日視其好惡而變化随之陳昉所載隂陽四時有若干神者随六十日而運各有其次亦有吉凶或曰實無至此之虚也善者皆五行之精華氣惡者皆五行之繆盭氣其理或然記言天地之仁氣義氣温厚氣嚴凝氣亦各有方昜言帝出乎震成言乎艮亦各有位啟閉生殺随之術家之神位理出於此然經簡而術繁繁用則疎簡用則宻記之說昜之義皆在矣齊物論此篇論齊物然物之理齊而情故自彼是莫得其隅而要之以天地之一指萬物一馬而後物無彼是道泯乎無成虧矣莛楹厲施極異而皆同故言唯達者知通為一通為一則不齊之論近不用也然而衆理相承彼是未始不用聖人欲泯用之迹故為是不用而寓諸庸寓諸庸則我雖不用而物量無窮黙然而自用殊施而各得若此通矣故曰用也者通也通也者得也適得而㡬矣不用則理阻而不通故用為通通則物各得其理故通為得得則各適其所而盡矣故適為㡬而聖人非有心為之也特因物之自庸也故曰因是以有成與虧故昭氏之鼓琴也無成與虧昭氏之不鼓琴也猶之七竅未鑿而渾沌不死也過此以往則反乎無物其為無成虧也至矣故師曠之杖䇿也恵子之據梧也皆為者敗之也皆非所明而明之也故雖竭其智而理終不可窮謂之堅白同異名實之辨若此其察矣然要於不察而以昧終其為滑疑也不甚矣乎若夫天地雖大要之一指萬物雖多要之一馬一指一馬為論省矣則雖衆理相承黙用而常通尚安有滑疑之耀者哉然其始也恢詭譎怪未通乎一故有滑者焉有疑者焉無滑無疑則其際㝠㝠昧而不耀有滑有疑則長短之相形前後之相随不昧而耀矣耀也者明也而此非明也以夫衆理之相椉也滑亂而疑似反以炫聖人聖人欲為人觧紛而辨惑則嘗圖之矣故曰滑疑之耀聖人之所圖也物之情不齊而其理齊聖人窮理衆人役情聖人欲反情之異合理之同所以圖滑疑之耀使無疑無滑而泯乎㝠㝠者莫要於此矣故重言為是不用而寓諸庸此之謂以明然則聖人泯用之跡而物未始不用無意於明物而物常自此明故曰此之謂以明也若昭氏師曠恵子者知盡於此以非所明而明之祗以為昧非此之謂以明也故曰三子之知㡬乎猶曰知盡於此而終不足以明也㡬盡也猶㡬希也然非夫以道泛觀而備萬物之應則以不齊齊其齊也不齊乃若莊周則以齊不齊其不齊也齊矣而猶以為未也故又曰今有言於此不知其與是類乎其與是不類乎類與不類相與為類則與彼無異矣夫類則齊不類則不齊類與不類相與為類則齊與不齊相與為齊夫有所謂齊有所謂不齊則與彼誠何以異哉故推而上之極於物之無曰有未始有夫未始有無者此要言無物無物則無齊矣推而下之窮於物之有曰自無適有以至於三而况自有適有乎此要言有物有物則有不齊矣故於是重言無適也因是巳因是巳者盖齊物之要論盡此矣何以知其盡此也曰以因因則無適也故入之為無非或使之無也因是巳出之為有非或使之有也因是巳夫號物之數自一至萬逺矣夫無未始適有何以自一而語萬有未始適無何以自萬而語一之二者泯而無物無物而無齊矣雖然非刳心喪我不能觀物而知無故此篇始之以南郭子綦之喪我而齊物之論開非觀物同我不能知化而窮有故終之以不知周之為蝴蜨蝴蜨之為周而齊物之論閉學說學不可已惟知之然後能好之記曰雖有嘉肴弗食不知其㫖也雖有至道弗學不知其善也而孟子亦曰理義之恱我心猶芻豢之恱我口盖飲食旦旦之所須故譬學於飲食為最昜知然猶曰人莫不飲食鮮能知味也天下豈有不習而能察者哉昔野人有甘葈莖芹萍子者對鄉豪稱之取而嘗焉蜇口而慘腹夫口腹人所同也而野人至甘人之所不甘此非未嘗知甘所謂甘者而以夫巳甘謂人甘者止此哉至於百工衆技皆學也下至跳劍弄丸縁竿踏索既為之終身不得已非特利所在也習而知其味故樂也若廼對君子稱之則如野人之甘葈莖芹萍子其於不足味也不特慘蜇而後方知之也故嘉肴世皆知其㫖必食者而後益知其為㫖至道世皆知其善必學者而後益知其為善曰聞而知其㫖且善者意之也或曰道之出口淡乎其無味而飲食人所甘似不類夫以人之所甘者弗食猶不知其㫖而道又淡而難好則不知者不其愈多乎然終猶是也病弗學耳學而入之安知其淡乎大觀四年四月旦日書付姪公秉俾以語諸小道云勤說送甥李師藺游學道無勤物無不勤夫既謂之物矣物必有所事有所事必勤故物莫大於天地其次曰人而三者同以才稱才之為言物量之所能也能必有所事故天有四時地載神氣皆謂之無非教無非教者有所事也日月如争其所乎雲者為雨乎雨者為雲乎意者其有機緘而不能已耶其有所運轉而不能自止耶則天地之事亦勤矣人見其四時行百物生也以謂天地未嘗勤焉不知夫有道焉範圍乎其外莫或使之日夜以造偲偲然若有與之計其期而不得暇者是能成千嵗之積而開萬化之原人以其才參諸天地有誠焉㝠極於道不息而善成古之聖賢惟孔子顔淵能知此故孔子之語子貢而曰生無所息顔淵之賛孔子而曰欲罷不能夫以有涯逐無涯必墯故欲罷而願息皆人之情也然回非不欲罷而曰不能罷賜非不願息而曰息無所夫求斯須之畫至於念兹之隙其暫無㡬也猶曰不能而無所此非有所畏慕勉彊而驅之也性不能已也是天地人之所以均不能無事而皆勤也雖然天地以無心莫之為而為故久人以有心知而為之故怠嘗試語怠之所從起譬道為萬里塗而以勤為馬繕性之始如適舉趾其弛於負擔未知其以曷月止斯殆已故欲從事于此必自夫誠其意者始焉夫人何可以確然隤然如天地之無心而常運能誠其意則㡬矣誠者非義襲而取之也閑其邪則存嘗又請實之以誠為我我欲至於萬里孰禦之哉以其孰禦之者為䇿以臨馬不至於萬里馬終日躞蹀而不得止由不怠故能久久則疑於神矣聖人之事業所以蔽天地而疑於神則自其孰禦之者積之耳雖然此亦非聖人獨能之也百工之賤預能焉承蜩者猶掇之也夫豈惟其精之至自五六月纍垸二而不墜至於纍三而不墜至於纍五而不墜則其勤之積可知已而世不知者方且曰勤者事也道無所用勤其知者則將曰事者勤也天地不能無事而况於學者乎余甥師藺年少而彊文采曄然其所學又中庸也故告以其無息者自誠其意始而余老矣不復能自彊猶樂以静觀動日出而開吾牖以臨交衢之内四民亹亹各各以其業趣利鳥嚶翔而獸嗥騖意各有所􅈻蜂螘之至細迕行旁逝營宅室而競食事亦維以卒嵗至於物之無情者山日夜出雲流水之不停甲拆而勾申木不崇朝而其華敷榮並行若争小積而大盈而天地乃司其成功及其至也皆日損於是以觀復而見天地之心則萬物何莫猶斯道謂道無勤道亦未嘗息也而其勤見於天地天地亦未嘗勤也而其勤見於萬物萬物各以其勤自成而天地終其功故成能者為聖人學之積由是師藺勉之儆陋有覩於其里而自儆也且以儆其子及甥姪焉子欲居九夷或曰陋如之何子曰君子居之何陋之有吾非君子安能不顧蠻貊之陋而欲居居之不唯不能革彼陋吾未免於陋也里仁為美擇不處仁焉得智吾非智者安能知里之不仁而擇處處之不惟不能遷彼之不仁吾未免於不仁也與君子游苾乎如入芝蘭之室久而不聞則與之化矣與小人游膩乎如入鮑魚之肆久而不聞則與之化矣吾不幸逺君子而近小人近之不惟不能洗彼膩吾未免於膩也一薰一蕕十年猶有其臭吾薰也蕕尚能臭之吾惡夫久而不聞也不惟不能薰彼蕕吾未免於蕕也四累者吾憂之見賢思齊焉見不賢而内自省也壤陋里不仁鮑漬蕕與藂也引領而望夫安得賢者而齊之而不賢者乃日夜相與輩而詠且游乎吾之邦囂塵雜起千變萬化在人目前茍見此而恥者炟然肺熱濈然顙泚而内自省曰吾不幸無乃類之其庶乎居與之同里出與之同闀吾不能捨以逃也使跡近而心逺焉雖不得賢者而齊之日儆此亦賢已尹鐸為趙鞅戒晉陽之辱而不墮其壘培又増之鞅怒郵無正曰委土可以為師保何為不増夫里無仁賢則思吾一日之嘗辱焉如晉陽之委土非耳目能言之類也修而存之如見參於前倚於衡也亦可以為吾師何必師人烏戒余初偕鄉書時有水邱安期者以講論語居鄉挍中安期少行四方道闗中所見如此余以其說作烏戒時年二十矣烏於禽甚黠伺人音色小異輒去不留非彈射所能得也闗中民狃烏黠以為物無不以其黠見得則之野設餅食楮錢哭冢間若祭者然哭竟裂錢棄餠而去烏則争下啄啄且盡哭者已立他冢裂錢棄餠如初烏雖黠不疑其誘也益鳴搏争食至三四皆飛從之稍狎迫於網因舉而獲焉今夫世之人自謂智足以周身而不知禍藏於所伏者㡬何其不見賣於哭者哉亦或不知周身之術而以愚觸死則其為智曽不若是烏之能靈於彈射也韓非作說難卒以說難死於秦天下哀其以智死楚人不知沐猴而謂人沐猴天下哀其以愚死是兩人者其為智愚則異而其於取死則同矣寗武子邦有道則智邦無道則愚智愚觀時而動禍其可及哉雞肋集巻二十七欽定四庫全書雞肋集巻二十八目録雜著賔主辯諱辯話述七述醫言雞肋集巻二十八目録欽定四庫全書雞肋集巻二十八宋晁補之撰雜著賔主辯晁子既摭陶子歸去来辭以名其居而記之自以聞道歴年而為潛不足中慙而疑隐几去智則方寸之地廓然其虚若兩丈夫為主與賔巾裾而坐廬賔曰子道與吾殊而多謂子類余豈其然乎凡子以躁樂吾静隘恱吾和子人之放也而多謂與我自放者同科我遺夫世者已盡子縁於物者尚多而子賔賔焉以從我奈何主人曰萬物聚閭千古並塗然求諸其間天地異職父子殊面莫大且親而相因以判今賔方欲合兩人為一體則物我蠭起不可得而止賔不通之則自賔之身十指長短兩目大小肝膽共絡而楚越畫界也况賔出千載之上我起千載之下别族離居所遭異者而賔乃斬然為間方且病我之浮氣獨不傷賔之大同乎賔自揣心日化年改壯異幼時老乖壯日今是昨非前棄後拾使賔自操且不可得盖孔子聖人猶六十化智如恵子徒觀其勤未知其謝賔如通之則齊嬰公扈離立昜心夢為魚鳥可與飛沈况我欲遵子若是其賔賔者耶如賔之詞委心去留椉化歸盡化乃所過胡可以吝我之慕賔亦以是近躁静隘和曰情非性人放自放非故曰命極則俱極進則皆進賔遺夫世者雖盡而猶多我縁於物者雖多而必盡則又胡可以賔之既瘳而傲我之方病也水既蛻地氣又蛻水吾方觧我之不然而經賔之所以則我既化矣雖六十改未知為數也且物固以其近相慕昔伯宗人言其似楊父則懌桓温婢以為類劉琨則忻夫楊父劉琨徇權殞身而夸者慕焉恐不得鄰前輿既覆後轍不逡彼皆炫智而闘力角驅而競犇故彊弱斯在而勝負可論也今我與賔既已俱出乎忘我之境而同塞乎累物之門得失安在是非奚存哉賔獨不聞魯男子之拒託宿者乎嫠曰子胡不若桞下恵男子曰柳下恵固可吾固不可吾將以吾之不可學柳下恵之可而孔子以謂學柳下恵者多矣然未有似於斯人今欲使我如賔觧組長違我則不可可在佚身賔則猶我譬魯男子審已故其為柳下恵也不以其同而以異及其至焉一也可不可安寄賔亦奚以知我不與賔同至於葛天氏之地以謂何如於是賔唯而起主人送之不離席則霍然若寤廼書之記後諱辯禮不諱嫌名二名不偏諱孔子之母名徴在言在不言徴言徴不言在補之先君子二名禮不偏諱者也單舉則於禮無怍矣而世皆偏諱厚於古不敢變也若嫌則後世亦有不諱者矣漢和帝名肈不改京兆郡魏武帝名操而其子植詩云脩坂造雲日肈非兆造非操也唐韓愈非薄於親者作諱辯抵諱嫌者曰父名仁子不得為人乎義盡此矣然周人以諱事神亦惡夫音之斥也甥輩讀有若酉者斯可矣話述晁子嘗曰至人鶉居而鷇食鶉無常居鷇仰物食我窮殆似之蚍蜉集其枯螟宛轉于塗而我不廬開口待餔廼不如彼鳬有喙則腴其妻曰水舟而陸車乎憎里巷而愛歧陌乎今日越而昔者燕乎雲忽忽乎萍不止乎大章盧敖歩八極乎荒土功乎負覊紲乎孔不暖乎墨不黔乎無乃蠏蛫蚿足躁不一乎陽鳥鷾鴯氣則移乎敗瓦墁乎長鋏慨乎匍匐往三咽乎人蓐食而媪見哀乎東郭穢而中庭泣乎貿貿来乎額額然伏乎西山餓乎雉噫徙乎無乃侏儒瞽師困慰禄乎豢豕犬羊犧餼養乎凡子行人間何以請擇事晁子曰唯既而曰龜笑不知我知之乎適可則可我不可乎其妻曰唯舍然大笑七述時年十七嵗予嘗獲侍於蘇公蘇公為予道杭之山川人物雄秀竒麗夸靡饒阜名不能殫者且稱枚椉曹植七發七啟之文以謂引物連類能究情狀退而深思倣其事為七述意者述公之言而非作也眉山先生懐道含光陸沈於俗日與嵇阮賦詩飲酒談笑自足泊然若將終身焉於是潁川孺子聞而往從之躡屐擔簦破衣踵門及階而止望帷而稱曰不敏聞先生之誼敢待于下風先生矍然驚曰孺子来吾惡夫世人之保我也久矣而不能使人之無我保則户外之屐滿焉將命歟吾無所逃此雖然孺子何為者也孺子曰幼而多治長而屢窮遭先生乎齟齬之塗陪先生乎寂寥之事樂先生之所為樂者以白吾首其已乎先生啞然笑曰孺子上吾以樂而未嘗無以樂者順也羇旅于吾有時矣亦嘗聞杭之山川人物雄秀竒麗夸靡饒阜可樂者乎孺子曰先生不以不敏為難與言得聞咳唾之音不敏以為幸先生將何以教之先生曰杭之故封左淛江右具區北大海南天目萬川之所交㑹萬山之所重複或瀬或湍或灣或淵或岐或孤或袤或連滔滔湯湯渾渾洋洋纍纍硠硠隆隆卭卭若金城天府之彊其民既庶而有餘既姣而多娯可導可疏可舠可桴可跋可踰可􅀈可車若九洲三山接乎人世之廬連延迤邐環
