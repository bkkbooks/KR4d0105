body:
  text: 絶句國子監莫㱕荅李令身世謾悠哉禱雨宿九曲池三首譙國嘲提壺書周開祖子抱一發願文後和荅魯復一高士讀昜題宗室大年畫扇四首閻子常求琴絃濵州道中四首館宿季夏即事雞肋集巻十九目錄欽定四庫全書雞肋集巻十九宋晁補之撰絶句五言國子監莫㱕杖屨清晨往縑嚢薄莫歸閑官㕔事冷蝴蝶上堦飛荅李令知音慙李令問我復何為道義惟添􅕘功名只有詩身世謾悠哉身世謾悠哉田園首重囬春来亦何事忽忽歎庭槐禱雨宿九曲池上三首微月淡蕪城飛螢縱復横蛙魚凉亦樂跳港觸荷聲荒城孤絶處猶指玉鉤亭凉月偏宜上江南山更青同輦笙歌地荒池風露天無心更懷古凉夜正甘眠譙國嘲提壺何處提壺鳥荒園自叫春夕陽深樾裏持此勸何人書周開祖子抱一發願文後欲愛生諸穢俱盛一革嚢應從持犯入當發紫金光和荅魯復一髙士四觀以為隣朝霞以為竈贈我不知名千古巖下草讀昜學不到忘言崇朝守韋編使我能解化此物為蛇蟬題宗室大年畫扇四首栁動燕初来波生雁將去惟有小崧高蒼蒼自如故鸜之仍鵒之爾名今是非人言不踰濟何事滿苔磯西風入叢竹􅆭澹帶秋隂驚起中汦雁衡陽萬里心王孫蘊奇意紈素澹雲煙借與王摩詰含毫思邈然閻子常求琴絃先生三尺琴斷絶絃上音欲求鳳喙膠弱水毛猶沈濵州道中四首六言身随符檄塞壘家與琴書鄴都白酒清談憶汝黄花佳節愁予月墮孤村露合日出高原霧開道逐故河西去人將新雁南来三徑蔣生里第再見虞君客卿多病増予歸思少年許子高名林下囊裝夙興雲間鴻雁悲鳴行役正嗟予弟言旋當復諸兄館宿殘雪封條未乾蘭臺襆被春寒斜日房櫳吏散鳴鳩飛下欄干季夏即事紅葵有雨長穗青棗無風壓枝溼礎人霑汗際蒸林蟬烈號時雞肋集巻十九欽定四庫全書雞肋集巻二十目録
