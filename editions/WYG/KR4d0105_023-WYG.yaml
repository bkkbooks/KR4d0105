front:
  text: 二十三目録
  hash: sha256:d64894028987d516ee3b1905989f8dde0efb75e9d3a754a5e43e9feaa5533cee
body:
  text: 挽辭欽聖皇后挽辭二首欽慈皇后挽辭二首王拱辰太尉挽辭二首趙開祖挽辭一首蔡州叔父金部挽辭五首蔡州叔父金部挽辭别二首秦􅀦夫人挽辭安門下母二首秦􅀦夫人挽辭三首任承制挽辭雞肋集巻二十三目録欽定四庫全書雞肋集巻二十三宋晁補之撰挽辭欽聖皇后挽辭二首神開大馬表坤祺象配黄龍耀母儀囏棘從權非本意憂勤復辟竟先期欲書皇極彞倫事不在關雎巻耳詩陵作因山名改聖君王仁孝自生知蒼黄大策中先定洶涌姦言外獨驚可但觸山憂地坼只應鍊石見天成江湖自昔波濤逺日月如今晝夜明盡作兒啼送文母不知簫鼔若為聲欽慈皇后挽辭二首仙馭飄颻不可尋西陵寶冊襚衣衾禮遵章懿因仁志諡酌欽慈自聖心感泣萬人隨遣奠恩勤千古詠徽音一言能使民忠勸要識吾君孝治深弓韣它年事炳靈紅光滿室衆潛驚人言薄氏誠君子天與文皇兆大横聖有至情風不止邦傳慶祚日重明百神陪扈朝陵寢想像登輿動珮聲王拱辰太尉挽辭二首賈山辭賦妙升堂十八髙名擅雒陽遭主聖人千載事濟時賢獻萬夫望已加壇上將軍鉞未促齊中相􅀦裝曾有新詩介睂壽悲歌何忍送歸牆童年已切耆英慕壯歳初陪後椉逰衛幕櫜弓皆廣建梁筵進牘竝枚鄒雲臺生靣丹青古馬鬛新封草木秋是事公應付蜩甲蒼霞誰見揖浮邱趙開祖挽歌辭萬里歸来兩鬢霜故人如玉閟幽堂凄凉長吉無題句㝠黙淮南未試方空復藏書如冊府何由載酒更僧坊諸郎文字能傳業開府風流未渠央蔡州叔父金部挽歌辭五首文詞蚤嵗諸儒上操行當朝􅀦士期清世急賢千載事白頭齎志一州麾省中共襆青綾出關内同驅五馬行何許書來一千里西風淮上淚縱横青史他年羨二疏功成脫屣向迷塗薄逰竟後抛官約常愧都門長大夫聞道一㕓親卜築亦求百畝伴鉏犁􅄼知湖海歸來日只及鄊閭㑹葬時竝直儀曹前後㕔當簷種竹已青青平生不試南宫筆可忍圗公地下銘蔡州叔父金部挽辭别二首書來猶勸還鄊早路梗誰令去棹遲曾綴鏘金拜先壘可堪扱衽送靈輀學比我公常恐後身於餘予似䝉知心驚竝直儀曹夜淚盡孤吟海浦時秦􅀦夫人挽辭安門下母二首𤓰瓞傳仙裔鳲鳩嫓積功龍章看子貴鶴髮與夫同揄翟丹青裏珠襦鼔吹中秋原送車淚斜日起西風城南塞冠葢哀挽送何人吉卜郊連浚恩封􅀦號秦桓碑空復古蒿里不知春應奪居廬念朝廷佇弼臣秦􅀦夫人挽辭三首指李仙源後興唐帝胄餘家傳湖北句人誦嶺南書知子唯賔客揚名屬起居平生操史筆遺事一欷歔相􅀦家風獨夫人壼範如寶珈宜服象文錦合軒魚感慨温成議光華慶壽餘非夫聞敵退應愧此生虛酷好春秋學親書列女篇胡兒吟敢竝逸少字方傳餘事猶閨範髙材自世賢凱風君莫誦秋栢已成阡任承制挽辭劉挍勘槩求作生業清談外浮名痛飲餘誰令力如虎坐使食無魚壁冷猶鳴劒床空未巻書呻吟待河潤秋柏只遺墟雞肋集巻二十三欽定四庫全書雞肋集巻
