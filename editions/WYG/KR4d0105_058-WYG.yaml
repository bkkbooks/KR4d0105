body:
  text: 啟與謝寳文啟謝淮南漕彭元施啟與京東漕黄朝散啟答謝華守趙子剛賀入館啟與亳守向宗旦啟上河北漕呂進伯所業啟代胡唐臣授蘇幕與使者啟授澶州司戸答韓諫議璹請充教授啟囘鄆城孫簿啟賀教授陳履常啟答謝狀元李常寧啟答謝宗室奉議啟答賀李祥改宣徳啟答亳州趙教授啟太學答學生林自啟答王勲謝貢啟答陸倅啟雞肋集巻五十八目録欽定四庫全書雞肋集巻五十八宋晁補之撰啟與謝寳文啟竊審再膺宸撿還鎮淮邦副朝廷因任之求慰民吏去思之意伏惟歡慶恭以某官忠藎耆徳文詞宿儒蚤記淵衷徧躋法從長人京邑豈徒前有之趙張控馭藩垣真是禁中之頗牧惟江陽氣俗之舊有棠隂恵化之餘農絶帶牛尚未忘於勸課兒騎竹馬願復見於行春惟暫屈於統綏固不勞於經理而補之倦游文館得請佐州曾未造於門牆將獲依於麾棨自惟幸㑹尤劇欣愉方冬冱凝取道遼逺謝淮南漕彭元施啟吏能何補公舉過優迂疎内循光價已倍伏念補之無自得之學非適時之才間關一名黽俛十考庠校五歳館閣四年不能穡而取禾退黙既慙於素飽未操刀而欲割進為又懼於得傷故嘗冒請於外官庶幾自試於民事而託部封之未久辱咳唾之獨先靜言思之何以得此斯葢伏遇某官忠以事上恕於取人過譽斗筲俾叅瑚璉李長樂之許文舉非為通家㬥公子之知不疑儻縁一語人之幸㑹勢豈偶然誓堅許國之心終得報恩之所感荷激切不知所裁與京東漕黄朝散啟伏審祗膺眷擢榮總漕將已擇剛辰初臨治部伏惟慶慰恭以某官才髙當世聲發妙齡行誼規於古人文章固其餘事鴻干以序美既載於兩朝玉立而温威自宣於百郡屬河朔流移之始復而山東罷瘵之未蘇庶幾小豐有望卒歲故暫假問民之寄豈乆迂攬轡之行補之頃濫麾符方茲譴謫何意周旋之舊乃依刺舉之嚴捨曰蘇孺文之天迂疎敢有或者李將軍之地寛大所為非輒病於至公實少伸於知己永言幸㑹莫罄叙陳答謝華守趙子剛賀入館啓頃者効官河外託庇府中違離屢昜於歳華傾想第勤於魂夢疎慵成癖問訊闕修伏惟坐鎮安閑履時休裕補之才能甚薄學術亦迂比縁明詔之求偶用輔臣之薦道山羣玉之地濫跡莫遑長林豐草之思此心固在斯葢某官忠信好禮彊恕行仁吹嘘所加隠伏皆奮葢嘗勉裁尺牘槩叙鄙誠置几塵生開緘字滅既後時而莫致滋撫事以為慙乃䝉眷私特枉慶賀辭極璆琳之美情踰骨肉之親顧惟感銘尤劇衷悃新元肈布介福来同與亳守向宗旦啓頃縁契援嘗奉標儀去牆屏之已賖託麾符而湥幸恭以某官温良植已忠藎在公勳名烜赫於相門婣戚蟬聯於帝室不由此進自以才稱騫翔省寺之華更踐藩垣之重居有善政去嘗見思而補之疎拙領州乖違得譴未更歳律仍避親嫌仰寛大之足依俯飄揺而自慰奔馳敢後叅對可期上河北漕呂進伯所業啟草木有榮逢春乃耀鳥蟲含響得氣則鳴物誠甚微情乃如此士有知識志宜激昂自憐孤生誤喜末學執技不化知己益消寅縁官曹統莅使部竊以畏大人於早歳事君子於一朝向塵長趍人進亦進登堂危坐衆言則言不圖髙明見假顔色問訊所學開擴其愚昨成至言所要知道退念空語滋不欲陳然而殫廢楮毫棄滯箱簏憤悱已吐蕪蔓莫刪猶望牛歌足觀蠅墨可綴察鄙心於甯子成拙繪於曹生則雖孔門未廢由瑟尚或有取不為無庸代胡唐臣授蘇幕與使者啓此者忝命宸廷備員州幕仰威容之固久託封部以為光竊自思惟良湥幸㑹伏念某才出中下譽乏鮮明雖任使之粗更顧毫末之未立祗惕譴尤之後摧頺禍罰之餘豈敢進求智挈缾而安取庶幾分守恩弛負之已多此葢伏遇某官忠以事君恕於接物蕭生論議寧忘意於本朝范子澄清葢有心於天下寅縁竊食邂逅望塵捧檄束裝計官期之良邇登堂聞教况吏政之可師欣忭之情倍百常品授澶州司戸答韓諫議璹請充教授啟竊以貴賤位殊義非均則有所不答賢愚術異勢既絶則無以相求葢明公在上之達尊而不肖衆人之晚遇解褐一命從軍大邦以未嘗知名而過聽獨收故不待望履而陳書犯分罪實出於不韙誅宜獲於非常敢謂伏䝉某官寛裕有容威嚴曲霽猥以世間之盛禮施於麾下之鯫生屈記室以裁牋賜家童而返報往来嫌於敵體進退越於常倫愧汗莫堪駭情無措炳若文章之眩目跫然藜藋之驚心上煩開府之知下無國士之稱至於假資助乏輟椉代徒自惟平生得此固寡三復敢置累息弗寧葢補之才實窳疎學尤拙陋幼雖有志壯益無聞幸遘明昌預霑教養庶幾同小子之有造未敢與先生而並行正使米鹽効勤猶病弗稱若復庠序肄業尢非素長伏况門下徳誼之最隆府中衣冠之甚美鄒枚毫牘之侍應劉樽俎之陪足以議論古今酬酢左右豈宜下陳無似之賤吏乃辱大人當路之末光拜教至榮拊心益忝請自隗始私不忘築臺之初即以遂行倘或有奉盤之頃斂板就列計日有期託庇門䦨終身悃愊惶懼激切之至囘鄆城孫簿啟麋鹿情疎但記蒿芩之樂鵷鸞跡逺無心羽翮之追忽被除音復叨守土髮星星而久墯綬若若以增慙敢圖眷奬之湥首辱緘題之慶徒欽雅致夐越常流偉初奮於仕塗藹已揚於才譽身相為援豈無用力之公卿意獨與親乃在退藏之農圃將髙懐之固異實近世之所稀補之自信良堅與庸已甚枉瓊瑶之為好撫蓬甕以生輝感荷之誠倍百常品賀教授陳履常啟擢領掾曹歸臨鄉校與從游之良舊私慰喜以居多竊惟國之求才病取捨之膠於法士之渉世患進退之失其中設科舉爵位以誘人假誦數詞章以干禄須其出試則鄉黨自好者耻夫屢獻不以禮際則山林長往者豈其肯来故上安於有司之區區糊名以為公而士惑於古人之皇皇載質以為辱莫聞覽徳之鳳率多食餌之魚恭以某官行獨而通志潔而降不落落以如玉矧泛泛其若鳬窮無立錐術可濟國至於博覽之學絶出之文要其平生固曰餘事尚不屑去安有求聞聲自籍於諸公章數騰於當宁㧞起閭里朋類之榮收還妻孥親黨所喜未促公車之詔聊從泮水之行庶觀成山必自累土辭尊及富仕何往而非安有為與行志茍存而皆可貽牋良幸修慶獨稽傾詠之誠倍於儕等答謝狀元李常寧啟摛詞中禁擢秀羣豪一鳴而驚閭里爭傳於盛事三道之要朝廷相賀於得人伏以某官藏器於身待詔而往文非時好近灝噩之商周經本心通無異同之王鄭囊錐出穎郵傳馳聲望冠葢以傾風固其素願過蓬茅而委質非所宜堪豈徒一戰而稱雄庶觀千里之自此忻愉良劇敷叙何窮荅謝宗室奉議啟程文入等恩詔換官起身玉牒之華通籍金閨之貴伏惟慶慰竊以邦國之建本支是崇變商餘風周化行於麟趾懲秦孤立漢勢定於犬牙豈徒魯衛兄弟之俱賢固宜向歆父子之間出逮觀近世莫盛李唐持鈞軸以當朝適之首出以文章而傳世長吉獨先聲明迄今想像未泯恭惟聖世尤篤宗盟惜夫飽禄廩而宴安故使學詩書而進取及茲歴歳寖得聞人新恩奉議稟性茂良修詞敏邵恥從派屬輩居環衛之中欲以功名自致薦紳之上果縁藝選驟改文班同列相矜一時盛觀竚騫騰於夷路益開發於逺圖先枉緘封過形謙挹感銘良劇敷叙奚殫答賀李祥改宣徳啟延對宸廷改榮京秩從游兹舊慰喜良多恭以宣徳懿行不羣令儀可度粤從幼學夙有俊聲下帷未省窺園持竿寧悟流麥其精如此故資之湥珠玉藴含山川輝媚自當名世豈獨傳家補之氣合相求心均莫逆絣䌟洸之何取橛株枸之自留臨水送將牛羊方下望風懷想鴻雁欲来庶幾逢聲子之班荆且復過孟公而投轄未遑馳慶先辱流音尚阻盍簮惟期彊飰答亳州趙教授啟茲縁罪譴復避親嫌跂才譽之素勤聯官曹而湥幸恭以教授推官端良可度超犖不羣早收科第之榮方莅膠庠之佚粹精古學本自得於下帷敏捷髙辭咸相傳於倚馬操惟幽而不改聲乃大而逺聞倦飛聊比於一枝築室尚容於三徑先煩慶問尤認眷私感服忻愉併增誠悃太學答學生林自啟竊審論秀辟雍登榮造士伏惟慶慰上舍先輩懿行可度美才不羣負笈徒行豈辭李固之千里違親忍志未厭何蕃之五年故能通達大成文史足用升諸鄉而有素告於王而可官以補之預在膠庠特貽牋翰推先非據感服徒湥答王勳謝貢啟數從升補初預賔興雖學制之同然必鄉評之所與竊以貢士先輩幼稟儁異早勤編摩敏七歩之修詞飽五車之彊記李廣百戰未立寸功何蕃一歸動輒累歳阨窮已甚操守更堅果縁考察之公往偕造秀之選國有道化方革浮華士惟忠良乃稱推擇九層始於累土一鳴可以驚人豈但顯親固將行義願思飯粟務正學以言而發身毋侈輜車稱稽古之力以辱士先承緘翰但劇感銘謝陸倅啟輟自班聨屈臨州郡涓辰之善視事云初伏惟慶慰恭以某官經術博通文詞敏贍賢關論秀蚤成金玉之章卿寺須才久躐鵷鴻之綴英猷方顯雅致不羣自求外官欲試民事聳聞交印已揚慈恵之聲即見賜環復在清華之選補之田閭託跡萍梗因風當趍牆屏之嚴以伸桑梓之恪屬茲被命既廹赴官愧流問之辱先悵叅承之莫遂雞肋集巻五十八欽定四庫全書雞肋集巻五十九目録啟赴揚州上太守王資政正仲啟與交代范峒啟與淮南提刑賈殿院啟與淮南監司啟答揚州教授曾旼啟上揚守王正仲啟與淮東提刑王司諫啟答揚守判官趙奉議啟答致仕劉敏大夫啟與京東漕張道順啟與京東提刑趙景仁啟答淄守啟與淄倅啟與提舉鄭彦能啟與京東漕吕直父啟答滑守李孝純啟賀知府趙待制移鎮啟謝提刑上官正言啟留臺韓朝請到狀啟答濰守啟揚州泛用賀冬啟元日賀啟元日賀啟答交代中散啟與李中大啟謝吕大夫啟答通判朝奉啟代韓太中賀徐中丞啟與淮南監司啟謝解啟公為求親啟送幣啟公似求親啟代謝求親啟許親啟送幣啟求親啟雞肋集巻五十九目録欽定四庫全書雞肋集巻五十九宋晁補之撰啟赴揚州上太守王資政正仲啟比者得請宸廷備員州佐蚤在陶鈞之内久辭牆屏之嚴寅縁庇依欣喜幸會恭惟某官道徳世範文詞儒宗龍虎之得風雲主威益重山淵之有珠玉國勢增華加以仁厚不矜直方有體倦經為於機政思宴息於藩維而補之册府後来書生孤立慙梧鼠之五技窘侏儒之一囊江海之思日縈魂夢麾符之䕃與有光榮春氷已生吳艎當具尚曹裝之未促儻荀御之可容鄉往之誠倍百常品與交代范峒啟䝉恩外補承乏後塵惟慕誼之素勤獲趨風而自慶恭以某官夙懐賢業藹有令名行已不撓而衆推居官所至而民願尚淹器幹屈佐藩維補之質薄自憐學迂寡與陪英髦於中秘非所宜堪奉甘㫖於宴閑葢其私便企青雲而雖舊繼白雪以良難行造門墻粗窺矩範欣愉幸㑹悃幅奚殫與淮南提刑賈殿院啟䝉恩外補竊禄便親望履幕以良勤去門墻之未久敢圖官守遂在部封恭惟某官道業古人之期風聲列位之冠以義出處繫時重輕雖雅意不忘於本朝而直諫自難於居内久傾公議尚屈逺猷補之質薄自憐學迂寡用糜丹鉛於􅉺府固乏毫氂佐條教於藩城足殫駑蹇趨叅良邇庇賴為榮瞻詠欣愉併深悃愊與淮南監司啟䝉恩補外竊禄便親仰風望之素隆傾誠心之固久敢圖官守遂在部封恭惟某官賢業藹聞公才屢試奉行寛大之令威亦暢於屬城愛養疲瘵之甿財不虧於成賦尚淹使指行副褒延補之質薄自憐學迂寡用糜丹鉛於􅉺府固乏毫氂佐條教於藩城足殫駑蹇趨叅良邇庇賴為榮瞻詠欣愉併湥悃愊
