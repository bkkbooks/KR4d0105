body:
  text: 第二十九卷記博州髙唐縣學記冠氏縣新修學記清平縣新修孔子廟記沈丘縣學記祁州新修學記林慮縣學記慶州新修帥府記照碧堂記濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第二十九記博州髙唐縣學記始余讀史記至西門大夫治鄴投巫嫗三老禁為河伯取婦喟然嘆曰賢哉西門大夫稍行四方見今為縣令者論罪人適榜箠耳亦具獄乃決佐史自旁持之至上下顧莫敢誰何於是益太息知豹為不可能其後讀律令見所以繩吏者甚具更悟曰法如是耳晚得髙唐令王君聖塗而異之聖塗為髙唐非能外律令用其意也而獨規矩搶攘之中從容以和夫使騏驥得原野則勢便利至里門曲囏六轡不亂而所投無差難矣哉髙唐民貧聖塗惟不奪其時民以富縣有孔子廟嵗久壞弗治學者莫至風雨草生之可羅雀也聖塗曰我豈得勿憂猥自安曰非不能或不可姑以俟後人而已哉舉而新之鳩材庀工人罔告勞也又教其邑中君子小人以學道之美武城絃歌逹于四境余聞而喜曰非有為則難以莫之敢為而為之則難古者其美是人也嗟嘆之永歌之亦使睦者歌吾子可也故為詩以遺其邑人俾不忘王君曰高唐之學兮王君之作兮王君去我誰吾與覺兮誰使此微兮而舉則希兮王君去我誰吾與㱕兮元豐四年七月丙戌學成十一月戊子潁川朝補之記冠氏縣新修學記太師潞國公留守北都余故人鄭君為其戶曹掾數持檄出潞公曰鄭參軍才無俾去府中即奏以為其法曹掾公還雒鄭君亦去為冠氏令冠氏父兄聞鄭君來咸賀曰是公所奏以為其法曹掾者也相與戒其子弟無犯鄭君法故時冠氏人務衣食知學者鮮朝廷方以丁聨兵鄭君從容不擾人人安鄭君爭趨令無幾何則習擊刺馳射足任矣鄭君出野民有歌者曰犀邪兕邪襏襫者憊邪鄭君曰嘻有勇而無義安可乃為之布約束無不信驁者執之它日出野民又有歌者曰無以吾乎彍襏襫者方作無乃吾鄭君不樂鄭君曰民庶幾可教也㱕灑掃召其僚與賦詩飲酒言治民之意見諸生問所以學而别其秀民民益勸乃即孔子廟為學學成又率諸生日談經其間諸生自它邑者常屬絃歌釋菜洋洋也於是民以為榮爭遣其子弟往觀頗改服為士矣間以書抵余願有述余曰士學古入官有人民社稷豈其一切效俗吏如不及者乃鄭君所謂不忘其本者非耶因采其行事本末可為邑人道者刻石學中俾無忘鄭君鄭君名僅字彥能彭門人嘗從彭門守睂山蘇公游蘇公稱其良士始知名元豐七年八月甲午濟北朝補之記清平縣新修孔子廟記羣有司所治異事而事之在縣者十九以其十一用心乎治之本則力不給故雖有庠序教化亦十九不舉一有舉焉令之才足以任事可知已魏為天子北都而清平為畿縣竝河水數至自慶曆逮治平縣再徙不復立孔子祠為屋居神民往來猶原上也令始至吏導之拜屋下嵗春秋釋奠為次草間吏曰即次乃即次曰行事乃行事曰禮畢乃禮畢俯默而出不復省或告曰此宜省則嚬蹙曰吾有公事不暇也若是者有年至風雨屋壞不支縣之民為士者滋少令錢侯之來惻然悲出涕裴回倣徨顧相其地得舊材瓦甓在官者幾具始復興之人歡然從不勸而成有堂有筵兩廡四墉饎㸑有所若祭器咸在而人不病斯已才矣夫儒術之於成民欲久於其道則為功緩故急於人知者忽之錢侯不以人之所急者為先而急於人之所緩則其賢又可知已􅒘是詢諸邑人其大者既舉其細者有不治余不信也錢侯名唐卿字元輔余王姑之子云元豐六年二月乙丑北京國子監教授朝補之記沈丘縣學記民可以誠化而不可以文治吏功可以嵗月致而不可以一朝成古者繼世以立諸侯又命之教而為學使各以其身化於其國然中材之君意竭於有為而先王之事業曠時而不一覩况夫後世吏不得久於其官而庠序之教已微吏有愛民不茍之心不幸或不得為而去或雖為之名具而實亡以其鹵莽滅裂僅存之餘而施之其久壞不安之俗故為其事而無其功豪傑逺識之士以謂是區區何益於為民而不為中材乍存乍亡而不肖者盡棄不省而好更張喜事者乃始務修此以盜名於衆人不為之中則學之存否於吏治之損益信未有繫也蓋如卓茂魯恭其治至使民相仁愛不犯有司而亦不聞其朝夕與民誦詩讀書舞樂釋菜常常從事於此而惟其誠心實事則固有以得之然俗吏至或一切務簿書獄訟財賦無愛民之意士亦不本鄉黨庠序而游談四方專以干祿於此以為文不足為或不得久而不為則至於俗隳弛已甚本又不立孰從而維之譙郡張柔文剛好學而有文為令沈丘嘗曰位無貴賤皆可以行志民無古今皆可以道理齊也則欲以其學試之沈丘使民於衣食必以時教民於相收養必以孝弟廉恥三年而民有改文剛喜曰吾所知信是吾民可與言矣乃從其邑子論古之學者所以治心修身非干祿之意而士亦欣然相與化之乃建學孔子廟中貌像堂室東西序之房與祭器廩庖皆有所蓋為屋四十楹可以待鄉先生之講道而來子弟之願游者屬補之記補之曰世之所患先王之事業不可為非先王之事業不可為而其勢不得為治天下有本而徒於其末救之則智不勝無以為之大而僅為之小則力不足雖然導民之道唯其所欲無不可成民嘗見者則識之嘗為者則能之耳目習熟於此而中心不喻人情無有也文剛於是能知其本則其所施設宜有先後非特以備觀美人為亦為而已武城絃歌夫子戲之曰割雞焉用牛刀然亦各以教其人使知道則子游之意卒乎為是以為不告朔而餼羊可遂去則夫子之所悼也民常病詐而至其化上之所為則甚信晉之儉秦之好車馬鄭衛之音宛丘之婆娑以詩書所記行四方察其風俗無不近者當其一時上之所為豈自知能入人如此之深耶其漸靡使然朝鮮去箕子千載至漢時其民飲食猶以籩豆民不相犯恥淫僻其後吏及賈人往者稍侵之俗乃益衰朝鮮夷貃况中國哉後之來者嘗無忘文剛所欲為則沈丘之民雖使世世知好學俗純厚易治無不可也元祐二年五月十日朝補之記祁州新修學記先王以禮為天下禮行而民有恥以樂為天下樂行而民鄉方以庠序養天下之才而君子之學洋溢於四海先王之須數者以治如此而自後世視之則常若迂逺而不切於治之情夫古與今一也而先王之用禮樂則如帛縷之於衣榖米之於食每須而常效而後世之用之則如觀殊類之好而名異國之物雖存而猶亡射鄉食享裼襲之文而籩豆之器鍾磬柷敔綴兆之容而搏拊之節是先王之所朝夕用以為禮樂者也而行之於後世則文齟齬而情不安若度十指而合方圓非聖人復生不可得而定是先王之禮樂終不可用於後世也然而後世亦何嘗一日而無禮樂賢君良吏誠心於為治各因其世所用者而用之以合恭敬而交歡欣亦不見其少雖聲音服器滅裂於已壞之餘而參差於不同之緒至雜野人里巷之說而用之蓋禮樂自此而亡然亦或自此而存何則其文異其實在也至於庠序先王之所以教人事父兄親宗族而善鄉黨內之於治心行已外之於事君牧民蓋亦如此而止矣而世之為士者聞先王之教則漠然若非其身之所當任而惟其文詞記誦所以干有司者為師儲粟闢屋而俟之三嵗而一取士集於堂者如市否則掉臂而不顧蓋僅有存者夫如是則州里之有學特以為求仕者之舍耳而於治誠何補哉然盡棄而不舉專以文法賦斂目前之所急者為務則民益野一州而有學則一州之為士者多一邑而有學則一邑之為士者多使夫世之所謂賢有知者不出於士則已賢有知者而必出於士則為士者多蓋先王之教所以在也河北自五代兵革遷徙之餘而士日少至本朝百有餘年朔方之民得安於衣食而偉人巨公間出於其地仕於四方以文學政事顯者往往而有祁州又支郡而求舉於有司者率常百餘人舊有學不復葺學者至散而入他郡宫苑使董侯之為守始至慨然以為先務而郡貧力不足以為乃斂菜圃之課當入於守者日二千錢舉而新之籍其圃之入以其半為學者之食其居處安其資糧足而無患矣復得前進士彭城趙君懷之以教授學者學者日至絃歌之聲逺聞使其子逌以書抵補之求為記補之以謂自三代之亡由秦漢至於今所以教養人材者固無復先王之舊凡幾百千年矣而忠臣孝子仁義之人操守廉潔之士器足以任重而致逺明足以解疑而釋惑彊足以勝難而處劇朝廷用之則重捨之則輕天下有之則治無之則亂者亦凡幾何人而豈其必出於先王之庠序亦各因其世所有取之長才秀民傑然於衆人之中若物之精華不可得而掩終不以教養非是暗曖而不出亦何必曰春夏教禮樂秋冬教詩書十有三年而舞勺成童而舞象中年􅊲挍九年大成論辨而升黜之一切皆如先王時而後得哉有誠心若古之人則處今之事而要古之效何適而不可龔遂黃霸漢之良二千石此兩人何必文武成康之吏其教民成俗亦何必文武成康之法而正使文武成康之用吏亦不過如此㱕於治而已雖然此可為通人道難為守文不知變者言也董侯以文法中第而不用顧以其才雄於諸將武人之間而其政事施設先後如此惜也其試之小不獲試之大也故序其意而刻之林慮縣學記先王之治其實不可為也而文可為夫文亦安足為哉蓋文者實之所寓而存也并文而去之實之所存與有幾然則存其文是存其實也遵古人之跡而為之加以誠心不倦而能久則實斯可幾也巳食飲以籩豆夷而有先王舊也則朝鮮可求禮被髮而祭於野中國而用夷事也則伊川為戎此非夫文存則實存文先喪則實並亡者乎故魯不棄周禮則君子以謂未可動子貢欲去餼羊則聖人以謂我愛其禮此深知為治之意者其於守先王之故本末惟謹雖其既絶之緒不可復之餘而堇堇焉不欲其廢而不舉者如此也無棣劉君演好學良士其為林慮令也下車而問庠序之政若令之事莫先於此者而先聖之祠有堂而無序風雨屋壞雀鼠之所舍不足以備登降供禮事劉君愀然不樂以語其僚曰此於事若緩而急者吾聞之君子米鹽獄訟吏之力可以朝夕為者至焉則為之一日去則已矣若夫事之大而緩者則其舉百一蓋未嘗為而去者相輩也我不敢以後吾之所急顧一錢一工之在官者令不得專焉使吾常知所急而不敢後日儲之不足嵗儲之有餘則學之成其必有時矣蓋自始至至將去踰二年而學成為屋五十有五楹貌像一新講有堂休有房廪廥饎㸑有所賔客諸生之至者曰美哉昉於此前此無有也於是乃介其主簿真定耿君轍求文於補之以記之耿君儒者道劉君所以治其邑事皆若此一二修舉類不茍然者士相與歌其能民聞其欲去而戚者甚衆也人之言曰以儒術緣飾吏事儒術之不可一日無也如此㫺者子産為鄭陳伐之子産能以其衆入陳蓋數俘而出致地而還以獻捷於晉而晉人猶難焉子産陳周之德數陳之罪甚順而有禮晉人乃受之仲尼曰晉為伯鄭入陳非文辭不為功夫子産之功不在其對晉時而晉之受之又不以其功可尚卒之其事所以顯而不泯者獨其文辭足以發之若俗吏一切用其力於簿書法令之間而不知緣飾有禮義何足道哉然則劉君以謂於事若緩而急者不可忽也慶州新修帥府記上即位之元年憂勞逺人欲與之休息詔邊臣按兵自守母生事疆埸有不如詔㫖務利者罷斥之先是文正范公與今右丞相父子帥慶皆有恩德在慶人上方招延老成而丞相以給事中召自慶且大用矣朝廷既難其代而謀慶人之所安者於是朝散郎直龍圖閣范公自京東轉運使擢環慶路經略使知慶州詔曰爾尚無忘爾父兄之功公拜稽首就道且公嘗使陜西攝帥事慶人父老聞公來咸賀未至而其心已安之雖其宿將悍士以公家世聲名惠澤與其所施設素信於心皆拱手待令愛行而威不試於時朝廷方寬征役民復田畝嵗屢登虜芻牧相望公戒邊吏姑謹備得諜者勞遣之使語其酋曰爾無犯我我不侵爾毫髮虜不敢動民既不見公有所為而寇入稀愈益安公政成而無事矣先是慶州官府􅋻陋朝廷間遣使勞邊冠蓋旁午及嵗時燕犒蕃酋將佐皆在坐於堂者肩相摩立於庭者足相重庖厨吏舍馬羊之所養檐屬垣比殆不足稱連帥之居自文正公固欲闢大之至丞相增葺殆半而未備獨韓康公嘗建鼓門為閎壯餘或傾側朽腐矣公曰居室苟美謂施諸家也至官府所以臨人聽治布禮而出威者雖一邑必飾况連帥治哉乃度荒閒地徙饎㸑欄廄而逺之踰月而公堂成明年春儀門成夏視事之堂成周廊廣除博大而沈深蕃酋將佐若兵民之來執事聽命者知連帥之尊禮行而威申不待聞其號令見其指麾而其精神氣象已足以折衝而禦侮矣又明年春乃以其餘力築東北隅作堂以燕休而屬補之記其營造之意名堂而榜之補之嘗論公之父子兄弟其謨謀才業固足以相望於前後矣而其一時措置務以便事豈能必同而慶人皆安之何哉竊以謂文正公當康定初元昊叛擾邊中國應敵無寧歲既城大順胡盧而役使其大族明珠滅臧等儲畜益充士可用故文正公欲遂弱賊更有遠略之意丞相當熙寧元豐中洮氓用師諸邊屢深入斥地矣重虛內事外則力不堪故丞相務鎮靜意不在逺略上既專以德懷四夷為長久慮如前詔書約束顧邊備不可徹得帥如龍圖公平居弟勸課撫循舉其廢事和輯其內外吏民若在守不在戰然敵至亦不敢侮樽俎談笑賔醉而樂徹人或不見其有所遣已而成功如此然後可以待機㑹制倉卒是公父子兄弟所以措置雖各因時有緩急不能無異而慶人享其利則同其皆安之豈不以此哉㫺蘇綽嘗有所施設以便一時曰此猶張弓也後之君子誰能弛之至子威因罷綽所為而後世善其能成父之志若趙括非不能讀書而至於臨事不知合變則奢雖不能難亦終不能善也至於居處土木之美陋雖非事之所損益而勢有所不得儉前人豈皆以為可忽而不為顧不暇耳􅒘是以觀公之規模固甚逺當其閒暇充足獨彊本治內至於府庫倉廪無不飾以威屬城而視遠人蓋有深意豈易量哉匹夫而自為謀養其力以有為一家而自為計愛其財以有用如李牧之為趙守優游閒暇市租以入幕府為士卒費日椎牛釃酒欲戰不許敵至則入收保固為勇不為怯也㫺江漢之詩言宣王以文武之命召公者命其孫虎而虎能似之其詩曰王命召虎來甸來宣文武受命召公維翰虎拜稽首對揚王休作召公􅊲天子萬夀古之人君能用其功臣之世以有為而其臣能不愧其先人之功報上之意者如此故江漢之詩美焉嘗試以江漢名堂敘公為政本末而刻之元祐三年九月二十三日宣德郎祕書省正字巨野朝補之記照碧堂記去都而東順流千里皆桑麻平野無山林登覽之勝然放舟通津門不再宿至於宋其城郭闤閈人民之庶百貨旁午以視他州則浩穰亦都也而道都來者則固已曠然見其為寬閒之土而樂之豈特人情倦覿於其所已饜而欣得於其所未足將朝夕從事於塵埃車馬之間日􅉴而食夜分而息若有驅之急不得縱而與之偕者故雖平時意有所樂而不暇思及其脫然去之也亦不必山林逺絶之地要小休而暫適則人意物境本暇而不遽蓋向之所樂而不暇思者不與之期一朝而自復其理固然此照碧堂之所以為勝也宋為本朝始基之地自景德三年詔即府為南都而雙門直别宫故經衢之左為留守廨面城背市前無所逹而後與民語接城南有湖五里前此作堂城上以臨之嵗久且圮而今龍圖閣學士南豐曾公之以待制留守也始新而大之蓋成於元祐六年九月癸卯橫七楹深五丈髙可建旄自東諸侯之宅無若此尤者先是南都嵗賜官僚賔客費為錢七千緡公奉巳約亦不以是侈厨傳故能有餘積以營斯堂屹然如跳出堞上而民不知可以放懷髙蹈寓目而皆適其南汴渠起魏迄楚長堤迤靡帆檣隱見隋帝之所以流連忘返也其西商丘祠陶唐氏以為火正曰閼伯者之所以有功而食其墟也其東雙廟唐張巡許逺捍城以死而南霽雲之所以馳乞救於賀蘭之塗也而獨梁故苑復道屬之平臺三十里者名在而跡莫尋雖隋之彊亦其所穿渠在耳豈汰靡者易熄而勳名忠義則愈逺而彌存不可誣哉初補之以挍理佐淮南從公宴湖上後謫官於宋登堂必慨然懷公拊檻極目天垂野盡意若遐騖太空者花明草薰百物媚嫵湖光瀰漫飛射堂棟長夏畏日坐見風雨自堤而來水波紛紜柳搖而荷靡鷗鳥盡儛客顧而嬉翛然不能去蓋不獨道都來者以為勝雖饜於吳楚登覽之樂者度淮而北則不復有至此亦躊躇相羊而喜矣夫人之感於物者同而所以感者異斯須之頃為之易意樂未已也哀又從之故景公美齊而隨以雪涕傳亦曰登髙逺望使人心悴然㫺之豪傑憤悱憂世之士或出於此若羊祜太息峴山之巔祜固可人其志有在未可但言哀樂之復也公與補之俱起廢而公為太史氏補之亦備史官間相與語斯堂屬補之記之已而公再守南都補之守河中書來及焉補之嘗論㫺人所館有一日必葺去之如始至者有不掃一室者夫一日必葺以為不茍於其細則將推之矣不掃一室以為有志於其大則不可必卒之其成功有命則婼與蕃之賢於此乎未辨乃公之意則曰吾何有於是從吾所好而巳矣二纍之上也公名肇字子開文學德行事君行巳為後來矜式其出處在古人中其欲有為在天下後世其卷而施之一邦不以自少而以自得又樂與人同者如此堂不足道也建中靖國元年十二月戊戌記濟北朝先生雞肋集卷第二十九
