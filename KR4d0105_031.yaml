body:
  text: 第三十一卷記新城遊北山記睡鄉閣記潛齋記歸來子名緍城所居記積善堂記永感堂記宋故尚書刑部郎中知越州軍州事贈特進吏部尚書南安朝公改葬記中大夫提舉南京鴻慶宫李公生祠記濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第三十一記新城遊北山記去新城之北三十里山漸深草木泉石漸幽初猶騎行石齒間旁皆大松曲者如蓋直者如幢立者如人卧者如虯松下草間有泉沮洳伏見墯石井鏘然而鳴松間藤數十尺蜿蜒如大蚖其上有鳥黑如鴝鵒赤冠長喙俯而啄磔然有聲稍西一峯髙絶有蹊介然僅可步繫馬石觜相扶㩦而上篁篠仰不見日如四五里乃聞雞聲有僧布袍躡履來迎與之語􅌓而顧如麋鹿不可接頂有屋數十間曲折依崖壁為欄楯如蝸鼠繚繞乃得出門牖相值既坐山風颯然而至堂殿鈴鐸皆鳴二三子相顧而驚不知身之在何境也且草皆宿於時九月天髙露清山空月明仰視星斗皆光大如適在人上窗間竹數十竿相摩戞聲切切不已竹間海棕森然如鬼魅離立突鬢之狀二三子又相顧魄動而不得寐遲明皆去既還家數日猶恍惚若有遇因追記之後不復到然往往想見其事也睡鄉閣記睡鄉之境蓋與齊州接而齊州之民無知者其政甚淳其俗甚均其土平夷廣大無東西南北其人安恬舒適無疾痛札厲昏然不生七情茫然不交萬事蕩然不知天地日月不絲不榖佚臥而自足不舟不車極意而逺遊冬而絺夏而纊不知其反寒暑得而悲失而喜不知其反利害以謂凡其所自見者皆妄也昔黃帝聞而樂之間居齊心服形三月弗獲其治疲而睡蓋至鄉既寢厭其國之多事也召二臣而告之凡二十有八年而天下大治如睡鄉焉降及堯舜無為世以為睡鄉之俗也禹湯股無胈脛無毛剪爪為牲以救天災不暇與睡鄉往來武王始克商還周自夜不寢曰吾未定大業周公夜以繼日坐以待旦為王作禮樂伐鼓叩鍾雞人號于右則睡鄉之邊徼屢警矣其孫穆王慕黃帝之事因西方化人而神遊焉騰虛空乘雲霧卒莫覩所謂睡鄉也至孔子時有宰豫者亦竒其學而遊焉不得其塗大迷繆而返戰國秦漢之君悲秋傷生內窮於長夜之飲外纍於攻戰之具於是睡鄉始丘墟矣而蒙漆國吏莊周者知過之化為蝴蝶翩翩其間蒙人弗覺也其後山人處士之慕道者猶往往而至至則囂然樂而亡歸或以為之徒云嗟夫余也幼而行勤長而競時卒不能革豈不迂哉將因斯人之問津也故記之潛齋記潛室之廣無丈其髙如之背陽而面隂違溫而趨寒髙室雙翼外蔭老木翳其前小竹叢其右朦朧暗曖光景不曜蓋若蟄蟲伏獸之所潛焉而潛之名所為得也客過豫者曰方今主聖臣良政恬俗康朝有鵷鸞野無豺狼可謂有道之世矣吾子生二十長六尺出不能提桴鼓以動百萬之師左烏號之弓右昆吾之劎喑嗚吒叱北收祁連西虜靈夏入不能陪黃閣之末議聨紫微之别班正容端色以齊肅百吏操𥿄握管以號令四海今反幽幽默默逃形逺迹以頑處心以潛名室豈非所謂倒道而逆施者邪豫瞿然而驚舍然而笑曰有是哉主聖臣良此吾潛之所為甘乎分者也政恬俗康此吾潛之所為幸乎安也朝有鵷鸞野無豺狼此吾潛之所為有殆乎享也而反以是而疑我頑其亦未之思耶請為客言潛易曰雷在地中復此天地之潛也而陽氣巳動乎黃泉矣尺蠖之屈以求伸也龍蛇之蟄以存身也此蟲獸之潛也而小者獲信大者獲存矣故不能靜者不能動不能處者不能出然則奚行之倒而施之逆耶昔者回憲潛於道故暗然而日彰黃綺潛於聲故默然而浸揚潛乎潛將以為不潛者矣客俯而出因記其語於壁歸來子名緡城所居記少日讀書不升孔子之堂自夔咎繇而下若巫咸傅説則器不逮遭時有用庶幾學鄭子産晉叔向之為人尚恐其逺且一國佐不足用天下事君慕汲黯劉向而愧二子之直且博顧嘗好孫吳頗通其説用以為䇿悟非己志輒去之獨於文詞喜左丘明檀弓莊周屈原司馬遷相如枚乘若唐韓柳氏古樂府詩人之作時時發於事又拙不工晚得釋氏外生死説始盡屏舊習皇皇如堂室四達無所依方寸之地虛矣又不喜晉人初不知道徒窺其藩謂盡至清言誤世念身於古無一可數讀陶潛歸去來詞覺已不似而願師之買田故緡城自謂歸來子廬舍登覽遊息之地一户一牖皆欲致歸去來之意故頗托陶詞以名之為堂面園之草木曰松菊松菊猶存也為軒達其屏使虛以來風曰舒嘯登東皋以舒嘯也為亭廣其趾使庳以瞰池曰臨賦臨清流而賦詩也封土為臺架屋其顛若樓瞰百里曰遐觀穿室其腹若洞深五步曰流憩䇿扶老以流憩時矯首而遐觀也為庵抱陽而圓之以嬉晝倚南窗以寄傲也曰寄傲為庵負隂而方之以休夜鳥倦飛而知還也曰倦飛顧所居逺山水非柴桑比門直通道有長坂亘其前數十里故渠縈之蒲柳蓊然魚鳥之所聚有丘壑意俯而就其深為亭曰窈窕既窈窕以尋壑也跂而即其髙為亭曰﨑嶇亦﨑嶇而經丘也凡因其詞以名者九既榜而書之日往來其間則若淵明卧起與俱仰榜而味其詞則如與淵明晤語接躊躇自得無往而不歸來矣猶相觀左右意不自足懼失淵明一語也因喟然太息自幼壯至于白首勤苦蘄盡探聖賢之藴上則欲觀性而復其初次猶欲慕古人著之行事晚無一諧乃徒恐迷而忘歸又欲盡屏所習使空無有至為一淵明懼不足何哉學道者惡夸夸則不近且人才力有分以盡為人之所為而求有功則常不足以盡不為人之所為而要無事則常有餘夫知其無可奈何而安之若命若淵明其幾矣又陶之自敘云環堵蕭然不蔽風日短褐穿結簞瓢屢空晏如也忘懷得失以此自終淵明誠於此有餘裕今余居不至環堵衣不至穿結食不至屢空以若所養為淵明固易而余遭盛時嘗見識拔汙臺省國恩未報而決然去之以若所歉為淵明固難一以為淵明易則是余與淵明倨欲以此自終而豫難易乘除一以為淵明難則余於淵明得失亦未有辨也或曰淵明亦晉人抑知道者非耶而顧自以為其葛天氏之民與奈何曰嘗讀釋氏説譬如動目能搖湛水今余與子常動不足以觀湛彼淵明湛者類也嘗試與子去夫膠膠擾擾之蹊而處隂以休影若是者有年喉喘寧而顛汗止而后相與求淵明於葛天氏之國洸然見其塗巷乃余與子昔所嘗歷而去之久者乃今來歸而后淵明可侣其知道與否可得而議也積善堂記積善之家必有餘慶孔子贊易之言也而朝氏得以名其堂何耶惟宋八世道隆而治洽皇帝以聖孝既右烈􅊲亦以教民孝詔嵗丁亥為大觀元年因大赦天下民百嵗男子官婦人封仕而父母年九十官封如民百嵗於是故漳州軍事判官朝公諱仲康之母夫人黃氏年九十一矣其第四子仲詢與其兄仲謀喜而議以仲詢走京師狀其事省中為漳州請漳州雖沒赦令初不異往者於是丞相以為可而上之制曰黃氏藴仁積善享有耄齡可壽光縣太君其子榮君之錫而慶其親之享斯榮也以少牢告禰廟且告漳州又告其祖如禰廟禮又周示其族人鄉黨作堂以奉夫人而名之曰積善退飮酒相賀為歌詩以敡訓詞以昭夫人之淑愼以慰其心而介期頤謂補之曰吾君盛德在書所謂斂時五福用敷錫厥庶民者其賚及我家爾頃為春官屬列太史氏此國之昭典盛事家之餘慶爾職書之補之曰諾禮祝則名君為神厭也父前子名君前臣名為尊厭也自夫人言之皆子而下若載事法皆名昔晉欒書實針之父針為右書以將越載君針曰書退針名父不悖禮猶在益恭之列非車上儛之類請以諭不知者而後書惟􅏯氏自漢大夫以忠探七國之禍本而撥之以安劉氏劉氏無遺禍享國四百年而大夫不終漢祿以身膏東市奉祀無聞焉又千有一百餘年而文元公起家仁義忠信樂善不倦蓋具於天爵實兄弟三人伯刑部侍郎補之髙祖也叔吏部尚書夫人舅也皆中和孝弟慈惠而愛人用鍾其慶六世子孫男女嬪婦至口五百而夫人為子婦今存屬最尊又獨享是夀祿康寧恱豫􅏯氏之積善皆歸焉抑朝氏自文莊公秉政勳業在王室逮今六十餘年而仕益微似不可振而夫人之仁善於是獨報將其子誠孝幹母之蠱神實祐之亦夫人少囏約晚乃儲此如訓詞旨蓋六世口五百未有及者雖來者未可知抑鮮矣豈造物者報其人雖如易語積善必有餘慶而享斯報者亦必如夫人淑慎身所自履有以致之耶然朝氏為善者亦多矣或不享又何也不然吾宗之餘慶久躓且復起將自夫人啓之夫人既屬尊嵗時集會子孫族人螽斯雁行官學者冠者提者抱者少長咸在而補之乃於夫人為族曾孫年五十五矣獨素髮垂領搢笏跪起以夀夫人於羣從之後蓋世之老人見曽孫尚多有之如夫人見曾孫數十其長者已白首又自有孫在昔良少於是具載本末以為世積善者之勸云永感堂記東平董耘武子年少以孝聞既葬其親天堂山之下而築堂其北以享以居而榜之曰永感書來求文曰非以記室宇之陋也以極耘不孝之思也某泫然曰某少孤不夭中年太夫人棄養愛生不能死以皇皇就食于四方逺者十年近者四三年乃一歸手拔墓上草則泚吾顙我尚忍記吾武子斯堂也哉天下莫悲於言言莫悲于音若曰孤子之鉤以為隱九寡之珥以為的則音無此最悲也夫隱鉤珥奚取於為音緣名而益悲則武子之名斯堂其意悲矣天下豈有無親之子哉捨所厚而從其薄或宦學逺鄉里無朝夕養死且不葬聞斯堂之名則怛然內熱如吾泚者多矣而武子不泚是乃武子之所為以孝聞者也閔子騫人不間於其父母昆弟之言孔子曰孝哉閔子騫宰我曰鑽燧改火期可已矣孔子曰豫之不仁也充武子之志則雖未敢曰方孝於子騫而尚足以愧不仁之宰豫豈但泚夫如吾泚者而已哉是乃武子之所為以孝聞者也人亦有言忠孝不兩立王尊叱其馭於九折坂曰王陽為孝子王尊為忠臣士亦以是藉其口損其親從利而不顧然有王尊之志則可不然食人之食以老無補而靦其面於人間託移孝以自恕騖歧道而亡羊聞斯人之風其亦庶幾乎有慙而復也哉年月日巨野朝補之無咎記宋尚書刑部郎中知越州軍州事贈特進吏部尚書南安朝公改葬記贈特進吏部尚書朝公以慶曆四年九月己酉既葬於祥符大墓矣後六十六年實大觀四年三月壬寅改窆于任城魚山先是祥符地卑多水患自特進公五子伯庫部公而下雜然以為慮而叔虞部公尤患之議遷不果至是特進公子皆前沒而虞部公之子泰寧軍節度推官前知莘縣事端禮朝散郎前通判徐州事端智相與議必成其先志以告羣從諸孫及庫部公之孫補之等曰祥符水患諸子之責猶諸孫之責也且特進公之子庫部公而下皆葬魚山遷魚山宜抑族墳墓以安神則從以蒸嘗合食則類又宜衆曰唯於時諸孫存者莘縣為長莘縣乃走京師告特進公墓並舉河間縣太君劉氏之柩護奉以歸啓窆易槨改禭惟美凡資用皆莘縣力也初補之居蓬萊縣太君喪始學地理行視魚山崦中若虎若牛回抱踞盼勢盤薄可喜乃厚其賈取之手植四松定南北既命師袁才筮地袁徙其域稍東才五尺而止前十丙室遷庫部公與夫人之柩至是以特進公劉夫人宅丙室而將以壬甲二室遷庫部公與補之􅊲朝議公以從特進公兆焉既即事又屬補之記本末而特進公氏諱爵里行事之實巳載端明殿學士李淑所撰志銘中不復書獨記改卜及所告祭文並納壙中若庫部公諸弟子孫婚宦則各具於銘志皆不復出云曾孫朝散大夫管句南京鴻慶宮飛騎尉賜緋魚袋補之謹記中大夫提舉南京鴻慶宮李公生祠記中大夫提舉南京鴻慶宮隴西郡開國李侯棻少以文詞及進士第所居官官治燁然有聲於搢紳間公卿大臣若當塗之顯人言其才可用者以百數而侯於蒞官務盡其心力蓋慕昔人奉法循理不肯少如玉多如石者故人不得而置親踈世亦不得盡其材而侯亦超然自得於二纍之上守其操不改外若不足而中無愧焉者也尤長於治郡有遺愛於同華商邠四州而蒲又侯之里也故士以其老成為矜式民懷其舊以謂知吾俗而不忤吾安其治而不忘者莫如侯乃相與謀其子弟若邦人之樂善好誼者為侯立生祠會補之自尚書郎出守蒲下車拜侯於里中問民所疾苦求施設之方且誦秦穆公求黃髮則無過之言以為請而侯亦欣然傾蓋俉語與之忘年又因以教邦人諸生悌長而貴老此守之事補之之志也或曰以侯之才雖官視九卿年耋耄以康寧而食飲猶為不遇補之曰士有志遇不遇有命若常情言者仕而不至將相皆不遇也以義則一官而可以行志皆遇也龔遂黃霸郡守也而尊魯恭卓茂縣令也而貴其同時公相位四人上者豈皆傳然則貴且尊果不在爵遇不遇惟其所施屈吾指以數往行而吾無愧焉者則吾之遇不既有餘矣乎嘗試過侯之居升髙以望其前則太華削成四方矗然倚立而參天右則黃河出於龍門洶乎跆蹙而鳴地南則首陽危顛不毛伯夷叔齊之所登也東則王官深谷絶迹司空圖之所藏也因顧侯而語想見古昔之盛夸奪相雄間不容息與二三君子之遁逃一世寂寥長往雖勢相什伯皆忽然而過如吹劒一吷何有得失而侯乃以少壯陳力有政四州老乃休此固異於斯人者兒童流輩如風中燭而侯獨白首笑傲康寧食飲如平時有何不足而慕夫世之役役生趨榮而沒有恨者以為愧哉因舉酒而起為侯夀曰樂哉非不遇也崇寧元年九月旦日記濟北朝先生雞肋集卷第三十一
