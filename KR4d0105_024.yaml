body:
  text: 第二十四卷書上皇帝北事書濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第二十四上皇帝論北事書臣朝補之謹齋戒擇日昧死上書皇帝陛下臣窮年抱經志願局促緑衣紵絮多學無益竊甘野人自曝之溫輒昧廣厦重裘之燠退無尸祝尊俎之位進干庖人操刀之職不計僭越冒言天下之事陛下赦其狂瞽而矜其市井草莽有介然之心一賜察省天下幸甚天下之治莫大於制禮作樂而臣之愚以謂二事有在於施設之後者其所先舉者以定天下晏然則禮不制而備樂不作而洽凡此所缺特北胡一事而已臣􅋠之至深以謂陛下神道設教紀綱既正天下大定燕居而高拱百工安職四民樂業矣而不能無一朝之事或經聖慮者庶幾在此乃臣之狂瞽而深􅋠所至有取萬一則臣區區窮年抱經志願局促猶不為緑衣紵絮多學無益夫豈惟天下幸甚臣之師教臣亦若此也北胡猖狂敢冒故疆使天下百年有為兵不得藏今四野肅淸邊不告遽而縉紳先生四方寒士或北首憤悱爭道利害者非願於太平無為之時生事覓功特以中國之地前王之舊有未復而已獻言陳計者踵相接於國陛下優而容之如假種借耕久貸不償亦不以券責豈非周愼再􅋠萬舉萬全以謂將欲取之必固豫之不欲以所重試所輕哉內治未具不遑外憂心腹既寧手足當治以今凖昔莫利此時置而不念何以異夫宿雨拗池科斗所泳不以時去設不害事而蛙黽日暄乃臣之所願為陛下深􅋠者特曰以中國之師責中國之地得地而師解不為無名如此而已陛下知兵之道愈於黃帝復古之功過於宣王披圖在目長想遠慮則窮髮龍堆螻蟻藏情不待前箸而臣私憂過計竊不自揆忘己之愚不敢膠柱鼓瑟御馬以書陛下一發天光使得竭忠則言而有罪非臣所敢避也夫北胡之盛莫盛漢唐而所以制胡亦漢唐為得三王以前事則經見戰國之際人自為防遍舉悉數則孰與四庫之書終始為備百執之謀同異致詳故臣輒皆置而不論論漢唐之所以制其強者其強可制則方其弱時不論可知漢病胸奴唐病突厥至於畿內鳴鏑渭橋按轡後宫辱於氊裘宗室降於絶域其形如此之逼也然而列五單于滅兩突厥擒回紇制延陀漠南塞北皆漢之賦盧龍松漠皆唐之府臣深思至此然後知北胡之盛雖莫盛漢唐而所以制胡亦漢唐為得也冒頓烏維力足以弊漢而武帝雄才數戰不倦胸奴絶幕自以漢不能至而漢率二三歲一出或二千里不見一人故胸奴至於孕重墮殰罷極苦之夫搏鼠當庭善遁易失灌垣熏穴則生無聊賴故欲戰在我則不欲戰在敵此其情自昔然也頡利突利進如飈風而太宗知兵善戰虜在其術中而不悟兩陳馳語二主坐㩦六騎臨水羣酋奪魄靈朔之境曰我將滅之命有司更所與書為詔若敕􅋠摩孱懦至感恩流涕願為一犬守吠北門蓋五十年無突厥患臣嘗壯二主以謂得一時之權置三王之事則漢唐之事猶在中䇿何遽無䇿乎今臣又計之耶律雖桀驁其強亦未有以過胸奴突厥者陛下神武不殺高越前世制之得術可使繞指惟上之命何至越百餘年而不暇營哉臣請為陛下言契丹可取之形五古者北胡無大君長種落部族不相統攝捽搏鬭擊強者為制往往而聚者百有餘戎勝不相推敗不相愛尺地一民不自保而有也無城郭邑居故其民遷徙難制無耕田作業故其人食足不勞無文書約束故其人一而易使無營陳行伍故其人戰自趍利彼以其智力之全不治四者而一之於鞍馬射獵中國亦以其智力雜治四者日夜不息而以應戎狄之至間故其自視常以無法勝中國利則烏合譟而從人不利則雲散四去欲追無所自冒頓盡有北垂之地胡人始不安其舊而有侈心尺地一民皆欲保而有之不能去也其後衛律教單于穿井築城治樓以藏粟或者以謂胡不能守降及唐世尤以合中國之好為重至佩印綬服爵命廢一置一皆決於朝廷亡虜之在中國者或樂而忘歸胡人自是益雜中國之俗乃臣以今料之則盧龍范陽中國故地又非特如此而已城郭邑居耕田作業文書約束營陳行伍四者皆因漢俗而胡無一焉雜處而交治欲其胥而胡不知強勉之難堪此其可取之形一也冒頓烏維伊種皆席胸奴之始強能以其力為中國患武帝中年力盡於北胡而朔方之患無歲無之然胸奴卒不能踰塞而南以有漢尺寸之地而陰山草木茂盛單于之所依阻者漢輒奪焉胸奴失陰山之後過之未嘗不哭也頡利突利延陀之兵皆號精悍數入冦唐一旦至渭上薄畿內唐亦以其南征北伐之餘力完不弊日削月剝至奪之地而􅘗都護府不敢輒怨蓋未有坦然肆志窟宅中國之地藏獲諸夏之民如耶律之侈者臣嘗計之其君亦非有冒頓頡利等輩沈毅雄勇之姿阿保謹特有天命而德光之暴以謂晉之立自我晉亦不勝其德而屈之驕子不制日益侈大割地弗厭至踐中國此如黔中之驢土所不産方其一鳴虎為遠遁而其技止此亦足悲也夫人之情勝則驕驕則不自強乘秋未霜則水濱之腐草猶足以爭明於陰夜天寒既至萬物將肅則莫或使之一夕而零其理然也璟與明與賢皆柔懦不事事隆緒稱多謀不能復振焉宗真好樂兩母爭權至內相殘當是時皆有可乘之隙而中國不取迄於今四十年彼其君苟非有過人之才臣知今日之治與璟明宗真未大異也夫知敵之主知敵之將則每戰不殆彼曲我直我整彼亂此其可取之形二也石氏之割地當其需人之力制命在外無以異於晉惠公河外之列城買人而巳無積仁纍義之資一朝而有天下舉天下之大偲偲然常恐其不能守何暇重割地哉窮室之人驟獲千金不能經營販夫孺子皆得以起而制其弊富家巨室力足以仁其四鄰則四鄰之外所衣食者猶我有也尚誰得而嗇之哉石氏既亡京師不守中國為之一虛當時人君內憂其腹心外病其四鄰中國狼顧自救之不暇故胡人得以竊計其不及圖已而跳踉虛喝求以堅中國不動之心至於柴周天下小定以其享國之日淺乃能用一朝之議一戰而勝以復三關由是言之胡雖強中國雖積衰之緒猶足以勝之况治朝哉律耶明時胡已浸盛柴周之取三關蓋人有告之者曰此本漢地何惜之有然則彼其平居驁然不顧跳踉虛喝豈固敢吝其非已有之分為所常守之資哉求以堅中國不動之心而已今國家百年太平而陛下神武不殺高越前古心有所懷威動萬里柴周叔世臣豈敢議然以今天下言之運偶聖人時在千一富萬柴周力萬柴周將賢則萬柴周士勇則萬柴周斷而必行鬼神且避以懾小寇勢易破竹此其可取之形三也太祖龍興不折一矢不馳一馬而有天下天下稽顙而稱臣五國委命而下吏夏商之興莫若此之捷也當是時舉中國之兵十二萬而已太宗皇帝繼以神武之資經營四方至于大定並汾之討師久於外雖迄奏功然倉廩之羡士卒之鋭殫憊於河東太宗為社稷長慮慨然太息有恢復心士不弛弓馬不解勒倍道兼行越數百里一日出塞金鼓之聲如在天上虜不素備而燕城遂圍分軍收城所向輒靡天下以謂遂無胡矣幽燕之人老弱登埤而望乘輿無意復戰虜之計自謂力不足抗乃為先聲張言兵至號五十萬太宗重愛民命不肯以力服虜欲退修德以懷之而師久翺翔士馬南首亦有怠意幾舉而捨燕既釋圍而諸將所下輒復為胡蓋臣聞之城中有謀執其帥而降者王師既還莫不泣下雖然胡人自是始有疑中國之心四方已定中國厭兵景德之役乘中國不虞大舉來寇章聖北巡天意助順彍弩竊發遂隕達覽虜相顧自失屈首請命亦無復鬭志當時之議以謂乘勝席卷兩翼遮前大軍從後可使無遺噍而天子嘉其既服亦棄不戮虜始痛自懲艾以謂中國不可得而侮也夫太宗以收並汾之餘力計議無素倉卒北狩然而一舉幾復章聖以寇出不虞至犯輔郡出師逆擊然而一戰遂却况今陛下席祖宗積纍之舊虜不加強而中國之盛則倍前日肉食之謀芻蕘之言垂數十年已審已備計成而動何慮不獲此其可取之形四也太祖神武有希世之謀御將訓兵臨機料敵出人意表舉天下之衆宰制役使如視嬰兒嘗謂胡人之衆不過二十萬吾以十縑購一胡二百萬縑足矣以太祖神武左右之將不減衛霍滅越滅吳滅江南滅蜀滅河東天下已安四方之金帛充於內府士卒平居無事奕博超距志意無所騁當是時中國特不舉設有為虜孰能禦之者天下百年無水旱兵革法度致修人物阜安以三十年之通制國用山積水委漢唐所無則成太祖之志臣以謂固在於今日陛下建學設科使為士者知兵頒教立法使為兵者知戰十有餘年墯慢疲軟之氣既復拯矣而堅甲利兵羡於四邊偏州小戍不移而具臣竊以北道三數者言之通都要路一庫之藏足以衣被十萬况濟之以大司馬之備也驃騎西征艑師南略河隍六城交州九郡歸命內附而飛挽之煩不及於邊民此其美古未有也舉事動衆宜百日之費者今千日之費不憂乏宜百金之賞者今千金之賞不憂匱蓋非徒以厚費重賞為得也要以為前世之所不為者知今日之能為之而已順流建瓴如風靡草以臨不加強之虜此其可取之形五也兵法曰形兵之極陛下亦既知形則不圖而何待臣請為陛下言所以入胡之䇿夫欲興大事所病者兵不衆食不充天下之言者必曰舉二十萬衆度百日糧鳴鼓而攻之以臨不加強之虜如孟賁之戰嬰兒何往而不可入而臣獨計以謂非勝之難所以入虜者實難以樊噲之驍悍自意得十萬之衆足以橫行於胸奴而或者曰樊噲可斬夫使好奇之人不度是非不量利害高論而慷慨其言固甚可喜然空語無施於實事則陛下尚誰取之今臣則不然舉二十萬衆度百日糧非三年經營之不可借使以國家之盛一朝而可集銜枚縛馬口千里奄至雖計甚祕而人固有知之者矣綿十許州塘水之浸以彼入非易故我入亦難阻塞而陳燕亦起而拒白溝之南兵雖衆食雖充非勝不能入也臣請為陛下效臣之狂計蓋昔者尉陀畔越漢兵出豫章出會稽而唐蒙獨上書發巴蜀罪人下牂柯以出越人不意卒擒尉陀蜀薑維拒劒閣鄧艾乃潛自隂平馳無人之地七百里卒降劉禪兩人者若挍之以事而索其情則皆近乎不知迂直之計而臣則以謂論越與蜀者不如是則不可得而入今虜之勢亦何以異此臣請先為樓船百艘精甲萬人浮膠東待渤海而勿發使大軍出次於王畿聲言以十萬出瓦橋瓦橋敵所備出亦此入亦此在兵法則所謂以正合者也潛軍其東以五萬則自滄趨平州同時而偕發潛軍其西以五萬則自代趨雲州同時而偕發平雲非敵之所素備則滄代之兵宜易入兩翼偕縱則燕之東西可擾矣東軍入平州戰且誘以稍西行附於瓦橋之大軍西軍入雲州戰且略翺翔乎蔚朔之間而東以牽制敵勢敵必分軍以禦雲州然後瓦橋之大軍與東軍合勢而偕入則涿州新城不戰而可收東軍既棄平州平州備少懈然後渤海之精甲可以乘間入平州平州下則營並舉矣乃間使渤海之師通高麗曰中國責故地高麗宜以爾兵從而析渤海之精甲三千背道絶險以徑中京之南繚古北之後奪關而守之謹守勿戰虜狼顧自救然後雲州之西軍鼓而東以取易州而與大軍合吾兵益張乃稍乘勝逐北則燕城可圍矣度燕城之大二十七里而止一人而守地六尺三圍之則滿卒三萬守地無餘以二十萬衆頓燕南攻而圍之若適三萬則是野戰以拒虜之大軍者猶十七萬也度虜之大軍亦不過二十萬盡燕城之大而以五萬人實之不能容矣虜之名統軍在燕城者其所護契丹奚渤海兵馬數才滿三萬而其曰侍衛在燕城者騎一萬步一萬而止借使臣所聞未實虜能益之度燕城之大不過容五萬則既勃蹊矣而大軍相持傖囊未決其勢不相救以三萬鋭師濟以臨衝雲梯之械并力而急攻間使張良陳平不愛千金從反間以啖城中臣虜之子孫能以禍福喻其衆使內附者許以封侯萬户之賞彼其在虜或身居將相而服衣食飲不免於輿皂之賤一聞德音宜有發憤內應如望并汾之師者一人有心則舉燕城之內其勢搖矣燕城可圖則山前後之地雖未盡復可徐致也臣又率臣之意料之使虜能出上䇿中國之師始動虜無空國逆戰亦以二十萬拒大軍而更練奇兵間道它徑反乘我隙我大軍遠戍深討而虜兵出於不意釋燕而自圖則前功一發而盡廢欲勿釋耶而自治未可安能治人然而舉塞上十許州言之大軍出瓦橋矣又五萬出滄五萬出代虜亦以其軍三析之而應我滄翼其右而霸與信安保定介其間使堅壁勿戰則虜雖出奇兵亦必不能入霸入信安入保定代翼其左而保與廣信安肅介其間使堅壁勿戰則虜雖能出奇兵亦必不能入保入廣信入安肅何則吾為之守者素也置是數者自渤海之東言之操舟於水固非虜之所宜便而其所不當忽萬一可虞意者其西北之疆乎昔唐安祿山以范陽亂稱兵道胡中犯京兆不期月耳臣嘗考之圖志則祿山所行自燕而西其迹具存不可不察也國家方恢復河湟全秦之力河湟之所仰或者􅋠患而豫防之益全秦之地以待虜之出於不意如此而已臣又率臣之意料之今單于之才不聞其沈毅雄勇敢為難制如冒頓烏維頡利突利等輩比者其左右賢王谷蠡亦非有如張説所稱闕特勒暾欲谷之徒超卓過人之才帖帖然慕中國學文字工語言是口尚乳臭安知出上䇿哉虜計出於數者而皆不能遂則臣之所料不過舉國興師烏合蟻聚而已使虜先能扼古北口而守之渤海之舟師無以伺其利則我東軍扼彌老符家私亭口之右以西軍扼挑峪紫荆金坡口之左使其東西不能出奇而後大軍鼓行而陳以挑其南虜進不能拒退無所逃不力戰求勝則必有內顧自保之心此在兵法所謂窮寇臣請勿薄勿逼緩而持之置曹王居庸等關而無奪以開其生路我亦視白溝之南塘水之浸所從歸者狹何以異於淮陰泜水之傳餐東西與北三面薄阻而背阻塘水則士卒無所往其心宜固當是時陛下得人如韓信使乘其會則攘而扼之於井陘莫利乎此顧為陛下將者如何耳臨衝雲梯器械致修士力致完以中國之善攻而加不能善守之虜則二十七里之城而已何為而不下燕城下空其積以賞戰士以臣度之三年可以無飛挽自京東西與河朔之列郡更輦緡榖以實之臨以重臣列亭障於外燕可守也陛下以河湟六城之富孰與全燕河湟遼遠城中素空匱中國且能保而實之則全燕之富其易守可知也惟其城郭邑居耕田作業文書約束營陳行伍無一不出中國之舊今以中國之法守之其民宜易安燕城既守則凡石氏之故地猶不盡舉者未之有也雖然臣猶有説者則在乎先勝而後戰夫入人之地欲其不迷不可以不知地索人之情欲其不匿不可以不明間地可知間可明而軍無選鋒則兵不可以交有選鋒而不較長短不合外助則雖多猶寡也臣請為陛下言所以必勝之道陛下誠得數十將用之則何患夫四五者為今之慮士已知兵兵巳知戰而臣獨過計以謂今選於班列以將名官者患未試而巳夫將欲興大事不可以無重臣重臣君所信功業已試可使士卒素附可使四夷知畏可使位重德亦重可使權重威亦重可使舉一軍二十萬之衆而重臣得其人軍之命定矣千夫長萬夫長才各不同則舉二十萬之軍大吏偏裨二百人而後可也夫安能皆得重臣者而使之將委之有司之選耶則天下必有蕭何之至明然後可以知韓信之未試不然則趙括之易言不窮天下幾何其不以言而信之人之才有不能治一妻一妾者有不能耘三畞之宅者持籌挾算擐甲百萬守地千里翛然不勞乎其間忘昔之短也平居自喜袒裼而按劒志如飄風而聞金鼓之聲失氣而死此人之情也然則將其可以不試哉天下之言兵曰微妙者祖孫吳然臣以謂是何以異於宋人之遺券密數其齒而曰吾富可待豈不誤哉陛下知人能哲興大事選大將帥既已得其人矣凡此臣不敢議然臣以謂舉二十萬衆而為之吏者二百人所試者在此而已子文之治兵終朝而罷不戮一人子玉之治兵終日而罷鞭七人貫三人耳然而君子與子文李廣之行軍逐水草不擊刁斗程不識之行軍嚴斥候擊刁斗自衛然而士卒樂李廣將之才固不可而一也孫武之試於吳也以婦人孫臏之試於齊也以上中下馬用之於婦人用之於馳馬非將之常也兩人者唯其無所不可用以成功故卒之武能將吳以入郢臏能將齊以却魏豈不用其試哉驪山之閲天下擐戎服以令賢如郭元振幾以失軍容而誅而薛訥解琬乃獨有不動之軍教使然也今天下之吏以將名官握兵柄習軍事者環列於輔郡逮數十人平居無事大車駟馬洋洋乎國中與之言兵而不能者幾人若此臣豈敢以為遂乏才哉凡所以必待試而後可用者特不敢以能之於平居無事而信其用之於倉卒擾攘也陛下知人則哲能官人用人之仁去其貪用人之勇去其暴用人之智去其詐皆得其所以用則向之四王者凡可以委之夫將而已以二十萬之軍度百日而後罷厮役在焉人日糒二升則率兩日而食非萬石不可百日則百萬千日則千萬邊儲不足以給則不可不權而入之於民今天下之買爵者緡錢五千高得一尉下乃助教極矣為之説者曰商賈之子孫不可以揭而加之於民上此為説者之過也天下無賴之民遊守不業計窮力盡者皆起而為兵能犯矢石致頭首有一日之勞則紆朱懷金美爵厚廩往往而加之民上者皆是也何獨至於民而疑之天下之民不幸而陷于盜賊白日殺人而奪之財亦可棄矣甚者竄山林晨夜聚嘯州里為之搖動其中有一人焉造利而自言則賞千金而命之官未始疑也則夫商賈之子孫雖其類則賤矧未至於盜賊哉臣請為賣爵如漢故事惟勿為郎而已其餘皆可易之以它秩得比朝籍與京師官率能入粟於邊滿三萬石者為之等級以授事定而止不過假百人粟可充也昔武帝用朝錯議卒弱胸奴乃臣區區意竊在此陛下幸聽焉則其詳有司可得而講也何謂之地夫四夷之與中國其土地風俗剛柔險易之不同猶之城市之與山林並得其宜各便其欲未嘗同也百蠻之地皆阻山負海遠者去王畿數千里一隅有故不得已而應就其近者調之則兵少不足以用欲置大軍則病道里之遼首尾衡決倉卒不救設或遂能致之其土地風俗皆非國之所習知萃百萬之衆而頓絶徼之下欲深入不可欲致敵不能譬之逐兔叢林遇穴而失則良鷙逸足猶翺翔傍徨雖巧而無所效其理然也東南西南羣夷皆絶遠致險論其近而與中國比者則莫若北胡古者北胡則本非與中國近且比也踰塞而北至於寒露遠野人迹所不至者乃稍稍屯聚蓋李牧破林胡雖斥地千里而胡不能吝自漢至唐迄於五代始侵尋曼衍􅎊有中國之地自王畿而言則白溝之南千里而近耳置驛十數則舉朔漠之事十日而傳之可聞城郭邑居漢也耕田作業漢也文書約束漢也營陳行伍漢也舉山前後之地而言之無為而非漢者臣嘗披圖而觀起白溝趍燕城二百里而止居庸曹王大安黍谷崆洞之山環抱如箕而燕城峙其中自白溝而北衆山而南燕城之四隅在箕中者其地如掌由燕城之三隅東西與北衆山之塞川關要害遠者不過四百里近乃二百里而止山非不可陟也水非不可涉也土地風氣水泉百物之産又非中國之所不習也徒可徒騎可騎車可車何動而不可圖正可正奇可奇伏可伏何動而不如欲顧為陛下將者如何耳何謂明間夫書生之論以謂仁義之兵無術而自勝此臣讀孫子至所謂賞莫厚於間事莫密於間非聖智不能用間非仁義不能使間非微妙不能得間之實臣始不信今乃知之夫使仁義之兵無術而自勝則敵衆我寡亦勝敵強我弱亦勝敵實我虛亦勝敵逸我勞亦勝敵有備我無備亦勝而聖人者何事乎教民七年而後即戎而其曰不教民戰是謂棄之者又何用也夫仁義王者所以無敵於天下不得已而去焉兵可去而去仁義則不安至於不得已而用兵仁義非可忘而所謂權焉者蓋聖人亦多有之而未嘗去也孫武無王佐之才而其言有用於王者之事間非平日之所宜先也故非聖智不能用非仁義不能使非微妙不能得其實如此而已聖君參之以獲夷狄之心賢將持之以制三軍之命士卒獲之以幸封侯之賞夷狄取之則四境不能以是一日而安其理然也秦得由余而八國賓燕入秦關而東胡破漢厚閼氏而冒頓解唐語突利而頡利疑此中國之以間勝夷狄者也韓王信在胡而胸奴入太原盧綰居胡而胸奴入上谷中行説在胡而漢不得美幣市胸奴以至於唐突厥以萬榮侍子而寇瀛州回紇以僕固懷恩而入涇陽此夷狄之以間勝中國者也自昔兵家之用間者一勝一負不可得而數姑以中國夷狄之制勝負者言之在中國則夷狄憂在夷狄則中國病此其理易知而其事難成不可不察也今臣以北胡之勢言之山前後之民大槩皆思漢并汾之事王師在燕有謀執其帥而降者誠能得張良陳平不愛千金以致內應猶反掌耳唐周鼎失沙州州人胡服而臣虜歲時祀父母衣中國之服號慟而藏之河廣武梁故時城郭未隳龍支城耋老見唐使者拜且泣曰頃從軍沒於此朝廷尚念之乎臣讀史書至此則慨然知燕之地士大夫之子孫宜有發憤不辱飮氣南首而望王師者徒患無以發之耳以契丹之舊法言之其得漢人皆僕妾役之仕宦而顯者歸見其主如舊禮殺漢人而以牛馬償之弗誅也逮蕭氏乃始徙漢人益北居而以契丹奚渤海之民雜處幽薊殺漢人者如殺人之罪自以謂漢人之子孫可懷矣然臣度之燕之人皆謹厚朴茂世漢種也終不能胥而胡白溝新城崎立而相望漢之俗良美也不幸而子孫世世為虜痿人不忘起盲者不忘視勢不可矣天下誠不乏張良陳平之智不愛千金仗社稷之神靈所麾前移所指前死五間俱起莫知其道是謂神紀褁幽薊之城百日而平使彼粟實可因而食使彼粟虛可因而墟也地可知間可明夫然後合三軍之士而表其技且勇者此之謂選鋒越有君子五千人秦之鬭士倍於晉若此皆選鋒也凡兵尚義而保氣義之所勝愚可明氣之所加柔可強人之情非有鈍利之殊也顧上所以表之者何如而已一夫當死市袒裼而不呼則千人為之失色童子按劒而先登則七尺之丈夫全軀保妻子者猶為之却也然則人之情豈固難知也哉前有大壑臨之則魄墮而懼狼顧却踵則身在平地夫誰肯舉足而蹈其危使為士卒者知有死之榮無生之辱夫然後顧平地不為安蹈大壑不為懼則攻何患堅城戰何患堅陳哉吳起臨陳有一夫不勝其勇遽前取首而還吳起曰雖勇非吾法也斬之吐蕃逼奉天渾瑊進單騎馳之挾虜一將躍而出一軍皆譟臣以為若此者皆可賞勿誅而吳起反之此用兵之過也鋒可選然而不挍長短則臣以謂兵不可以交何則天下皆以北胡為善用兵而臣獨計胡非能出奇合變循環無窮也顧其長在騎射而巳自圖志言之多馬之地半出於胡而其能挽弓騎射蓋亦天性使然趙武靈王變服從胡騎射而􅒘是以取中山此其為䇿之得者非以其所長制其長哉冒頓控絃百萬白登之圍騂駹驪白各以其方之色自古以馬戰未有如此之盛者也漢武帝中年鋭意馬備阡陌之間盛或成羣比戰數勝胸奴罷極矣而其後亦以馬少不能復出則度漢之能以其長弊胸奴亦在騎不在徒明矣唐薛延陀不知以所長抗中國而自恃其數以徒勝執馬者既收而徒不能復為卒以取敗胡人自是益自知其短於徒而中國亦暴其所長而術制之比者朝廷置騎射又教民蕃馬意良而法美矣而或者民之馬雖蕃而未教故臣以謂置義勇置保甲則民馬皆可以假而習夫馬生其水土則人心可知然而教訓之不安以之當胡馬之新羈朝夕馳騁乎荆棘斥澤之地體安而心調者恐非敵也陛下誠用臣説則義勇保甲之籍於民者方其教時皆使之習騎騎不足則更借之乎民馬嘗入而藉諸官者番假之則民力不勞而馬不病不過三年天下皆可用之馬以是佐軍則漢之戰何以易此雖然猶有所需者則外助而已自昔為國未嘗不以夷狄制夷狄其説以謂海濱之蚌鷸兩自斃而後人能並得之胸奴方病漢而烏孫昆彌亦自以不得與中國通漢藉烏孫撫諸夷以孤胸奴之外援挍尉常惠護五將軍兵擊胡而昆彌常力戰為漢軍鋒所殺過當胸奴遂虛於是丁令攻其北烏桓入其東烏孫擊其西而胸奴析其兵支三敵國以南與漢爭一旦之命卒以困弱至于裂五單于昆彌與有助也臣嘗譬之鄉邑之小盜三人而為輩則百不得以力擒一人焉爭財而不平則二人者不制而自弊何則其素相知者審也陛下南面負扆冠帶而朝百夷四海之內八荒之外心有所懷唯上之所命乃者高麗折於胡不敢越遼而西以效其一日之力於中國陛下能撫之至絶海蹈越綿數千里而入貢闕廷陛下嘉納遣賜報聘增美於祖宗之禮臣聞之其國見使者至皆歡喜擁道自慶未始獲也彼其折於胡久矣宜有以逞其志如烏孫昆彌者而臣未敢言焉凡此數者陛下得一重臣而委之與在廷一二之士嘗得預聞腹心者皆可以使之雜而議然後臣之䇿庶幾乎可效也兵既定石氏之故地已復臣請謹封疆嚴斥候戒邊吏無得以非中國之地而利絲毫以為功且示聖人以天下為度而致誠信以結之虜雖失燕知其本中國之舊而不以為吝中國亦與之講好修聘歡猶昔時可使如伯氏之奪邑沒齒而無怨言此百世之計也臣身未嘗為吏則凡國中之議是非利害不知其果何從姑以臣深􅋠所得發於畎畝憤悱之忠而不能以自掩者獻之闕下陛下好問如虞舜亦幸擇焉韓愈曰凡此蔡功惟斷乃成故臣至此猶願致其愚者則曰必行而已以臣之幼而學壯而欲行之心而又幸出於聖人之世三代之時以戴非常之治沐無窮之休褒衣博帶學古人之事而名諸生之列每聞陛下德音雖在市井草莽欣喜自幸如第五倫其所願伸喙道説以求補於萬一者豈特此書之所敘而已然臣竊以謂禮樂為大而必其所先舉者已定天下晏然然後禮不制而備樂不作而洽區區之愚蓋在於此臣身賤迹外其學甚野輒敢不避鈇質之誅而冒言其所不當預之事懷不能忍憤悱自致無以異於傳之所謂怒蛙而幸人君之一式陛下揭日月之光而蔀屋之幽得以容則臣疏遠之言庶幾乎可採而無罪若乃安畎畝之賤而不知聖人之世三代之時非常之治無窮之休親逢之會為難遭則臣之倀倀不出門庭其失時亦極矣伏惟陛下萬機之間一留神聽焉天下幸甚天下幸甚臣無任俯伏待詔激切之至臣補之誠惶誠恐
