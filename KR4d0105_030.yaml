body:
  text: 第三十卷記拱翠堂記有竹堂記清美堂記白蓮社圖記澶州學生登科記金鄉張氏重修園亭記近智齊記濟北朝先生雞肋集目録濟北朝先生雞肋集卷第三十記拱翠堂記蕭之南稍東五里曰泉山泉山之勢南峙而北屏左則如濤如雲如虎如蛇騰涌拿蹙雜襲而相羊右則如車如蓋如人如馬逶迤雍容離立而孤驤中則平原緑野桑柘禾黍井閭溝洫什伍而縱橫泉出于山夏冽而甘冬木落山瘦泉渟而不冰泉旁土腴潤宜九榖百果衆物皆夥其南踰百里至于汴舳艫萬艘以輸賦于京師以下入于江淮浙荆湖閩廣其北不五十里至于泗商賈游士之載者自大野以東西通于齊魯趙魏之衢以下達于淮入海而泉山介其間其境勝而土樂又甚易至也然往來者旁午而莫之聞雖余少長數舍間亦莫之聞也豈人皆不知山水登臨之可樂而事驅之惟其憧憧而過者皆有求於汴泗而無求於泉山故泉山雖近而莫之聞尚有美於此者或去城郭益逺居人勝士足跡之所不至而田夫野老常居之林以為樵蘇為逋亡聚而泉以為漚以飲牛馬千百嵗而無過焉者也且物固無情於所遭而遺天地之美為可惜又東北俗椎魯雖信美或不知擇而居居之或不愛愛而不以語人語人而不能夸以大之故皆不顯蓋如嶧山靈岩或有名秦已來或名天下四絶處與齊境諸泉皆清冷鳴射如線如珠仰出奇異以皆在東北下國僻處故聞者往往不道道之亦未必信况未有名于昔者則雖近而莫之聞亦無足怪也而竇君師道世居於蕭恬淡寡耆好嘗為一尉即拂衣去讀書賦詩不以取名而以自娛故能獨得泉山而居之居之而愛然不以語人不夸以大之曰此樂神所祕吾非不能與人同之從我者寡也然士之慕君者時往焉故泉山因以知名而師道沒十年其子明逺始益築圃疏沼為亭為庵而面勢作堂臨泉之上盡山之勝以其四達而望皆山也則以拱翠名之曰雖然不能盡也頃余固以聞師道於徐之君子後謫佐宋都始識明逺於國子生中出師道詩讀而愛之而明逺因道拱翠勝絶且圖其圃以來求文為記而余未至泉山也然少游吳愛富春四合皆山民居蟻附山上而中大溪蜿蜒貫之嘗自言仕宦幸至縣令當求富春然吏居不可久也又竟不得况田畝耕稼終身優游之樂哉又嘗聞膠西牢山有老人七八輩不出山食其山中藥皆百餘嵗耳聰目明意甚慕之而念不可以逺墳墓欲築室故緡城東以老而緡去山逺相其原阜見似山者而喜則泉山之往來余懷可知矣而明逺方年少氣鋭日夕治其業為揚名顯親事則雖其居之勝草木日茂池檻日修而有時去之得不為猿鶴林澗之辱且拒哉㫺漢隱者王儒仲與令狐子伯交後子伯為楚相而其子為郡功曹子伯因遣子奉書儒仲車服甚寵而儒仲子方耕見客不能仰視儒仲愧焉其妻曰始君志何如今子伯之貴孰與君髙而慚兒女子乎儒仲屈起而笑曰有是哉遂共終身隱遁余以謂師道潛德不愧儒仲而明遠溫恭慕義非儒仲子比且功名可求也其成有命則明逺固不得以彼而易此也有竹堂記濟南李文叔為太學正得屋於經衢之西輸直於官而居之治其南軒地植竹砌傍而名其堂曰有竹榜諸棟間又為之記於壁率午㱕自太學則坐堂中掃地置筆研呻吟䇿牘為文章日數十篇不休如繭抽緒如山雲蒸如泉出地流如春至草木發須臾盈卷軸門窗几案婢僕犬馬目前之物有一可指無不論說形容彊謿而故評之以致其欣悅而於竹尤數數也顧其地狹而卑天雨榛薉蜘蛛之織河柳兔葵之所交橫而䝉翳人不知其竹也有過者文叔必顧堂下而語之讀壁間記仰棟而指其榜曰吾固詔客矣客辴然而笑曰今夫渭川之千畝淇園之林與南山之造天而蔽日者其大若杯若盂若桐梓之軀其膠繚􅰗岩之上而臨百仞之淵不特出屋檐而摩牆堵也草春者春雷隱山萬笴奮角如犀兕作籜解而出碧一日百尺彌望不可以極於時刀斧之取材者度經圍而得之大小齊一西轉巴笮南引江漢浮渭而亂河囷束屬而下者為筒為干為屋椽揵菑千丈之笮遍國之藩籬是賴與竅而比夫律吕以悲哀娛耳者㫺聲滿天地也是其旁之人室廬竹也用器竹也樵而薪者竹也以貿米鹽而出之其鄰境者竹也夫此人豈知竹之愛翛然而喜諄諄然語人而以夸之曰吾居有竹也哉文叔亦辴然而笑曰不然夫物安知其貴賤之所常在玉之美而藍田以抵鵲沈為美木而交趾以為槃食彘白鷴錦雉山中以醢臘而貴人以百金致茗以為粥而胡人以為佩夫物固有以多為賤而以少為貴者今夫王城之廣大九塗四逹三門十二百坊之棊置上自王侯至於百姓庶民宫接而垣比車馬之所騰藉人氣之所蒸漬囂塵百里欲求尺寸之地以休佚而莫之致而貧者置圊無所况於其他哉然則環堵不容丈而有竹如吾堂者不知能幾人也則余所以揭之於棟而名之書諸壁而記之翛然而喜諄諄然語客而以夸之不亦可哉且竹之美㫺人以比德松柏在冬夏青青君子之所獨也以夫少猶貴之使余得見夫渭川淇園與南山之薈蔚者而遊其間雖多固不可賤也夫多猶不可賤而又况其少哉客曰唯雖然吾聞㫺王子猷好竹嘗曰安可一日無此君聞吳中士大夫有佳竹欲觀之徑出坐輿造竹下諷嘯良久主人欲留而不可將出主人閉之因盡歡而返今文叔居有竹文叔姑亦灑掃儲具借不邀客客將造門坐堂上不去曰竹固招我元祐四年五月二十八日穎川朝補之無咎記清美堂記㫺柳子厚名愚溪而居而溪之神見夢曰余甚清且美為子所喜子幸擇而居余而辱余以無實之名以為愚耶子厚與之辨其言信激而有理須城王景亮以為不然曰夫物之名物之實也且子厚固不愚夫安能使溪愚也士而矜其能不自愛以近權利而取悔未始病其智也而曰我固愚余羞之在州里則賢不肖小大皆趨焉行四方則人慕交之居朝廷則附者衆若此皆自以為吾智能得之而余以為有命故余進則不敢以智徼其所難而退亦不敢以余力之所無如何而受余之愚責汶之陽盧泉之上其南大澤其土腴其生物夥而可悅築圃而居之為堂以臨盧泉而挹北山取其所謂甚清且美者合而名余堂盧泉之上多楊柳茂木可休而坐釣魚以忘老杖而望北山雲氣之浮游可接也其前岡阜陂隰摧嗺而湠漫青齊之往來者歧路迤靡牛羊麥禾膏野極望鳴鸛鶴而下鳬雁也余又種花其旁為錦堤鑿堂之東西為池植柏其唐以逹于門為徑為臺為庵為亭以出眺而入息以與賔客坐而談笑為樂叢竹雜果竒石異草凡物之清且美而可悅者甚衆也獨泉乎哉且物之清惟其自然宜不以人之所處要地僻壤改其度也然世之人出入乎官府而往來乎廛市者朱墨傖攘之與居米鹽喧啾之與曹雖有物境可以澄耳目而曠心意者不暇一接則物雖不以要地僻壤所處者改其度而自人觀之異矣而余終歲優游焉於此則所謂清美而可悅者非余獨得之哉而所為名余堂者亦豈非以其實耶柳子厚以謫居遠方一旦得官捨而去孰與余常有此也於是求文潁川朝補之以記之補之曰嗟乎㫺之君子進則急於功名不暇擇當否退而懟不逢則誣溪谷草木以自解說豈不過甚矣乎若景亮進不干時退而處其常斯可矣近時豫章黃庭堅魯直有美名其羈旅於魏嘗歌曰盧泉之瀕可忘死補之愛焉然補之亦未嘗至盧泉也獨嘗以事出鄆之東郭見其川源土俗之富意固樂之而補之先君又葬於濟濟與鄆澤南北也庶幾它日過景亮臨斯泉一醉解吾纓而濯之元祐二年十二月二十五日記白蓮社圖記廬山白蓮社十八賢者始晉太元中雁門正覺法師慧逺愛此山卜居之而河內覺寂大師慧永先居西林故法師所居號東林云法師神明英越初從太行釋道安落髮道安知其能使道流東國者也時諸方名德聞風而至與同修淨土之社者甚衆而十八賢者社中之傑也曰佛䭾耶舍佛䭾跋陀羅竺道生慧持慧睿曇恆道禺道敬曇詵內有士曰劉遺民雷次宗周續之宗炳張野張詮合十八人而佛䭾二尊者罽賔人皆神僧也餘各有異跡又法師最善陶淵明陸修靖兩人髙蹈不肯入社先是南海漁人嘗網得文殊金像有文云阿育王造也後商人於東海得其圓光以合像若符節陶侃嘗取之旋失去至是法師禱之江上出焉永公室中嘗有虎或畏之即驅上山去恆公行有鹿馴擾耶舍赤髭呪水洗弟子足使閉目但聞風聲自龜兹一夕至姑臧跋陀羅嘗見彌勒兜率天上得不還果有釋迦舍利三顆及羣士等皆有異跡見於其傳則法師可知已初法師送客常以虎溪為限最厚陶潛陸修靖偶送兩客不覺過溪然陶忘懷得失晉宋間一人耳修靖後得道度世兩人固非入社者皆善法師而謝靈運恃才傲物嘗求入社法師以心雜止之靈運不恨也為鑿二池種白蓮後名其社云殷仲堪之為荆州也時入山修敬故圖中所繪陶陸謝殷在十八人之外今龍眠李公麟為此圖筆最勝然恨其略也故余稍附益之凡社中士十八人非社中士四從者若干馬六蓋人物因龍眠之舊者十五他皆新意也菩薩像倣侯翌雲氣倣吳道玄受塔天王圖松石以關同堂殿雜草樹以周昉郭忠恕卧槎垂藤以李成崖壁瘦木以許道寧湍流山嶺騎從鞬服以魏賢馬以韓幹虎以包鼎猿猴鹿以易元吉鶴白鷴若鳥鼠以崔白余自以意先為山石位置向背物皆作粉本以授畫史孟仲寧使模寫潤色之余幼慕無生法墯世網不得出貶玉溪時道廬山愛而欲居不可家緡城八年時往來於懷也至為思山辭十數醉輒歌之初見李圖悠然忽如蠟屐扶杖行其中故為此圖特盡意澶州學生登科記周公封於魯禮樂傳焉孔子生於魯六經出焉學之為聖人事其求莫近於魯也孔子曰魯衛之政兄弟也魯衛固兄弟而政豈兄弟也耶雖然周公教康叔以求商之遺民賢人君子長者康叔能修之武公文公有文章道化蓋美哉淵乎憂而不困者於詩具在也孔子取之適衛而言曰庶矣哉如有用我者三年有成聖人之於衛亦不可無澤也秦並天下立州郡至於今不改而君角之亡地澶即其墟始余自南州求濟中流而歎知衛之美也登南北城而望則山川迤靡圖記可指蓋楚公頓丘泉源淇水須漕之地仿佛而在其詩曰如切如磋如琢如磨彼姝者子何以告之則原其國俗好學而樂善本於餘習者如此自季札見夫五人者以謂衛多君子其國無故則其所從來者舊矣非特孔子時為然也而秦漢以降士或忘其故習不醇乎文學之緒有夏育尚氣任俠之風述往事者不善子羔脫身於孔氏之難而喜道仲􅒘結纓於臺下之勇也蓋莫盛於漢質直如汲黯曠時而不一人而倜儻喜戰鬬如後魏李崇輩比者迄於五代往往而出相望也反而思之然後知治天下病學挍之不設太祖太宗神武不殺四夷屈降真宗北巡叛虜奪氣而澶之人始開門相往來人人知本農桑勸學挍以不忘其故家遺俗之盛士亦稍稍能自有聞於時繇學生而取科第者自興國逮元豐可考而記者若干人其一時行事皆有可道而不幸窮天且世無人者又不可勝訪斯巳盛矣今天子以儒術治天下而汲郡韓公之守澶也能推天子所以樂儒術之意行之其邦始命其參軍朝補之率邦人諸生而與之游且告補之曰無所待而興者豪傑也降是則君子不能無勸焉士而知讀書為儒取科第列士大夫以㱕榮其親榮其邦人焉亦可尚矣子無乃為次敘其名氏而記之豫聞而益喜曰不可一日而不治者三畝之宅猶如此目前之事猶如此况人倫所以本乎跨浮梁而望大河之奔渾為馬圖為榮光神氣之發也獨人異哉將必有君子如季札之所道其理然也因歷考其古之所以盛所以衰與夫風聲氣俗之變而載若干人者於其後使邦人諸生一過而知焉後之大車駟馬洋洋乎四方人指以為勸者亦知夫所以致此自公之教而始也公名璹官右諫議大夫云元豐三年十二月某日記金鄉張氏重修園亭記濟為州治巨野下土草木不殖其西北無山東南五十里乃有山而金鄉其東南邑故緡城地云嘗鑿山得金因為金山縣凡平土淺山無金此山乃有金知其地氣與竝澤異凡九榖果蓏土有宜有不宜此咸宜若松檜梅柚遷乎其地而不能為良者植此皆良又不可知也以余為兒時所聞見其俗饒美大家率輕作業樂善而好士厚子弟於學游客晨夜相面背于門庖無熄煙然不倦又好為園圃游樂事以相尚而非為利張氏其甲也其先世豐人太宗時侍御史肅字穆之以敢言不茍合四十謝事為王黃州所畏始起家而顯者也御史子畋字無逸髙介有父風亦早棄事初壞田作此園佳木異卉錯置竹萬竿出郭門而望蓊然秀色橫野其陽金梭嶺隂賀溝起伏異狀其外莽蒼無際目極可喜無逸得此因忘仕宦意而故張公安道石公曼卿皆與往來良厚園有亭曰先春張公客游愛之石公為宰每醉而忘返也皆有詩留亭上兩公前輩偉人傑士不妄以詩與人也蓋六七十年矣前此無逸子孝綽孝基孝孫亦善士好客能修其先人之業猶及與余先大夫游聞先大夫稱焉不知園幾時廢而元符中余南㱕始自巨野遷此邑竝嶺行溝上秋稼離離雉驚起馬前館無遺址桃李不復在獨兩老檜離立榖壠間風雨摧剝蒼皮白枝龍虎躩拏而上數十尺道衍隰而來未見也下馬半嶺北望南武七日諸山或斷或續屏列逺陸如畫其南數百鳬雁飛集鳴唼聲回望白水明滅桑野間意甚樂之順塗而詠吾居不可以易此也因買田築室距百步時時至其地捫檜坐石至於日入悵然惜兩公之跡將泯而恨無逸之不復見也而其孫大方從余游久乃語之大方則啾然有間曰此固張氏地請復焉未數嵗則築垣移植如其故徑檻旁午草木扶疏矣且營三亭曰先春其舊名也曰樂意曰生香因曼卿之詩也又礲三石來言曰其一求文以記其事其二請書兩公詩與記俱傳也余欣然曰吾里俗衰不有君子何以使復善且為近市利日不足鋤犂腹飽則載粟入城市買士宅士無邑居故吾里之為士者微今子獨能羞而反之不致求贏餘既異俚俗意而憂世家之墜念祖父之所嘗游賢公才士之跡至此而俱熄也慨然圖復之又欲因文以傳尤異余何愛不為子記之亦稍稍化吾里持家猶子豈但數過子相羊樂飲無人之境以忘吾老如是而巳也大觀二年七月十八日潁川朝補之記近智齊記傳曰計人之所知不若其所不知宇宙至廣萬物至夥千古至遠衆理至幽而欲以七尺之軀方寸之地盡攬而悉儲之譬以芥納山人知其不可故神智大矣德配蓍卦而㫺人猶或以謂智有所困神有所不通雖然聖人蓋常通而不困夫常通而不困豈特其生而知之皆備於我者能若是亦必曰好古敏以求之也而天下之不知者乃始曰聖人必其生而知之故不窮其曰好古敏以求之者孔子之所以自貶聖而不居之意也是不然祖述堯舜憲章文武律天時襲水土刪詩定書雅言執禮至於韋編三絶曰我於易則彬彬矣是固孔子所以學也豈曰我生而知之學皆可已哉雖然自其常通而不困語之神不可知而智則學者可以俱至舜稱智臧武仲亦稱智而臧武仲去舜逺雖才異亦學不造其極也學造其極則無不知故智之為言惟好學為能近平居無事反觀而內融上思千載若存若亡中攬四海若隱若顯下索將來若絶若續譬空中雨欲數其滴有不勝知者矣欲知之奈何惟學而已矣學則聖人之智可近而不遠故物量無窮而聖人之智亦無窮用無窮逐無窮亦窮則凡理之不可勝知者有不能外吾之所察易曰通乎晝夜之道而知此古人所以事至而辨物來而名也可謂不智乎事物之過吾前如日月更代而無止而吾知所以應之如井泉愈汲而愈不竭蓋學之效如此不可謂不智也頃余術不與時偶廢官休其廛八年而巷之草沒屐或唁之輒自語曰足固未嘗刖而士相與戒而逺之曰是其術也不利人眤且招悔而袁君耕道獨往來從余者亦八年其意不衰或謝不見或乍見而不留卒不懟或旦草見或易與言如家人卒不侮余歎曰甚矣耕道可謂好學也抑人所戒逺利近悔奈何耕道猶笑自如而余記誦益落文字益疏顧無以應耕道求又不敢以其不知而作者語之雖語之而知也無涯使耕道何自入故第誦中庸語曰好學近乎智以勉之好學云者非孔子顔淵不得以私相與然各從其志獨顔淵得好學而已哉時習之為說譬氷水為之而寒於水茍不已則所不知當益知故求智者莫近反而言之則好官爵好貨財至塞其心如蹊間之茅者皆愚矣人之所以無知若草木自愚其心者耕道可不反戒而逺之惟恐其似若彼之相與戒而逺我哉因為之名其所居齊曰近智耕道勉之乃棟牖花竹起居之佚視聽之適則不足道也大觀四年七月十四日記濟北朝先生雞肋集卷第三十
