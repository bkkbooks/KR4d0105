body:
  text: 第五十七卷啓賀門下吳侍郎啓代上北京韓丞相子華啓謝何相公啓賀侯樞密啓謝韓儀公啓泗州謝執政啓代外舅杜侍郎賀姚舍人輝中啓泗州謝監司啓謝泗州倅曾丞議啓謝泗州教授啓答賀直閣林次中啓謝龍圖吳雍薦論啓髙麗人使回遠迎狀謝髙麗使送人事物狀送髙麗使副人事物狀北朝國信大使先狀濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第五十七啓賀門下吳侍郎啓誕膺制撿再秉政機已光選衆之求更竦具瞻之望凡居庥廕靡不欣愈恭惟某官致主忠誠濟時賢業寵冠三朝之舊譽髙百辟之前蓍龜治忽之所昭柱石安危之攸恃久茲均佚未替告猷聿逢圖任之明復二納言之重國政弛張之素達人材能鄙之盡知祇賴和衷以成纍洽伏念補之稟性朴野賦命奇窮早荐歷於閨臺晚屢更於麾守嘗遭尤悔旋被洗湔皆朝廷及物之私與門牆好士之德尚叨寄委敢怠承宣今川流已復而無虞歲事將登而甚美吏知免咎民識樂生仰大厦之帡幪固無不芘撫孤蹤之踸踔當有所㱕即日再惟燮理宴間神明勞相屬拘官守阻造台閎代上北京韓丞相子華啓孚告治廷改司留鑰逖聞新命竊忭丹悰恭以某官道重躬行望隆世濟翊亮四朝之老儀形百辟之師黃閣調元意比勞於鼎鼐赤松嘉遁興已傲於林泉屬訪落之云初固􅋠賢之方急茂惟安集尚輟保釐開府加崇擁旄增重居然全魏隱若長城伯教素明愛茲棠而敢伐公㱕寧遽有是衮以宜封某蚤誤陶甄復叨庇賴雖簡書之良窘繄履幕之匪遙幸㑹居多欣愈倍劇謝何相公啓峻騭鼎司誕敷制命嘗致門牆之慶粗申簮履之䖍偉天地之休明曠山川之受納故惟幽介畢獲昭蘇民知至善之不忘物識太平之無象即日恭惟持國有道自天降康三接益隆百祿是擁伏以某官剛柔體撰文武憲邦尊主逺猷隱申甫之維翰宜民善政粵丙魏之有聲寬足以得衆而惠足以使人深可以通志而幾可以成務大臣絶傷手之斫小人懷隔面之從本於中和成此清靜所以不勞施設坐致安榮伏念某稟生拙艱擇術迂滯以場屋粗知文墨故閨臺誤有姓名然而未嘗當一事權任一言責是以初從輕坐終獲蕩除齒髮衰齡妻孥滿目晚已無心於事業老猶有纍於寒飢及此分符益知幸會念使功孰與使過况屬盛時儻成仁可以殺身敢忘異日顧惟逺跡阻望台閎賀侯樞密啓光膺褒制峻執鴻樞國有儒臣以裨上治民知聖澤當復下流相與歡愈固無逺近伏以某官髙明篤實寬裕直方岌然髦士之中夙有大臣之氣果逢盛旦自拔周行辭章炳蔚足以鼓動四方操莭冰霜足以整齊百吏事無施而不可才屢施以皆宜曾未十年遂登兩府漢千秋之寤武帝何足慕哉唐馬周之遭太宗無以尚此洪惟聖主以孝事宗廟􅋠率由於舊章以仁育幅員欲誕敷於文德務進溫良之士聿求久大之功必有同寅來膺至眷豈惟精神折衝於樽俎之上固將中和明備乎禮樂之間而某稟資拙疏賦命蹇薄以場屋粗知文墨故閨臺誤有姓名不慮冗材既盈小器故暫膺於識拔已旋致於顛隮然而未嘗任一事權當一言責用汔逢於清問遂終削於丹書儻非獲依仁賢當路之餘光何以克全孤介末塗之晚莭重念補之頃親講習又接鄉邦竊比然明辱知子産敢同貢禹恃舊王陽不能自躍於鴻罏乃獨長鳴於峻阪盡煩深察更欲何求貧未脫於寒飢尚資廩入老不愆於忠孝猶纍生成念賀厦之可同悵掃門而無自謝韓儀公啓伏念近者特造門牆願親杖屨康寧貌悅千岩松竹之間蕭散情長一世塵埃之上不覺聳慕膝屈氷歎意消顧蚤預於甄收非敢言於姻婭髙明廣逮疏逖咸依尚憐孤根未必墜雨生芻一束窘窮巷之坐愁清酒百壺陪後堂之宴笑曾忘禮絶滋愧人微緑野放談過晉公之髙蹈黃花佳唱比陶令之將㱕醉猶貸於歐茵狂豈誅於落帽顔間和氣席上陽春以此使人何人不盡既貪知己特達勿二之意遂罄平居深念欲效之言而莫戒轉喉幾成捫舌雖禮不禁嫌諱字亦有同音如肇者和帝名也而漢郡存京兆之稱又操者世祖諱也而植詩有造日之句載在傳注可以􅊲知乃唐巨儒若韓吏部亦著宏辨欲開後疑晉進既殊釗昭不避仰惟大雅固已包荒然令公以三朝德望之尊而不肖有十年門下之舊昜知罕犯每慎偶疏豈止汗顔真成芒背自違鈞席愈攪蓬心悔訟稍瘳蕪詞始敘伏乞略此細故要諸後圖間順下風且詢公議似聞芝撿已拜玉音想遂促於曹裝行復調於伊鼎即日恭惟神明來相寢餗鈞休補之田野益疏光儀乍阻蕭然形迹失此庇依已戒僕夫將趨道左庶欲贊輿誦具瞻之意豈獨伸恩閎私戀之情泗州謝執政啓久此投閒初䝉起廢已膺近使更竊名邦荷天地之曲成玷鈞衡之平施迂疏內揆感涕徒揮伏念某家世久衰人材甚冗早預諸生之選與從三館之遊羣飛刺天同時遇合者自其能爾決起控地無庸不足者安所尤哉幸未忽於省循終獲逢於湔洗退無仇怨寧論三歲之不興進有盛明未廢十年之乃字里閭浸鄙文法逾疏顧雖懷遭時有用之心實亦負陳力不能之責斯蓋伏遇某官忠誠尊主賢業濟時蓍龜治忽之所昭柱石安危之攸恃豈惟丙魏有聲於漢蓋非堯舜不陳於王邦之榮懷必㱕其美於上上有大澤必行而致之民災祲聿消歡謡允塞恭惟挈國尤慎官人敢圖赦過之餘乃在選能之列泗雖支郡地實控淮舳艫上下以相銜冠蓋往來而旁午今秋潦收涸而川流底平稼已兆於豐登吏茍逃於曠失顧承人乏適在此時逢歲有餘乃幸乞漿而得酒於生無愛尚欲舍魚而食熊誓以肖翹仰酬造物代外舅杜侍郎賀姚舍人輝中啓拜命中宸升華西掖側聞新命預劇歡悰竊以舍人制行溫恭修辭敏達夙藴濟時之業中懷拔俗之情決科從仕者不四三年閉門著書者踰二十載化行閭里共畏陳君之知名動京師咸髙鄭子之趣二聖垂衣之始羣才連茹而來首登老成次起遺逸以謂處厄窮而不愍則宜傃富貴而能行議禮曲臺衆果推於適變讎書東觀士尤服其多聞豈徒居遺闕而抗辭司言動而直筆雖亟躋於法從已久屈於公才出則代言許劉超之清慎入而承問倚徐邈之博通朝廷得賢中外胥慶某早塵近列竊企下風未修牆屏之䖍先辱緘縢之貺永言欣佩莫罄敘陳泗州謝監司啓久幸投閒初䝉起廢拜明恩而局蹐奉中㫖以馳驅偶蒞屬城遂依大庇州素稱於繁會力尤病於拙囏視事云初撫躬以愧伏念某材能甚薄學問又非越自諸生蚤升三館再更郎選四領藩麾惟被譴之獨輕故滌瑕之前逮付以要郡俾其赴功野鹿情疏念蒿蘋而常在疲駑氣索見車蓋以內驚伏遇某官寬厚愛人公忠蒞事提封一路撿察百城仰惟攬轡之邈然孰不望風而惕若更願小寬撿䇿稍假歲時必有毫釐自圖報稱官守所拘不獲趨候門牆謝泗州倅曾承議啓恩俞守郡幸㑹同僚平居想望之深今此從遊之便伏以某官賢猷開濟雅趣靖良事業藹其家傳聲名籍於衆口方紆佐郡良屈逺猷然而素履允修撝謙更篤宜入預清華之選寧久從關決之勞惟此拙囏劇於延跂歌襦袴之慕深愧非才詠海沂之康終煩敏手方圖馳問遽辱惠音黼繡之辭蔚然纍幅衰頺之質煥若增輝展晤非遙欣愈可既謝泗州教授啓比䝉恩撿改蒞便州悵馳問之未遑辱流音之先及眷言披玩但極感銘伏以某官早擅俊聲躐登科第偉該通之經術燁藻麗之文辭暫屈討論亟躋要近某衰遲假守邂逅為僚敢辭奔走之勤行有晤承之便方茲殘溽更厚自持答賀直閣林次中啓升華內閣增秩列卿雖揚歷之固宜亦東掄之􅎊重竊以冊府之設非止於藏書文館之名固先於延士大則典領撰述或次補法從之崇卑而是正挍讎猶擺落常流之賤嘗􅋠所以置此之始又念所以待之之殊豈欲虛名相矜而徒以廩食豢養於燕休深廬默坐而不聞朝廷議論之毫末世務既趨於一切書生亦習於自輕逮茲陵夷最號間冷聖明繼照員品復修方將敷求久任之俊良稍以敦勸方來之遺逸猥同聲氣預有光輝恭惟某官少以藝文早收科級本於髙才達識之自致濟以彊學好問而旁通明白不私敏捷立斷事每試而皆可居所去而見􅋠烏府郎曹屢更於繁要蘭臺都省稍陟於髙華果奉明恩更躋祕職猗歟父子之相繼藹然兄弟之嘉聲儒者之榮衆人所慕行超騰於近列益開發於逺圖致主之功計日以俟補之備員中祕絶企後塵乃䝉齒記常僚講修故事交馳箋牘慙輩行之非宜藏置縑緗傳子孫而為好謝龍圖吳雍薦論啓陳編窺竊何補諸生華衮褒榮敢煩一字誤䝉代匱祗劇厚顔補之稟生既愚聞道亦淺少日狂狷頗復激昂長年艱難稍亦咎悔不幸先子蚤棄諸孤居然為貧初此求仕賣刀買犢行藏獨可以自期觀頤舍龜失得不足以相補朅來泮水三昜歲華無它時捧檄之勞有平居肄業之樂譬彼倦鳥聊復投林坐令摧頽滋用迂闊風雨子桑之席促軫屋穿蓬蒿仲蔚之園披書案朽間偶好事惠然晤談務間偷安􅊲滿當去豈圖過聽乃此誤加謂鳬足非長而雞肋可惜收置門館論諸朝廷此蓋伏遇某官髙才得君强恕待物統綏一道刺舉百城如般之運斧斤曾微擁腫若良之操轡䇿安有疲駑曲憐孤生為借餘潤㫺張安世不樂私謝而李習之嘗賦感知趣非不同義各有處更願寬其不及須以後來豈無毫釐可卜報效髙麗人使回逺迎伏審航琛入貢館飫言㱕瞻九雉之崢嶸夢回天上指三韓之縹眇色見睂間候祋來聞使軺將及參承可卜欣抃良深謝髙麗使送人事物狀茲緣迓勞初獲晤瞻入覲日畿慶賜牽之成禮言㱕海國辱展幣以交歡盛意難承珍藏敢置送髙麗使副人事物狀州僚備位郊犒常儀蚤欽俎豆之風先煩委贄願報瓊瑶之好敢廢實笲薄物將誠别封具列北朝國信大使先狀茲者歷紀嵗端禮欽鄰問眷使軺之于邁幸候館之可休冒涉寒威乂寧福履趨承良邇欣詠徒深濟北朝先生雞肋集卷第五十七
