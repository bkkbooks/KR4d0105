body:
  text: 第五十八卷啓與謝寶文啓謝淮南漕彭元施啓與京東漕黃朝散啓答謝華守趙子剛賀入館啓與亳守向宗旦啓上河北漕呂進伯所業啓代胡唐臣授蘇幕與使者啓授澶州司戶答韓諫議璹請充教授啓回鄆城孫簿啓賀教授陳履常啓答謝狀元李常寧啓答謝宗室奉議啓答賀李祥改宣德啓答亳州趙教授啓太學答學生林自啓答王勳謝貢啓答陸倅啓濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第五十八啓與謝寶文啓竊審再膺宸撿還鎮淮邦副朝廷因任之求慰民吏去􅋠之意伏惟歡慶恭以某官忠藎耆德文詞宿儒蚤記淵衷遍躋法從長人京邑豈徒前有之趙張控虜藩垣真是禁中之頗牧惟江陽氣俗之舊有棠隂惠化之餘農絶帶牛尚未忘於勸課兒騎竹馬願復見於行春惟暫屈於統綏固不勞於經理而補之倦遊文館得請佐州曾未造於門牆將獲依於麾棨自惟幸會尤劇欣愈方冬沍凝取道遼逺謝淮南漕彭元施啓吏能何補公舉過優迂疏內循光價已倍伏念補之無自得之學非適時之才間關一名黽俯十􅊲庠挍五歲館閣四年不能穡而取禾退默既慙於素飽未操刀而欲割進為又懼於得傷故嘗冒請於外官庶幾自試於民事而託部封之未久辱咳唾之獨先靜言􅋠之何以得此斯蓋伏遇某官忠以事上恕於取人過譽斗筲俾參瑚璉李長樂之許文舉非為通家暴公子之知不疑儻緣一語人之幸會勢豈偶然誓堅許國之心終得報恩之所感荷激切不知所裁與京東漕黃朝散啓伏審祗膺眷擢榮總漕將已擇剛辰初臨治部伏惟慶慰恭以某官才髙當世聲發妙齡行誼規於古人文章固其餘事鴻干以序美既載於兩朝玉立而溫威自宣於百郡屬河朔流移之始復而山東罷瘵之未蘇庶幾小豐有望卒歲故暫假問民之寄豈久迂攬轡之行補之頃濫麾符方茲譴謫何意周旋之舊乃依刺舉之嚴捨曰蘇孺文之天迂疏敢有或者李將軍之地寬大所為非輒病於至公實少伸於知己永言幸會莫罄敘陳答謝華守趙子剛賀入館啓頃者效官河外託庇府中違離屢昜於歲華傾想第勤於魂夢疏慵成癖問訊闕修伏惟坐鎮安間履時休裕補之才能甚薄學術亦迂比緣明詔之求偶用輔臣之薦道山羣玉之地濫迹莫遑長林豐草之􅋠此心固在斯蓋某官忠信好禮強恕行仁吹噓所加隱伏皆奮蓋嘗勉裁尺牘槩敘鄙誠置几塵生開緘字滅既後時而莫致滋撫事以為慙乃蒙眷私特枉慶賀辭極璆琳之美情踰骨肉之親顧惟感銘尤劇衷悃新元肇布介福來同與亳守向宗旦啓頃緣契援嘗奉標儀去牆屏之已賖託麾符而深幸恭以某官溫良植已忠藎在公勳名烜赫於相門姻戚蟬聯於帝室不由此進自以才稱騫翔省寺之華更踐藩垣之重居有善政去嘗見􅋠而補之疏拙領州乖違得譴未更歲律仍避親嫌仰寬大之足依俯飄搖而自慰奔馳敢後參對可期上河北漕呂進伯所業啓草木有榮逢春乃耀鳥蟲含響待氣則鳴物誠甚微情乃如此士有知識志宜激昂自憐孤生誤喜末學執技不化知己益消寅緣官曹統蒞使部竊以畏大人於早歲事君子於一朝向塵長趍人進亦進登堂危坐衆言則言不圖髙明見假顔色問訊所學開擴其愚昨成至言所要知道退念空語滋不欲陳然而殫廢楮毫棄滯箱簏憤悱已吐蕪蔓莫刪猶望牛歌足觀蠅墨可綴察鄙心於寧子成拙繪於曹生則雖孔門未廢由瑟尚或有取不為無庸代胡唐臣授蘇幕與使者啓此者忝命宸廷備員州幕仰威容之固久託封部以為光竊自􅋠惟良深幸會伏念某才出中下譽乏鮮明雖任使之粗更顧毫毛之未立祗惕譴尤之後摧頽禍罰之餘豈敢進求智挈瓶而安取庶幾分守恩弛負之已多此蓋伏遇某官忠以事君恕於接物蕭生論議寧忘意於本朝范子澄清蓋有心於天下寅緣竊食邂逅望塵捧檄束裝計官期之良邇登堂聞教况吏政之可師欣忭之情倍百常品授澶州司戶答韓諫議璹請充教授啓竊以貴賤位殊義非均則有所不答賢愚術異勢既絶則無以相求蓋明公在上之達尊而不肖衆人之晚遇解褐一命從軍大邦以未嘗知名而過聽獨收故不待望履而陳書犯分罪實出於不韙誅宜獲於非常敢謂伏蒙某官寬裕有容威嚴曲霽猥以世間之盛禮施於麾下之鯫生屈記室以裁箋賜家童而返報往來嫌於敵體進退越於常倫愧汗莫堪駭情無措炳若文章之眩目跫然藜藋之驚心上煩開府之知下無國士之稱至於假資助乏輟乘代徒自惟平生得此固寡三復敢置纍息弗寧蓋補之才實窳疏學尤拙陋幼雖有志壯益無聞幸遘明昌預霑教養庶幾同小子之有造未敢與先生而並行正使米鹽效勤猶病弗稱若復庠序肄業尤非素長伏况門下德誼之最隆府中衣冠之甚美鄒枚毫牘之侍應劉樽俎之陪足以議論古今酬酢左右豈宜下陳無似之賤吏乃辱大人當路之末光拜教至榮拊心益忝請自隗始私不忘築臺之初即以遂行尚或有奉盤之頃斂板就列計日有期託庇門闌終身悃愊惶懼激切之至回鄆城孫簿啓麋鹿情疏但記蒿芩之樂鵷鸞迹逺無心羽翮之追忽被除音復叨守土髮星星而久墯綬若若以增慙敢圖眷奬之深首辱緘題之慶徒欽雅致敻越常流偉初奮於仕塗藹已揚於才譽身相為援豈無用力之公卿意獨與親乃在退藏之農圃將髙懷之固異實近世之所稀補之自信良堅與庸已甚枉瓊瑶之為好撫蓬甕以生輝感荷之誠倍百常品賀教授陳履常啓擢領掾曹歸臨鄉挍與從遊之良舊私慰喜以居多竊惟國之求才病取捨之膠於法士之涉世患進退之失其中設科舉爵位以誘人假誦數詞章以干祿須其出試則鄉黨自好者耻夫屢獻不以禮際則山林長往者豈其肯來故上安於有司之區區糊名以為公而士惑於古人之皇皇載質以為辱莫聞覽德之鳳率多食餌之魚恭以某官行獨而通志潔而降不落落以如玉矧泛泛其若鳬窮無立錐術可濟國至於博覽之學絶出之文要其平生固曰餘事尚不屑去安有求聞聲自籍於諸公章數騰於當寧拔起閭里朋類之榮收還妻孥親黨所喜未促公車之詔聊從泮水之行庶觀成山必自纍土辭尊及富仕何往而非安有為與行志茍存而皆可貽箋良幸修慶獨稽傾詠之誠倍於儕等答謝狀元李常寧啓摛詞中禁擢秀羣豪一鳴而驚閭里爭傳於盛事三道之要朝廷相賀於得人伏以某官藏器於身待詔而往文非時好近灝噩之商周經本心通無異同之王鄭囊錐出穎郵傳馳聲望冠蓋以傾風固其素願過蓬茅而委質非所宜堪豈徒一戰而稱雄庶觀千里之自此欣愈良劇敷敘何窮答謝宗室奉議啓程文入等恩詔換官起身玉牒之華通籍金閨之貴伏惟慶慰竊以邦國之建本支是崇變商餘風周化行於麟趾懲秦孤立漢勢定於犬牙豈徒魯衛兄弟之俱賢固宜向歆父子之間出逮觀近世莫盛李唐持鈞軸以當朝適之首出以文章而傳世長吉獨先聲明迄今想像未泯恭惟聖世尤篤宗盟惜夫飽祿廩而宴安故使學詩書而進取及茲歷歲寖得聞人新恩奉議稟性茂良修詞敏邵恥從派屬輩居環衛之中欲以功名自致薦紳之上果緣藝選驟改文班同列相矜一時盛觀佇騫騰於夷路益開發於逺圖先枉緘封過形謙挹感銘良劇敷敘奚殫答賀李祥改宣德啓延對宸廷改榮京秩從遊兹舊慰喜良多恭以宣德懿行不羣令儀可度粵從幼學夙有俊聲下帷未省窺園持竿寧悟流麥其精如此故資之深珠玉藴含山川輝媚自當名世豈獨傳家補之氣合相求心均莫逆絣䌟洸之何取橛株枸之自留臨水送將牛羊方下望風懷想鴻雁欲來庶幾逢聲子之班荆且復過孟公而投轄未遑馳慶先辱流音尚阻盍簮惟期強飰答亳州趙教授啓茲緣罪譴復避親嫌跋才譽之素勤聯官曹而深幸恭以教授推官端良可度超犖不羣蚤收科第之榮方蒞膠庠之佚粹精古學本自得於下帷敏捷髙辭咸相傳於倚馬操惟幽而不改聲乃大而逺聞倦飛聊比於一枝築室尚容於三徑先煩慶問尤認眷私感服欣愈併增誠悃太學答學生林自啓竊審論秀辟雍登榮造士伏惟慶慰上舍先輩懿行可度美才不羣負笈徒行豈辭李固之千里違親忍志末厭何蕃之五年故能通達大成文史足用升諸鄉而有素告於王而可官以補之預在膠庠特貽箋翰推先非據感服徒深答王勳謝貢啓數從升補初預賔興雖學制之同然必鄉評之所與竊以貢士先輩幼稟俊異蚤勤編摩敏七步之修詞飽五車之強記李廣百戰未立寸功何蕃一歸動輒纍歲厄窮已甚操守更堅果緣􅊲察之公往偕造秀之選國有道化方革浮華士惟忠良乃稱推擇九層始於纍土一鳴可以驚人豈但顯親固將行義願􅋠飯粟務正學以言而發身毋侈輜車稱稽古之力以辱士先承緘翰但劇感銘謝陸倅啓輟自班聨屈臨州郡涓辰之善視事云初伏惟慶慰恭以某官經術博通文詞敏贍賢關論秀蚤成金玉之章卿寺須才久躐鵷鴻之綴英猷方顯雅致不羣自求外官欲試民事聳聞交印已楊慈惠之聲即見賜環復在清華之選補之田閭託迹萍梗因風當趍牆屏之嚴以伸桑梓之恪屬茲被命既迫赴官愧流問之辱先悵參承之莫遂濟北朝先生雞肋集卷第五十八
