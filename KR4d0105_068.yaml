body:
  text: 第六十八卷墓志銘雄州防禦推官朝君墓志銘殿中侍御史趙君墓志銘永寧縣君李氏墓志銘進士杜君墓志銘進士閻君墓志銘夫人閻氏墓志銘右通直郎楊君墓志銘進士清河張君墓志銘並序單父主簿單君墓志銘濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第六十八墓志銘雄州防禦推官朝君墓志銘府君朝氏諱端中字元升漢大夫錯之後後家開封又徙巨野尚書刑部郎中知越州贈吏部尚書諱宗簡之孫尚書庫部員外郎通判鳯翔府諱仲偃之子庫部前夫人許氏後夫人劉氏而府君劉夫人出也封長夀縣君府君生警悟好書十歲能為古詩草聖竒異庫部尤鍾念其失怙恃也年始十五矣人意其幼驕而難其驟處約也而府君悲哀折節如故寒生間關自力竟為東方名進士而文辭雅不追世好故纍上乃中第初調趙州平棘尉盜去境民安堵遷雄州防禦推官知潁州沈丘縣事將行而以疾卒享年五十元符三年四月庚子也即其年五月辛酉合祔於任城縣吕村魚山前夫人胡氏之穴胡氏知書能詩先府君沒二十二年矣繼夫人閭丘氏淑愼宜其家二男三女男保之付之皆舉進士自立女尚幼府君為人豈弟卑以自牧而倜儻尚義不事小節文史筆墨之玩甚於嗜欲好酒喜山水嘗誦李白語曰偶乘扁舟一日千里忽遇勝景終年不移人亦以為近與人交傾倒無不盡仕宦作業得少為足類馬少游之為人詩文草隸則元和以前勝士也江南黃庭堅嘗見其所作而歎曰永懷而善怨蔚然類騷庭堅未嘗以此許人也其在平棘守李陶作樓於洨之陽府君賦焉陶刻石樓上後補之見之曰賦雖小道然屈宋逺矣文詞之芳潤至相如子雲而極左張厪厪乎蘄富而更窘曹植欲返其波瀾而不能也洨陽樓之作有心哉漢之上乎若親見子雲不能動人則補之之所不能知也府君補之之季父少長同研席其銘府君不求諸人而補之自銘之亦府君之志也銘曰論世莫近於唐而唐以文侈何必其大者若郊島焉傳矣目賤耳貴藍田之璞以為塊東家尚爾而况乃雄輩虎炳不玩以逺莫馴山雞鏡舞則惟近人吁嗟吾季父以逺沒身雜蓀茝以為詞兮以慰夫離散之魂舉斯世而一人知兮則吾不既已聞尚遺此後昆殿中侍御史趙君墓志銘君諱祐字夀臣其先趙州平棘縣人殿中丞諱符之曾孫太常博士諱昉之孫而尚書都官郎中諱盛之子也家世以財雄邊州國初北方用師博士悉以家財助官軍逐寇趙人賴以全自都官始葬磁州滏陽縣因家焉君幼警敏不戲弄稍長學通洽中天聖五年進士第初調冀州司理􅊲中囹圄屢空改雍丘尉轉大理丞再知長垣臨卭二縣事用舉者擢知威州事威近蠻苦侵剽君下令毋先犯蠻蠻久感悅至相帥拜庭下遷殿中丞通判相州事相守資政殿學士張公觀竒之曰廊廟具也㑹改守鄆即奏君通判鄆州遷太常博士時賈公昌朝為御史中丞言君方正擢監察御史彈劾不撓仁宗眷待之時楊崇勳以恩舊位將相判成德軍其子宗誨受民金崇勳因為釋民罪事發崇勳猶為營奏既逮捕宗誨崇勳又篡取之君言闕庭至近崇勳恣橫如此臣聞制使李宗昜有奏報繼遣种世材就問崇勳但臥閣延制使入􅍟不合鹵莽臣請選使臣以禁近送崇勳就對念以其嘗官樞庭務存大體猶望與一散秩許令致仕上深然之保州卒叛閉城拒守朝廷初遣中使招撫繼又發兵攻討君言保塞近敵境偵邏日至今發兵速破則謂我邊壘不固未下則謂我戰士無勇使遂克之老幼魚肉帑廩灰燼可恤也又聞已遣樞密副使富弼宣撫河北龍圖閣學士歐陽修為都轉運使宜下弼修倍道走城下曉諭㱕順不可淹久啓戎人窺覬之心生逆黨變詐之計或叛兵有邀請亦務俯從事定自可裁剸上優納之而鄭公文忠公卒平保州賈公為參知政事君引嫌請外官遂以監察御史知棣州事仍不廢言事俄遷殿中侍御史興利除害州以治參知政事王公堯臣引為三司户部判官恩得任子以與其弟祀補郊社齊郎時虜通耗朝廷難奉使者假君朝散大夫守太常少卿充接伴北朝國信使還經趙宴其族人語曰終願復為平棘人與族人處因以錢二百萬為貧者營産既還遣視汴口陛辭上曰卿此行㱕當峻任卿而君得疾汴口既還卒慶曆五年四月六日也年四十有五上聞之歎息曰趙祐乃止此問誰後者賈公以嗣子滋聞而有司白君遺奏不應録子上曰與太廟齊郎君平生以建明時事為己任言多為民自佐郡為州至官臺省內外如一嘗疏決刑禁河北鞫獄陜西既畢皆以其道所見利疚聞凡切於事者六其一慶曆二年星變又春大旱上避殿寅畏敕寺觀為道場齊醮事君言邊患未寧民力重困此聖慮所宜先軫者也佛老亦化民趨善然未聞遂以此答天譴也其二河北配糴民粟至二百萬石民蓄榖盡籍加督責戶不聊生君言陳新未續恐榖翔貴轉致流亡民為邦本不可忽也請俟秋成聽民自入粟其三京東水患令民各塹田畔以走水因其土為防植木防上君言民田有多寡而塹深闊若一可施之廣不可施之狹請下田欲塹者從民便其四鄆州戶輸乾食鹽錢名乾食者君言鹽錢但歲抄浮戶計丁配之皆里正鄰伍専增損丁數又變輸絹若紬費數倍恐京東盡然請悉輸以錢以當預買直官入優民費省其五陜西榷鹽較通商時民不為便君言始改法盡收客鹽官貿之已盡則必配民輦致或衙前督運多破産又戶無髙下給食曆貧食圭撮官不圭撮貿為病請通商如舊其六陜西令戶運糧至延州保安軍又不許飛腳齎貨就糴其地君言陜虢以西米斗錢五百至六百此但輸直以五六榖價臣聞沿邉入粟甚耗中都錢今解鹽以席計猶四百萬請入粟皆償鹽且稍潤之則逺民紓中都實事多施行君疏財尚義識吳公奎於嘗僚未有名時吳公從制舉為空室給其資卒大顯韓魏公文潞公亦與游皆器之武功蘇子美以詩豪少所許可與唱和盈笥娶李氏封永寧縣君子滋終漢州録事參軍二女長適內殿崇班秦某次適宣德郎王定五孫崇厚崇烈崇德崇仁崇卞皆進士崇烈嘗舉禮部後以貢士垂釋褐卒崇仁崇卞皆夭録事君以滏陽葬有河患改卜下邳之新安未及事而歿故崇厚崇德刻意能幹其蠱以大觀三年十月甲子舉君及永寧縣君之匶合葬於新安並舉録事君以祔成其先之志也銘曰惟天祚宋削平僭亂如舜禹升逮於仁宗休養生息文景致平其同亶時天為生賢碩大光明庶尹百工亦罔不正可庸可承猗歟御史崛起平棘有直亮聲士欲愛君愛民為本本固邦寧尚率爾祖毋壞爾成則後其興永寧縣君李氏墓志銘故殿中侍御史趙君諱祐之夫人李氏鄴大姓如蜀程鄭氏夫人幼孤鞠於其叔父母年十八適御史君生一子漢州録事參軍滋也幼莊靚寡笑言御史亦少孤事母恪夫人不愛奩橐奉姑甘旨日夜勉御史以學御史立朝清白有內助焉纍封永寧縣君姑老癕發胸間殆夫人吮㿈出血信宿愈御史年四十有五而歿姑繼歿夫人哀痛垂死其二叔求異籍詐其資二百萬録事君幼不能平夫人止之曰無以纍爾父鄉里賢之以熙寧某年月日卒二女五孫見御史志孫崇厚崇德自滏陽舉御史之匶改窆于下邳之新安以夫人合葬銘曰生富侈躬淑靜嬪髦士勉以正姑曰孝與為命或分財棄不競洵女子能力行寧爾後微厥慶進士杜君墓志銘寬伯姓杜氏諱欽卨濮州鄄城人也杜氏固多賢而寬伯之髙祖某官諱某曾祖某官諱某祖某官諱某皆以文學政事顯於時杜氏始大而今為宣德郎詳定官制所撿討官曰純鄉人尤以為賢而師之者實生寬伯寬伯為人頎然而長質直且願人以為稱其家兒也補之十餘歲時先君為補之言宣德君君子也若人乃可事之及補之長為補之求配以為莫良杜氏而補之所與奉先君祭祀者實於寬伯為第二姊寬伯與補之游七年飲食起居不見其有過也讀書能知其意為言語皆質直事親竭力不薄於其所厚與兄弟族人處竊竊然愛不能捨也元豐四年五月八日不幸感疾以夭年十九娶閻氏無子卜以十月某日葬於開封府祥符縣某村之原初寬伯疾亟補之入視挽補之衣泣曰恨不與吾姊别補之悲之寬伯孝弟人也銘曰生而不夀無男子生莫毒斯而寬伯罹之求其所以至此極者不知其為誰嗚呼已而進士閻君墓志銘進士閻君蓋字天錫世鄆州人有諱寶者仕梁為保義軍節度使後降晉晉以寶同中書門下平章事胡柳之戰晉敗莊宗欲退保臨濮寶獨以謂梁兵窘蹙其情已見持不可卒逐梁軍寶沒封太原王逮周割鄆州之南邑為濟州治巨野故巨野之閻皆寶後中散大夫光祿少卿諱貽慶君曾祖也楚州録事參軍諱化基祖也宣德郎致仕諱仲宣􅊲也君生而茂良兒曹有志於學嘗謂揚名於後世以顯父母為孝隨父官縉雲病其僻絶無與言乃自獻書其親願受業太學不以逺膝下故自㬥以貽親憂乃孟子所說五不孝終身保不犯也其詞踰千言至論死生窮達有命不敢借勢而欲速嗚呼是誠有志也然觀其詞汲汲若與日月競迭微猶茫然如不及者感慨異甚蓋居太學才一年輿疾而㱕卒於家其親念其平生言而痛之其族人見其勤苦而望其有成者惜之而鄉人之知其誠孝宜顯者以不盈而得害咸歎其不可知也有詩六十二篇率多志士幽隱良玉毁棄騏驥不乘冶容巧舌但悅兒女反掌凋謝之意寂寥可傷也娶趙氏大理評事某之女亦卒評事無子而女得其父産以㱕君甚厚宣德君謝事良窶因得以養有餘則以分族人不私也子一人闓業進士亦愛孝操心慮患欲不墮其先人之志甚恪女一人嫁王應臣亦進士闓卜某年月日將葬君於磁州某縣某鄉之原以君嘗與某游其求銘踰書五返而益堅某既知君不得辭銘曰梗柟豫章可成棟梁拱把而毁傷藜莠蓬蒿實害嘉苗雨露以翹翹曰山虞老農之罪而山虞老農不願其如是豈非命耶夫人閻氏墓志銘故大理寺丞充刑部詳覆官朝君諱端本之夫人閻氏濟州巨野人也􅊲單州司戶參軍贈宣德郎諱德基蚤卒妣孝感縣太君張氏寡而材教其女甚修士爭與㛰故夫人年十九㱕朝氏而大理君復蚤世夫人恭儉守義族姻更賙之嘗從其兄今奉議郎致仕仲約官江州因受道家籙逮補之為尚書郎及守河中也皆迎夫人以居而補之之以太平觀食而居緡也夫人不果來崇寧二年六月甲戌歿享年六十有五生七子皆不育一女嫁故集賢院學士杜公諱純之子承奉郎開又以産夭夫人􅒘是得疾悲啼不捨榻竟以歿且瞑猶綱紀其後事不亂前此杜氏以其外孫君渥從始孩矣隨其柩而號行路傷之而大理君於補之為叔父補之痛君之無祿也既以歲甲子冬十月乙酉葬君魚山矣故夫人之亡十八日七月辛卯克袝于魚山之塋且嘗誓于大理君曰惟歲時薦享則先人之不肖子補之在乃先人之祀未墜於地則叔父飲食如生今夫人之葬也言猶在我先祖先人尚聞之銘曰生無以養既養矣死無以葬既葬矣抑富貴而多子相去乎此其能幾吁嗟夫人可寧止右通直郎楊君墓志銘元祐八年二月戊辰右通直郎新通判河中府事楊君卒于家其孤若狀君行以抵其外兄朝補之而哭曰若不夭我君志義宜承吾祖後光大我家以垂裕我不肖孤而位與年止此若念此痛於心我君嘗言吾所與游衆而吾甥知吾志然則非外兄誰銘尚慰我不肖孤補之哭曰自我為兒時從夀光夫人於外氏舅愛我厚導我於學甚恩竊不自少謂舅才業可任重而迄不偶其敢嫌於戚以沒舅美謹按楊氏系出弘農華陰漢興有喜為郎騎追項羽初封赤泉侯喜後有寶王莽時不應聘蓋救黃雀山中而夜有童子致白環四云後當出三公如此者寶生震震有令德亦致三鱣之異震生秉秉生賜賜生彪皆忠孝竟四世為三公如童子言雖其後分裂猶世多大人顯士非他姓比而君諱某字節之世家單州成武自曾祖諱超以上遭五代之亂遁逃不仕祖諱善基始徙濟州任城以學術行義教授其鄉生二子為郎纍贈尚書刑部侍郎而尚書比部郎中贈右朝議大夫諱早君􅊲也幼彊學事親孝慷慨有大志聲聞山東既冠以經明起家歷畿令州守數決大事疑獄不侮鰥寡不畏彊禦有古循吏風顧喜言兵挽弓至一石平居論議慕班超之為人近臣亦屢以此言不果試前夫人鄭氏先沒繼夫人向氏封福昌縣太君而君向出也故以其外祖父龍圖閣直學士傳式恩任郊社齊郎生警悟異甚年十六舉進士以髙等薦即知名尤為吳申江淵諸生進名士所稱文采贍逸造端立語則破的驚人初調密州諸城主簿再舉進士又首薦不第遂盡屛其少所學益治經􅊲古去華而居實矣諸城劇邑令以病不勝事去君承令乏吏少君君為晦圭角調聏不遽吏稍縱因微得其宿姦狀盡置諸理一邑大駭時清獻趙公抃方安撫青州亟言君才於朝又以吏事稱再調開封府襄邑縣尉初教保甲君行法不擾而辦歲終以其伍見庭下旍旗弓矢甚整坐作甚習神宗喜又嘗有獲盜功應並賞即擢大理評事喻執政與畿內大邑以觀其能而用它事忤當塗得知真州六合縣又左遷監荆南府酒轉運使趙鼎提㸃刑獄事周尹爭薦辟各欲為己辦事者移監鄂州都作院改承事郎守朱夀昌數移疾輒以郡政屬君而幕府熟君名亦不以為嫌也丁福昌憂免喪知廬州慎縣江南俗喜訟而慎多豪右率以財陵其里人而屈之少忤則使其黨毆藉或擲其陰事于官無不至君發其尤無良者一人以徇訖其去無復以此至庭者有吏犯賕覺而當法輕君繩之急吏反賄民往誣君以事於戶部君為不知者而民詞窮自歸君諭以誠釋之巡撿王軫嬖其親卒而御其下慘衆洶洶欲為亂軫懼求解其官去君曰我在君無恐即召軫所嬖懲之而喻安其衆衆不敢動軫用以全父老以謂自皇祐逮元豐四十年才兩令前李處厚後君也再知鄆州陽榖縣政如慎而滋有聲民以小忿夜與奴殺田客獄未竟㑹君暫出其人賂吏求去奴絶口因以奴病聞君已知之衛奴甚謹計不得逞卒伏辜有殺其鄰之子者尉視之類刀傷而得斧尸旁不可詰君獨陰使人探其簀得刀而藏之因語囚悉上汝家刀囚數其狀悉而諱簀中者君出刀示之曰此誰物也而不數即叩頭請死轉運使范鍔每行部至境輒反其斾曰此故慎縣才令必刃有餘地也京東多盜而陽榖接河朔君勸民以衣食之本盜為衰囹圄屢空吏無所措其手民相與謡曰吾邑有難遇事十今令自為令一也蓋歷數其能皆聞見所無者吏雖初不便君既束君法人人幸無過久反自慶以謂令保我至此擢通判河中府未行一日㑹其昆弟族人飲甚歡將休忽坐帷後瞑不語家人就呼之逝矣享年五十一歷官宣義郎宣德郎右通直郎勳武騎尉服五品娶錢氏丞相文僖公惟演之孫而殿中丞曄之女封樂夀縣君有淑德善於舅姑宜其家二子若鄉貢進士彊記而文能幹其蠱者也革少卒一女未娉將以某年月日葬於任城縣千秋鄉千秋里從朝議公之兆也君忠信和裕孝於親生事死葬無愧者敬伯兄猶父而鞠其嫠妹恩為人風儀修整書畫妍楷談議翛然晉王夷甫衛叔寶之流也至其居官有守遇事剛果所至人受其惠則又人不可及者好書多所觀覽而尤善昜於文喜韓愈嘗道黃州以所為詩賦贄睂山蘇公公歎息為文美之上即位之初上書言時事大槩欲久監司守令之任􅊲百司課均坊市昜捐牧地租略已施行初補之先君以文詞德義寬厚愛人有美名州閭人慕學之舅以童稚從先君先君固言舅少成矧補之壯長聞見如是懼不肖述事不能白矧曰敢以其昵私舅詩曰言念君子溫其如玉桃李人且猶蹊其下如舅玉也不繅藉以奠諸廟而毁於櫝中是可以為求者惜銘曰天固不愛物不然何以鍾其美而與之不為用以屈物固不自愛不然何以輕吾寶而喪之昜所徇於外爰有至理是不自期繄厥所遭孰知妍媸彼玉而美而未始以為美碔玞佩爾而玉亦不自謂其如桃李嗚呼舅氏進士清河張君墓志銘並序君張氏諱鼎字正之張氏得姓逺周宣王時有張仲春秋時有張老兩人最顯其後杜陵人張湯以法律取漢三公傳子安世至純凡七世侯蓋班固嘗言馮商稱湯與留侯同祖而司馬遷不言又怪漢興以來侯者百數而未有如富平久者意湯雖酷烈以其推賢故有後而余嘗竊以謂留侯豈特其才智漢無雙而輔漢救民於亡秦虎狼塗炭之中生息二百餘年事成乃翛然推而不居本其處心使世果有辟榖不死之說非妄者如良乃當得之而良死僅傳子不疑即絶此不可知者及得商所稱然後乃知湯之忮刻雖其逹賢恐不足相補而富平之所以久殆良祖以來君子長者之風故迄今雖分裂微晦然張姓遍天下亦盛矣而君之先蓋鄆州須城人自五代之亂纍世隱居以孝稱逮君曾祖始徙濟州巨野而諱宗孺者君􅊲也富而好施以壅培其子讀書為士君用勉礪有立初泰山孫復家居傳經聲聞山東其一時貴人賢士爭師之後仁宗召復居太學而君往執弟子禮因盡得與其門人髙第游受復春秋尊王說然猶以取科名慰親意為事而於時翰林鄭公獬滕公甫場屋聲藉甚亦與君厚乃以詩賦舉進士不中第治其業益勤㑹其父病就養者纍年因歎曰士遇合有命若可以力挽取非命也遂不復措意尋遭父喪茹蔬摧瘠自是益外名譽略威儀鄉人之賢不肖善惡皆與之齒窮閻寒家慶弔必在雖塗潦不乘曰無以見里之老人家故饒於財而奉養薄不以饒故欲可侈而昜其所聞於儒者也至賙人之急則竭其力恐不逮故食客常滿堂嘗買田三百畝以待宗黨之貧無㱕者使葬且養焉歲凶出粟數百斛食流殍所活以千計為人寬厚坦夷喜讀書樂善而好信鄉人有爭者至就平曲直勸譬而去無不滿意此其身既不偶而退行之家一二之大槩也母房氏有淑行老疾危甚君夜禱于庭即夢得期三年后如期亡人以為孝誠所感云娶許氏繼孫氏皆善其內事子一人仲原嘗以進士舉禮部講肄有聞工為詩溫恭樂義致客之多如其先人五女嫁房經薄演髙修房之才程獻夫皆同郡良士而經以明經獻夫以進士俱嘗預計偕諸孫男女八人男紳詢績綱紹女長適進士翟光弼餘二幼以元祐六年六月甲辰卒年六十有八初君􅊲以上皆葬巨野之比干村而地多水君疾且革語仲原曰欲為先人改卜今不能以為恨汝無忘吾志則是吾不沒也仲原泣曰諾既而卜任城縣之諫議鄉吕村吉乃遷其先柩及君與兩夫人之喪祔焉實元符二年九月某日也仲原與余兒曹俱學相好求銘㫺馬少游常哀其兄援慷慨有大志以謂士生一世取衣食裁足乘下澤車御款段馬使鄉里稱善人斯可矣致求盈餘且自苦爾而援後遭光武立功萬里之外光於竹帛亦可以無憾而當其臥浪泊時至念少游平生語若不可得方余年少意援老憊志昜不然何愧於少游者後余宦學四方無所成就既未有援毫髮可以厭足加齒未若援老也而已非元龍上床之意從許君問舍之事不自知與前日之慮昜然後益知少游逹識果足以愧援而君亦優游耆艾無慕於世當昜一爻不出户庭無咎者以是銘君其誰曰不然銘曰士生委質功業林匪學問意皆侈心使成炟赫固莫任況事與志常嶇嶔尾閭其損得蹄涔一羽之徇捐千金少猶頴脫中悔侵念平生語安可尋但自惡影忘息陰有良里士裂冠襟不與一世驅駸駸髙明之室有物臨取裁足爾吾良針瓶轠于瓽惟久淫淡泊可守寧適今畏名勿取神所歆後枝葉茂􅒘根深單父主簿單君墓志銘君諱拯字濟甫淮陽下邳人家故饒於財而祖翼􅊲琇以樂誼好施聞琇生四子皆為士而君結髮游學嶄然兄弟間彊有力知恥為文辭敏麗太學諸生交譽之嘗四舉禮部不中同時流輩或蚤得科名通顯獨潦倒庠挍而志不屈年五十始中進士第調登州文登萊州膠水二主簿困窮久閲義理多知道以愛人為本教民次之故所居官輒欲行其志嘗攝令文登民有怒其子草屛諸戶外者旦視碎首而死其家疑鄰父執之鄰父不能自明且具獄矣君疑不情夜就訊方泣稱冤遽破械出之捕得其殺者一邑歡駭然君未始以為功也沈於銓選者二十年晚復調單州單父縣主簿未至以疾卒大觀二年某月甲子也享年七十娶同里莊氏男許學問有立女二人適進士聶綸郭闢之以卒之年四月甲子葬于下邳縣某鄉之原君為人豈弟尚氣遇事便發不藏宿怨怒故忤物而物不忌或戒以昜言近悔自以義當出此不化也其家數世不異籍無親疏若一淮陽守龍圖閣學士趙公卨欲上諸朝旌表之君辭曰此在民為難於士為常不敢以是徼名既仕不遇欲投紱去即所居為東齊呻吟論說其間悠然自得國子祭酒顔公復為文以記之初某未冠游下邳君亦未壯平居學問相好也得罪家居一日君過門歡然道故意加篤夜踰半忽索馬去挽留之不可無幾何而聞其卒悲夫君尤與里人隴干令聶循矩善聶良士自言嘗從君學乃狀其行來聶謂君單姓官單州單父為以歿與柳子厚死柳州事符雖戲論亦異矣銘曰士生欲其志之成也家人欲其仕之榮也交游欲其義之行也志雖卷然亦成仕雖屈然亦榮義雖不試然亦行所得在此所失在彼在此而得展余喜在彼而失匪余恥嗚呼賢矣濟北朝先生雞肋集卷第六十八
