front:
  text: 濟壮晁先生雞肋集序雞肋集左朝奉郎秘書省著作郎充秘閣校理國史編脩官濟北晁補主无咎自名其所為詩文也夫物有質者必有文文者質主所㕥辨也古主立言者當主采居論説諷詬應物接事不能無言非席豹犬羊之異也食主則無所得棄主則可惜其雞肋采故裒而蔵之謂之雞肋集元祐九年二月旦日序濟北晁先生雞肋集總目
