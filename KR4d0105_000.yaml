front:
  text: 濟壯朝先生雞肋集序雞肋集左朝奉郎祕書省著作郎充祕閣校理國史編修官濟北朝補主無咎自名其所為詩文也夫物有質者必有文文者質主所以辨也古主立言者當主采居論説諷詬應物接事不能無言非席豹犬羊之異也食主則無所得棄主則可惜其雞肋采故裒而藏之謂之雞肋集元祐九年二月旦日序濟北朝先生雞肋集總目
