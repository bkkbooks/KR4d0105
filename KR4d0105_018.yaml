body:
  text: 第十八卷律詩自蒲赴湖至板橋逢杜謀伯和石明叔喜雪次韵韓求仁南臺朝請晚過南湖見寄再用前韵和荅用前韵荅李行正教授次韵和求仁不赴照碧堂㑹呈無愧之作求仁復示怨句次韵元符戊寅與无斁弟卜居緡城東述情次韵信守李秬二首再和嘉父見貽次韵嘉父喜雪次韵信倅練定夢雪中過王侍郎次韵李秬靈山亭宴集寵戲之句次韵李秬梅花次韵李秬祥符軒次韵李秬重修宴亭次韵李秬新菴次韵李秬新移牡丹二首次韵李秬約賞牡丹次韵李秬雙頭牡丹次韵李秬賞花次韵李秬酴醾立春日呈通守資中通直題文潛詩冊後次韵杜天達見寄景修二十嵗襃為鄉舉之首晚乃尉青田無不遇色其里人晁補之為賦五十六字以别且勉之赴元老劉元之集呈十二朝請十五推官二叔父兼呈元老邦式諸公次韵棠美甥晝眠和王定國見寄和歐陽宣徳經野步目録終濟北晁先生雞肋集卷第十八律詩七言自蒲赴湖至板橋逢杜謀伯二年兩度踏京塵猶喜常逢杜子春文學老来從舊日金蘭同好更何人身慙隨檄終難彊計欲㱕耕未敢陳正是桃花紅似血不應無酒但霑巾和石眀叔喜雪解凍南風故未􅝪六英先嵗舞車塵盡消日觀千巖雪初破江梅一蕚春立召金閨通籍客更呼花豓大堤人使君日飲無功業同樂何妨亦為民次韵韓求仁南臺朝請晚過南湖見寄浮花浪蕊信東西何許尋芳去自遲流景不須驚石火寸田應已長瓊枝想君清興聊堪發遺我憂心久欲夷便作崔丞日臨水鳬行擿尾不須知再用前韵和荅當時同赴飲城西傾葢論心已恨遲湖海可無年少氣雪霜還有嵗寒枝功傳汗竹藏王府詩入文􅋶動島夷不會書生安用此眼前睫固未曾知用前韵荅李行正教授見我淮南被召西重来學館尚棲遟未容小隠通三徑聊可卑飛共一枝飲罷玉山方突兀賦成筆陳已淫夷霜荷葉歎青衫舊聞子修身自畏知次韵和求仁不赴照碧堂會呈无愧之作政成歡誦沸田萊畱鑰雍容更上才繚郭平湖從㫺好倚天朱檻為誰開曵裾况是他年舊倒載何妨盡日陪自有登髙能賦客可容清坐詠南臺臺南香見傳燈静坐一罏求仁復示怨句次韵聞説高情久泬寥縶維誰與永今朝五車猶累方書好萬物先從辯說彫已向季咸心獨醉更緣順子意都消清秋璧月凉如水莫遣纖雲翳紫霄元符戊寅與无斁弟卜居緡城東述情四海一居何處卜北窗祗取見家山要無名利來心曲便有園林出世間拙宦莫興三黜歎老㱕未厭百年閑先君餘慶期之子吾駕如今不可還次韵信守李秬二首誰榜鈴齋作面山晦明終日卷簾看賦成夜燭纔銷寸衙退朝曦未半竿枉渚孤吟愁旅雁薄宦以况蘇門雙嘯駭朱鸞公贈酬以况二平生五袴何須詠一借黄鍾變谷寒愛山何必竢㱕山簿領忙時撥置看閶闔自應行發軔珊瑚終未拂垂竿樽中屢許陪文舉廡下猶堪寄伯鸞便作功成同范蠡白鷗盟誓不教寒再和嘉父見貽使君心賞在髙山櫟社寧煩匠石看能似鼠多愁渡谷仕如鮎鈍笑縁竿田録見㱕威儀披霧窺文豹音韵當衢聽玉鸞曾共廣陵花下醉綈袍應歎一何寒次韵嘉父喜雪六出先春兆物華故撩高韵發車斜散榆天上齊飛筴布玉畦中盡吐芽梁苑俊逰風不極剡溪清泛月無涯雄豪樂事幽人詠都屬江南太守家次韵信倅練定夢雪中過王侍郎夢覓毗耶看雨華玉城銀澗過縈斜乍疑霧廓千峯障未覺䨓驚萬谷芽碧落清談元物外卿上貳金閨高興共天涯車上貳寒雞喚起新詩就誰憶袁安正卧家次韵李秬靈山亭宴集寵戲之句勝游誰繼竹林賢峴首髙情自邈然寳刹千尋出天半靈山三面落樽前梅花摘得寜煩驛桃葉呼來不用舩南楚何須說竆巷且陪鈴閤聽鵾絃詩古渡江不用楫桃葉復桃葉次韵李秬梅花寒巖幽霧不曾開殘雪猶封宿草荄一蕚故應先臘破百花渾未覺春來慙非上苑青房比誤作唐昌碎月猜常恨清溪照疎影橫斜還許落金盃次韵李秬祥符軒雲端紅粉拊雕欄謝守綸巾語笑間游客乍驚人外境居僧初識面前山暫来猶足畱公賞借與眞堪著我頑鈴閤多餘賓從少誰敎平缾盎不曾閑自謂補之次韵李秬重修宴亭壁間雙記快沈㝠山畔譙門水畔亭相國名因稽古白使君眼為好賢青廢堤不復風揺桺新檻依然月滿汀羈旅從公厭游樂欲圗佳致作幽屛次韵李秬新庵無心何用說心灰庵在青蘿緑篠隈自可談間公事了不妨閑處道書開更㩦邀月清樽上只著登山小屐來桃李他年應勿剪使君嘉譽在閨臺次韵李秬新移牡丹二首史君著意與深培為向吳宮好處來得地且從三月㬉眀年應更十分開溱傍芍藥羞香骨江裏芙容妬豓腮雲雨鴻龍摠非比沈香亭北漫相猜笑倚東風㡬百般忽疑洛渚在江干玉容可得朝朝好金盞須教一一乾送目漢皋行已失斷魂巫峽夢將殘七閩溪畔防偷本四照亭邊更著欄次韵李秬約賞牡丹夭紅濃緑總教囘更待清明榖雨催一朶故應偏晚出百花渾似不曾開常誇西洛青屛簇久說南滁紫線堆任是無情還有意不知千里為誰來次韵李秬雙頭牡丹寒食春光欲盡頭誰抛兩兩路傍毬二喬新獲吳宮怯雙隗初臨晉帳羞月底故應相伴語風前各是一般愁使君腹有詩千首為爾情如篆印繆次韵李秬賞花天香國色競新竒初過清明未覺稀困舞尚迎風嫋嫋醉粧猶弄日暉暉飄零洛下千金價慙愧江南百草菲謝守多才最憐爾百篇能伴羽觴飛次韵李秬酴醿夭紅瑣碎競春嬌後出何妨便奪標雲鶴嬉晴來萬隻玉龍驚震上千條蓐収晃蕩風前仗蕚緑飄翩月下綃㑹向瓊林亭畔見天涯相遇一魂銷立春日呈通守資中通直揺軒柳態未應還正在憑高望逺間一夜春風吹北渚清晨佳氣滿南山動頭樂事從今數信手詩章莫放閑但惜濉陽蔡公子鸎花爛漫向京闗題文潜詩冊後君詩容易不著意忽似春風開百花上苑離宫曾絶豓野牆荒徑故幽葩愜心芻豢非雜俎垂世江河自一家頭白昬昬醉眠處憶君頻夜夢天涯次韵杜天達見寄冷屋寒舟兩處懷一封㱕信隔年開愁容頓與河冰泮佳思先隨岸桺來射雉便甘忘我矢畫蛇何怪奪君柸端知雪裏清吟好未減山陰興盡囘景修二十嵗褎為鄉舉之首晩乃尉青田無不遇色其里人晁補之為賦五十六字以别且勉之一尉三千五百里㫺人嘗已歎沈英陸機文賦成童妙梅福官資向老清盡說江山多勝事且臨風月慰髙情它年見我長安道貨藥無心更避名赴元老劉園之集呈十二朝請十五推官二叔父兼呈元老邦式諸公故鄉等作異鄉愁常笑吾生不自謀百日狂風春草草十年㱕夢客悠悠倦游情話陪諸父老罷親鋤學故侯得坎椉流兩皆可名亭應不用三休次韵棠美甥晝眠炎歊暫卧北窗凉更覺甘如飰稻粱宰我糞牆譏敢避孝先經笥謔兼忘憂虞心謝知更雁安穩身如掛角羊要識熈熈不争競華胥别是一仙鄉和王定國見寄請說當年王武子淮南别椉謫仙人自從金馬還通籍直恐瓊花便不春遺愛誰方府中步舊時獨埽壁間塵平山送目思公子自許詩成覺有神和歐陽宣徳經野步汴流時入遡風何敢祝淮神青律飛灰氣自醇顧我衰容唯殢酒因君佳句始知春山中桂子年年好觀裏桃英日日新延對彤廷須努力方就引對時歐陽君詹生學問及昌辰濟北晁先生雞肋集卷第十八
