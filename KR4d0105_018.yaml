body:
  text: 第十八卷律詩自蒲赴湖至板橋逢杜謀伯和石明叔喜雪次韻韓求仁南臺朝請晚過南湖見寄再用前韻和答用前韻答李行正教授次韻和求仁不赴照碧堂會呈無愧之作求仁復示怨句次韻元符戊寅與無斁弟卜居緡城東述情次韻信守李秬二首再和嘉父見貽次韻嘉父喜雪次韻信倅練定夢雪中過王侍郎次韻李秬靈山亭宴集寵戲之句次韻李秬梅花次韻李秬祥符軒次韻李秬重修宴亭次韻李秬新菴次韻李秬新移牡丹二首次韻李秬約賞牡丹次韻李秬雙頭牡丹次韻李秬賞花次韻李秬酴醾立春日呈通守資中通直題文潛詩册後次韻杜天達見寄景修二十嵗褒為鄉舉之首晚乃尉青田無不遇色其里人朝補之為賦五十六字以别且勉之赴元老劉元之集呈十二朝請十五推官二叔父兼呈元老邦式諸公次韻棠美甥晝眠和王定國見寄和歐陽宣德經野步目録終濟北朝先生雞肋集卷第十八律詩七言自蒲赴湖至板橋逢杜謀伯二年兩度踏京塵猶喜常逢杜子春文學老來從舊日金蘭同好更何人身慙隨檄終難強計欲歸耕未敢陳正是桃花紅似血不應無酒但霑巾和石眀叔喜雪解凍南風故未􅝪六英先嵗舞車塵盡消日觀千巖雪初破江梅一蕚春立召金閨通籍客更呼花艷大堤人使君日飲無功業同樂何妨亦為民次韻韓求仁南臺朝請晚過南湖見寄浮花浪蕊信東西何許尋芳去自遲流景不須驚石火寸田應已長瓊枝想君清興聊堪發遺我憂心久欲夷便作崔丞日臨水鳬行擲尾不須知再用前韻和答當時同赴飲城西傾蓋論心已恨遲湖海可無年少氣雪霜還有嵗寒枝功傳汗竹藏王府詩入文􅋶動島夷不會書生安用此眼前睫固未曾知用前韻答李行正教授見我淮南被召西重來學館尚棲遲未容小隱通三徑聊可卑飛共一枝飲罷玉山方突兀賦成筆陳已淫夷霜荷葉歎青衫舊聞子修身自畏知次韻和求仁不赴照碧堂會呈無愧之作政成歡誦沸田萊留鑰雍容更上才繚郭平湖從昔好倚天朱檻為誰開曵裾况是他年舊倒載何妨盡日陪自有登髙能賦客可容清坐詠南臺臺南香見傳燈靜坐一罏求仁復示怨句次韻聞説高情久泬寥縶維誰與永今朝五車猶纍方書好萬物先從辨説雕已向季咸心獨醉更緣順子意都消清秋璧月涼如水莫遣纖雲翳紫霄元符戊寅與無斁弟卜居緡城東述情四海一居何處卜北窗祗取見家山要無名利來心曲便有園林出世間拙宦莫興三黜歎老歸未厭百年間先君餘慶期之子吾駕如今不可還次韻信守李秬二首誰榜鈴齋作面山晦明終日卷簾看賦成夜燭才銷寸衙退朝曦未半竿枉渚孤吟愁旅雁薄宦以况蘇門雙嘯駭朱鸞公贈酬以况二平生五袴何須詠一借黃鍾變谷寒愛山何必俟歸山簿領忙時撥置看閶闔自應行發軔珊瑚終未拂垂竿樽中屢許陪文舉廡下猶堪寄伯鸞便作功成同范蠡白鷗盟誓不教寒再和嘉父見貽使君心賞在髙山櫟社寧煩匠石看能似鼠多愁渡谷仕如鮎鈍笑緣竿田録見歸威儀披霧窺文豹音韻當衢聽玉鸞曾共廣陵花下醉綈袍應歎一何寒次韻嘉父喜雪六出先春兆物華故撩高韻發車斜散榆天上齊飛策布玉畦中盡吐芽梁苑俊逰風不極剡溪清泛月無涯雄豪樂事幽人詠都屬江南太守家次韻信倅練定夢雪中過王侍郎夢覓毗耶看雨華玉城銀澗過縈斜乍疑霧廓千峯障未覺雷驚萬谷芽碧落清談元物外卿上二金閨高興共天涯車上二寒雞喚起新詩就誰憶袁安正卧家次韻李秬靈山亭宴集寵戲之句勝遊誰繼竹林賢峴首髙情自邈然寶剎千尋出天半靈山三面落樽前梅花摘得寧煩驛桃葉呼來不用船南楚何須説窮巷且陪鈴閣聽鵾絃詩古渡江不用楫桃葉復桃葉次韻李秬梅花寒巖幽霧不曾開殘雪猶封宿草荄一蕚故應先臘破百花渾未覺春來慙非上苑青房比誤作唐昌碎月猜常恨清溪照疏影橫斜還許落金杯次韻李秬祥符軒雲端紅粉拊雕欄謝守綸巾語笑間遊客乍驚人外境居僧初識面前山暫來猶足留公賞借與真堪著我頑鈴閣多餘賓從少誰教平瓶盎不曾間自謂補之次韻李秬重修宴亭壁間雙記快沈冥山畔譙門水畔亭相國名因稽古白使君眼為好賢青廢堤不復風搖柳新檻依然月滿汀羈旅從公厭遊樂欲圗佳致作幽屛次韻李秬新庵無心何用説心灰庵在青蘿緑篠隈自可談間公事了不妨間處道書開更㩦邀月清樽上只著登山小屐來桃李他年應勿剪使君嘉譽在閨臺次韻李秬新移牡丹二首史君著意與深培為向吳宮好處來得地且從三月暖眀年應更十分開溱傍芍藥羞香骨江裏芙容妬艷腮雲雨鴻龍總非比沈香亭北漫相猜笑倚東風幾百般忽疑洛渚在江干玉容可得朝朝好金盞須教一一乾送目漢皋行已失斷魂巫峽夢將殘七閩溪畔防偷本四照亭邊更著欄次韻李秬約賞牡丹夭紅濃緑總教回更待清明榖雨催一朵故應偏晚出百花渾似不曾開常誇西洛青屛簇久説南滁紫線堆任是無情還有意不知千里為誰來次韻李秬雙頭牡丹寒食春光欲盡頭誰拋兩兩路傍毬二喬新獲吳宮怯雙隗初臨晉帳羞月底故應相伴語風前各是一般愁使君腹有詩千首為爾情如篆印繆次韻李秬賞花天香國色競新竒初過清明未覺稀困舞尚迎風嫋嫋醉粧猶弄日暉暉飄零洛下千金價慙愧江南百草菲謝守多才最憐爾百篇能伴羽觴飛次韻李秬酴醿夭紅瑣碎競春嬌後出何妨便奪標雲鶴嬉晴來萬隻玉龍驚震上千條蓐收晃蕩風前仗蕚緑飄翩月下綃會向瓊林亭畔見天涯相遇一魂銷立春日呈通守資中通直搖軒柳態未應還正在憑高望逺間一夜春風吹北渚清晨佳氣滿南山動頭樂事從今數信手詩章莫放間但惜濉陽蔡公子鶯花爛漫向京關題文潛詩册後君詩容易不著意忽似春風開百花上苑離宫曾絶艷野牆荒徑故幽葩愜心芻豢非雜俎垂世江河自一家頭白昏昏醉眠處憶君頻夜夢天涯次韻杜天達見寄冷屋寒舟兩處懷一封歸信隔年開愁容頓與河冰泮佳思先隨岸柳來射雉便甘忘我矢畫蛇何怪奪君柸端知雪裏清吟好未減山陰興盡回景修二十嵗褎為鄉舉之首晚乃尉青田無不遇色其里人朝補之為賦五十六字以别且勉之一尉三千五百里昔人嘗已歎沈英陸機文賦成童妙梅福官資向老清盡説江山多勝事且臨風月慰髙情它年見我長安道貨藥無心更避名赴元老劉園之集呈十二朝請十五推官二叔父兼呈元老邦式諸公故鄉等作異鄉愁常笑吾生不自謀百日狂風春草草十年歸夢客悠悠倦遊情話陪諸父老罷親鋤學故侯得坎乘流兩皆可名亭應不用三休次韻棠美甥晝眠炎歊暫卧北窗涼更覺甘如飰稻粱宰我糞牆譏敢避孝先經笥謔兼忘憂虞心謝知更雁安穩身如挂角羊要識熙熙不爭競華胥别是一仙鄉和王定國見寄請説當年王武子淮南别乘謫仙人自從金馬還通籍直恐瓊花便不春遺愛誰方府中步舊時獨掃壁間塵平山送目思公子自許詩成覺有神和歐陽宣德經野步汴流時入遡風何敢祝淮神青律飛灰氣自醇顧我衰容唯殢酒因君佳句始知春山中桂子年年好觀裏桃英日日新延對彤廷須努力方就引對時歐陽君詹生學問及昌辰濟北朝先生雞肋集卷第十八
