front:
  text: 濟北朝先生雞肋集目録
  hash: sha256:af71eac6dde752a2a40652d11f1b8029623a3743c0dd5aa0c8159efe7eb844af
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0105_SBCK_004-1a}
body:
  text: 第四卷古詩擬古六首上鮮于大夫子駿西北有髙樓東城髙且長亭前有竒樹冉冉孤生竹涉江採芙蓉生年不滿百建除體二首答魯直八音歌二首答魯直感寓十首次韻魯直西㱕七首次韻泗州十五叔父感興五首次韻李希孝飲酒二十首同蘇翰林先生次韻追和陶淵明濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第四古詩擬古六首上鮮于大夫子駿西北有髙樓西北有髙樓縹眇齊紫清周欄十二折飛鸞結丹楹上有絃歌女充耳以黃瑛當窗弄白日顔若苕之榮陽阿奮哀響梁欐有遺聲不惜厲清商零霜飛園英誰為聽之者皎皎自知明幸承遺褋眷同車以遐征東城高且長東城高且長下瞰阡與陌谷風麗百草春華紛已白良時忽如此馳景一何逼喟彼飯牛詩終年守寒厄恭儉夙所敦葛屨傷褊窄身為物逆旅生乃逺行客豈無百日蠟樂此一日澤美人顔煌煌竒服爛五色彈筝奪新響杯酒縱相索鬭雞逐狐兔六博呼一擲貧士悲失職坎壈何所迫安知黃鵠舉隨時振六翮庭前有竒樹庭前有竒樹好鳥鳴喈喈朱榮被紫蕚采掇以忘懷棄置而不省秋風淒以摧不惜朝華草君行殊未來冉冉孤生竹冉冉孤生竹託根中谷卑結髮事君子江蘺近華池江蘺榮有時逮此春冰期玉盤有嘉餐思君以忘飢棗下何纂纂朱實亦離離秋風一披拂菀其為枯枝願垂太陽惠照妾葵藿微涉江采芙蓉涉江采芙蓉江上零露滋方舟不能度日草白蘋悲清波有鳴鴻蕩漾安可期幸因南風逝寄言欽所思生年不滿百生年不滿百一日何三秋花開苦多雨何不張幕游行樂時不再春榮豈長在古人輕尺璧愚者昧所戒君看龍與虎飄忽不相待建除體二首答黃魯直教授建䇿移漢都奉春緣衣布除地願見公乃以舍人故滿船載明月且復酌清酤平旦襏襫出牛羊下來草定境要兩言出處非竝趣執臂欣逢迎秋蘭在堂下破甑雨生衣蹇不改兹度危莫如人心難莫如行路成事安得悔來者其可悟收拾不須陳千言一棄屨開門見井市終歲紛遑遽閉門面牆壁少日豐暇豫建鼓求亡子初昧學所之除去日月多及此歲未遲滿國和巴人若士誰與知平陸不推舟客行當來兹定居厭屋廬風雨勞所思執鞭慕㫺人孰與並此時破裘不御冬要假完腋裨危言則來詬愼密又逢譏成德尚如是薄志安能期收聲復藏熱雷火忽然微開口且復歡是事置勿推閉眼可內視獨復不自為八音歌二首答黃魯直金蘭况同心莫樂心相知石田罹清霜念此百草腓絲看煮繭吐士聽憤悱語竹馬非妙齡美人恐遲草匏繫魯東家今君尚天涯土膏待陽疸氣至如咄嗟革薄不可廓士迫下流惡木無松柏心蝎處螻蟻託金丹妙通靈子有遺世術石髓不成餐閔豫多滯骨絲聲紡事草搗聲寒事來竹葉將菊花及時同一杯匏器祀天地貴質不貴華土緣井渠繁生氣泄大和革面固非性小人變丹青木雞本無心風雨安所能感寓十首次韵和黃著作魯直以將窮山海迹勝絶賞心晤為韵鳲鳩興獨居百兩誰與將未見憂忡忡既覯為龍光吹竽沸齊市零雨暗空桑寒歌牛軛底激烈氣彌剛雁以無能亨鼠以有技窮古來達生者神不馳其胸物或似而非藁本奪芎藭臧否何間然吾師阮生風倉鶊知陽春喬木聲關關白駒不食苗奈此空谷寒㫺有丹徒士檳榔貯金槃富貴懷隱憂無寧歸故山吾期瑶之圃玉英良可采崑崙在萬里積石更磊磈學經儻無用詩禮發含琲叢臺尚何為袨服若煙海鼓吹出西羌光華動睂額鞬櫜望酒泉面有可憐色念身匪兕虎少日四方迹百計等畫蛇老大悲故國謝公文章餘幽事課伐嶺清詩如玄酒胡乃淡而永得無西堂夢春草句彌勝但使田野傳何須論銘鼎江南盛鬱蒸代北紛霰雪卞生無出游何以得此刖一朝有天運春華未萎絶吾猶託雄鳩而彼固不拙平生莫逆交弦斷寄心賞相思望青楓目極江水上念當及時節農事動春壤來者不有年何能咎吾往楚有吹竹者工作百獸音削格為爾多滔滔寧適今嘗俾範馳驅終日無一禽復之儻或可詭遇亦何心葉公好畫龍龍固不可晤安知下其室驚駭暗楹霧昭王亦貿骨冀以得馬故相者競舉肥終然駒逺去西歸七首次韵和泗州十五叔父潔腹不受汚㫺人因食薇薇亦周土生悲哉懷永飢武王與周公聖德天動威奈此二子何猶歎安適歸霏雨晚霑裳零霜曉被路驅車歎時邁所遇一無故悠悠天地宇萬物各有聚閟我冰雪姿幽居從可住草投古店宿夜聞狐狸嘷僕夫告行邁起視月尚高清霜來何許不覺滿我袍逆舍良非時求前兹已勞浮雲如游塵倐忽蔽白日登高念搖落歲草一何疾東陵種瓜事富貴寧可必人生無南北行樂時易失驅馬馬走山回車車漸水塗窮我何適慟哭盈襟淚巢居識風聲穴藏知雨意救鬭曾得傷纓冠亦可已贈君彼風蘭佩之可為璫贈君彼露荷製之可為裳薄言兹擷掇道逺莫置傍峥嶸又歲草與君同所望古人重生男豚酒慶親戚桑弧射四方言有四方役奉璋比德性墮地要膂力如何晉公子安樂忘所適感興五首次韵和李希孝海鳥御羊角飄然凌紫清有背如泰山未覺毛羽輕鹽陽亦羣飛日景為不明空倉自苦飢安得有此名人生須富貴如俟河之清草木競榮華春服亦已輕桑田自足樂未可居髙明君子順天道小人眷時名長歌遺世情滄浪之水清鑠金在衆口折軸􅒘羣輕君子貴同塵安事皎皎明儻在子所呼牛馬亦我名不肯掃一室顧欲天下清少日又不羈頗復鄉黨輕長年始羞悔耳目尚聰明何須更市藥小女故知名春半寒未已今晨天氣清彈冠適新沐搔髮亦良輕但愛百鳥樂復憐一窗明干世寧可期㱕耕良近名飲酒二十首同蘇翰林先生次韵追和陶淵明少賤足可喜險阻更嘗之為親謀斗粟無意出競時緬焉效一官報國方在兹寧當不恤緯對酒懷憂疑學道恨力淺中遭世網持沈飲非荒宴凜然忽頽山或人欲問事已醉不能言古來亦如此名字垂千年但問酒中適豈計飲者傳陶公羣於人而無人之情詩豈世外語世語不可名東坡憐此翁同調但隔生形光來户屨真處人不驚得酒自醒醉放意無虧成園林日夕好花繁時鳥飛少年玩芳物不飲成坐悲只今未白髮念㫺已依依紛華戰吾道決勝當有㱕挫鋭培其根外槁中匪衰念方終日行輜重安得違一眼異青白口語來啾喧酌一不酌一用意何其偏誰似子孫子高栖蘇門山時隨嶺雲出又與林鳥還平生但長嘯獨為嵇生言髙賢衆所懷衆理應取是如何濟衆事難成復易毁功成身無與天運亦復爾軒裳役羣愚兒曹眩文綺庭前兩古柏凌霄燦其英問此誰榮枯雪霜見其情榮枯何足計有酒還自傾熟寐暫展轉覺來一蟬鳴㱕休但如此便足了平生功名有天命美好無定姿雲夢未足吞聊可巢一枝同時金門士文學多瑰竒幞被向淮海酣放遽爾為車蓋豈不榮野馬不受羈城東故鹽渠自㫺誰所開似說全盛時邈焉一長懷穿渠引江水此計未為乖千帆競草入集浦如烏栖萬疇分白浪嘉稻擢新泥恐此太多事且當寄嬉諧疏通養魚鳥花柳共低迷時時載酒往江上亦忘回大明唐來寺廢苑西南隅青松拱髙阜崎嶇有微途肩輿病我皂一馬良可驅衆木媚深壑氣􅝪時雨餘此焉可數醉何用葺吾居蘇公士冠冕復似郭有道知士未達間趣操保耆老精鋼試九火勞倦容不槁為州弟飲酒况此年歲好藏鋒避世故輕敵喪吾寶時來用毫末勳業自世表東漢有兩士才智炫一時三公往訪事臥痾亦見辭偉明獨不然小道安取兹斯人似水鏡與世破昏疑憂國不為身百世那可欺舉杯相歡屬是事亦置之齊居忽若遺不識身與境頗疑酣中似奈爾輒復醒東坡自云然挈世一裘領是事吾有師安敢囊出穎指窮火已傳豈待得薪炳安昌漢耆儒樂飲侈亦至東坡儉不固少飲得徑醉愚敢效戴崇正復思其次旁通獲親愛公亦安所貴便坐時一巵彭宣寧寡味幼聞錦江春欲訪子雲宅叩門問竒字便掃四方跡青雲看一鶚凡毛愧纍百勞公諭伯業齒堅頭未白何當擺俗纍歲月可惋惜王道無偏黨此語聞諸經髙賢如大海亦以衆流成文饒歎維州刀鋸人所更相如後私怨此語驚秦庭小人慮事疏妄意鹽車鳴安得如江酒洗我塵垢情淮南夏早收晚秧亦含風連艫似雍絳千斛輸吳中使君飲酒樂歲美關梁通安得天下人俱忘楚人弓十年一麥禾此歲亦難得寄語吾州人不飲良大惑經時無死市吏責亦可塞先生門弟子佐守同一國舉杯日相屬有句安得默堂堂門下公英發自初仕卷舒固以時出處不為巳朝廷登儒輔德禮民有恥岷峨更峥嶸清風在閭里獨醒固不惡既醉又可紀成王訪落時百室賦盈止吾儕為國謀私愛不足恃黃子似淵明城市亦復真陳君有道舉化行閭井淳張侯公瑾流英思春泉新髙才更難及淮海一髯秦嗟豫競何為十駕晞後塵文章不急事用意斯巳勤平生不共飲歎息無與親問道伯昏室何人獨知津各在天一方淚落衣上巾㱕休可共隱山中復何人濟北朝先生雞肋集卷第四
