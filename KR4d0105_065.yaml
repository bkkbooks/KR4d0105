body:
  text: 第六十五卷墓志銘朝夫人墓志銘穆氏墓志銘進士李公裕墓志銘通直郎權通判環州錢君墓志銘朝奉大夫常君墓志銘通直郎充德清軍使兼知澶州清豐縣事魏君墓志銘四㑹縣尉劉君墓志銘奉議郎高君墓志銘右朝議大夫梁公墓志銘知涉縣閻君墓志銘濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第六十五墓志銘朝夫人墓志銘前達州司理參軍葉君助將葬其夫人朝氏于蘇州吳縣之靈巖鄉寶華山北元祐八年某月甲子吉以書屬夫人之弟補之為銘補之泣曰姊為女與婦以德稱以我銘姊懼不信以人銘姊懼不知雖然為可信者而已乃序之曰夫人世家開封後徙巨野尚書刑部郎中贈特進吏部尚書諱某之曽孫尚書庫部員外郎諱某之孫而先君之弟二女也先君諱某祕書省著作佐郎􅏯系出于周景王之子朝朝之字或為􅏯朝死葬南陽西鄂縣故西鄂之􅏯氏皆自謂子朝後事見裴駰史記而漢御史大夫錯以忠見殺其後因不顯蓋千有一百餘年至宋而後文元公文莊公父子復以文學政事位朝廷􅏯氏始大宗黨至數百人而夫人端豐婉慝自少不妄語言作止有常度而中洞徹事至能辦先君曰是女姿靜甚名之曰靜姊若妹則皆以靜字之族人喜咸曰嫁靜必衆為議對也而司理君吳名家子舉進士知名乃㱕之時年十有九矣葉大族有家法而夫人沈詳莊儉宜其家雞鳴而起治其婦事無違處其長少親疏間恩稱而禮得竭其力以助孤婺矛牙而分不足退而享其薄以為安司理君豪邁不茍合數舉有司見抑有不遇歎夫人輒酌酒飲之陳義甚高則矍然起曰能如是乎吾可不愧故窮居十年終不以不合於有司變其業以求合夫人助之也元豐四年從其舅大夫君提舉兩浙常平倉事八月二十六日暴得疾以卒年三十男曰蘊舉進士好文自立曰蘩卒女長適左奉議郎通判達州事李騊次卒次幼銘曰葉宗有祉姊不逢其祉姊賢若是我言不可悔以昌其子穆氏墓志銘故丹陽進士吳君諱磐之夫人穆氏其先洛陽人後徙廣陵曽祖諱彥璋以閣門祗候採訪兩浙有能聲祖諱琪為鄆州觀察推官父諱之武舉進士皆有學行而夫人少莊靚惠和年二十有一㱕于吳君二十有八而吳君沒服喪以禮綱紀其家事甚飾顧其子敏修始六嵗矣藐然弔影或勉以再行夫人輒泣曰自吾父沒吾母惟我一女子尚能老今置是兒何地且吾用為吾母女自爾屛不與姻黨接日夜誦佛書躬針縷以杜外事而吳氏尚饒於資敏修之諸父求異籍夫人愀然不能止既教敏修惟諸父所與乃取鄉人異之間覽書傳至隂陽數術無不總益訓敏修于學敏修遂以好文修潔稱四方之游士豪傑至者必見焉夫人常躬視食飲舍館以厚其子使與客處切磋成名於是鄉人亦以夫人為賢其母丁氏寡且老猶寓廣陵夫人懷思不忘因歎曰生女不生男㫺人以為恨顧我與子處足自為矣乃迎丁氏舍吳氏㫖甘定省無違迄十有一年恭謹如一而丁氏以夀終又禮葬廣陵而夫人號慕成疾嵗餘亦不起紹聖二年四月甲子也享年若干敏修以其十二月甲子葬于丹徒縣崇德鄉官唐之原從其夫之兆屬補之銘敏修字彥達舊相與游後補之佐淮南㑹翰林沈公存中來與彥達俱益熟其為人彥達學問不茍徇世好為文詞甚工與人交終始不失義知夫人之後方興也孫六人男曰某曰某女曰某曰某皆茂慧銘曰穆之婺矛牙無子有女如有子養葬祭以禮穆氏播其美其嬪于吳氏吳氏復無祉婺矛牙亦不失義以訓子于理吳氏且復起嗚呼賢矣進士李公裕墓志銘進士李君公裕字好問濟州金鄉人尚書工部郎中直史館定之孫而奉議郎通判潞州事衆之子也幼自立事親孝學問文詞蚤成其意以為富貴功名可以力挽取非命也再舉禮部不中退而發憤益治其業窮日夜不懈家事無鄙辱必身任之曰不以纍吾親其自勤苦如此其諄諄以教諸弟不以人言間亦如此已而得疾歐血幾危者數矣其妻朝氏先君之弟六女也少淑慎敏於女工吾母尤鍾念嫁七年年三十生二子而夭無幾何其幼子又夭而好問已疾病年三十二亦夭於時吾妹未祥也其親哭之為三日不食其存兒伶俜慕不絶聲鄰里過者為墯淚傷心吾母聞之哀甚語補之曰汝妹不幸其夫又不及祿以夭吾憐其用力無所就其心可悲也汝為作銘豈惟而甥是慰尚以紓吾悲補之曰諾既而奉議君書來如吾母言乃敘好問之志為之詞極其悲使納諸壙中好問卒以元祐四年七月四日葬以某年某月日地則其縣之某鄉從其祖史館君之兆也銘曰此邦之砠兮雲氣族而慿天此邦之濋兮瀦為野之瀾謂此邦之人兮胡不變化而嬗幼里兒兮長邑士生于此兮死于此羽成而飛兮忽墯地其不舉無婦以哭夫兮况欲恤而子四方莫可告語兮非而親戚孰憐爾騏驥也而不以紲絺繡也襞而幽之室視其藏不為碧兮為楸柏之實霜萃兮木萎春風至兮豈無時謂人往兮無返期我不敢慟兮畏而子聞之通直郎權通判環州事錢君墓志銘錢氏臨安人自武肅王鏐有吳越至㱕本朝其子孫仕宦常數十百人有諱禹卿字仲謨者天下兵馬大元帥尚書令兼中書令秦國忠懿王諱俶之曽孫保靜軍節度觀察留後贈太尉宣惠公諱惟濟之孫而中大夫諱暌之子也以父任為太廟齊郎調雲安尉徙令繁昌以行法不擾改大理丞擢通判霸州遷通直郎年五十元豐五年三月丁酉卒夫人仁和縣君楊氏悲哀無幾何亦卒二子誴詡女嫁進士石仲堅元祐二年十二月庚寅葬應天府楚丘縣固胡村之原以楊夫人祔其弟山南東道節度推官唐卿來曰吾母君之從祖姑而吾兄君所知也願以數言藏其墓補之曰諾君舉進士博達彊力所居官可道在霸州有告榷場火者衆相傳虜至守陴警備君曰何至是遣捕之果小偷也在環州屬靈武用兵守辟君提舉糧草虜縱抄輸者不繼而君崎嶇獨全霸環西北要害郡朝廷方以此觀君而用之而君死矣補之既悲君不遇而志之且申其事以為銘曰杭錢姓武肅顯遭亂離匿負販鑑山石衮龍儼奮八都五王逺世阻江不絶獻宋龍興致其版愛生人流斯善將及相卿士衍自忠懿胙秦墟子保靜有旐旟粵其孫中大夫世不乏發仲謨令繁昌發跡初佐兩邦政有譽火邉市人驚郛饋靈武行者瘏克掩捕莫告劬秩通直五十殂夫人楊殞戚吁子誴詡儒冠裾女一人石氏夫嵗丁卯月極涂十二日㱕其居何以識原固胡朝奉大夫常君墓志銘元祐元年冬補之守齊太學生商河常瓌以書來曰瓌宜見未有間也今瓌舉首則見歷山行則一日至齊矣其引物連類慨然想見前古之英而悼今世之不及者補之異焉復書曰足下學問非黃而澤以欺暗獲售者比也幸教之甚厚㑹明年春補之去瓌不果來又七年補之還朝瓌復自商河以書來曰先大夫沒無以銘敢纍子補之曰禮知生而不知死弔而不傷知死而不知生傷而不弔今我非大夫舊不可謂知然吾有與人游三十而莫我知吾亦莫之知也而大夫官有聞其子信我於未見我亦未見而信之不可謂不知也銘其可辭常姬姓河內人君諱諤臣字彥輔其系蓋出於唐相國衮五代之亂猶仕不絶有撿挍職方員外郎德方者始東徙棣州今為商河人曽祖諱峻安丘縣主簿贈太子中允祖諱仲容不仕􅊲諱億乾寧縣令贈左朝議大夫而妣桃源縣太君劉氏也君幼警悟不羣十二嵗失怙恃已能自發憤晝服事兄所不懈夜則取室中書讀之至音句無所從質稍長始能自是正遂通書禮左氏春秋及出入他書傳甚博嘉祐中朝廷厭詩賦之弊詔置明經科視進士君一上中高等授試挍書郎朝城縣尉凡府遣其挍督尉事尉皆禮答至君不然乃故慢君君杖遣之守竒其能不罪也民劉旻訴盜殺兄令以狀屬君君疑焉問旻安在曰去矣亟追還之嚬蹙曰爾賊而兄何盜也旻驚立伏曰不親殺實使牧者白現殺之君曰其然即自往捕而白現已叩頭馬前矣曰何敢逃鞫治伏辜或告井中有死婦人出尸驗之民聚觀籍籍莫知誰何一人持籋立衆後君熟視之色動遽語吏收持籋者其人惶懼自露嘗為其家兒剃髮因誘婦人取資而殺之衆皆大驚再調汝隂縣主簿用舉者充國子書庫官又權主簿自朝廷新學挍有司喜事果於行法有不可君輒持之後起大獄其不及者皆君之持而不果者也改光祿丞知蓨縣事民至終年不見吏過門至當輸租若錢揭而書之縣門皆如期至吏既無所取民民自謂今但輸常嵗半也有爭田者君閲其訴不問忽回語一吏曰若得何等饋乃教為此吏叩頭不能匿人亦莫測其故蓨古邑城門塹深夏潦溺人君董夫河上㱕以其羡工塞塹為大道再宿而成民大便之嵗旱里婦産魃訛云龍母官迎致舍謹祠之當雨吏白宜如故事君不聽取婦繫庭下責以妖狀曰魃能神三日不雨杖而母㑹即日雨嵗亦大稔監堋口鎮時天下初行市易吏或禁民私賣買君獨謹大貨薪蘇魚鳥聽民賈息入亦羡又嵗課茶息數萬緡前此文書多草不得休君從容至午則閉局去放意山水以為常而課亦登堋口瀕江嵗㬥漲壞民廬君募工為石岸三里居民以安通判成都府成都去京師逺守貴官體大吏相習不知有監司至參佐取充位事無復可否君奉法不撓革其因循威甚行通判登州前守尚氣喜事君數裁抑之事以適平後守一切委事於君君謝不能而隂贊之政亦不弛知均州事均僻佐守喜以無事自處弊日積君首按流吏一人有大吏喬老舞文罪莫得畏君明摧斂不敢踵故然竟不自安一日丐去為浮屠州大稱治徙德州又知博州博有河患荐飢君勞來甚恩囹圄數空方議決積水繕城壁為長利無幾何卒元符三年秋八月癸亥也年六十有五自光祿丞易宣義郎七遷為朝奉大夫勳騎都尉服五品娶李氏封金堂縣君男珏瓛珫璹前卒瓌仲琥季也瓌再應得任子恩以與琥及弟之子希閔今皆郊社齊郎女㱕左侍禁俞渙瓌等卜以建中靖國元年秋九月庚申葬君于商河縣龍興鄉之原以金堂祔君為人剛潔樂善嫉惡出於天性然其㱕忠厚嘗讀尚書張乖崖公談録抵卷曰是皆吾所力能者吾不用耳遇人貴賤殊絶無低昂親疏意然未嘗一言求於人元祐中丞相劉公摯左丞梁公燾皆嘗遣人致君且用之君聞命輒避去後哲宗召對便殿曰卿何從識許將黃履君方知為二公所薦也徐進曰臣老不足為陛下用矣因罷去其為詩頌書記銘序一百三十篇好佛學晚益幻視世間為文字如其說千言立成無留礙其亡不亂有舍利出柩上下光明異甚然嘗聞之佛但以無心通達一切法其神變末也其言曰若作聖解則受羣邪為夫莫知而議者故略云銘曰天下蚩蚩皆以事為師事求有功則以智出竒中民榮之去其本絶馳反而觀內夫世安足為捨所為事以學道必至寸功不施而無名之纍一朝之息可以宅萬世是故德人以所過為蛻猗歟大夫庶其是通直郎充德清軍使兼知澶州清豐縣事魏君墓志銘余頃為澶州司户參軍以事至德清過軍使魏君相與語甚歡飲輒醉不能起方午吏抱牘趍廡閉户去庭中虛無人風至葉翻然墮有鳥集其庭旁睨其几案文字秩秩私太息以為能後豫教授北京國子監去德清不逺書數至余知其於余厚也居無何君感疾卒其孤深狀君之行事來告曰將葬無以銘為之出涕敘其語㱕之君諱通字擇之族魏氏世家平原曽祖象祖超􅊲可法皆不仕君生五嵗能誦書日數千言十四嵗以尚書中第為夀州夀春滄州清池石州離石尉廣安軍恩州判官擢大理丞知武强縣遷太子中舍充德清軍使兼知清豐縣改通直郎蓋初以階易官也其佐夀春能察盜盜不敢肆得盜當賞不自列人以為廉其在廣安門卒殺犯關者或當之死獨爭宜不死比聞于朝果不死人以為平於清池離石如夀春於恩州如廣安而滋有聲嘗忤使者意使者督過之君不屈乃更知君人以為直其在武强德清號難治獨從容不迫其治長於發姦而愛平民故民樂之當路者以為才數言於上且顯矣而君卒元豐五年十二月二日也享年五十有二其為人短小鳶肩面黧黑目視有光睂間骨隱起異於人喜賓客稍有則以買田賙族人娶劉氏平原縣君七男子泳洙深泗蚤卒深以君卒之明年八月壬申葬于安德縣擊壤鄉之原銘曰十五入官五十而死能乎如彼施如此墓門有石尉其子四㑹縣尉劉君墓志銘君劉氏諱師愈字道甫其先保塞人後徙雍丘曽祖諱審竒太祖創業之初嘗倚以事奏為泛水關令未及用而卒贈右千牛衛大將軍祖諱文質內園使連州刺史佐曹瑋有邉功􅊲諱渭尚書比部員外郎妣趙氏天水縣君而金華縣君朝氏繼母也君幼爽悟翰林學士李淑稱愛之嘗舉進士不中用伯父尚書毅公渙恩補試將作監主簿初調某縣尉民劉豬兒凶悍數犯法以氣蓋其里人君攝邑事召豬兒數以罪杖之戒曰復見我不汝容于里豬兒卒改行為良民再調醴陵縣尉民嘗亡牛訴于君君曰汝何以識牛民曰以門鑰烙其角君曰吾知之矣第去勿復語無幾何捕殺牛者烙處信是衆皆服又調增城縣尉民葉氏兄弟出販兄獨㱕而弟為人殺賊不得君疑之召語其弟妻曰汝夫於家宜有負妻曰夫何負顧家饒財且伯氏出時㩦鍤往何用也君默然遽索兄屋間得其鍤血猶在卒致之於法又調廣州右司理參軍經略使與轉運使爭私忿數牽制州獄君務平反兩人者亦不能害後廣州竟起制獄帥與使者皆得罪官吏相連逮譴去而君獨不與復調四㑹縣尉兼主簿民妖言有神曰何巡撿能禍福人所至輒具幡蓋威儀迎導之或為出錢米委積君遇于路捕主者送縣取其仗焚之妖乃息君官于南久朝夫人在北未嘗亡思忽慨然語曰吾家世如是而吾老不遇侶蟲蛇於此不得從母夫人養吾愧焉無幾何以疾卒夀五十六娶錢氏三子長寂業進士餘二人夭女六人皆夭朝夫人聞而傷之㑹寂自端州以書抵夫人求補之為銘將以某年某月某日葬於某州某縣之原夫人於補之為王姑義不得辭銘曰家朔漠兮以武名死一尉兮海之濱謂我非南人兮兒夷聲若魂氣則無不之也從先人奉議郎高君墓志銘君高氏諱元常字復明其先齊太公之後食采於高其出渤海漁陽遼東河南廣陵者為望姓而君世家符離符離蓋廣陵高也曽祖諱士宗尚書屯田員外郎贈禮部尚書祖諱覿給事中集賢院學士贈金紫光祿大夫􅊲諱秉右朝議大夫朝議前夫人朝氏真寧縣君後夫人薛氏仙居縣君而君真寧出也給事公以進士通貴而符離之高始大君幼開敏用給事恩為試將作監主簿十嵗能自力於學嘗病嬉戲廢業至維其帶於座食至乃起方時外家朝文莊公隆盛篤愛無不至然幼而不驕君年十四遭母夫人喪哀戚有加初調滑州司户用舉者改京兆府司理監滄州都作院守李復圭豪舉役視其屬獨以詩知君遂見客游樂必與俱徙嘉興丞嘉興劇縣令不任事則求持檄出旁郡訟牒如山君暫領其事一朝剖遣立盡先是佃户靳輸主租訟􅒘此多君揭而書之曰田人田嗇其入杖且奪田民競往償訟於是衰華亭户欺詐田已穫而撥其荄引水沒之嵗比訴菑吏不能察除租多上又譴之至君行田為十等號參相驗欺者輒得民不能欺守吳安世黷貨私諉令市竹君語令毋受令阿安世飲其欲安世後繫獄令欲告之君曰前戒君毋受而告之可愧今狼狽卒自露遷忠武節度推官知泰州録事轉運使陳倩與監如皋酒侍禁方曖者仇也入境即以疑似逮務胥屬君訊鞫必欲造曖事莫脫者君明曖無它倩怒欲劾君不能也改宣德郎知郪縣事以親老不行求監呂梁鎮酒娛意文史轉運使侯利建見而歎曰君非居此者也轉通直郎知山陽縣事縣當江淮道吏窘將迎隳事而君優游辦治過者亦皆滿意旦坐堂民肩摩入常前其座迫庭呼民一二開喻或戒敇俄頃皆去民各自以為得盡邑子李南夫與其兄鬩兄告欲害已然但犯之也君曰南夫誠可論使人曰弟緣爾訴得刑爾亦辱矣其兄感悟丐不問因為薄罰而南夫後亦自悔人有以過笞其子婦婦雉經死者其兄訴殺之驗者三輩未白守彊君往君即呼畫史自隨人殊不能知至則語史圖俯仰左右四人狀其傷無遺皆非所以死者訟乃已支家渠可通以漕鹽轉運使黃隱初獻言濬之隱愛公家費欲姑調楚海及高郵九縣夫且促其期君曰凡土工人日竭力為方且深丈不可加也頃龜山為渠六十里調十七縣夫而足今以里計支家如龜山且塗泥甚起夫少則為日長是重費也衆然其言㑹隱去呂溫卿為使因求民私出錢募夫事欲害隱屢語君君不應溫卿怒欲並中之已而代去不獲竟在山陽三年獄為七空轉奉議郎服五品勳武騎尉又差監泗州糧科院復以親疾不行元符二年三月庚辰卒于家享年五十八夫人向氏繼掌氏皆名族女淑慎男渾洞徹湍汭皆舉進士彊學女長適進士張知剛次未行君為人和厚潔廉好書不倦為文尚理然所得多用以為詩至其精於吏道有人不能及者性孝謹侍朝議藥經時不解衣既喪過毁因得疾不起可哀也已渾等即其年六月癸巳葬君於宿州之蘄縣蘄城鄉世墓之次以二夫人祔而湍狀君之行事來曰吾子我君外黨知我君盡敢乞銘銘曰童子而厲已壯所就如此使白首可知巳一官而盡巳居所施如此使為大可知巳抑雲者為雨或族而不雨風實引去抑復明所遇吾不知其故豈非命耶右朝議大夫梁公墓志銘紹聖二年西鄙進築諸城而潼關控陜衝難守臣詔曰右朝議大夫梁彥通可乃以公知華州事屬嵗不登米㪷錢五百公至括廩粟得數十萬斛平賈踰半開門坐府躬視糴糴者踵入老幼癃寡皆得食所活以萬計民頌其惠事聞朝廷詔使者閲實使者奏如民言即召對將顯用而疾不果對乃以知兗州事無幾何卒其孤以補之家世舊來請銘乃序之曰公梁氏諱彥通字貫之鄆州須城人天平軍節度判官諱文度贈太師中書令兼尚書令魏國公曽祖考也妣某氏韓國太夫人翰林學士諱皓贈太師中書令兼尚書令周國公祖考也妣閻氏唐國太夫人中書門下平章事諱適贈太師開府儀同三司陳國公諡莊肅考也妣任氏越國太夫人自翰士皆第一而莊肅公相仁宗稱忠厚梁氏閥閲冠于山東而公幼警異無綺紈好力學博古尤長於毛鄭詩從丞相䕃為祕書省正字遷太常寺太祝嘗舉進士五不中益自勵將舉方正㑹罷制策猶慨然以墜其世科為恨丞相經略秦州奏書寫機宜文字逮帥雍帥並皆奏以自隨遷大理評事光祿寺丞在太原時中人蘇安靜為鈐轄不法頗隂厚公公察而疏之㑹丞相徙三城而使者發安靜事尚疑公與交通求索無秋毫乃更知公丞相當國公每入侍未嘗以一言干朝廷事間有所論奏以屬公亦絶口不言謹敬無過丞相甚器之自大理寺丞遷太子右贊善大夫又遷殿中丞皆以英宗神宗登極恩序進服五品勳上騎都尉矣丞相㱕印紱臥汶復丐公簽書天平軍節度判官遷國子博士丞相薨執喪盡禮既除不忍去墳墓守邵公亢憐之再辟知須城縣事移簽書昭德軍節度判官民吳氏異籍久忽詣府言求兄弟復同居守郭公逵難之公曰民而知義可旌已乃如其請吳氏畫其像祠之涉縣胥犯法應徒而以自首當減從杖州僚希使者㫖議不減守亦疑焉公獨爭甚力竟以減論人服其公遷尚書虞部員外郎通判澶州事詔塞曹村決河聚兵夫十萬務日百出就委公剸決河上分郡事什七遷比部員外郎初澶魏定置三倉廣糴備邉至是朝廷又委公計置力為多丁越國憂哀毁垂絶族人索棺食具意公從丞相久多珠玉發笥蕭然人服其清還朝改朝散郎熙河用師吏相繼以不才免選通判永興軍事始至大軍已趨靈武諸郡皆督夫負糧從軍且受數矣使者隂諭指夫增負若干人莫敢言公獨曰計已受數恐不滿又重之是必壯者逃弱者踣即詣中軍言之初猶不從爭久乃定夫賴以還者衆鄜州支使石蒼舒冒取俸給積數千百緡使者屬公治蒼舒雅為當路信猶簧鼓自辨解使者反疑焉公不為搖竟坐贓去自是􅎊益有聲上即位􅒘朝請郎遷朝奉大夫復以才選為神宗山陵專句司自塞決河督軍餉有功逮此三應賞格各減課二朞擢知沂州事遷朝散大夫移知洺州事洺近漳城􅋻下前此泛決壞城死者相藉守以罪去纍年矣而水備仍不修嵗秋霪潦民相恐欲潰去公出午橋躬飭備諭民姑安堵水至守以身當之敢惑衆規利者斬既而大漲公登高望水北溢則病郛郭南激則害田疇公曰當先其急者即開王家灣走水南陂城用無患遷朝請大夫加上柱國服三品又移知邢州事河北荐飢詔御史巡撫至洺州民擁其馬言守不恤民困願得前守活民御史問前守為誰曰邢州梁公也御史因遣洺人皆就食邢見公猶涕泣再拜富人感公義不閉糴粟出日倍流徙如㱕安撫使及使者交薦其能考課優等遷右朝議大夫加封保定縣開國男食邑三百户㑹復行免役法詔使者與州縣議或欲胥徒毋頒祿公曰是差也且非先朝意衆無以奪卒定令如元豐時虜使王遵義等入覲公出郊勞遵義意公不服金帶禮薄公曰國有官儀猶使者著蕃服不可改也相持踰再宿竟不復見代還上嘉諭在華時鄜延修城調七州保甲華在調中衆聳懼公召諸令以意慰遣且版示衆曰旬浹之役近在邉隅不與頃嵗入界同也衆乃趨命然政尚嚴以抑彊扶弱自任所至盜賊為衰在兗時歎曰此先丞相舊治且桑梓近吾能無恝然意乎為霽威嚴人益愛之紹聖五年四月十日卒于官舍享年六十八為人開敏深博喜論議恬淡不妄交遊官居事無大小必身任之尤以興庠序勸學為先嘗疏新法十事達于利疚又奏乞設邉備講馬政編役書皆詳辨時元豐末年也家居言必稱父母奉身儉菲無聲妓之好遇宗黨誠且愛推丞相遺恩己子所當得者以與不當及之孤著令大臣後禁毋折賣居第墓田因刻石以警族人教諸子必以學問發身諸子皆有立而子是遂登進士科晚尤薄於進取名其莊曰平野名其園曰佚老時往來其間數懇求謝事命未下而沒有平野雜編二十卷藏于家娶張氏清河縣君繼張氏福清縣君男子誨宣義郎子恕宣德郎子是曹州司户參軍女長適董正封承議郎次適鞏燾濠州定逺縣令次適王蕘瀛州防禦推官孫曰祇祖郊社齊郎曰行祖偱祖幾祖未仕諸孤以其年七月己酉葬公于須城縣登庸鄉執政里從丞相之兆銘曰梁世有人翰林始興發其德幽以基九層顯允莊肅乃暨乃成相我仁祖有丙魏聲何以似之保定開國又何大之匪車馬飾彼德而微則大􅒘小此用而微不瑕有耀相爾嗣矣士有造矣自我率祖維其瓞矣有陂者澤其水泱泱有汶斯原如其世長瀛州防禦推官閻君墓志銘君閻氏諱師孟字醇老濟州巨野人光祿少卿諱貽慶之曽孫贈衛尉卿諱詢之孫而尚書比部郎中諱仲甫之子也母長安縣君賈氏君中元祐九年進士第調徐州彭城縣主簿即以才稱初攝尉下邳民有不事作業者其妻與前夫女謀去之妻與民鬭而女從傍自斃其子以誣民民莫能辨君疑焉未送縣以舍逆旅而伏吏床下伺之夜中母女議誣狀吏遽出持之不逮于獄而事已正衆大驚彭城號難治君至復攝令事踰月庭訟為衰夏潦害稼郡檄邑毋多受訴君白不可而受如令民用不困城西北汴泗匯也嵗苦水菑君疏渠以殺其怒水至游渠中不肆因以衛城無患民大利之當塗者益以為才而爭薦焉嵗滿遷瀛州防禦推官知潞州涉縣事將行以疾卒元符三年七月六日甲子也享年四十夫人朝氏先君朝散大夫之弟五女而補之之第三妹也子七人璩琮珌璘瑋璹一未名三女幼卜以崇寧三年十一月甲子葬於巨野縣黃澗鄉長直村之原璩來求銘君為人警敏和裕儀狀秀整贍于文詞初喪比部公與賈夫人尚幼號泣自傷志欲以學問顯鄉閭所與遊多知名長者事其兄恪居官臨人事事欲以諸老先生為矩範而不苟也故始仕而得譽衆以逺大望之而君死矣銘曰裹糧以期萬里志駸駸焉無燕越矣而不千里百里發軔而止匪志則然曰命止此如黼斯繡為衣
