front:
  text: 濟北晁先生雞肋集目錄
  hash: sha256:221dfe13869a24a5a924bbf1455c86ba537ad199042976343042fd90ded837c3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0105_SBCK_007-1a}
body:
  text: 第七卷古詩同劉景文登大安閣次韵張文潛飲王才元家次韵范翰林淳夫送秦主簿覯次韵荅秦覯見贈北京學直舍對客虛齋直舍即事昨日雪已佳約李令希孝同文潛送况之諫議十四丈守潞過成季作送梅挍理子明通守杭州送呂承奉至山從呂龍圖晉伯辟秦州機宜曉發樓子莊禮部移竹次韵李員外文叔次開祖使君韵兼呈端叔大夫聖域長老次韵錢濟明贈感慈長老送八弟无斁宰寶應和關承議彦逺水樂送君上馬試院次韵文潛欲知㱕期近呈天啟愼思栽花招泗州叔父濟北晁先生雞肋集目錄終濟北晁先生雞肋集卷第七古詩同劉景文登大安閣劉矦先將軍忠義當代顯喑噁指戎虜却走自相踐西坡坐首鼠勢蹙不得免天憐壯士竆有子如此鮮清時鑄農器文字正須勉行吟畔牢愁憤悱亦足遣時來躡雲梯仰視天宇展下俯河兩涯牛馬細不辨達生匪行怪未用驚邑犬官閑尚數臨泑澤要清淺次韵張著作文潛飲王舍人才元家時坐客戶部李尚書公擇光祿文少卿周翰大理杜少卿君章黄著作魯直霜雪埋百花及時鬭春陽城南有高士買屋入花藏經時不出門爲花日日忙我居在何許近止東數坊亦有佳公子連車換帷裳隔牆蜂蝶諠開戶草木香仙人朱桃椎髮緑童臉芳此公不可見此畫來遠方竹欹廜㢝塢桺拂轆轤床素兒雖小小亦足侑客觴尚書廊廟具氣若冰壺凉忘年此賓主吾黨有輝光人生走塵土歲月顔鬢蒼曷不休沐暇過此薰修房宴坐二十年非癡實難量元未王才休官四十張矦不出家在家説縁忘尚擬問兩卿㩦肴借紅粧妍歌聽黄子不飲亦清狂次韵范翰林淳夫送秦主簿覯髙詞自班馬短句亦隂何輸寫無竆已懷山赴壑波㴱耕待銍艾療飢乃嘉禾機雲共一時未信來者多老病愧羣豪魚山臨東阿蘇公門下客事業皆不磨孫寶暫主簿靈槎㑹竆河它年九功敘當使睦者歌業虡置牙羽筦簫復森羅鏞鐘欠一鐸未害大樂和却欲從浮海珊瑚爛紅柯龍門雖箭駛此志未蹉跎丹沙還黑髮流景爾則那仇池出一派分江定有沱蘇詩事見次韵荅秦覯見贈修身貴日新如草陳葉換請看絃上矢歲月不可玩文章得蛙釜虎以皮遘難兹事從古然吾黨奚獨惋秦君好學勇決勝百馬汗宵行委明月屢得按劒盼鄙夫晚更事前猛窘新愞憐君亦自喭意滿懷不散誰為傾國媒尚此瓊英粲期君似椓罝無以無人慢北京學直舍對客鳥聲落檐間竹色在户外解屨置几前放杖當椅背黙然仰棟時往與古初㑹有時遺坐客十問不一對尚因呼乃覺笑自謝頑昧知非慕蘧子事去等蜩蜕一生所未免飲食與眠睡所以更頽然可樂本非内有心欲何用橋起則形累賴客同門生曠蕩乃不愧虛齋虛齋閉疎窗竹日光耿耿更無司業酒但有廣文冷人憐出入獨自喜徃還省時作苦語詩幽泉汲脩綆直舍即事秋雲多重隂凌旦亦可樂虛齋坐亭午寒雨依髙閣王官有憂責霖潦河未落孝先但欲眠不奈弟子謔黄花迫晚景白露下叢薄獨當慰佳節得酒自斟酌昨日雪巳佳約李令希孝昨日雪已佳今日雨亦好冰膚解萬木洗濯見枯槁思君對此坐孤詠廢幽討明日尚相期春禽聽清曉同文潛送况之諫議十四丈守潞過成季作午投李同年下馬汗如洗城南迫送客雖嬾聊爾耳出門繚陂陼白鳥起㴱葦佛宫横晚霽窈窕間一水借問客何人諫垣有直氣吾人浮丘伯聊可與把𬒮如此邂逅何得酒亦佳事官閒猶有守旋折窘六轡可憐千紅蕖的㿨姹晚市便當夙駕行秋風如箭駛送梅挍理子明通守杭州金明池上柳人折一枝春贈子意不淺東遊雲外身人生半刺史朱綬光四鄰此豈經世懷但慰垂白親錢塘我舊遊頗復識其人不應山水改但恐猿鳥新章臺走馬客冠葢盡要津竊禄我自慙便面聊障塵亦思一舟去共醉西湖濱時平自行樂不為千里蓴㱕來麒麟上獻納當及辰送呂承奉至山從呂龍圖晉伯辟秦州機宜去日劇奔驥新交非曩圖憐君事業長蔚若頤生鬚表東海者誰君世有顯儒端委論百揆鞭弭雄千夫二陳詩禮伯八荀紈綺雛嘗聞達大家可以濟八區功名望聖世忠孝自吾徒我㫺拜秦州詞林炳於菟見謂可與言鋤荒而破觚刳中不宿穢味道因有腴斯文望若人顚沛一手扶白頭逺綏邊狐兔安足驅汲黯在朝廷永絶淮南覦平叔不鬭羌事正今日須今君撰杖屨還向府中趍問訊不棄捐寄聲亦疎迂何當質疑義賣劎老樵蘇曉發樓子莊曉發樓子莊淮山自兹近春風似惱客浪穩舟不進長安一囘首堤桺千里潤念當整帆席快若冬蟄奮微生謝拘窘末路嗟鄙吝林花一迎笑岩鳥相借問塵埃改顔鬢堅白畏緇磷江海慰高情飄蓬自吾分禮部移竹次韵李員外文叔東南之美者見伐以直幹豈如此君疎猶作此郎玩此郎乃在此無乃材亦散平生吉甫頌意鄙枚叔亂坐狂得此冷對竹頭幘岸尚思殺青書充宇白虎觀恐此愧子猷還成倚楹歎志史事文叔有次開祖使君韵兼呈端叔大夫聖域長老神龍異凡馬頭角要須斂邦公七歲時驚耳一語險悟身非常住風日過河減崢嶸法雲窟跳出有家範金剛不吐焰已落天魔膽一派感慈中無波寒湛湛是波本非水無以瓦礫㸃低枝競聽法草木有情感作解受羣邪碔砆疑琬琰居然身出定面目本來儼而我久塵勞見之良内慊周侯老詞句太華聳而黯自説少苦心脩塗肆竆覽李侯遺世事不琢元無玷文采麗春葩百牘交千槧顧慙土炭嗜畏疾非羞儉望不見水端譬河還少貶請佩伯陽言吾非勇於敢次韵錢濟明贈感慈長老我聞棲禪人一念超十地云何別影事未免依縁氣譬如幻男女機廢根隨廢不然怖頭走此病竆三世邦公師子吼曾使諸天喜廣説無説時俱成甘露味不知室久如當有天來侍城隅竹塢近梵刹開嚴閟以彼穴中空清風自來萃我生久更事求愚不求慧清風已説法不用重宣偈開祖照人姿滄波白蘋際居然九奏妙往往魚龍戲濟明經世才彫松識寒歲懷寳竟迷邦此豈非良計名山尋勝士投老終㴱詣我自所蘄廉蟬葉眞堪蔽送八弟无斁宰寳應竆邦迫秋成霖雨厚土溼邅吾上淶水濞洶三峽疾邦人送之子岸潦飲馬膝淒淒屬方升澹澹驚竝集衝湍順塗路游波滙原隰安知禾黍腐轉覺蛙黽急何􅒘乾此潦問天借九日蕭蕭荆棘晚亹亹霜霰密之子向南州銅章宰一邑何須念宋遠古謂跂余及揚舲堤桺盡把醆淮山入封圻吳楚徼郡縣秦漢襲開門駔儈鬨輳浦篙帆翕平旦書百函交衢客三揖新湖容鼓鑄甲令貴綏輯之子搴詞科聞詩不讀律古來學為吏頗自吾儒出足民與知方求由有政術鞭笞麏鹿駭亦恐日不給先君卓魯後之子况早立焚香閉閤坐啾耳從潗濈官忙尚偷閒文字要嶪岌和關承議彦逺水樂上盆五尺髙下盆二尺廣咿呦蟻穴間飛瀑一線響關侯初為此避世挹蕭爽晁子亦欣然閉户穿瓦盎虛堂一畞靜純白四隅敞中央渾沌胚鯈忽所求往鑿竅令語言豈但一成兩危峰下俯瞰石井黝然仰奔泉決眥落慘澹隂壑想明珠溢盤盂白露溼塵坱聲音通大道斷竹自誰賞何曾戞擊䦨缾缶日夜長初疑風隕籜驟雨來莽蒼乍似酒落槽夜枕聽惚恍鳴禽雜啁哳物鬽亂肸蠁相依欠林樾見蔽賴帷幌范侯驚側耳李令笑抵掌張侯助我嬾不憶税歸鞅雲間余仲弟聊可樂吾黨中和非外物此理未宜罔相勸戒勿傳名字遍天壤撞鍾鼎食事老罷不知饗但怪一世狂端如轉車輞能來解幅巾為子濯泚顙送君送君上馬時不道朝罏燠春風入木心皮肌發紅緑春風良昜草那得勤行路且莫望南窗胡蝶飛無數上馬上馬笑屬君㱕期在十日來時草白芽㱕時青鬱鬱來嗔馬蹄急㱕嗔馬蹄緩人心自如此馬蹄終不變試院次韵文潛欲知㱕期近呈天啟愼思睂山得張侯心許出一手臨川見蔡子千載慰邂逅鄧君起南國磊磊看三秀譬如黄鍾陳我尚瓦釜吼欲知㱕期近喚馬牽出廏官壺持餉婦傾寫不漬口千章輸明堂勿問草澤有羣公自澟澟水鏡照妍醜栽花招泗州叔父春園移春栽芽孽秔粒大東風日日吹噴吐不暇裹楊梢青猶未桃蕚紅尚可田蔬美已最村醑醇亦頗少年慕立事幸得能幾箇艱難合㱕來茅屋聊共佐濟北晁先生雞肋集卷第七
