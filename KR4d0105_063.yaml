body:
  text: 第六十三卷墓表寂默居士朝君墓表廣州推官楊府君墓表鄧先生墓表濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第六十三墓表寂默居士朝君墓表寂默居士朝氏諱端稟字大受居開封之昭德坊太子少保文元公曽祖也給事中參知政事文莊公祖也其世家爵里諡諱詳於國史文莊生祠部員外郎祕閣挍理諱仲衍挍理生居士居士世胄蟬聨非少長山林人且有盛名場屋間嘗為參佐州郡令大縣矣卒不用以沒寂默云者蓋嘗以此自名而未嘗以此語人補之曰道隱於小成言隱於榮華道之不明也言之不行也以夫小成榮華者隱之也寂默而道與言顯矣無成與虧故昭氏之不鼓琴也居士曰吾琴故未嘗鼓吾何虧其族人之知居士與其交遊而厚者則皆相勸號之以寂默以實居士嘗有志於時不遭而為此也居士七嵗竒警過常兒絶逺見而名聞而識二十嵗而盡授六經百家説又雜取他類書小説叢脞人不勝覽者皆成誦於口用以自娛為文詞捷敏如水就下騄耳行遠干將立斷無肯綮者旁睨其同學兒方濡墨蹙頞如拾瀋如憶昨夢不可得而居士已四顧滿意寫紙腹背欲盡矣用此蚤有名譽熙寧中與補之同試開封嘗暫出謁客客壁間石刻合序千言蓋手詔賜史臣者居士曰能一再過誦乎則俱默讀居士曰誦矣某曰亦誦矣偕誦偕止而居士盡習補之遺二字焉無幾何居士舉詞賦為開封第一主司駭其策豪贍異聞難字非他時舉子比展其卷堂上自屏及陛紙窮顧相詫曰盡識此可以為三千士先登矣然是嵗屈於禮部又三年始以經術第進士意不自得欲從制舉曰此吾漢大夫之世科也時王湖州石父亦制舉喜根持論氣豪老師宿儒少所屈然獨厚居士居士數從石父道往古石父通洽猶自為不及居士博也石父因以直言舉勸之而居士故倦遊不復萌意亦會其科廢云為人和裕明白不作畛域藏覆言辨濬發有所作意必先人外視之類欲速者而中平夷實與事闊也又事母潁川夫人孝重去左右兩從伯兄使淮浙居間不調者十年愛西湖琅邪山水曰是可以忘老有詩數十百首至今傳杭滁間善為長歌怪處似玉川子平處似香山居士至雜文數千言敘事極古今得失之辨則唐人獨以詩名如郊島者不能逮也文莊齊安夫人宰相王祁公之姑初王公之自舒來貢於禮部也猶少出入姑氏如家後貴為宰相居士以布衣年少往遊如平時不怵於其貴或飲醉其堂上劇談大笑傾一座退而與里閭賤者遊亦傾竭無吝情初不見其異人皆曰如居士蚤有名譽使能稍自矯拂逶迤以蘄合必獲然居士不志於其獲而樂於不矯拂視不合如其躬之遂其知者則以為氣完而守全其不知者方且以世禮睢盱一二誶諑之嗚呼此其所以窮也哉然居士自以少孤依潁川夫人辛苦學問欲嗣其家聲甚力既失夫人養已得疾鬱鬱又官不偶抱所長莫試滋與世闊不復自金玉類李將軍既困負其才能數與虜角忘意於無益者常人不知愛惜恐一失不可得必其誠心好士知才為難者方復悼其窮也晚尤自放於酒一日過故人飲甚樂忽悲歌起舞泣數行下顧補之曰吾若是乎已矣人暫見之不知其為開封朝大受也或竊語以為狂居士笑曰琴張輩所謂狂狂者進取吾進取乎哉補之輒從旁讚曰魯漆室女獨處躍然不寐而悲嘯亦狂者邪鄰人疑其欲嫁鄰人則淺矣然數月而居士卒異哉補之嘗論聖人有中道若伯夷柳下惠俱非中者故從伯夷之清則和為不恭從柳下惠之和則清為隘然二子蓋百世師不有聖人知之則揚雄所謂餓夫詘臣非過言也然人豈可以皆至於夷惠如陳遵張竦長短不能相效雖未足與論中不中之際要曰外輕者差獨樂至所遭薄厚學者不道也居士嘗主簿博野又為保德軍掾洺州推官知堯山縣事其為令與邑子講習經藝有惠愛於人然居士終無意於為吏昔魯肅論龎士元非百里才其治不治後人固不當求之耒陽之間至其言克涪作樂非仁者之兵豈惟異於魯肅所期治中事雖孔明猶當自恨前所以待士元者未也故韓愈謂千里馬常有而伯樂不常遇居士卒以元祐五年四月丙午葬以其年五月戊寅地則鄭州新鄭縣之旌賢鄉也配王氏潁川夫人之姪潁川夫人為朝氏婦矜式王氏恭儉似姑居士二子覺之貫之皆文學善士貫之已得科名為新鄉令後十七年而貫之始以書來曰頃先君不幸葬日迫太僕林旦嘗銘之痛其遺也知先君之深者孰與兄願為文表旌賢阡上抑先君不至要官職四十六年而沒施為者少然孔北海志不就士議處以豪傑陶淵明一縣令後仰其高窮達成敗信不足論論其人物如何耳補之曰孝哉是足以大吾族父為不朽系曰天之高明地之無疆中不知嵗之幾何長人不七尺當物之一乃若傅説以其事業沒而上比於列星之光何必傅説有陵客星有白長庚彼微者也而動其芒豈皆如説富貴有功德于商乃如是其昌嗚呼居士世人以為狂自謂我非狂既隕于霜亦揚其芳此如陵與白也身雖沒其才氣俊偉猶耀而不亡也廣州推官楊府君墓表元祐二年正月辛酉廣州觀察推官楊府君卒喪未還也其後姪洵一日晡時昏然如醉歘見府君乘馬從徒而來洵遽迎拜既坐神色翛然如平生問何之曰今為忠孝節義判官矣所主人間忠臣孝子義天節婦事也從容竟夜人但見洵拜且自言也將行有二紫衣留語曰府君好范山下石臺何不即彼立祠洵忽悟謂家人曰適廣州叔父至如此衆悲駭因呼工為像工良拙而像惟肖人益以為神然府君宦不顯當塗無上其事者祠竟未立也衆復曰府君生有德於此沒能震其靈響其存不朽不以祠立與否惟嵗時野祭尚足以慰吾人之思乃敘府君行事并記洵所見來言曰府君里冠冕不可使其較然著於耳目之迹久不傳也子實為文表諸其阡上補之曰諾府君諱緯字文叔濟州任城人也少願敏事親孝儀狀端重長七尺忠信豈弟好學而愛人遇鄉人無少長必以敬而鄉人亦無少長皆敬而親之未嘗有官府而民聽之如官府至就評曲直而府君固退然君子非預人事者也曽大父諱超五代末藏匿不仕大父諱善基初稍稍以經術教授鄉里生子諱忭者府君􅊲也諱早尚書比部郎中諱景尚書駕部郎中皆經明擢第有能聲故府君大父纍贈尚書刑部侍郎而府君亦以皇祐五年經明中第嘗為太原府司理參軍活縣所上盜在死罪者三人其黨應死者猶感泣語家人曰楊參軍遇我盡今且死尚當為楊參軍求佛追福我死不冤矣徙鳯州梁泉縣令教民以孝弟力田為先守史千之不知其能嘗薦其録事參軍張革等數人革呼同列詣千之言梁泉循吏而公不薦革等以為愧千之踧踖曰吾過矣吾過矣因并薦之遷沂州防禦判官嵗大飢盜蜂起守霍交屬府君督捕四縣盜吏爭以殺盜求賞多至數百人府君獨哀之開喻首減所全者衆狂人李逢聚亡命淘金境上有異謀郡疑不時發而逢敗誅府君亦坐廢二十年優遊守道化行其家河決曹村灌七郡巨野大溢會秋榖大登場事未畢民有舟者爭救榖老幼多死府君盡棄其田中積不載而以其二舟躬救人於津口所活日數十百人後民相見者皆曰楊府君生我上纂極復為廣州觀察推官歎曰欲老於此故恩不及􅊲妣今往幸滿嵗得休官追榮丘墓不憾矣無幾何卒於官年六十有二夫人翟氏有淑行踰年亦卒子三人涓滌渙皆進士學問修立後方興未艾也其沒後數年嘗有羣盜白晝行剽輒呼相戒無犯楊府君家過其門猶俯而趨蓋府君不特生為善人怙而沒為小人懼者如此然於時府君未葬也其詳猶具於銘焉補之嘗竊以謂行德於幽人不知而天知之天之所豫不必貴富使正直好義所居以為民命是謂不泯其動於怪異亦時以勸善而警惡抑府君生誠實不欺沒豈其欺尚曰吾父母邦庶或福之豈利其饗哉系曰生無職於爾土民固聽之如其有官府沒無封於爾土民固神之如其山川主意有道者其德全畸於人而侔於天莫之爵而常自然范之山兮石如砥木蕭蕭兮草靡靡侯愛我邦兮歸萬里山中人兮春復秋日慘慘兮雲幽幽侯壯長兮所居遊侯之來兮民喜風飄帷兮雨霑几鼓淵淵兮舞侯戺紛進拜兮侯鄰里侯不可見兮德可思侯行不來兮民心悲謂侯飲食兮無去斯福爾之土兮以慰民之思鄧先生墓表孔子曰舉逸民而天下歸心焉孔子之所謂逸民者必若夷齊若少連七人其行有當於聖之事者乃素隱無述則孔子不與沮溺子路能非荷蓧矣此學者之所誦而識也自漢聘樊英如待神明至竟無它異故李固以謂處士純盜虛名無益於用然厥後益衰士一切趨利遂往不返夫安得如古作者而言之惟夫行已有耻惡衣惡食而不耻而知違患之當逺也猶足以救俗壞故范曄因固論而極之曰後進希之以成名世主禮之以得衆原其無用亦所以為用有味乎斯言也而吾里鄧君異於是昔魯黔婁先生不干世生無以養死覆以布衾而其妻以謂有餘於富貴嗟夫鄧君其殆庶幾先生之遺風乎君諱御夫字從義濟州巨野人幼辛苦讀書嘗試太學異等蚤為司空平章事呂公所知而性薄榮利方壯則褫舉子服去布裘芒屩犯晨夜身自力作以供祭祀仁鄰里而退甘其菲如食五鼎非農圃入不以昜所無亦難矣平居頽然順靜望其貌知有道者與鄉人言老者以慈愛幼者以孝悌􅒡里工駔以勤儉不欺故人慕交之或就評曲直皆滿意慷慨尚義急難必赴身結茅北郭水濵牛羊鳬雁之所牧集蒲柳蓊然下窺如墜谷有石几丹墨作老子注寒暑昜節乃一再出吳人項傳見之心服書其石几云昔聞河上公今見濠上翁姓名字時異道德經解同辭雖俚然實事也又作農歷一百二十卷言耕織芻牧與凡種藝養生備荒之事較齊民要術尤密州守王子韶為上其書朝廷請頒之不報乃棄家入廬山學釋氏説將老焉會得疾其家強之歸有詩三百篇皆蕭散方外言也無幾何卒大觀元年正月十六日也享年七十有六有子二人長曰汮次曰洵能守其業以是年二月初九日葬於巨野縣宋善村龜山之原女三人長適鄉貢進士高處約次適右侍禁張寬次適鄉貢進士程延禧將亡一夕過所與遊呂奐論死生之際曰吾去矣呂莫知其故是夕呂復夢之言塵纍未盡今當至蜀都為一富家子呂怛寤馳候之殂矣死生聖人難言此非補之所能知然觀羊祜探環事世固有於此不昧者系曰孟子論君子之行不同也而曰歸潔其身而已矣大哉潔乎惟君平生潔則有餘以是銘君亦忱不誣濟北朝先生雞肋集卷第六十三
