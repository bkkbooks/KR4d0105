body:
  text: 第三十二卷銘贊文恭胡公研銘端溪研銘七星研銘大圓研銘歙研銘金星石研銘假端夫研銘胡琴研銘賈甥書几銘八仙按銘藥篩銘以洮研易賈彥德所藏端研因以銘之贊東坡先生真贊三老圖贊南華真人畫贊松齊主人寫真自贊內贊外贊二李夷行易初贊董汲秀才真贊張汝平牧牛圖贊濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第三十二銘文恭胡公硯銘天不愛道實生異人地不愛寶發為物珍人惟文恭物則硯美介如石焉斷可識矣公在場屋文詞崛奇此硯出之如虹如霓公來侍從詔命雍容出此硯中為雷為風公居廊廟謨謀宥密亦此硯出以澤萬物遺其孫子折墨棄筆世不乏才亦鄉亦弼貴人有金後益不學硯如龜殼以支床腳粵公是怍端溪硯銘森然星辰不可以天文隱然堆址不可以地理有倏忽相遇之際或執其樞雲翔而雨驅似神而非於是以茁萬殊七星硯銘如天其蒼匪正色杓欈魁枕森的皪有尊如辰粵帝宅其傍嘒者儼若客廣野成宫象所積古媧搗鍊疑此石不敢箋詩以寫易斯文星爛從爾出大圓硯銘黑月模汗兩奴利與黔突居難與揭篋趨爾圓其外亦不可轉視吾爾硯歙硯銘黮其貌虛而不屈溫其腑動而愈出貶溪之名躐溪實如世之不名爾實何金星石硯銘天雲而星雨斜橫有河漢象從石生濡老潘煤雲峥嶸假端夫硯銘端之窟惟玉質厲以立我溫以與物故用不既如山泉出胡琴硯銘有琴之名無琴之聲託君之詞哀玉鏘鳴賈甥書几銘仲逺好學辭藻良贍逸然有子貢之感時倦而願息聞之吾師曰生無所息仲逺其務自彊而夕惕八仙桉銘東皋松菊堂飲中八仙桉八仙何必來松菊自吾伴藥篩銘得精於粗爾病惱除過百草木無以苦荼以洮硯易賈彥德所藏端研因以銘之洮之崖端之谷匪山石惟水玉不可得兼一可足溫然可愛目鴝鵒何以易之鴨頭緑贊東坡先生真贊非儒非仙非世出世間不可以綸繳亦不乘風雲而上天何居乎猶心醉經目營海既逍遙乎濤瀨忽焉橫杖按膝而舒嘯鸞鳯之音猶隱耳而人固已反乎無在也三老圖贊如畫無言謨䕫卨前如畫不動才文武用或問管仲子曰人也仲如其仁以君霸者聖有踐形賢有具體若三人者可謂人矣南華真人畫贊乾顀坤頤口海齃嶽其聯日月大空之灼其詞風雷萬有之作魚乎周乎不在濠上周乎蝶乎何有夢想惟周能蟲惟蟲能天匪我則云然周則云然謂之聖人者非也松齊主人寫真自贊是真是假是不是畫人爾人爾誰非似者一㸃似人不能知在不言中如印印泥內贊彌勒真身分千百億汝幻亦然愈分愈出分千百億不離箇中汝與彌勒衆生普同外贊峩冠正笏貌若有知如此畫人不言靡施木則在囿馬則在廄匪用于梁亦不以驟木馬何咎李夷行易初贊元豐初補之教授北門而易初為掾汶上以事至魏相與語甚歡建中靖國改元補之守蒲津而易初在幕府始得其為人之詳易初形貌神意無塵俗纍趣間而技通中介特而外猗移輔之以學問未見其止古之所謂可畏者為之贊曰頎然而長者君之狀如竹如松翛然而逺者君之意冥冥飛鴻退然而藏者君之行有時女容介然而髙者君之操雲間孤峯蔚然而葩者君之同草木青紅益然而和者君之氣觸物者同載是六者虛而游世孰叶唐許儛車彼視董汲秀才真贊鵲實非脈假脈而言太子可起和實以脈遺脈而知良臣將死故鵲不能死生而和不能生死既有制之者矣亦有知之者矣術兼於道是謂醫理誰其知之惟汶陽董子張汝平牧牛圖贊吳機殘幅或休于屋有訛其前亦鬭而觸鼓文周篆缺不可續鐃歌漢辭亡不可屬東坡歎此折劎毁玉是畫非筆牧者非牧誰能觀此亦目非目濟北朝先生雞肋集卷第三十二
