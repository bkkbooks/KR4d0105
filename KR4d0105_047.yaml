front:
  text: 濟北朝先生雞肋集目録終
  hash: sha256:b8bd6f94f89f4756e553d00660839b9a9fed1227845d505ace641f1e9807769f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0105_SBCK_047-1a}
body:
  text: 事然觀仁師事史臣亦有忌嫉之語何耶語曰君子而不仁者有矣人情大不美雖聖人猶曰不保其往也况利害之間哉王荆公亦疑揚雄無投閣事兩公意皆忠厚然雄之學惟未至於孟軻或不幸至此以劇秦美新觀雄意憂懼深矣後之君子必有能辨之者桓彥範敬暉等既知國政懼武三思讒間引崔湜為耳目湜反以桓敬等計議潛告三思及桓敬徙嶺外湜又說三思盡宜殺之三思問誰可使者乃舉周利貞桓敬等聞利貞至多自殺右崔湜附傳第二十四桓敬等忠於唐志必興復繼以中宗之庸患未艾也故與武三思同列而不辭夫與惡人處欲不伺其動靜而務通行則身昜危而功不成其不得已而用耳目計之下也夫仁厚者固不肯為人使而可使者必皆小人以敬桓二公之忠如日月而委情於小人之湜以胎禍後世不可以罪之者特其不為身而為國可以情恕耳雖然亦足以為立功謀事者之深戒也蘇良嗣為荆州長史髙宗使宦者緣江採異竹將於苑中植之宦者科舟載竹所在縱㬥良嗣囚之因上疏切諫髙宗下制慰勉遽令棄竹於江中右蘇良嗣傳第二十五髙宗非納諫之主而良嗣之名亦未信於朝廷也至囚王人而罷奪其所求髙宗慰勉之不暇此事君臣皆可賢近古所未有也韋挺為御史大夫馬周為監察御史以周寒士殊不禮之至是周為中書令太宗嘗復欲用挺在門下周密陳挺傲狠非宰相器遂寢將有事於遼東擇人運糧周又奏挺才堪粗使太宗從之至盧思臺不可更進太宗怒除名右韋挺傳第二十七人才豈有世族寒士之間邪挺不足以識周又輕之非也而周報挺亦甚矣謂非宰相器或者雖挾舊怨猶附公議至言才堪粗使加以萬里之行是擠之也周於此愧不忮矣姚崇為靈武軍使將行則天令舉外司堪為宰相者對曰張柬之沈厚有謀能斷大事且其人年老惟陛下急用之則天登時召見尋同鳯閣鸞臺平章事右張柬之傳第四十一時柬之已為秋官侍郎矣按狄仁傑傳則天嘗問仁傑朕要一好漢任使仁傑曰豈非文士齷齪思得竒才用之以成天下之務乎則天曰此朕心也仁傑曰荆州長史張柬之其人雖老真宰相才也乃召拜洛州司馬它日又求賢仁傑曰前言張柬之未用也則天曰已遷之矣仁傑曰臣薦宰相今為司馬非用之也又遷為秋官侍郎竟召為相果興復中宗吕溫贊仁傑云取日虞淵洗光咸池潛授五龍夾之以飛蓋仁傑之勳如此而此傳乃専言崇薦之以其時􅊲之仁傑之薦在荆州時後再薦乃為秋官侍郎而崇之薦時已在秋官矣或者則天用仁傑言已深知柬之因崇純薦竟大用非崇一言便為相也又傳曰仁傑所拔用至公卿者數十人崇自是仁傑薦用則天信重二人當有間也而舊史自相為異其無法多此類突厥吐蕃數犯塞元忠皆為大總管拒之元忠在軍惟持重自守竟無所克獲右魏元忠傳第四十二元忠初以太學生詣洛陽上封事言吐蕃形勢將帥得失成敗曉然真經務才也至身自臨戎僅能保聚迄無成功然則人才豈一端而已必有能言之者亦必有能為之者故王者用人貴因其長計議折衝自兩事也若元忠當國守正嫉邪忠讜可與任大則不能少貶矣初元忠作相於則天朝議者以為公清至是再居政事天下莫不延首傾屬冀有所弘益元忠乃親附權豪抑棄寒俊竟不能賞善罰惡右同上武韋之際執政者厥惟艱哉元忠直亮有勇當來周酷吏羅織方興尚不能自容而顛沛僅免者數矣至韋氏時何庸乃復親附權豪哉觀其懇諫太女之請全軀固位者所不能為後竟遭三思之黨構其與節愍同謀權豪之助果安在耶此近史臣私意也史臣曰大帝孝和之朝政不由己元忠安石巨源至忠彥昭等行非純一識昧存亡徇利貪榮有始無卒不得其死宜哉右傳第四十二此謂魏元忠韋安石韋巨源蕭至忠趙彥昭也元忠在武韋時皆有忠節非茍從之者借使其間不能盡舉綱紀以正朝廷或遜以免禍以其時考之當爾也昭公不知禮孔子受以為過陽貨謂孔子非賢智曰諾吾將仕矣道有時而屈也安石在則天朝於內殿面折張昜之顧左右逐出宋霸子在睿宗朝顯拒太平公主力保太子有大功云上不可信讒言二事皆勇過孟賁矣卒不容於邪黨以至擯死此兩公何負而與巨源彥昭憸險附離輩竝列而同書至謂行不純一徇利貪榮何其悖哉至忠雖柔佞猶時時小附公議為一介之操不至於巨源輩可深賤第因依太平以蹈禍則無可言者長安中西突厥焉質勒與諸蕃不和舉兵相攻安西道絶則天令休璟與宰相商度事勢俄頃間草奏便遣施行後數日安西諸州表諸路兵馬應接程期一如休璟所畫因遷夏官尚書同鳯閣鸞臺三品又謂魏元忠李嶠姚元崇李逈秀等曰休璟諳練邉事卿等十不當一也右唐休璟傳第四十三休璟知四鎮山川迂直又長於兵計故能隃度不差若當時欲擇帥則無以加顧責宰相不及邉臣諳事非也而休璟又竟用此得宰相自古任人多此類先是朔方軍北與突厥以河為界張仁願請奪取漠南之地與河北築三受降城唐休璟以為兩漢以來皆北守黃河今於寇境築城勞人費功恐終為賊虜所有竟從仁願奏六旬而三城就不置甕門及曲敵戰格之具或問之仁願曰兵貴在攻取不宜退守寇若至此即當併力出戰回顧望城猶須斬之其後常元楷為總管始築甕門以備禦議者以此重仁願而輕元楷右張仁願傳第四十三仁願始謀築城休璟持不可而當時卒從仁願奏既築城不為守備元楷至乃修之而議者皆輕元楷此似仁願智勇俱勝而休璟元楷暗怯也然因河為津不免侵軼若入人之地恃孤壘以守則兵食非十倍不可使力能守之亦可暫而不可久也休璟之慮逺矣兵在攻取亦無常勝若前有堅敵勢必退守而無退守之城亦不可此似背水祇可一用而防戍難施也元楷之計得矣時將建儲二以成器嫡長而玄宗有討平韋氏之功意久不定成器辭曰儲副者天下之公器時平則先嫡長國難則㱕有功若失其宜海內失望非社稷之福臣敢以死請纍日涕泣言甚切至既薨追尊為讓皇帝右讓皇帝成器傳第四十五後改名憲憲以嫡長見議猶建成之當立也秦王創國所謂天與之人與之也髙祖不謀而立建成建成不辭而當大統禍幾覆邦承乾魏王泰等事不戒前車之轍亦相傾危以至并棄夫禍福成敗之理本不難知而利害當前不啻丘山何暇自擇哉人情簞食豆羮見於色而能深知天命人事不以天下昜其生非吳太伯其誰能任此耶蓋玄宗以藩王討國后雖英謀獨斷而事成不成間不容髮於唐實再造之功無異秦王衆所屬也憲雖鑑往事而懼然明識先定不為大利中搖蓋髙世難能之行不但明哲保身而已玄宗既內懷推己之德故一切褒崇終始恩厚亦前古所無夫讓非難讓而不處其嫌之為難憲既通達故克自抑畏不干時事使間言無從而入豈特玄宗天性篤於兄弟而然哉觀肅宗親玄宗子既以功遜位而李輔國構其間玄宗晚節猶自恨以謂吾兒不得終孝道夫親愛何足恃哉魏知古改紫微令姚崇深忌憚之隂加讒毁罷知政事三年卒宋璟聞而歎曰叔向古之遺直子産古之遺愛能兼之者其在魏公右魏知古傳第四十八知古彊諫守節不愧廣平之稱崇方徑雖不及璟然當時同稱賢相言忌憚知古人情不相若或者有之至隂加讒毁則崇不應爾也讒毁必有言何得不載故凡史臣書事欲信於後世者必著其事之實不然誰不可以加諸耶韓思復開元初為諫議大夫時山東蝗大起姚崇為中書令奏遣使分往河南河北諸道殺蝗而埋之思復以為蝗天災當修德以攘之恐非人力所能翦滅上疏云云崇乃請遣思復往山東撿蝗又請劉沼詳覆沼希崇㫖遂捶撻百姓回改舊狀以奏之由是河南數州竟不得免思復遂為崇所擠出為德州刺史右韓思復傳第五十一修德攘災雖王者所務然蝗遍天下不加驅捕坐視饑罄父子相食而曰天災勿除但當修德夫德修一日何足以弭已然之變而政事暫弛則患不勝滋矣要患至先除而後退自警勵其誰曰不可思復書生守文而崇慮變深以事不合㫖出為刺史非擠也魏光乘奏請行用魏徵所注類禮上令元行沖撰義疏將立學官張說駮奏孫炎始改舊本有同抄書上然其奏行沖恚諸儒排己著論自釋史臣曰此道非趣時之具其窮宜哉右元行沖傳第五十二戴禮已號殘缺補綴然聖言尚多有之及弟子門人所述不可廢也孫魏編類之書不能增益秦漢以前乃欲如遺經加義疏列學官何哉張說自非純儒不為章句者聚徒修書日不暇給要皆破碎無補未免於此纍也然至於行沖等欲經外别立學則說亦知其不可矣行沖務黨已學猥為同異而史臣又謂此道非趣時之具抑末也哉牛仙客初為縣小吏在河西節度時省用所積巨萬上大悅以為尚書張九齡執奏不可乃加實封九齡罷知政事遂同中書門下三品仙客既居相位所有錫賚皆緘封不啓百司咨事曰但依令式可也不敢措手裁決右牛仙客傳第五十三用人雖無流品之異而蕭何亦不常出至用簿書倉庾之才位宰相嗟夫人主惟務以聚蓄賞臣下將無所不至也安祿山叛以封常清為范陽節度得兵六萬皆傭保市井之流乃斷河陽橋於東京為固守之備賊大軍至常清戰敗奔至陜郡遇髙仙芝具以賊勢告之云恐難與爭鋒仙芝退守潼關監軍邉令誠言仙芝常清撓敗之狀玄宗怒遣令誠齎敕斬之右髙仙芝傳第五十四街亭之敗諸葛孔明以馬謖違節制戮之以徇而習鑿齒非之以謂明法勝材不師三敗之道亮志清中原成師而出謖舉動失利戮之以徇似未過也而尚以見譏開元天寶太平日久變出不意河北根本一朝盡陷顧責常清輩率市井白徒獨當其鋒鋭敗不亦宜哉東都既覆仙芝度往必并沒遽保潼關未為全失且二將名驍勇赦而使過未必無後效而以令誠一言奔走危迫之中先自割其手足既不足以勵諸將而徒沮士心時既乏人至舉數十萬衆付之哥舒翰病廢憒瞢之人姧人又從旁逼遣之一戰大潰幾覆宗社惜哉李林甫猜忌不見於詞色已自封植朝望稍著者必隂計中傷韋堅以皇太子妃引居要職實圖傾之乃潛令楊愼矜伺堅隙賜堅自盡愼矜權位寖盛又忌之乃引王鉷託以心腹鉷誣奏愼矜族其家鉷權盛林甫亦畏避之國忠之誅王銲鉷以表示林甫不許賜鉷自盡右李林甫傳第五十五王鉷傳第五十六韋揚王皆以賈販穿窬之才內阿主欲外附權利破人門族圖已富貴而人亦從而傾之譬如禽獸之趨食更誘其儕類以就網穽而身隨烹滅前者死後者益來悲夫國忠薦鮮于仲通率兵八萬討閣羅鳯于瀘南全軍陷沒國忠掩其敗狀叙其戰功又使李宓率師七萬再討南蠻不戰而敗李宓死于陳國忠又隱其敗以捷書上聞自仲通宓再舉討蠻皆中國利兵物故者十八九舉二十萬棄之死地人銜寃毒無敢言者右楊國忠傳第五十六趙髙事二世専務塗其耳目山東盜起而不聞後二世悔問左右何不告我左右曰臣若言之死已久矣二世庸蔽指鹿面謾自不能知何暇問關東哉若玄宗英武不世出國忠才駑下非秦事比也然一旦恣肆權去已手昏不知察其禍乃不減趙髙之於胡亥至覆軍二十萬以敗為勝旁無人敢以聞者何哉人君惟內有所嬖不暇恤外事有所信不能擇忠良則堂下之事雖如丘山無由識之國忠知上之可以欺而欺之姧臣之常情而當時滿朝豈無忠賢一二然人人畏憚國忠不敢漏其事近有國忠而蒙昧如此則逺有祿山十年包藏何從覺之哉故荀子論不蔽之福蔽之禍蓋相去其間不能以髮可不慎哉濟北朝先生雞肋集卷第四十七
