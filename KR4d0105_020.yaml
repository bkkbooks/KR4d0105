body:
  text: 第二十卷絶句新城塔山對雨二首同柳戒之夜過三學院汴堤草雪懷徑山澄慧道人送李知章下第㱕河北曉發長蘆晚雪示閻仲孺村居即事流民先塋治事㱕陌上花八首外舅杜寺丞永城守水作詩寄呈都門甘雨約李令和胡戢七首坐進庵張傑以龍茶換蘇帖和王拱辰觀梨花二首次韵兩蘇公講筵唱和四首復至凝祥池上題工部文侍郎周翰郭熙平逺二首呈文潜和文潜謝王立之送蠟梅和文潛試院道舊夜聞慎思吟諷赴廣陵邑中三首出城三首揚州雜詠七首題僧法芝鍾山詩後復和定國惠竹皮枕謔句和答曾敬之祕書見招能賦堂烹茶之句二首守蒲過洛思十嵗時侍先君寓居泣涕成詩二首澠池道中次韵提刑毅父送茶次韵閻仲父病起二首濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第二十絶句七言新城塔山對雨二首山外圓天一鏡開山頭雲起似浮埃松吟竹舞水紋亂坐見溪南風雨來竹枝草履步蒼苔山上孤亭四牖開煙雨濛濛溪又急小篷時轉碧灘來同柳戒之夜過三學院步月尋溪過佛齊溪邊石蘚溼芒鞋虛窗獨卧聽松竹半夜一山風雨來汴堤草雪懷徑山澄慧道人朔風吹雪亂霑襟走馬投村日向沈遙想道人敲石火冷杉寒竹五峯深送李知章下弟㱕河北鬭雞擊劎鄴王臺萬古英雄死不埋子去悲歌宜有和露螢白首亦常材晚發長蘆船頭勾曲洪濤外船尾長蘆白霧中千里山容初上日一江帆影盡乘風晚雪示閻仲孺拂檐㸃砌靜如沙無限寒林頃刻花明日窮檐深一尺不知何處覓袁家村居即事十載京塵化客衣故園榆柳識春㱕深村芳物無由覓蝴蝶雙尋麥隴飛流民生涯不復舊桑田瓦釡荆籃止道邊日草榆園拾青莢可憐無數沈郎錢先塋治事㱕先人㫺慕栖山樂賤子今懷陟岵悲柏葉初生石牆短况無金帶買豐碑家貧未能故及也補之方謀葬先子陌上花八首先生詩事見蘇郊外金軿步帳隨道邊游女看王妃內官走馬傳書報陌上花開緩緩㱕朝雲草雨山頭宅暖日晴風陌上花絳幕何妨行緩緩送春㱕盡妾還家娘子歌傳樂府悲當年陌上看芳菲曼聲更緩何妨緩莫似東風火急㱕荆王夢罷已春㱕陌上花隨草雨飛却喚江船人不識杜秋紅淚滿羅衣吳歌白紵怨芳菲腸斷懷王去不㱕陌上如今小花伴山前山後白鷴飛臨安城郭半池臺曽是香塵撲面來不見當時翠軿女今年陌上又花開雲母蠻箋作信來佳人陌上看花回妾行不似東風急為報花須緩緩開陌上偷來為看花饒聲鶯鵡莫夭斜犢車緩緩隨芳草不去桃源阿母家外舅杜寺丞永城守水作詩寄呈雪消冰動看通津草長江南岸岸春莫唱龍舟五更曲揚州楊栁解愁人都門飄零何處是生涯瘦馬都門踏落花芳物攪心看不得綈袍遮眼畏風沙甘雨暗暗轟轟有物催端如鬼駕北溟來百昌一種得甘雨蛇不耆乾苕卵摧乾獨不得甘雨古語云一蛇耆約李令茅檐明月夜蕭蕭殘雪晶熒在栁條獨約城隅間李令一杯山芋挍離騷和胡戢七首達則經綸隱著書㫺人於此孰親疏王通持砥答揚素汾曲先人有敝廬相逢樽酒未辭深握手盱眙十載心車馬凄凉人夜别出門落月與橫參聞說㱕心已浩然蘇門况有子雲􅒡廣文不去慙官長繫馬堂階要酒錢住近蘇門有白雲閉關却掃道逾尊相逢不語忽長嘯今日豈無人姓孫時平未用入山深嵗晚何妨木秀林聞說熊羆參後乘可容牛下有哀吟千首清詩競夜長真成蝴蝶為春忙莫教流落人間少䨓電它時下取將少時豪氣恨沈淪繆意詩書可庇民長笑壯年無一事微吟只有故人親坐進庵海魚水擊三千里決起還須九萬程坐進庵中才一步初無行處若為行張傑以龍茶換蘇帖寄茶換字真佳尚此事人間信亦稀它日封厨失雙牘應隨癡顧畫俱飛和王拱辰觀梨花二首海棠十韵詫芬芳慙愧梨花冷似霜賴有樂天春雨句寂寥從此亦馨香壓沙寺裏萬株芳一道清流照雪霜銀闕森森廣寒曉仙人玉仗有天香次韵兩蘇公講筵唱和四首白髮㱕聯侍從榮未應江海歎飄零禽魚不與鈞天觀想見羣龍舞洞庭李公素譽壓朝端曾泝龍門鬛未乾雖愧彭宣惟賜食未慙貢禹亦彈冠纘服憂勤未有言諸儒經術侍彤軒九疇咸敘今天錫三畫何人㫺夢吞金玉誰人詠德音太平無象屬人心日髙初散露門講天上五雲宮殿深復至凝祥池上去嵗相㩦此地遊西風垂果奉靈湫春工變化渾無跡紅滿枝條緑滿洲題工部文侍郎周翰郭熙平逺二首漁村半落楚江邊林外秋原雨外天誰倚竹樓邀大艑天涯草色已蒼然洞庭木落萬波秋說與南人亦自愁欲指吳松何處是一行征雁海山頭呈文潛無計河西尋杜家海棠空詠去年花煩君為謝郭少尹欲買纏頭迎犢車尤知名郭明遠妓和文潛二首阮籍空貪步兵酒陽城猶戀集賢書飽知世事非人力可是因玄更泊如索米彊知當世䇿種芝欲訪隱人書未應只有鄰邦約投老相看事事如謝王立之送蠟梅五首未教落素混冰池且看輕黃綴雪枝越使可因千里致春風元自未曾知恐是凝酥染得黃月中清露滴來香定知何遜牽詩興借與穿簾一㸃光上林初就詔羣臣紫蒂同心各自新誰見小園深雪裏破春一蕚更驚人詩報蠟梅開最先小奩分寄雪中妍水村映竹家家有天漢橋邊絶可憐去年不見蠟梅開准擬新年恰恰來芳菲意淺姿容淡憶得素兒如此梅小鬟􅊨立之家和文潛試院道舊璧月照歌淮上舫姚花引醉福昌城何如閶闔門西北卧聽秋風枕畔聲夜聞慎思吟諷疏林小雨月朧明商頌琅琅半夜聲鄧子弓彊殊未發欲馳桑本犯堅城赴廣陵道中三首醉卧符籬太守亭别都絃管記曾稱淮山楊栁春千里尚有多情憶小勝勸酒小勝其字也南都留守使雙鬟急鼓鼕鼕下泗州却瞻金塔在中流帆開朝日初生處船轉春山欲盡頭楊柳青青欲哺烏一春風雨暗隋渠落帆未覺揚州逺已喜淮隂見白魚出城三首埭新堤視邵伯桃欲呈紅柳弄陰麥田青已沒鞋深春堤細雨籃輿溼婆餅焦聲在竹林故國龍舟休水調高城雉堞尚雲間蜀岡朝雨如輕霧不見春江草外山堆案文書無了畢竝堤船舫且縈回非關董役年年事自為春郊得得來揚州雜詠七首舶商不入古鹽溝疏鑿才爭土一抔未說興墟灌田事且還歌吹舊揚州雷陂新作麥田荒曾說風興沒兩郎誰似當年李刺史春波還引句城塘欲穿九曲通淮子只費春夫數日工但見荷花三十里何須更有大雷宫蜀岡茶味圗經說不貢春芽向十年未惜青青藏馬鬛可能辜負大明泉皂莢村南三里許春江不隔一程遙雙堤鬬起如牛角知是隋家萬里橋龍興寺裏青雲幹后土祠中白雪葩五百年間城郭改空留鴨腳伴瓊花楊徐僭盜雄圗熾髙呂陵夷霸氣䦨猶有昆岡作龍虎千秋原廟奉衣冠題僧法芝鐘山詩後明珠出袖四百琲座有煙霞草木香斷取鐘山擎石掌那知不下淨名床復和定國專竹皮枕謔句老來山水興彌深不在長安俠少林它日只為林下計不將錦被作呻吟和答曾敬之祕書見招能賦堂烹茶二首玉泉吟鼎月隳輪姑射風標兩絶塵只缺何郎窗畔雪戎葵為我作餘春一碗分來百越春玉溪小暑却宜人紅塵它日同回首能賦堂中偶坐身守蒲過洛思十歲時侍先君寓居泣涕成詩二首建春門外柳依依迸淚當年綵服嬉窮子更無逢父日匿王空記看河時先君欲築伊川意四十年間萬事非他日一􅒡從可卜白頭持此欲安㱕澠池道中虎狼敵國易良圖望見將軍要引車不畏秦彊畏廉鬬古來只有藺相如次韵提刑毅甫送茶炮羔煮餅漸宜秦愁絶江南一味真健步逺梅安用插鷓鴣金盞有餘春次韵閻仲甫郎中病起二首伏波七十老鍪弧薏苡何曾適病軀髙臥輸公無一事評詩挍畫是功夫脫略軒裳陶隱居肘書百卷事寧軀茯苓日長東山澀早晚柴車命僕夫濟北朝先生雞肋集卷第二十
