body:
  text: 第三卷辭望渦流辭追和陶淵明㱕去來辭返迷辭冰玉堂辭漫浪閣辭遐觀樓辭樂哉侯之邦兮樂哉侯之堂兮守韓侯也二章美澶維夫君兮桂舟一首送梁正受㱕汶陽山坡陀辭白紵辭上蘇翰林二首江頭秋風辭琴中宫調辭濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第三辭望渦流辭渦之水西流過譙郡北乃稍南又東流入于淮包渙二水皆經其南以東歲旱深不五尺秋雨集始大而城之東北惟渦曲水深黑灌木蓊然舊有祠曰龍嘗宅焉作望渦流其詞曰望渦流兮浼浼勢南折兮東還水衝隈兮岸圯嗟龍去兮幾年俯余進兮藂祠儼帝服兮神冠牆壁繢兮怪竒泯蛇穴兮蝸盤列缺鞭兮䨓輈衛兩鰻兮驂鱣老龜起兮霧游跂玳瑁兮鱉黿或若馬兮非人紛陪後兮導前木陰陰兮藻長科斗舞兮下顚鯈羣出兮旅嬉忽俱去兮不還意土國兮無龍恐逃桷兮藏帝有命兮時乘亦隱隱兮填填世鑠石兮流金將誰識兮此愆包之水可揭也渙之水可厲也前汝足其暨也後汝跗其躓也江有鯢兮橫淵海有鯤兮翔天汝隘此兮往爭滔淫水兮八埏重曰望其崖若有宅於隈不汝爭於崖汝安其隈澤不必施也與渦竝流包渙二水追和陶淵明歸去來辭辭長而歌短歌有和辭無和也言語文章隨世隨異非擬其辭也繼其志也作者七人矣詞曰歸去來兮吾無以歸奚以歸既身不足以任責畏首尾而心悲慕往㫺之經世嗟吾力之莫追彼辭位而灌園豈吾今之獨非雨冥冥而荷笠榛莽莽而褰衣我行野而視天覺㝢大而身微乃矜虻蚷止驅息奔背隍築室面坂植門三綬從褫圖書尚存忘瓠落之可憂比浮海之為樽躒太初而游意弊無極而雕顔反國蝸而自足俯巢幕而亦安解豫轡之沃濡兮脫豫舝之間關識鳥鳴而物華陶陽氣以流觀悟息淵而消枝亦墐户而俱還惟文字之幼工則雖老而桓桓歸去來兮彼河濵之善游或往學而喪生復褁糧其安求善陶生之達情不與世兮同憂實迷途其已逺懼斯人之莫疇或待兔守株或遺劎刻舟雖成事之不說聚悔踰於山丘庶西方之至言聊反聞而逆流守一靜而為君亦何往而不休已焉哉一晝一夜成四時子之歎川逝不留頽光不可使東之韓終王子喬汗漫難與期俯寸田之荆棘曷不旦耘而草耔悲在堂之蟋蟀慙不樂於唐詩悟死生之如夢亘今古而無疑返迷辭五達跂行者迷茨菉蹊蚖蜴嬉杳淒淒莽離離赫隆曦可還時日黯西與誰期往不思逢詭期死貔安可知亟反之大道夷都邑差車馬馳冠劎祇志可持能足施貴名垂好爵靡儼樽巵饜梁肥窈室帷安厥妃觀盈虧浩浩移逝不遲咸若斯何綏綏不返為從魈夔神索衰今狐疑後當悲我此詞如泰龜冰玉堂辭冰玉堂者始前門下侍郎睂山蘇公子􅒘哭故廬山隱君劉凝之與其子道原之詞所謂潔亷不撓冰清而玉剛者也鄉人聞之其賢者喜其頑與懦者皆亷且立則相與採冰玉之語以名君堂而祠之而前起居舍人譙郡張文潛又因其名以為記蓋君父子博極羣書道原尤精史學而皆耿介守義不偶俗以沒世慕而傷焉故門下以謂夷淸而餓死惠和而三黜道不與命謀非和實得非清實喪而起居以謂司馬談與遷文學美矣而無聞於風節疏廣與受風節同矣而無傳於文學蓋門下至借君父子以論夷惠起居合其長謂過漢四人者以是知君父子為一時知名偉人所愛而推之無間然者如此則夫冰玉之名非鄉人故舊者之言也天下之言也補之生雖晚猶與君父子竝世而不及識既為館職修國史實録盡得道原所著十國紀年資治通鑑外紀諸書而觀之且門下補之所嘗事而起居所嘗游也因其言以益信顧雖不及識與夫識而知之者自以謂深且逺矣又與君之孫羲仲游相好元符中以罪遷玉山道出星子求君父子所葬而拜之五老巉然臨其上水交流其下松柏一徑如幢節行路耕者咸指而言曰此劉君之葬也則皆有敬容因喟然太息順塗而詠曰皎皎白駒在彼空谷劉君於是無愧乎天下之言矣既而復曰屈原以讒放而死而君父子進不犯難退而伏清節以沒與原異於原不更愈乎推此志也雖與日月爭光可也况冰玉乎哉凡楚人之詞皆傷夫中正不遇者而作也故以若詞弔之曰論世以觀士兮集義以為詞所非正而敢從兮日可罣而東之嗟若士之弗獲兮羌何忿而負石繄聖賢之出處兮惟遵道而守德鳳覽輝而乃下兮雛猶恥乎腐嚇非九方之為使兮夫何足以得馬廬岑岑以鎮楚兮洶大江之東涹分隂陽之晦明兮鍾斯人以正直惟天道與地寶兮非所求其猶愛與之全而不用兮懷斯美以固在大固不可以適兮方固不可以圓試回功謝於土榖兮夫乃同道於禹稷譬人生猶吹吷兮無得喪之可齊紛吾何指以為正兮服吾初其庶幾漫浪閣辭南康劉羲仲壯輿志操文義蚤知名於士大夫年四十矣而學問亦苦蓋不欲一日棄其力於無用也築屋廬山其先人之居自號曰漫浪翁意以比元結從仕與物皆不得已也豫章黃庭堅魯直曰壯輿未至於翁行已立志不可謂漫浪者潁川朝補之無咎以為知言壯輿曰請極其義補之曰唯其詞曰沛髙皇之受嬴兮劉别子曰楚元羌好詩而說義兮敬設醴於穆生戊始怠而穆去兮申白笑而鉗市富傳孫而失國兮派辟疆之支子爰清淨而少欲兮以身悟乎霍光蹇孫向之洽聞兮至耆老而彌良曰衆賢和於朝兮萬物和於野粵百世而能調兮民胥來而鳯下惟劉有後於楚兮千歲發夫道原流其芳以益逺兮偉壯輿之不愆原惟博而好直兮向異世而復起輿惟進而未已兮載向學亦不墜彼元結之信修兮羌何為此漫浪也將履中而晦外兮其德固天之放也惟漫浪之為言兮匪正則之嘉名豈其懲屈之死忠兮欲猗移以保生結當易之一爻兮幽人履而正吉輿方壯而惡畫兮棄爾輔欲誰賴吾語子漫浪之可兮遺物往其庶幾茍畏人而羣於人兮拭唾面其猶殆朝騁望乎紫霄兮夕㱕次乎左蠡五老兮在上星子兮在下垂瀑介於髙丘兮洞深林而北靡飛梁亘於三峽兮倐異景而殊世青松屋兮桂宇辛夷房兮梅户蘭糗兮菊粻蓀體薦兮肴若芳雲駟兮霓輈歲將晏兮誰與游煙為衣兮水為珮君誰須兮林之際吾以漫為旌兮建彼太虛之上也吾以浪為乘兮周彼八荒之外也羾萬里而不逢人兮御謁我以宜止暗轟轟而曠洶洶兮羌何以辨乎明晦彌高出於千仞兮羣鳯過而北南彌幽徑於雷室兮列缺驚而後先求佺僑而不得兮咸勃窣其在下乃山澤之臞兮夫何足以跂而望我茫吾不知其所如兮黔嬴告我以何舍出無隂兮入無陽旋丹崖兮匝大荒忽臨睨夫故居兮羣梯危之蜂户傴白叟之扶童兮迎謂我以良苦返吾稼兮復吾樵山兮江滔滔輿先人之善俗兮雖百世猶未改彼魯衰而齗齗兮吾老稚以知恥匪禮失而求野兮民固化於不恌輿克家而好常兮庸謹行以毋慠懷向原之遺直兮念爾祖而履薄陳洪範之九疇兮敘三統與七略以為博而弗考兮蹇無用而束閣紛輿世之多賢兮匪曲全而好修惟仁宅與義路兮羌可居而必􅒘結信賢而自晦兮忘其同物以迷世鳬與波而上下兮夫固非駒之所喜亂曰接輿詭而悟聖兮匪沮溺亦楚狂聖與言而莫顧兮人以為知乎大方既不足用吾中兮吾將從回憲之所臧遐觀樓辭窘牆堵之伏潛兮登斯樓以遐觀匪吾居之為隘兮乾坤䀜其盂盤仰攀甍而拊楯兮宇曠曠而益寬彼何大而能舒兮吾何眇而莫間霜肅壟而木枯兮潦收竇而澤乾蓬鳴野而相追兮知海冰而天寒左睇兮城闉右盼兮林埛商賈紛其晝合兮陶冶蓊其煙興之罘杳以在東雙柏近而青青物暇遽之不同兮余亦不知其何情聊浮遊以相羊兮初怫鬱而中清彼坱圠之無垠兮人駒隙之暫更道本夷而世險兮夸奪饜而卒平周垣兀其跨衍兮逝千古於樵耕春與秋之不淹兮歲忽忽其峥嶸招搖指於北陸兮淡黃宮之陽生固天道之反覆兮氣默㑹而孤萌朝卷箔而極望兮稍霧廓而日晶及暘景之方中兮晞余髮乎南榮浮雲起而景翳兮四暝合而覩星風摵摵而感軒兮雀啾啾而赴楹收百為以清慮兮施余裯而榻橫漠洶洶而非聲兮邈冉冉而非征形欺魄而若存兮神無虧而靡成目瞳曨而罔覿兮坐待日之方升夜寥寥而未央兮羌不寐而無營樂哉侯之邦兮樂哉侯之堂兮守韓侯也二章美澶樂哉侯之邦兮封楚宮與復關美哉洋洋水兮崑崙始乎並川桐離夫其實兮緑竹兑於丘園三年庶夫有成兮蹇吾師其永歎營室壁而建墉兮參國一其可觀塗椒丘吾駕車兮攬豫騑之嘽嘽襲豫斾之悠悠兮侯降觀其于田春陽滿其親天兮乃物作而芄蘭來吾省夫在疇兮介黍稷之有年侯寧般于遊兮無非事而不煩羌信修而好我兮曷懷㱕而翩翩信侯邦之可樂兮蹇攜手其同行樂哉侯之堂兮高門桀兮蘭錡切雲冠之峩峩兮四牡矯兮戾止夜悠悠其未晨兮紛侯庭之徙履雲容容而承􅎝兮日淡淡兮階戺雨雪晛其將流兮黃宮動乎子美爰俶生之煌煌兮又尚兹夫介祉嚴若植其姣服兮侯何須兮堂際進蕙幬豫稱觥兮芬豫席之蘭茞朱顔忽其滿堂兮五音昌兮來㑹藐姑射之綽約兮願慤保而為使洵侯堂之可樂兮與日月其無圯維夫君兮桂舟一首送梁正受㱕汶陽維夫君兮桂舟酌余酒兮攬君留君何為兮此野菊菲菲兮蝶下韡韡兮煌煌爛金敷兮襲余堂茱萸兮芙容衆芳越兮亂五風飢咀兮靈芝君歌樂兮余和之日下兮野隂淡忘㱕兮中林橘棟兮梅宇紛瓊茅兮被南榮白羽兮黑翮邀仙人兮語此文余高馳兮世之外君猋舉兮先余至襟帶兮東方旦爭門兮汶之陽大野兮始波翔鶬鸛兮嘷駕鵝羣宿兮迷址旅食兮殫穗霜肅肅兮葉方下君欲濟兮淹回水通道兮躞蹀冠如箕兮帶長鋏里千室兮士一喙余不善兮紛余誶世謂折揚好兮余白雪而莫知棄火布而以為垢兮胡不浣炎而振之彼鏌邪而能言兮工謂余以不祥聊逍遙而挫鋭兮䝉黯黮而益光山坡陀辭山坡陀兮下屬江勢崖絶兮濤波所蕩如頽牆松鬱律兮其高百尺旁枝虬騖葛虆之仰不見日兮下可依吾曵杖兮吾僮以吾之書隨邈余望兮水中汦頎然而長者黃冠兮羽衣軒頤坦腹濤石箕坐兮石亦有趾安不危四無人兮可忘飢仙人偓佺兮自言其居瑶之圃一日一夕兮飛相往來不可數使其開口而言兮豈惟河漢無極驚余心默不言兮蹇昭氏之不鼓琴憺將翔兮山海與日月兮常在若有聞兮夢中仇池我歸路此非小有兮噫乎何以樂此而不去㫺余遊於葛天氏兮身非陶氏猶與偕乘渺莽良未可兮僕夫悲余馬懷聊逍遙兮容與晞余髮兮蘭之渚余論世兮千載一人猶竝時歧又有歧兮余行詰曲欲知余者希峩峩洋洋余方樂兮譬余擊舟於水魚沉鳥揚亦不知何必每念輒得應余若響坐有如此兮人子期白紵辭上蘇翰林二首白紵棼莫緝紉蘭作衣祛朝兮日所暴草兮雨所濡木瓜諒微物期報乃瓊琚芳華辭甚妙贈我不如無上山割白紵山高葉摵摵持㱕當戶績為君為絺綌不惜潔如霜畏君莫我即誰言菖蒲花可聞不可識江頭秋風辭雒陽客後車結駟傳燭食人生富貴不易得江頭秋風旦夕起胡為翩翩雒陽陌雒陽陌吹塵埃江頭樹安在哉秋風起菱花開鱸魚肥歸去來琴中宮調辭神仙神仙何處青山裏白雲際不似人間世源上正碧桃春清溪乍逢人住無因憶紅塵出洞花紛紛卷二終
