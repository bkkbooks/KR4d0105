body:
  text: 第二十三卷挽辭欽聖皇后挽辭二首欽慈皇后挽辭二首王拱辰太尉挽辭二首趙開祖挽辭一首蔡州叔父金部挽辭五首蔡州叔父金部挽辭别二首秦國夫人挽辭安門下母二首秦國夫人挽辭三首任承制挽辭濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第二十三挽辭欽聖皇后挽辭二首神開大馬表坤祺象配黃龍耀母儀囏棘從權非本意憂勤復辟竟先期欲書皇極彞倫事不在關睢卷耳詩陵作因山名改聖君王仁孝自生知蒼黃大策中先定洶涌姦言外獨驚可但觸山憂地坼只應鍊石見天成江湖自㫺波濤逺日月如今晝夜明盡作兒啼送文母不知簫鼓若為聲欽慈皇后挽辭二首仙馭飄颻不可尋西陵寶冊襚衣衾禮遵章懿因仁志諡酌欽慈自聖心感泣萬人隨遣奠恩勤千古詠徽音一言能使民忠勸要識吾君孝治深弓韣它年事炳靈紅光滿室衆潛驚人言薄氏誠君子天與文皇兆大橫聖有至情風不止邦傳慶祚日重明百神陪扈朝陵寢想像登輿動珮聲王拱辰太尉挽辭二首賈山辭賦妙升堂十八髙名擅雒陽遭主聖人千載事濟時賢獻萬夫望已加壇上將軍鉞未促齊中相國裝曾有新詩介睂壽悲歌何忍送㱕牆童年已切耆英慕壯歲初陪後乘遊衛幕櫜弓皆廣建梁筵進牘竝枚鄒雲臺生面丹青古馬鬛新封草木秋是事公應付蜩甲蒼霞誰見揖浮丘趙開祖挽歌辭萬里㱕來兩鬢霜故人如玉閟幽堂凄凉長吉無題句冥默淮南未試方空復藏書如冊府何􅒘載酒更僧坊諸郎文字能傳業開府風流未渠央蔡州叔父金部挽歌辭五首文詞蚤嵗諸儒上操行當朝國士期清世急賢千載事白頭齎志一州麾省中共幞青綾出關內同驅五馬行何許書來一千里西風淮上淚縱橫青史他年羡二疏功成脫屣向迷塗薄遊竟後拋官約常愧都門長大夫聞道一􅒡親卜築亦求百畞伴鉏犂那知湖海㱕來日只及鄉閭㑹葬時竝直儀曹前後㕔當簷種竹已青青平生不試南宫筆可忍圗公地下銘蔡州叔父金部挽辭别二首書來猶勸還鄉早路梗誰令去棹遲曾綴鏘金拜先壘可堪扱衽送靈輀學比我公常恐後身於餘子似蒙知心驚竝直儀曹夜淚盡孤吟海浦時秦國夫人挽辭安門下母二首瓜瓞傳仙裔鳲鳩媲積功龍章看子貴鶴髮與夫同揄翟丹青裏珠襦鼓吹中秋原送車淚斜日起西風城南塞冠蓋哀挽送何人吉卜郊連浚恩封國號秦桓碑空復古蒿里不知春應奪居廬念朝廷佇弼臣秦國夫人挽辭三首指李仙源後興唐帝胄餘家傳湖北句人誦嶺南書知子唯賔客揚名屬起居平生操史筆遺事一欷歔相國家風獨夫人壼範如寶珈宜服象文錦合軒魚感慨溫成議光華慶壽餘非夫聞敵退應愧此生虛酷好春秋學親書列女篇胡兒吟敢竝逸少字方傳餘事猶閨範髙材自世賢凱風君莫誦秋柏已成阡任承制挽辭劉挍勘槩求作生業清談外浮名痛飲餘誰令力如虎坐使食無魚壁冷猶鳴劒床空未卷書呻吟待河潤秋柏只遺墟濟北朝先生雞肋集卷第二十三
