body:
  text: 第二十八卷雜著賔主辨諱辨話述七述醫言濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第二十八雜著賔主辨朝子既托陶子歸去來辭以名其居而記之自以聞道歷年而為潛不足中慙而疑隱几去智則方寸之地廓然其虛若兩丈夫為主與賔巾裾而坐廬賔曰子道與吾殊而多謂子類余豈其然乎凡子以躁樂吾靜隘恱吾和子人之放也而多謂與我自放者同科我遺夫世者已盡子緣於物者尚多而子賔賔焉以從我奈何主人曰萬物聚閭千古並塗然求諸其間天地異職父子殊面莫大且親而相因以判今賔方欲合兩人為一體則物我蜂起不可得而止賔不通之則自賔之身十指長短兩目大小肝膽共絡而楚越畫界也况賔出千載之上我起千載之下别族離居所遭異者而賔乃斬然為間方且病我之浮氣獨不傷賔之大同乎賔自揣心日化年改壯異幼時老乖壯日今是昨非前棄後拾使賔自操且不可得蓋孔子聖人猶六十化智如惠子徒觀其勤未知其謝賔如通之則齊嬰公扈離立易心夢為魚鳥可與飛沈况我欲遵子若是其賔賔者耶如賔之詞委心去留乘化歸盡化乃所過胡可以吝我之慕賔亦以是近躁靜隘和曰情非性人放自放非故曰命極則俱極進則皆進賔遺夫世者雖盡而猶多我緣於物者雖多而必盡則又胡可以賔之既瘳而傲我之方病也水既蛻地氣又蛻水吾方解我之不然而經賔之所以則我既化矣雖六十改未知為數也且物固以其近相慕昔伯宗人言其似楊父則懌桓溫婢以為類劉琨則欣夫楊父劉琨徇權殞身而夸者慕焉恐不得鄰前輿既覆後轍不逡彼皆炫智而鬬力角驅而競奔故強弱斯在而勝負可論也今我與賔既已俱出乎忘我之境而同塞乎纍物之門得失安在是非奚存哉賔獨不聞魯男子之拒託宿者乎嫠曰子胡不若柳下惠男子曰柳下惠固可吾固不可吾將以吾之不可學柳下惠之可而孔子以謂學柳下惠者多矣然未有似於斯人今欲使我如賔解組長違我則不可可在佚身賔則猶我譬魯男子審已故其為柳下惠也不以其同而以異及其至焉一也可不可安寄賔亦奚以知我不與賔同至於葛天氏之地以謂何如於是賔唯而起主人送之不離席則霍然若寤乃書之記後諱辨禮不諱嫌名二名不偏諱孔子之母名徴在言在不言徴言徴不言在補之先君子二名禮不偏諱者也單舉則於禮無怍矣而世皆偏諱厚於古不敢變也若嫌則後世亦有不諱者矣漢和帝名肇不改京兆郡魏武帝名操而其子植詩云修坂造雲日肇非兆造非操也唐韓愈非薄於親者作諱辨抵諱嫌者曰父名仁子不得為人乎義盡此矣然周人以諱事神亦惡夫音之斥也甥輩讀有若酉者斯可矣話述朝子嘗曰至人鶉居而鷇食鷇無常居鷇仰物食我窮殆似之蚍蜉集其枯螟宛轉于塗而我不廬開口待餔乃不如彼鳬有喙則腴其妻曰水舟而陸車乎憎里巷而愛歧陌乎今日越而昔者燕乎雲忽忽乎萍不止乎大章盧敖步八極乎荒土功乎負羈紲乎孔不暖乎墨不黔乎無乃蟹蛫蚿足躁不一乎陽鳥鷾鴯氣則移乎敗瓦墁乎長鋏溉乎匍匐往三咽乎人蓐食而媪見哀乎東郭穢而中庭泣乎貿貿來乎額額然伏乎西山餓乎雉噫徙乎無乃侏儒瞽師困慰祿乎豢豕犬羊犧餼養乎凡子行人間何以請擇事朝子曰唯既而曰龜笑不知我知之乎適可則可我不可乎其妻曰唯舍然大笑七述七嵗時年十豫嘗獲侍於蘇公蘇公為豫道杭之山川人物雄秀竒麗夸靡饒阜名不能殫者且稱枚乘曹植七發七啓之文以謂引物連類能究情狀退而深思倣其事為七述意者述公之言而非作也睂山先生懷道含光陸沈於俗日與嵇阮賦詩飲酒談笑自足泊然若將終身焉於是潁川孺子聞而往從之躡屐擔簦破衣踵門及階而止望帷而稱曰不敏聞先生之誼敢待于下風先生矍然驚曰孺子來吾惡夫世人之保我也久矣而不能使人之無我保則戶外之屐滿焉將命歟吾無所逃此雖然孺子何為者也孺子曰幼而多治長而屢窮遭先生乎齟齬之塗陪先生乎寂寥之事樂先生之所為樂者以白吾首其巳乎先生啞然笑曰孺子上吾以樂而未嘗無以樂者順也羈旅于吾有時矣二千里邑居牧聚蟻合蜂起髙城附之如帶繞指隱以為脊折以為尾因河塹華不足方比方城漢水胡敢競美當昔夫差之盛時內姑蘇以為心腹而外城此以為身革車千乘甲士萬人粟支十年帛散千屯灑汗成雨連衽成雲乃有大夫伯嚭行人伍貟之徒通其謀將軍孫武公子夫槩之徒用其衆嘗以國政之間發徒截江命習戰事於是張翠羽之蓋靡魚須之斿揚鵝足之楫曵龍尾之舟凌鱣黿之車戲賁獲之儔飄鼓吹乎下風隘戈矛乎上遊乍往乍還乍後乍先若亂而若聨乍止乍馳乍合乍離迭唱而迭隨驚鮫人立馮夷清江忽兮怒濤飇風為之揚歧怠而即次食具樂作三軍皆賀響震山壑其強如此故姑蘇恃以為南蔽而能驅唐蔡蹂齊魯侵尋乎百粵隳突乎三楚栖句踐乎窮山鞭平王乎頽墓此亦天下之形勝也孺子欲聞乎孺子曰西河中流衛客之所能諫秦險百二亭長之所能入願先生廢此而語它先生曰吳越之有東南也實國于杭而杭吳越之大都也宫室之麗猶有存者其始也削山填谷叩石墾陸蹶林誅樾擢篠夷竹旋緣阿丘憑附隈隩千夫運畚萬役供築增增硜硜坎坎碌碌前呼後和逺近相屬卑者起之以有餘髙者損之以不足開曠朗乎蒙密發瑰竒於潛伏然後工人之材陶人之瓦水輸陸運屬柁連輠縱橫錯落山積其下其成也翼翼鱗鱗勃鬱輪囷若化若神上據百尺之巔下俯億尋之津雙闕髙張敻臨康莊門開房達乍隂乍陽中則復殿重樓砂版金鈎卑髙仰俯下上明幽峥嶸截嶭鼎峙林列吐吞雲霧虧見日月宏規偉度古曠今絶旁則曲臺深閨碧檻朱扉鱗差閾限奕布榱題栱盤白鳯壁戲青猊溫風徐而吹座寒雨沐以霑帷列屋而侍者則妖嬙艷姝螓首冰膚清矑盧素齒既􅈺而都乃服輕袿被華裳綴珠履榆鳴璫飾鉛英含若芳倩巧笑兮婉清揚縹眇兮如雛鸞之欲舞逍遙乎如飛雲之欲舉㜕姍姽嫿婉孌媚嫵流榮發色不可程度羽觴薦朱顔酡悲激楚妙陽阿詞曰陌上花開遊女歸園南池北黃鸝飛曲房清閣夜更衣於是聞者恍然神揚意馳紛紛擾擾惑亂不怡此亦天下之雄觀殊樂也孺子欲聞乎孺子曰宫居閨處者寒燠之媒而疾癘之梯也且館娃成而麋鹿遊願先生廢此而語它先生曰杭故王都俗上工巧家夸人鬬窮麗殫好紛拿錯糾晃蕩精皛若八方之民車湊舟會角富而衍寶木則花梨美樅棁柏香檀陽平隂祕外澤中堅以斬以刋以剞以剜以漆以膠以墨以丹為床為匭為櫝為几為槃為巨為盂為簋嚴莊之佛慘烈之神詼怪之鬼頎姣之人塗以鉛英鏤以金文依以靈山乘以飛雲霞煙霧靄煥爛五采渠輸陸運投錢競買曽不若母猴木鳶三月而齊一日而敗衣則紈綾綺綈羅繡縠絺輕明柔纖如玉如肌竹窗軋軋寒絲手撥春風一夜百花盡發其製而服也或袍或鞶或紳或綸鱞或緣或表或縫或幱或紫或纁或紺或殷嚴以奉祠褻以養安薄以却暑厚以禦寒以錫三軍以賚四國以供耳目之玩以備土木之飾曽不若窮邊絶漠不紡不絡衣狐而袖狢寶則璆琳珊瑚碼瑙碔砆藥化之玉火化之珠琉璃之碗水精之盂紅黃白緑磊落滿櫝北商東賈百金不鬻沙河雨晴月照燈明席張案設左右煌熒逺而望之奪人目精遺英棄屑籮貯箱列曽不若宋人之拙三年而一葉於是雕床易席地之野文衣後弋綈之儉玉杯鄙土鉶之啜此亦天下之妙工絶巧也孺子欲聞乎孺子曰書云玩物喪志紂為象箸而箕子歎願先生廢此而語它先生曰杭之為州負海帶山蓋東南美味之所聚焉水羞陸品不待賈而足肉則封豲腯豕罝兔畋麂山狸白額竹犬青尾鶬鵝鸛鶩鶪秃鴻鵾園雞池鴨隴雉田鶉陵收水截頭駢尾列磔肩裂趾飛毛灑血魚則鯔魴鱣鱮鱸鱖鯿鯉黃顙黑脊丹腮白齒江鱘之醯石首之羮或臘而枯或膾而生白鰻青鮝黃黿黑蟹鮔魚花蛤車蛾淡菜蛙白肖雞螺辛類芥鼎調甌餖牛呞狢嘬果則枇杷楊桃橘柚柤梨青梅黃柿紫栗烏椑溪菱江蔍田苽湖藕壤肥水美天下無有冒以黃蜜漬以白醝芳香脆潔析酲解痾菜則茼蒿茵陳紫蕨青蓴韭畦芋區茭首芹根藤花羞盤菊葉薦莒薑辛薤淡薺甘筍苦飰以姑蘇之粳薦以烏程之醴于以和五氣于以資百體此亦天下食飲之珍也孺子欲聞乎孺子曰揚雄有云棄常珍而嗜異饌烏覩其識味也且養身而尚乎味味則愚以聖人為不如易牙願先生廢此而語它先生曰地不滿東南故八紘之水歸焉水之為物潤下作鹹溟渤蕩波海門莫緘駸駸脈布溢于江潭老濞席賚㸑山煮海豫章為船萬斛更載一船所受車數十量黃頭多錢富不可倣士之頑鈍不恥者皆餌其無厭之賞譬如山深而獸至木茂而鳥往故能收亡命借厮養連應髙之交合周丘之黨以北與中國爭長則鹽之利也夫鹽者食肴之將五均賖貸斡在縣官僅法議籠不罅以完大農給費入助國計官與牢盆世擅其利民有盜鬻則􅎂反徒計左趾沒入其器此為前古之所制嘗試觀乎江之濆葭葦不根淺草藝藝斥鹵無垠白花蘚文百里如雲鹽官千家匪柘匪麻匪漆匪茶規利乎泥沙蟻封蚓垤積土如截削剝剗刮不漏毛髮挾攜擔揭十步一蹶偷趨竊走遺筐棄缶塗關塞牖鼎釜雷吼皓然紛葩豐不盈斗姑以漬螺蛤而適口曽不比夫縣官冶鐵如山析竹為盤熾火以燔淵壑為乾峥嶸崷崒戍削律兀扶舒蕭勃煙氣滃出若滅若沒若亡若失乍疑鹽陽之神翳乎與羣蟲朝飛而蔽天日立呼起諾百夫齊作紛紜揮霍千竈就涸光芒閃爍璀璨磊落小星迸躍鱗鱗新倉斂貯堆藏如帛如糧國以是強神變鬼化刀貝齊價獨不美夫算菱芰魚蝤之殫細及下者哉諺曰千金之子不死於市又曰人富而仁義附焉此先生所以教民知榮辱之時也孺子欲聞乎孺子曰猗氏之治智賢白圭而不監於道願先生廢此而語它先生曰江源所起濫觴之墟泓泓汪汪不漏不虛放而行之冒於川渠繚繞縈行左挾越右截吳以散以敷然後淫為大江以東合乎尾閭而潮生焉古今所論潮者日月伏見之所為也嘗讀沌天之説曰地浮水中天在水外水之消息坱圠無際一闔一闢若開天地一呼一吸若出元氣其始來也若毛若線若帶若練堂堂沓沓合聚離散須臾之間千化萬變其少進也敲磕鏗􅥁石號木鳴越岸包陵在谷滿谷在坑滿坑其為氣也或喣或呀或噫或噦瀰茫湠漫澎濞沸渭澒洞滉漾渤潏滂沛􅉼淡淋滲潗濈淫泄跳珠湧沫百里紛會沃焦蕩冒汨母陵背縱橫絡驛飄忽爭逝徐則按行緩則就隊連氛纍祲陽景朝昧周天而旋踰八萬里不知其所憩於時玄冥收威海若振吼千溪崒立萬浦却走絶維推軸神母不守左驅天吳右拂九首淵客拒扉水夷潛牖江神海豨絶脰傷肘陽侯馬銜顛蹶前後其為象也則紛紜參差萬頃一迹禹不能知契不能識承光露怪不復潛匿或駃而蹄或森而戟或美而􅎶或張而翼洶湧而奔以沃海門若土囊風怒驅屯雲辟易而征以擊西陵如井陘戰酣出竒兵宛兮改容若蓐收素服駕白龍忽兮當前如歸墟泛溢浮五山一北一追一僨一起突然而逝餘勇未已於時吳兒獠工引檣挂席鐃鳴鼓動去若飛鷁風止雨息江清海碧此潮之大凡也傳曰上善若水又曰水幾於道故古之人見大水必觀善利萬物似仁不畏強似勇能方能圓似智萬折必東似信若是者孺子欲聞乎孺子曰幾矣先生之所陳五事之上也姑欲聞其深於此者先生曰西湖之深北山之幽可舫可舟可巢可樓與鷗鳥居與鹿豕遊漁簑山屐煙雨悠悠寂寥長往可以忘憂風衫塵袂京洛何求不如西湖瀕不如北山阿白蘋緑芰紫柏青蘿反裘坐釣散髮行歌人生安樂孰知其它茫洋以為柳溪盤旋以為李谷卷軻辨乎三尺之喙擴夷隘乎十圍之腹此古君子所以藏器于身待時而動也傳曰不怨天不尤人蓋優哉遊哉聊以卒嵗若是何如孺子竦然離席而立曰蓋聞逹人不忘身而先利志士不貪時而後義隱之所尚得全於天也孺子不敏乃今得聞出處之際敬再拜受教醫言上醫醫國或曰不然醫曰譬國於身天地乃所寓之形元氣乃所恃而生堅骨脆肉山石壤墳也中列五藏五材是營也風雲其衛百川其榮也闔闢運轉有神欲行也故昔之論養生者曰抱形以靜神將自正無搖汝精乃可以長生蓋天地亦物也其不壞亦然得一以清寧其析於一成虹而泄藏祁寒暑雨災害乃生時則有陵鬭隕墜扎癘蟲螟歷象授時使氣行正不有聖人孰醫國疢以國觀身理自此知不有聖人人誰則醫譬醫有經黃帝二典歧伯猶謨浮沈生死帝俞伯都平章於變亦與氣俱盧鵲秦和王佐可蹈鵲猶伊訓和比虺誥漢淳于意如説作命説不自言于古其鏡華他反經既不得巳敿于礪刃如甘戰誓何異吾醫亦論其世堯湯水旱國豈無疾稽天焦土要不病粒五毒所攻痤發中古武砭已甚血流漂杵七雄裂之五藏用爭衡秦縱楚焦腑炭氷衛生匪經民中道夭至秦暴蹶氣並則稿求諸身中一藏強勝四氣為微一安得競匪淳益漓醫斯用竒黃典歧謨安所救之鵲觀五會和參天命至他而極刮脾濯腎聖有至言代斫傷手世復無他矧敢他又他雖傷手猶漂杵然時周之命反商之顛過是益狂術亡不傳大疾始間漢與休息小瘳未復唐用飲食何世無醫孰曰不知不培其生毒尉妄施曰我術聖望而知之緒餘帝伯卑鵲和意曰如漢唐又何足議何異魯連好髙自奇徒稱唐虞顧未知之鵲和得嗤他何足議矧無他術乃行他事季良三醫一論其天不為何敗其平自然曷不卑之無甚髙論秦病可言釋之為近國有常治治不以智若烹小鮮時治之理生有常經亦不可擾損石益榖時醫近效滋彰法令盜賊乃多疾焉勿擾氣復則和何以休之惟勿益生築垣為室蚤作晦息平康有道醫於何力民有聖言有病不治起居惟常常得中醫作醫言濟北朝先生雞肋集卷第二十八
