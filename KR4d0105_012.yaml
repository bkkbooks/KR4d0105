body:
  text: 第十二卷古詩送張緡子望太常簿鄭彥能求擬江亭詩贈楊景平送吳黯赴闕送陳逸之筠州過劉季孫贈段萬頃次韻魯直謝李右丞送茶與李文叔夜談贈送張愈秀才魯直復以詩送茶云願君飲此勿飲酒次韻次韻蘇公翰林贈同職鄧溫伯懷舊作次韻文潛館中作次韻太學黃博士冕仲同考試作復用前韻贈祠部陳元輿復用前韻呈刑部杜丈君章復用前韻再呈冕仲送龍圖范丈德孺帥慶初與文潛入館魯直貽詩并茶硯次韻同文潛館中韻贈蔡天啓次韻魯直試院贈李伯時畫詩喜文潛自淮南歸招飲西岡呈坐客李成季得閻子常古琴作濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第十二古詩送張緡子望太常簿張侯於我丈人行十年江湖心鄉往平生獨立白雪曲少時妙譽青雲上胡為四十尚飄蓬逢衣騎馬鄴城中將軍寶帳簪履肅開府畫筵簫鼓雄况復儒宮飽間暇堂有叢書竹蕭灑論文不厭夜經過起看北斗插黃河相逢安得怨寂莫仲宣樓頭良可樂何當奇計出番禺未應長檄開卭筰太常句稽亦不冗少卿淑問清時重俎豆之事則嘗聞男兒讀書業有用歸去天邊道路長東風春草滿池塘美人不來時晼晚誰與玩此林間芳鄭彥能求擬江亭詩亭下流泉三畞隘誰擬西江晴一派桃李佳名聞昔人此言雖小可喻大寧非逐楚憔悴身當是羊裘傲漢人避世牆東王君公五經紛綸井大春端然養魚廢車馬一身環堵觀天下吾人鄭子詩句新高堂素壁開蕭灑何當湛湛見青楓白蘋落日慰相逢一亭兩檻更何有波濤風雨船前後莫憶乘槎犯漢津莫憶樓船下石城盡醉漁陽無好曲短蓑銅斗平生足贈楊景平君不見華隂楊君漢孔子君生其後無乃似平居恐懼西北隅力行發憤尚不愧君今鳴櫓下長淮眼明清曉三楚開揚州行矣勿濡滯江南細雨收黃梅我今正是鳥折翼肺病三年廣文直昔時黃帽榜舟人却向西湖當不識寄聲關子老漁樵小山桂樹不須招乘槎東海未敢必欲去天台觀石橋送吳黯赴闕我初官此君未來君今去此我未往翻飛豈不慕緬邈留滯何能悲鞅掌學道平生昧蹊徑半世端如走榛莽古人曾病田甫田切磋安可去吾黨東風消雪送鴻雁南國連山生篠簜為當歸夢五湖中會有髙名百寮上送陳逸之筠州居貧百草春靃靡製作舞雩春服美愛君欲贈華韡韡思君何處無芳卉三年眼花秪欲眠驚夢往往音跫然單金安所用吾技術成正復遷劉纍不狩何由有貆特錢鎛須勤晚方積呻吟裘氏日已多恩流三族功比河告行風雨春物空催花作果黍芃芃亦從梁汴即清潁湛湛已見江頭楓嚴君被命分符虎昔者無襦今五袴未勞負米迃山川姑弟酒中從聖賢田君弟酒中從聖賢一作奉甘未用君力過劉季孫劉侯歲覆春堤料居不曾間須我勞未嫌清濁各有㩦匪報瓊瑤以為好吏訶單絞自可更兒笑接㒿從復倒為憐徒步此青袍重憶歸來著黃帽官忙未向林野疏時清不廢詩書傲梨花如雪許重尋秋實垂牆晚方到贈段萬頃美人窈窕家南國可與副笄親黍稷平生寂莫鳳將雛慙愧木桃猶報璧石城三槳為誰催萬里清江凌不測王門酒肉傲勝詭豈有鄒陽仍下客危詞欲洗大夫寃千載獨懷吾祖賢不量腹小文籍博頗似井霓輕飲川丈夫趣舍無南北情親非為牆屋連子真正用臥谷口乃有高名喧日邊胸中傀磊契何所自笑柴愚得參魯借令好問忘足繭狐腋豈堪黃犬補吾身櫟社真寄耳趣取無用安足數無心俎几彘盤辱拳曲不羞人厭覩土山出火石為融羲和當午車隆隆通渠束帶過者寡乃獨葛巾終日同傾囷倒廩用餉我我為牙羽陳編鍾蟬聲入耳廩節改別我整驂無愧容次韻魯直謝李右丞送茶都城米貴斗論璧長飢茗碗無從識道和何暇索檳榔慙愧雲龍羞肉食壑源萬畝不作欄上春伐鼓驚山顔題封進御官有局夜行初不更驛宿冰融太液俱未知寒食新苞隨賜燭建安一水去兩水昜較豈如涇與渭右丞分送天上餘我試比方良有似月團清潤珍豢羊葵花瑣細胃與腸可憐賦罷羣玉晚寧憶睡餘雙井香大勝膠西蘇大守茶湯不美誇薄酒與李文叔夜談中庭老柏霜雪裏北風烈烈偏激耳誦詩夜半舌入喉飲我樽中淥醽美升堂辭翰愧非有何異還家數其齒文章萬古猶一魚乙丙誰能辨腸尾更慙頗似會稽康欲語常遭士瑶柅廣陵八月未足言曾使酲醲涊然起安得談如子枚子贈送張愈秀才秋水幽幽濟河道君挂蒲帆若飛鳥西風黃葉滯公車雞黍從君懷故廬男兒自有四方志世上相期獨榮利昔時馬周徒步動天子君今有用當如此魯直復以詩送茶云願君飲此勿飲酒次韻相茶真似石韞璧至精那可皮膚識溪芽不給萬口須往往山毛俱入食雲龍正用餉近班乞與麁官誠靦顔崇朝一碗坐官局申旦形清不成宿平生樂此臭味同故人貽我情相燭黃侯發軔日千里天育收駒自汧渭車聲出鼎細九盤如此佳句誰能似遣試齊民蟹眼湯扶起醉頭湔腐腸頗類它時玉川子破鼻竹林風送香吾儕幽事動不朽但讀離騷可無酒次韻蘇公翰林贈同職鄧溫伯懷舊作雪堂蜜酒花作醅教蜂使釀花自栽堂前雪落蜂正蟄恨蜂不采西山梅漫浪飲處空有迹無酒可沃胸崔嵬不知幾喚樊口渡五見新曆頒清臺鄧公昔歎不可挽素衣未化京雒埃山中相邀阻笻杖天上對直同金罍只今江邊春更好漁蓑不曬懸牆隈百年變化誰得料劎光自出豐城苔老儒經濟國勢定近臣獻納天顔開蜀公亭上別公處花柳未逐東風摧尚容登堂談落屑不愧索米腸鳴雷因知流落本天命何必挽引須時來九關沈沈虎豹靜無復極目江楓哀次韻文潛館中作蓬山前臨九軌路三日街晴案吹土直廬鑿牖面宫垣青壁嶄嶄看垂雨殿閣風斜碧瓦寒翅溼蒼鳶不能乳却思窮巷亦可言一掃蚊虻通昔苦鬱蒸書課未須忙午漏傳休聽天語後罷挍讐傳宣暑伏午平生豪氣對樽酒山雞見鏡猶能舞城南寺近晚堪過笙歌涼月聞千户但憂伏日細君須割肉無緣待歸俎次韻太學黃博士冕仲同考試作日邊傳詔天街草草草西城車馬聚官曹一見故情親宴語識君心志古成安長孺澶淵守昔君羈遊所為主我窮亦號成安客文采初無君一縷與豫澶州璹之客冕仲俱為韓胸中萬頃復誰同正有君家賢叔度官事留人何鞅掌廣文楊柳花飛户好書老未置鉛槧學經晚始羞章句乘槎況自風格有病顰那可形容慕成詩莫憚繼日傳青驄御史呼歸去復用前韻贈祠部陳元輿行樂曾聞戒遲草人生波上飛鳬聚蘭亭往事如過雨山隂修竹空千古陳侯揮翰少年時三賦聲名動人主可是高才棄繩矩自然采繡非針縷五十天南把一麾猶得無襦歌叔度邂逅西城築冶墟王官繼日車連户自言春晚洞庭歸日落江南得佳句傾蓋何妨許如故執鞭况是平生慕但憂筆陳困攻堅儻許尋盟解圍去復用前韻呈刑部杜丈君章杜侯灑墨春雲草紛紛滿紙棲鴉聚文章不犯世故鋒牛鬼荒虛瓦棺古平生傀磊寧獨此躋俗唐虞要遭主先君諸父盡金蘭申以婚姻况覼縷勞心吏卷官有程得意朋尊美無度尚憶花妍春仲時休沐黃昏來叩户苦憐蟾桂將十分欲贈海棠無一句巷南巷北相遇稀而此從公慰懷慕安石榴紅儻可期公不來過我當去有且素約矣二花兩家皆復用前韻再呈博士黃冕仲龍津之北雙溪騖逶迤勢入龍津聚龍歸何處牛斗間劎不可求江海古慘淡猶思八百年變化豈無神物主何當旋柂入奫淪儻可然犀照毛縷登樓那有北客同把酒但看南雁度更邀桃葉逺臨水正值荔枝紅照户入梁一曳鄒陽裾思越屢吟莊舄句竹林觴詠當日情峴山名姓它時慕一聞説盡青鞋遊令我乘風欲仙去送龍圖范丈德孺帥慶君不見先君往在康定中奉詔經略河西戎大順胡蘆盡耕稼賊書不到秦關東邊人咸識侍中子至今猶説將軍似給事文武龍圖賢大馮小馮安足言齠年書傳有肝膽二十起家車檻檻蛟龍雲雨時可用麒麟圖畫功非晚况聞馳傳厭山谷頃時河隴嚴飛挽朝廷屬休蘭會兵秦人倚慶為長城時平斥候正須遠軍間留田未宜輕東風浩浩吹榆柳相勸西城古原酒班春曷不問遺老先公遠謀尚多有女郎山下萬貔貅部曲肥馬身輕裘比曹賞賜飽無用談話豈得希封侯趙邊今日須李牧士無超距姑食肉初與文潛入館魯直貽詩并茶硯次韻黃侯閲世如傳郵自言何預風馬牛草經不下天祿閣詩入雞林海上州兼陳九鼎燦玉鉉並綴五冕森珠旒後來傀磊有張子姓名並向紫府收青春一篇更奇麗勢到屈宋何秋秋洮州石貴雙趙璧漢水鴨頭如此色贈酬不鄙亦及我刻畫無鹽譽傾國月團聊試金井漪排遣滯思無立錐乘風良自興不淺愁報孟侯無好詩用文潛館中韻贈蔡學正天啓蔡侯飽學囷千釜濯足清江起南土立談頗似燕客豪快奪范睢如墜雨東城禽羽未足言柏直何為口方乳蔣侯山中伴香火三年不厭長齋苦平生傀落有誰同要得張侯三日語晝間那自運甓忙時清不用聞雞舞桓榮歡喜見車馬書册辛勤立門户自當食肉似班超猛虎何嘗窺案俎次韻魯直試院贈奉議李伯時畫詩東房攜卷繞幕行西房卷作墮地聲紙山間出筆陳橫李侯畫若禪眼透觀魚玄沙骨竦瘦舟中淵明細若豆歸心秪愛玉花驄不須棘針學癡翁惱渠愁作睂鬭紅試院所作數物伯時喜文潛自淮南歸招飲西岡呈坐客春回三楚冰生漪銀臺春夢歸心馳莫言上水百丈苦淮渚東風一月期都城經春雪蔽地百花不放須君至清晨一紙國門書走馬蓬壺下直初保康橋頭燈照夜我馬鳴嘶向君馬得君豈但官局同卜鄰况近南城下文詞翊善知名久丈人令德于公後同年廖李藝省郎吳門隱尉身姓張平時花發值此客隨分東牆有春色宫壺賜酒玉流巵請君但作留春詩人生身外安所知為君借舞杜廷尉對花有酒那不醉李成季得閻子常古琴作昔人流水高山手此意寧從絃上有閻侯卷舌臥閭里意向是中留不朽似聞緑綺置床頭暑雨東城無麥秋趙傳和氏齋五日吳得湛盧當兩州李侯得意誇題柱成詩欲使邀諸路自有桓山石室彈深屋時聞繭抽緒無琴尚可何獨絃要識精微非度數人生有纍無非失我欲心灰木為質懶從徽的自凝塵老向詩書逾愛日自言結習久難除猶理斷編尋止息焦城卜築近連軫歸約閻侯亦蕭瑟舊聞君祖課木奴試買瑕丘百株栗濟北朝先生雞肋集卷第十二
