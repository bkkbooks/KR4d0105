body:
  text: 第六十九卷釋氏讚疏觀世音菩薩摩訶薩像讚猪齒臼化佛讚並序陳氏繡觀音舍利讚畫入定僧讚佛鑑大師語録序跋戒公疏後答揩老别紙無名庵銘劉範作為居士脫黏庵銘老作為陳元夢齊銘師作為曇秀東皋子宴坐內誦文濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第六十九釋氏贊疏觀世音菩薩摩訶薩像贊阿那婆婁吉底輸我觀世音本名號菩薩㫺自禮佛足憶念無數恆沙時有佛出號觀世音教我從聞􅋠修入無有一機非耳悟是故名為觀世音菩薩乘彼佛威神與彼佛慧正齊等從聞入流初亡所所入既寂相不生聞所聞盡覺亦無忽然超越世出世獲大圓明二殊勝三十二應度衆生我一名號與衆多恆沙諸佛等無異一首三首至百首八萬四千爍迦羅二臂四臂目亦然惟無心能通一切說一一呪一字義其音遍滿十方空悉知罪性無從來是故名為施無畏諸大菩薩阿羅漢亦各自說初悟門文殊師利普宣揚讚觀世音為第一旋機反聞聞自性是佛一路涅槃門方便堪以教阿難是故我今頭面禮弟子補之歷千劫循聲流轉得飄零人天鬼獄無不攖乃今日逢甚深法種微善根如芥許因緣㑹遇聞此言然我不斷三業根云何得取無學證涕淚悲泣作是語大悲灌頂開我頑我亦常得二殊祥一耳所聞一夢覩我今日復為衆說稽首菩薩在世間有海傍士族姓賀三世妙繢莊嚴相一貧女髽提魚笱晨朝過戶言善哉汝善畫此觀世音見觀世音能識不若士不悅因誶語汝安能識觀世音髽女忽化白衣仙彼魚笱成百花筥􅌓然稱歎欲作禮菩薩與女恍皆亡此但衣食為善緣而已獲是感應力於今十方普供養稽首賀氏觀世音又復我㫺居河壖有大比丘號覺海我從覺海求見性教我自問還自譍我緣宿障未能證於覺海言不悟入繫心成勞勞發翳悲魔入腑悲作狂夢觀世音竒特容而左手端起猛焰於猛焰中有佛首滿月嚴淨而憂嚬我時覺已自􅋠惟將菩薩慈加護我無明毒火燒佛性無嚬佛性佛無嚬爾時便得心清涼悲狂頓消諸惱息未成念佛三昧果而已獲是境界祥於今我在行住間稽首菩薩不􅋠議我今為衆說是事聽者同我增善根亦復隨順文殊言讚聞􅋠修為第一令汝離苦得解脫是經所說非我言未信與信皆信持無子能背父母者弟子補之夙供養與具信士弟子諶從佛方便作此緣或以文字或財施妙甘棠林它山質以佛力故成旃檀刻此無相慈威容觸光遇影成休復願補之諶先父母乘此願力勝因緣在天修羅人非人乃至一切受生處常聞菩薩救苦誓如海潮音震三千此音歷耳報無邊於眠睡中而大覺願補之諶先父母乘此願力勝因緣過去未來及現前所作諸因對復苦譬蠶作繭龜藏六不知懺悔無脫時聞無畏施自了知如劫波巾六結解願補之諶先父母亦復隨順文殊言從觀世音耳門修決定入此三摩地願我此一報身盡亦得乘是勝因緣生菩薩處為衆生復得見我先父母以身力命報父母如虛空盡無有時斷身口意不善根如維摩詰真懺悔汰除砂質求佳饌心清淨故佛現前如瓶撲落水散時十方一切俱消殞普願幽顯諸大衆信與未信同一音窮娑婆界稱南無如菩薩音震天地豬齒臼化佛贊並序豬齒臼化佛者崇寧二年三月一日衛州獲喜縣民職氏殺豬祭神而民劉氏獵犬得其棄首骨銜之狺狺四日不食民使其子析之其左牡齒臼中得肉如拇色酣酣由醉玉諦視之如來像也髻有珠如粟瞑目跏趺瞳子隱然莊嚴畢具觀者萬人補之從弟新鄉令載之目覩其事記于石以示補之補之聳然曰佛菩薩誓救苦衆生菩薩至不愛頭目髓腦度人畜鬼出無量苦而具縛凡夫以利養故殺害不已俱入劇苦大火坑中號呼恐怖過又不改佛菩薩動於威神為警此輩因懼生信令諸闡提隳彌戾車於沸鑊湯蓮花涌出是佛菩薩心欲此事流布十方諸惡衆生有芥子許過去善根皆大恐怖戒悔殺害普作回向諸佛現前不覺心喜身躍復作是言從不可說劫民有齒牙知相食故無日不殺􅒘大地草萬死萬生而佛哀愍故動於希竒如優鉢曇花時一現耳夫以不可說劫無日不殺萬死萬生之中而佛之威神才得一現而乃獨動於職氏之豬與劉氏之犬現已應傳而若覩若不覩若信若不信至千萬人夫於千萬人中而我兄弟兩人者又獨得而記且贊之則凡職氏與所祭若神所使若屠所殺若豬與劉氏所銜若犬所析若子與記者吾弟贊者補之於過去世是一段事本末輕重皆有因緣惟有佛眼悉知悉見次第顯出終始圓成令四天下與未來世因此希竒與此文字辨意不殺決定自知如利寶刀斷多羅木意已斷故業不復萌無始怨仇俱為眷屬􅒘是增長深般若因一切諸佛之所護念豈不勝哉豈不大哉三年七月二十七日初夜援筆為贊頃刻而成若佛力助文不加㸃云吾觀鳥獸諸食肉形鉤吻鋸牙慘劇羅剎如是一類是彊非彊業力所驅啖彼養已是遭食者死已能生反誅其償如汝啖我版築上下無有盡時此業甚深佛所不度牛馬草食口方齒平業淺昜超無對復苦人非牛馬齊貝瓠犀食榖果蔬形善應爾云何不若牛馬異生無凶吻牙而作鋒刃鷹虎受報形凶則然人形佛形而慘鷹虎故死受報甚於馬牛我誦此言普勸橫目血入牙故殺生不休至人無心同仁一視視人如我視豬如人人自不知是豬何等或其前世諸眷屬因云何無明日殺眷屬刺心取血血大壑流揚湯燖毛毛須彌聚死者不捨萬豬常隨汝莫鼓刀謂豬賤畜是熱血裏有丈六身南無佛陀南無僧佉我不敢殺諸佛現前一切衆生若飛若走若潛若穴小大妍媸其血肉中各具一佛云何見佛而欲鼓刀汝欲殺豬應作是念罽賓國主殺尊者時未及捨刀臂已墯落白乳涌出六種震驚亦如此豬腦破佛出佛不在外佛不在中佛不在空佛不在色是豬不死彼佛儼然世分别心自說人貴謂羊豕業本以供人彼以業來我何故受受則羊豕業㱕我身往有大豬生不啖穢食薄荷草度羣業豬菩薩威神示入異類汝自肉眼何􅒘識豬藏汝之刀莫加豬首驚齒臼內跏趺坐人稽首世尊在我齒臼我不敢慢無豬無人惟願現前諸見聞者如菩薩誓念念勿疑以此勝因普薦三世父母師長若冤若親化柔軟心去毒害意捨熱血汁獲甘露漿苦海悉乾同一安隱陳氏繡觀世舍利讚信為道元功德母大方廣佛華嚴義􅒘堅固信生萬法維舍利子名堅固心無心中植此信如地含種雨即生地猶有形種有差薑不為芋芋不薤然以此兩一味故無種種性一味生况此無生法無差從無盡藏來無自或求不得不求得得與不得不自知是名不壞金剛幢佛與衆生具此勝我今稽首先讚佛佛神耀力以無心默良久頃按指時海印生光地金色是光與色為實幻謂實非有幻非無以佛神力光色呈是光色從佛心出我今神力與佛等如鼓不擊終不鳴衆生身具一觀音各現其身而說法觀音常不離汝眼而汝眼不見觀音旃檀繡畫與紫金無是觀音無非者誰能信此不二義當執緘縷如虛空是堅固作海無邊舍利生如海泡涌非觀音力非爾力如旱氣透雨自滂或說菩薩妙吉祥欲信衆生未信者惟衆生以未信故舍利從此不復生闡提魁膾酒血林是堅固子血中滿投刀捨業拭面目如熱病汗濈濈生或說闡提身所無是波旬說非佛說我觀陳氏此殊勝非出家女和合僧一念圓成三業空十方菩薩為巳伴雲中金毛希有事佛說作解受羣邪常樂我淨亦佛言決定義中無決定我今頂禮菩薩足善護念此陳氏慈為衆生作佛因緣一浮囊濟大海水畫入定僧贊開眼見明名為見外閉眼見暗名為見內此二俱離無諍三昧彼上人者難於酬對佛鑑大師語録序佛以無心通逹一切法而以一音演說之故法法皆心說說皆法半字滿字有離有解有假名字而無一物四句百句千萬億句乃至不可說那􅒘他句其字有盡而義無窮始自四十二章西來而佛書遍中國能言之類無以復加如經所說山河大地皆是菩提瞪發勞相譬菩提心為一大鏡而山河大地一切衆生草木根牙之類皆清淨本然中所現物故隨取隨用而其取其用皆不外吾鏡中則其能以無心通達而一音演說字有盡而義無窮能言之類無以加豈不以此哉然佛以無言言故如刀畫水如空中鳥跡過不可尋而昧者欲求畫於水求跡於空故觀一藏教如大海普雨而欲以淺智悉數其滴至不可得則生迷悶於千萬億句計常計斷見中見邊如步屈蟲腳移後躡前終不得捨而曾不知反滴為海則千萬億句畫亡而跡失有大智人菩提達磨具佛知見憫此震旦為教所縛而來解之最初一語廓然無聖有求心了不可得者即以付之故面壁不立文字而一藏教咸露無餘佛音人音鳥音獸音一切風水百物之音是音皆說是說皆義乃至牆牖棟柱無說亦說隨其根性使各悟入如是解脫無量之衆譬五百比丘各有悟門言人人殊而佛告舍利弗以彼皆正說無揀擇也粵有佛國禪師白公天衣懷公之裔孫法雲秀公之嫡子提祖師印為一切雄而佛鑑大師惟仲又佛國之嫡子始從佛國悟庭柏義即師子吼盡眼色界隨類拈出物物皆金而佛國故不作如是言佛鑑亦不作如是解也或舉庭柏義問者則曰莫謗我師然青青滿前用亦不盡既往金山龍游道場皇帝數遣使降香學者雲集震于江南㑹補之至金山師傾蓋欣然語以家弟無極宰說之宗旨夙契嘗赴初請桃園鼓山亦以補之於道有少分因出門人所集語録求為序引補之聞之㫺佛一時取恆河岸一葉告諸比丘我所覺了一切諸法如大地草木為衆生說者如手中葉佛以為葉葉皆舉纍劫不盡故舉一葉使自趣入而縛於教者始葉葉而求之非祖師具佛知見則安能不立一指而盡佛之藴無有餘哉知此則如來祖師無異禪也故因佛鑑語録而伸之跋戒公疏後元祐七年翰林東坡先生守揚七月石塔禪師將還山其徒詣府請留公書其狀後與之曰傳語長老三十日奉謁議去住即以其日從僚屬過師出疏袖間師去而復留初師欲去甚確衆以為非東坡故不留也師留而公去室中塵凝師坐晏然如公未去時也補之不學道不足以知師得道之淺深而徒識其貌淵然而靖不可澄撓忘其初不為東坡而去亦忘其終為東坡而留也姑留而已矣後九十八日朝補之記答楷老别紙弟子補之黑業鈍根歷劫飄零可憐憫者竊不自意以何因緣年二十許時即知㱕依正法更不生疑而業力牽纒投身世網飲酒食肉作衆不善晚雖懺悔未有脫期曾禮圓通覺海二士嘗䝉接引自不承當今年五十七髮白氣衰㱕仗無所仰聞和尚德名心生歡喜恐是宿緣曾獲親近故昨覩了了庵頌不覺便伸偈讚熱鐡入水作種種聲亦不自􅒘非敢發露見解求大善知識剖判也伏䝉寄賜答偈茫然自失如大空中無安腳處既而內省若朽木不可雕和尚豈肯開甘露門也惟願慈悲更加誘誨令浮海盲龜遇木得歇幸甚幸甚補之稽首無名庵銘為居士劉範作無空名空在大覺中如海一漚無生滅同大千居空漚體億一是中無庵名庵非實無庵何銘况庵中主曰我不知芭蕉自喻有來畸人亦不自知㪣門試喚睡裏揚睂脫黏庵銘為陳元老作鴉鳴不鳴問庵中人是聞不聞聞不聞生不聞聞滅黏不可脫無黏何脫離生滅本十方消隕夢齊銘為曇秀師作夢中頭落以手捉覺知夢已默自笑我今無生妄為有如鬼詬口是非我是鹿非鹿何時了請循其本二俱滅我今何為復夢語門關墯地忽驚覺東皋子宴坐內誦文平居宴坐閉目收慮恆作是語汝身今者非男非女非孫非祖無古無今無來無去清淨本然妄生國土被塵染識根乃結聚久不可洗如衣受漬妄有形骸妄有名字是張是李是男是女汝既非此此亦非汝譬如蠔相被石黏住認石為我千劫受苦是義不然吾有一喻譬吾如空被丁釘去住是空非物釘無著處便得脫然離我我所正恁麼時
