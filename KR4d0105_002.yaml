body:
  text: 第二卷古賦北渚亭賦是是堂賦北京官舍後梨花賦後招魂賦披榛亭賦濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第二古賦五首北渚亭賦北渚亭熙寧五年集賢挍理南豐曾侯鞏守齊之所作也蓋取杜甫宴歷下亭詩以名之所謂東藩駐皂蓋北渚凌清河者也風雨廢久州人思侯猶能道之後二十一年而祕閣挍理南陽朝補之來承守乏侯於補之丈人行辱出其後訪其遺文故事廑有存者而圃多大木歷下亭又其最髙處也舉首南望不知其有山嘗登所謂北渚之址則羣峰屹然列於林上城郭井閭皆在其下陂湖迤邐川原極望因太息語客想見侯經始之意曠然可喜非特登東山小魯而已乃撤池南葦間壞亭徙而復之或請記其事補之曰賦可也作北渚亭賦其詞曰登爽丘之故墟兮睇岱宗之獨立根旁礴而維坤兮支扶疏而走隰跆琅邪與巨野兮梁淸濟而北出前湠漫而將屯兮後嶊嶉其相襲坯者扈者嶧者峘者礐者磝者障魯屛齊曰惟歷山或肺附之箕拱環連勢崖絶而脈泄兮萬源發於其間谷射沙出􅒓淫潗濈瀺灂汨泌澎濞渤潏忽瀵起而成川經營一國其利汾澮防為井沼壅為碓磑得平而肆乃滉漾而滂沛經民閭而貫府舍兮渚為池之千畞惟守之居面巖背阻邈闉闍之遺址兮肇嘉名乎北渚悲經始之幾何兮牛羊牧而宇顚非境勝之為難兮善擇勝之為難嘗試觀夫其園千章之萩合抱之楊立而成阡躋歷下之岧嶤望南山之孱顔修幹大枝出櫩造天藐砠岫之蔽虧乍髣佛其雲煙思仙人之樓居尚輕舉而髙翻盍駕言其北游登斯渚而盤桓岡巒忽其翔舞萩楊眇以如箸撫千里於一眒收城郭乎環堵其下坡湖汗漫葭蘆無畔菱荷荇藻蘅荃杜茞衆物居之浩若煙海歲秋八月草木始衰乃命罾罟觀漁其脽鳴桹四合方舟順涯鱨鯉窘乎深塘兮鴻雁起於中泜復有桂舫蘭枻浮游其中榜歌流唱自西徂東纖餌投隈微鱗掛空客顧而嬉傾盂倒鍾明月出於缺嶺夕陽眇其微紅天耿耿而益髙夜寥寥其方中駭河漢之衝波披海岱之泠風恐此樂之難留兮願乘槎乎星渚期韓終與偓佺兮采芝英乎瑶圃庶忘老而遺死兮路漫漫其修阻於是酒含太息中座語客曰自㫺太公奄有此丘是征五侯桓公用之攘狄尊周方其盛時山河十二號稱東秦臨菑遨樂中具五民秋田青丘實囿海濵而薛又其小邑也區區之賦食三千人其彊孰與比哉觀華不注朅其孤巘虎牙桀立芙蓉菡萏尚想三周追奔執韅下車取飲僅以身免困責質於蕭同尚何私乎紀甗而齊自是亦不競矣夸奪勢窮雖彊安在事以日遷而山不改則物之可樂固不可得而留也認而有之來不可持所玩無故去何必悲此齊侯之所雪涕而晏子之所竊嗤也今我與客論古人則知迷屬有感而歔欷豈不重惑也哉仕如行賈孰非逆旅託生理於四方固朝秦而草楚曽無必於一笑尚何知乎千古於是客辴然喜再拜舉觴而前曰凡主人言理實易求而我曠然巳忘㫺憂使客常滿使酒不空請壽主人如漢孔公主人亦辴然喜受飲反觴執客之手而言曰詩固有之未見君子憂心忡忡既見君子云乎不樂再拜洗觴而酬客舍然大笑是是堂賦是是堂彭城劉子羲仲之所作也劉子讀古人書則曰文王我師也周公豈欺我哉處今行巳則欲就有道而正焉抑荀子所謂是是非非謂之智者以名其堂而居之而南陽朝子補之聞而疑之曰劉子果於自信果於不信人也哉夫理無常是事無常非使天下舉以為非而劉子獨曰是將誰使取正使天下舉以為是而劉子獨非之安得力而勝諸嘗與劉子問津於無可無不可之塗而弭節乎兩忘之圃夫安知吾是之所在故賦其名而連犿其義則操吾戈以伐我者逺矣其詞曰隘區中之無覩兮邈荒忽以逺求軼太始以為元兮日與月之幾周本獲鼎之推策兮四千歲其已多謂過此或不逺兮世倐眒而謂何紛蛇身與牛首兮詭變化之莫原神與民其雜糅兮或傳之於余先川東南而辰西北兮余不知其何故憯絶維與折柱兮又孔氏所不語莽湯革之相質兮駴一世以共疑一身吾不自識兮疇莫覿而能知邅吾輈乎八埏兮旋吾舳乎四海蘄不死之遺氓兮稽吾聞之所在曰七聖至此而競迷兮羌誰使之正女朅輕舉而逺游兮吾將從巫咸之所處離屯雲以衛屬兮前奔霆使抗旌王良御以蹁躚兮何鼓隱其砰磷涉橫潢而櫂淹兮借斗車而轟轟九虬蜿以承綏兮六鳯翼而繽紛載格澤而雉厲兮歘砉撇捩捐旬始而遺攙搶藐無朋吾孤往兮騰光景之所經俯六合以周流兮觀一氣之所營叩潏湟之何居兮問黔嬴所休屯芒東西之無軌兮沕晝夜之無門追汗漫而與言兮若不見而不聞將下車而從之兮則竦身而遐征忽寐寤而莫質兮形欺魄而獨存神黮暗而載浮兮涕淫夷而霑襟聞佺僑之達者兮將與議夫本根靳乎保巳而不失兮何足與論此之至神鵬南徙而終息兮彼安知夫天地譬井蛙之跳幹兮吾亦安知其孰智謂道非物之外兮盍反求諸世間泮得失之兩塗兮一智者之足明世溷濁而智鮮兮薪得鹿而國爭曰吾不知孰是兮據有鹿而偶分待黃帝以占夢兮曠百世而莫尋雖人跡之所至兮如窮北之衣皮聞中國之有蟲兮咀葉飽而吐絲化草木之所染兮煥五色而陸離所不睨而戃恍兮咸莫信而我非饗香以為朽兮視素以為黑有迷疾而慮易兮意是者之反疾衆謂西施美兮何髙舉而深潛魚熊掌以為羞兮帶蝍蛆之所甘物各騖其所知兮孰為是而正女蹇多知而博辨兮盍質諸魯之君子曰經禮三百兮曲禮三千非堯舜禹湯之適兮為他道而勿傳守株以待兔兮卒不可得從女以決疑兮而增余之惑規吾觚以轉圜兮如二兒之干國權謀既不用兮仁義又見賊哀失時而齟齬兮改此度誠不能陳瓊茅以潔中兮訴神龜以吉占朝從而莫違兮吾安所行女意王倪蹲循乎不知兮齧缺昧瞢於同是違一世何不可兮山澤又多龍蛇深林杳以無人兮雨雪氛其來加前䕫魖後虎豹兮狒笑而施施石嶟嶟以增波兮路阻囏以委移結幽蘭以獨立兮歲將草而增唏懷同心之離居兮悵猶豫而狐疑必處廓若此而後可兮雖濟百世何足以嬉譬鄙夫之硜硜兮經溝瀆其誰與懷古人之兼善兮吾不忍抱吾之所獨五官異用兮物各派吾之一以聞聞性兮一非有異回車易野兮絶道九州吾既不從夫斯人兮盍反吾之初修闔萬宇以聚閭兮載百族與並游人羣固有倫兮生固有涯蠶桑而被兮粟以禦飢吾何以異於人兮曾踶跂而支離伯夷死名兮盜跖死利溺者入水兮拯者亦用以顚沛曾稽失之未暇兮羊固已逺去而千里重曰道無封不可畔兮雖千歲􅒘今日忘彼與是兮吾何愛嫉乘虛無以為輿兮託不得已以為鄰忘處石而出火兮超同物而獨生北京官舍後梨花賦梨於經無記而舍後梨人所不賞故賦之其詞曰攬察草木本原所起李梅紀於隕霜兮橘柚隨乎織篚木瓜足贈而詠詩含桃可羞而記禮雖信微而有託兮亦不委夫厥美惟兹梨之俊茂兮羌獨逺而未揚含溫潤之秀質兮皎若和璧榮其光淡暗愜其無偶兮歷年歲之已長草春者陽疸憤盈羣木解膚似夸者似鬭者似辴者似頩者色非一色同嫵殊嫮兹梨娟然獨見其素繄過時兮不省滋脈脈兮後户亦何必耀榮華兮朝日顧猶私兮泫露然而中唐之樗枝大扶疏以其近人人以縶駒則磨則齧則折則泄孰與夫杇壤幽薄厥植雖弱履屐不蹈根乃磅礴後招魂賦屈原作大招魂宋玉作招魂夫士以忠放濵於死故招其魂而復之豫交之長者王安仁賢且孝適未仕病以夭豫傷焉不敢以非吾上也借不知命之辭以訴于帝作後招魂竊悲夫天何為生此碩人兮蹇幼清而宜修既服義以時可兮又何為委厥美而改求天固復諸其初兮則如勿俾此昭質帝命巫陽曰有訴于下汝往聽之精神將離筮而復之巫陽曰物死與生司命有職自廢自起朕何能識帝彊之乃下招曰魂兮歸來去君七尺之軀胡為乎大陰些舍君之靈龜而糟莩沈些人固懷慈而抱愛兮一言欲訣而怦怦些君胡樂誘於異物兮從之踶跂而逺行些魂兮㱕來上天不可以游些有神當關其視畏人些其下百鬼伺人往來執而殺之些徜佯無所倚歎息不可些幸而得還無所求階些歸來歸來不可以久放些魂兮歸來地下不可伏些土怪墳羊狠戾突觸些蛇身鬼首蓬髮䯯鬖當前搖毒些九幽之府惡厲牛首得人以械獄些歸來歸來不可以久屈些魂兮歸來無止乎山中些山木蕭蕭猿狖所居些藜藋柱徑梟祥鼯怪杜鵑號呼些夔魈罔兩笑風涕雨見人揶揄些虓虎封狼磨牙吮血侁侁穴居些魂往顚隮狂惑失塗些歸來歸來久幽恐不得出些魂兮歸來君無下海些大海蕩潏日月回周些白波連天五山狂浮些巨神操蛇唯魂是囚些淫氛瀰霧八方錯易魂往安投些百怪歡舞羣出類沒更遨迭遊些霹靂掣電蛟龍直起江潮逆流些有鳥九首載鬼盈車擢筋以縻其輈些歸來歸來久淫恐不得還些魂兮歸來君無樂兮八蠻九夷些遐方異類其人似禽些烈陽慘隂韝裘祼䄇凉溫不時些蔽林夜祠被髮徒跣妖魅叢嬉些魂往非族抵冒凌欺些歸來歸來恐自遺羞些魂兮歸來君無以髑髏為南面之樂些毛枯骨化精離識落些螻蟻所寄烏鳶所搏些蚊蚋姑嘬狐狸齧嚼些髐然七孔攓擲疇覺些棘薪葛蔓交錯綿絡些鋤耰野火侵凌甚虐些歸來歸來無自遺賊些魂兮歸來八紘六合無一可以翺翔些魂孤迋迋消耗淪亡些歸來歸來反故鄉些工祝前君無迷方些崇城兩溝夾高楊些車軫馬􅧊交康莊些日中為市集工商些高門懸箔襲慶祥些選閲甘㫖薦北堂些金昆玉季美雁行些斑衣竹馬兒嬉傍些曲欄橫牖窈洞房些長蛾曼緑含若芳些齊紈阿錫曵明璫些戞瑟鼓簧封豕羊些食前方丈釃椒漿些嘉賔雜坐紛賢良些朱顔欣欣君樂康些魂兮歸來反故鄉些亂曰龍火頽坤兮虛正宵萬物酋勑兮傷秋郊汩君徂征兮默誰曹天地為爐兮物流以銷一受成形兮巧專莫逃斯彌頤輅兮一體所交鼠肝蟲臂兮忽何遭魂知復吉兮改而超與君除祓兮三下招張君之衣兮升屋號魂兮歸來居匪遙無哀我心使豫勞披榛亭賦舒陳儀甫官於魏覽觀公圃廢城之堞墾其土作亭堞上名曰披榛斬木枝為梁柱菅蒯衣之目踰四垣矚五里外進客而語曰樂哉此亭客曰微主人言之固願有謁也今夫山居者遺世逺舉煙霞之府厜㕒之顚翠微之顔穹石曲塢上正宛中如堂如防猱玃之所處首更奔星髙出雲霧足蹈太虛下見雷雨邈乎杳冥一攬九土此人以登邑門之垤蹤步齟齬若絆若禦若見阹櫓遊意無所至於平原案衍秫麥之土漫漫漠漠蔑有堆阜下澤之車短轂幎爾晝日旁午出汗霑湑此人適逢沙丘宿莽廣不䕃路怠而願息解轡弛負相攜傴僂忽如飛翔延頸顧慕矣若乃平時室處曚曨環堵窮年不出四壁為伍周以闤閈域以牖户如彼井谷潛逃之鮒衡從北南適在跬步仰而視之不識天宇此人出城而望見桑麻緑野猶將樂之况乃矗乎巍巍據城之陴出屋之危前無蔽虧俯首而窺哉夫明不求晦處內慕外各以其不足所遇生貴雍門之技悲者驚心鍾儀見縶尚猶南音主人殆倦遊窮居者耶不然何以躍然於此而志意洋溢也嘗與主人周覽五嶽岱嵩衡霍巫廬九疑白鹽赤甲靑城峩􅖭歲草深林攀援桂枝結軌羡門髙溪方駕赤須安期委區中之局蹐遊太上之無涯則主人樂此耶嘗又與主人服纖離驂騄耳夸父前乘魯陽奉轡超人跡馳萬里以觀乎八紘九野觚竹北户與西王母日下之地扶桑月窟紫淵丹水大章所步盧敖所履殊方怪物齊諧之志焜煌譎誑經目而記則主人樂此耶嘗又與主人觀乎京洛神州宋魏兩都未央建章天子之居前殿武庫金闕玉除東華耀靈西華望舒復道氤氳飛閣渠渠千官鏘鏘劎佩以趨朝㑹而出冠蓋布途富貴潤奴􅘗衣食仁里閭則主人樂此耶嘗又與主人挍術孫吳抗技頗牧左象弭右魚服韓厥中御州綽為右馮軾而寓目以觀三軍之斬伐擊刺琅琅􅐀􅐀風起雲㑹北登燕然躪轢長塞西屠石堡飲馬瀚海麒麟圖形贖死胄代則主人樂此耶嘗又與主人出咸陽經上蔡過邯鄲桑中大隄石城之間士女亟㑹倡樂止客杯酒相索吹竽鼓瑟鳴筝擊筑六博踏鞠宛珠之簪傅璣之珥羅裾從風衆曲入耳人生得意亦何能已則主人樂此耶主人油然而笑曰人夀幾何而時易失細猶不果巨安可必深山大澤實生龍蛇髙明之家鬼瞰其室吾非以狹驕廣以儉笑侈也狹易治儉易供此吾所以樂也窮秋九月狐狸出穴宇宙隆冽時亦登吾亭而支頤藂棘之分披朱實之離離秋風鳴枝久而不去羣竅盡奏若歌若嘯起左作右時亦杖藜隱几而聽之寂寥兮無為淡乎熙熙似遺己離物而不知飛鴻滅沒夕陽就微月出埤堄樂而忘歸則客亦樂此乎哉於是客曰我以衆夸主人而主人以少奪我主人賢哉非僕所及也濟北朝先生雞肋集卷第二
