  - {type: variant, offset: 0, length: 8, content: 濟北晁先生雞肋集, WYG: ''}
  - {type: variant, offset: 9, length: 2863, content: 録第七十卷釋氏贊疏勸縁造大藏經疏請則和尚説圓覺經疏請則和尚説金剛經疏龍泉寺修五百阿羅漢洞募縁疏齊州齋僧祈晴疏甥杜氏小五娘披剃疏詞幷序鵞湖長老開堂疏請崇寧長老疏請普照長老疏題大寳篋經後濟北晁先生雞肋集目録終濟北晁先生雞肋集巻第七十釋氏贊疏勸縁造大藏經疏伏以諸佛出世本縁説法利生衆生鈍根不能見性成佛所以託胎卵溼化為正命認地水火風為自身將盲引盲從苦入苦大可厭患况無出期故如來警之以雷震法音示之以天然覺路設有七寳布施滿恒河沙不如四句受持等虚空量而此小邑其中萬家雖建梵宫猶虚龍藏醍醐上味至死不嘗摩尼寳珠曠劫常棄豈不共生慙愧同作因縁今聞上國伽藍適有古教緗帙題緘萬巻價直千緡欲置六師殿堂不妨八部衛守普願聞見咸發慈悲大事圓成諸方慶讚若僧若俗得誦得持十地一椉性陸蓮而不染三塗八難罪湯雪以無餘或素或緇曰男曰女不以多寡便爲重輕惟能運喜捨心則必獲法施福恭惟大覺證之謹疏請則和尚説圓覺經疏伏以脩多羅教者如來本起因地正受住持大湼槃門妙莊嚴路十二部經諸決定義十二菩薩所脩行因流出無量一切吉祥眞如超過恒沙十方文字譬喻若廣説說者千劫不盡若無說説者一句不煩然而末世勤勞益逺正法衆生眼目必有導師和尚徳性純明道鋒孤迅具三次第爲一總持固嘗振錫游方爲證此事拈香説悟已契古人於我此邦夙植善本願興慈閔普爲宣揚夫性覺圓通初無此觀彼觀因地漸次故有齊修單修欲令見聞不生差别幸對人天之衆尚無金玉其音請則和尚說金剛經疏六百巻義總般若以題籖四大部中以金剛為教髓如是住如是降伏法固已傳若以色若以音聲佛不可見所以徳山受具而精究曹谿採薪而聳聞葢達心則四句無餘故上根以一門超出和尚離我我所得玄玄機故知筏諭本空然欲濟者盈於涯涘夢觀不實而臥鼾者喧於床帷况此小邦魔彊法弱賴覩若士雲開日明庶幾興行從此紹續㫺逹磨見梁武帝則不立文字而天女告舍利弗以無離語言師今對經所説何法我不取相亦無是經願諸見聞同一解脱如病得汗如鳥出籠龍泉寺修五百阿羅漢洞募縁疏伏以瞬青蓮目付法藏以黙傳結白疊巾指心源而直授爰有迦葉首悟慶喜先聞夙習大椉已超無學假修小果欲接下根故十二大菩薩之所總持與五百阿羅漢之所證入波不離水水即是波此皆為一因縁酥乳流出雖復説三次第羊鹿亦無知性空則法空如我說為佛説諸祕文之畧出衆聖號之具存肅恭僧儀炟赫靈跡或經行四世界或宴坐一嵌巖受請天宫應供海殿擲錫飛去投盃渡來龍虎伏馴仙鬼陪隸少别萬里蹔休千年亦有混跡和光入􅒡化俗游戲自在變化無常近者淮泗塔中袖藏逺施天台橋上茗結餘花不違本心示常住世覿面不識有縁則逢永吉是用運廣大心募清信侣建長簷及㴱廡閟異相與竒容平地起山凡境成聖大千無有盡我願不可竆亦使見聞同生歡喜讚佛一偈施佛一錢在經有云獲福無量齊州齋僧祈晴疏伏以佛等慈誓雖蚊蟻以不傷民業報身於衣食而常歉幸嘉苗之極望乃霖雨以涉旬非民獨招繫吏不徳是用潔誠念咎㱕命求哀不違本心來受此供敇天龍之休燕賜田畮之収成仰冀威神必垂拯䕶甥杜氏小五娘披剃疏詞幷序濮陽女子杜氏小五娘法名故朝散郎集賢殿修撰提舉西京崇福宫故真寧縣君閻氏今安平縣君晁氏之孫今宣義郎知潁昌府陽翟縣丞故晁氏八姐今晁氏二十一姐之女年十八歲其家議以從人矣念其前母以産歿已當為婦而悲忽自截髮如頭陁儀頮粉澤屛葷見請於親冀他日為比丘尼以報生身之恩學出世之法其尊屬䀌然傷而聴之其壻氏悵然恨而捨之自歲丙子至歲戊子十有二年其志益堅行益熟而朝請郎監西京中嶽廟晁補之之妻永嘉縣君杜氏修撰公之女而宣義君之姊也憐其姪之意以錢一百三十千輸諸官得祠部度牒施之命以善月日享佛飯僧落髮受具又以告補之曰子為作文讚其事成此女子願且普慶懴使杜晁兩宗往者居者向佛菩提獲大饒益其詞曰伏聞山河大地尚因瞪發而生血肉幻身豈是金剛之法為泡為沫為無量腥臊聚為苦為惱為百一疾病纒為火宅已燒為丘井將墜晝作猖狂而不暇夜夢怵惕而自驚無常大鬼之所驅有情更生而何往所疑厭患出離而反欣喜控搏乃清浄童女杜氏小五娘法名賢公之孫信士之子初聴結褵之議便盟落髮之誠至於視姑姊妹之行譬若觀雀蚊䖟之過葢戒定㝛修於前世故因縁適㑹於此生親杜姓中咸從本起之願姑晁氏配為營披剃之資解紒著盤諸天八部而皆歎登壇受具大覺六師而現前當有無舌瘖啞人教汝讀經生盲擿埴人指汝見性滋長聖種斷除愛根用以加持晁杜兩族俱椉勝因回向幽明二途永脱苦趣及此㑹中盡未來際助縁隨喜男子女人證明此比丘尼令得不退轉同悟無生忍曩謨佛陁耶鵞湖長老開堂疏葢聞大空非界認華自是迷人陽燄無波守魚真成癡鶴徒以無始妄業有為幻因說寂説常别名别相室羅筏河見佛影正似夢中毗舍俱家入聖胞未知來處有病必求藥到岸不須船佛性在阿那邊兩頭雙動般若以何為體大笑一塲談此者多達此者寡又恁麽去也當如何接之曾經黄蘖三頓來直得困徹便是曹溪一滴水更不疑他固知戴頭覓頭就屋添屋也要春來冰解日出煙消况鵞湖山水之名藍馬祖子孫之遺範雖復骨藏十世未妨名播九州法席比虚緇徒猶盛必得如龍如虎乃堪度馬度驢伏惟某和尚悟祖祖心提方方印黙時淵妙體用推向一坑語則雷驚縱横流出千偈彼縁已熟此正是時巻舒皆欲爲人去住亦豈􅒘我今者不動一莖草不逺千里塗直須救取猫兒也莫輸却山子慈悲肯顧歡喜普同請崇寧長老疏葢聞大圓頓教不以世求妙淨明心不縁他悟既衆生本來成佛則祖師何以為人皆􅒘流轉塵勞多生認賊所以顛倒迷悶終日怖頭有大智人縁在震旦面壁無語不妨滿國清風隻履西㱕依舊一天明月雖它方之已熟眷此土之未敷今皇帝陛下紹述聖猷嗣隆法寳合百工㱕美之意建萬夀崇寧之名妙喜擎來化城跳出是用騰封章而有請屈道徳之肯臨恭惟和尚受祖祖心提方方印等慈不擇貧富任運無有東西視不見聴不聞在三藏鼻孔上立遇者死當者壞從徳嶠棒頭出來願垂悲憐副此翹竚不用變生作熟自然識路知家以不盡燈度無量衆葛藤具斷阿誰曾縛汝來皮髓兼忘那箇是不精底上資睿算永洽純熙旁沐民生普離菑咎不勝懇倒之至請普照長老疏大圓頓教不以世求妙静明心不縁他悟既衆生本自成佛則祖師何以爲人但救沈流聊加警䇿面壁無語不妨滿谷清風隻履西㱕依舊一天明月自兹而降得度者多况普光淮上之静居大聖唐來之顯化久虚法席葢俟名流齊公長老上人授祖祖心提方方印黙時淵妙體用推向一坑語則雷驚縦横流出千偈今者諸方咸説四衆同音不逺千里途不動一莖草刹那即至燕坐宛然光弼得子儀之軍何煩申令韓信奪成安之壁也要作家阿誰曾縛汝來那箇是不精底空劫前三世無佛時一言如是接人方名傳法題大寳篋經後真覺大師志添傳其逺祖百花巖主之道受持大般若波羅密多安忍精進静慮之戒誦百千旋陁羅尼降伏諸魔拯拔衆患有大名稱於四方補之戊辰歲拜大師於京師已䝉教誘丁丑歲遭太夫人楊氏喪於丹陽哭詣金山修水陸供大師忽於衆中念舊拊孤惻然慈閔後數日入船臨柩宣祕密音如出金石宴坐収足忽起唱言汝母無苦我佛如來有大寳篋陁羅尼能為一切衆生在生死者開大黑暗滅罪増福作金剛幢獲不壞報若頂若佩若安舍宅若冢墓中所在之處則為有佛迺授此經補之奉行如大師教戊寅歲遇妹之壻陳琦於金鄉琦不知補之嘗受此經也蹙頞而言我聞人言大寳篋經㫺在朽塔諸佛涕泣所共宣賜願以薦先行求積年了不可得補之驚愜出經帽中為琦贊說再拜授琦琦即書寫命工刋印普勸人子亾失父母如我苦者恭敬供養頂佩藏置安像腹中仗真正力為升濟資四月六日晁補之記明吳郡顧氏於崇禎乙亥春照宋刻壽梓至中秋工始竣濟北晁先生雞肋集巻第七十終, WYG: ''}
