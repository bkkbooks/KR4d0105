  - {type: line-break, offset: 0, content: '', id: KR4d0105_SBCK_028-1a01}
  - {type: variant, offset: 0, length: 1451, content: 濟北晁先生雞肋集目錄第二十八卷雜著賔主辯諱辯話述七述醫言濟北晁先生雞肋集目錄終濟北晁先生雞肋集卷第二十八雜著賔主辯晁子既摭陶子㱕去來辭以名其居而記之自以聞道歴年而為潛不足中慙而疑隐几去智則方寸之地廓然其虚若兩丈夫為主與賔巾裾而坐廬賔曰子道與吾殊而多謂子類余豈其然乎凡子以躁樂吾静隘恱吾和子人之放也而多謂與我自放者同科我遺夫世者已盡子縁於物者尚多而子賔賔焉以從我奈何主人曰萬物聚閭千古竝塗然求諸其間天地異職父子殊面莫大且親而相因以判今賔方欲合兩人為一體則物我蠭起不可得而止賔不通之則自賔之身十指長短兩目大小肝膽共絡而楚越畫界也况賔出千載之上我起千載之下别族離居所遭異者而賔乃斬然為間方且病我之浮氣獨不傷賔之大同乎賔自揣心日化年改壯異幼時老乖壯日今是昨非前棄後拾使賔自操且不可得葢孔子聖人猶六十化智如惠子徒觀其勤未知其謝賔如通之則齊嬰公扈離立易心夢為魚鳥可與飛沈况我欲遵子若是其賔賔者耶如賔之詞委心去畱椉化㱕盡化乃所過胡可以吝我之慕賔亦以是近躁静隘和曰情非性人放自放非故曰命極則俱極進則皆進賔遺夫世者雖盡而猶多我縁於物者雖多而必盡則又胡可以賔之既瘳而傲我之方病也水既蛻地氣又蛻水吾方解我之不然而經賔之所以則我既化矣雖六十改未知為數也且物固以其近相慕㫺伯宗人言其似楊父則懌桓溫婢以為類劉琨則忻夫楊父劉琨徇權殞身而夸者慕焉恐不得鄰前輿既覆後轍不逡彼皆炫智而鬬力角驅而競犇故彊弱斯在而勝負可論也今我與賔既已俱出乎忘我之境而同塞乎累物之門得失安在是非奚存哉賔獨不聞魯男子之拒託宿者乎嫠曰子胡不若桺下惠男子曰桺下惠固可吾固不可吾將以吾之不可學桺下惠之可而孔子以謂學桺下惠者多矣然未有似於斯人今欲使我如賔解組長違我則不可可在佚身賔則猶我譬魯男子審已故其為桺下惠也不以其同而以異及其至焉一也可不可安寄賔亦奚以知我不與賔同至於葛天氏之地以謂何如於是賔唯而起主人送之不離席則霍然若寤廼書之記後諱辯禮不諱嫌名二名不偏諱孔子之母名徴在言在不言徴言徴不言在補之先君子二名禮不偏諱者也單舉則於禮無怍矣而世皆偏諱厚於古不敢變也若嫌則後世亦有不諱者矣漢和帝名肈不改京兆郡魏武帝名操而其子植詩云脩坂造雲日肈非兆造非操也唐韓愈非薄於親者作諱辯抵諱嫌者曰父名仁子不得為人乎義盡此矣然周人以諱事神亦惡夫音之斥也甥輩讀有若酉者斯可矣話述晁子嘗曰至人鶉居而鷇食鷇無常居鷇仰物食我竆殆似之蚍蜉集其枯螟宛轉于塗而我不廬開口待餔廼不如彼鳬有喙則腴其妻曰水舟而陸車乎憎里巷而愛歧陌乎今日越而㫺者燕乎雲忽忽乎萍不止乎大章盧敖歩八極乎荒土功乎負羈紲乎孔不暖乎墨不黔乎無乃蠏蛫蚿足躁不一乎陽鳥鷾鴯氣則移乎敗瓦墁乎長鋏摡乎匍匐往三咽乎人蓐食而媪見哀乎東郭穢而中庭泣乎貿貿來乎額額然伏乎西山餓乎雉噫徙乎無乃侏儒瞽師困慰禄乎豢豕犬羊犧餼養乎凡子行人間何以請擇事晁子曰唯既而曰龜笑不知我知之乎適可則可我不可乎其妻曰唯舍然大笑七述七嵗時年十予嘗獲侍於蘇公蘇公為予道杭之山川人物雄秀竒麗夸靡饒阜名不能殫者且稱枚椉曹植七發七啟之文以謂引物連類能究情狀退而深思倣其事為七述意者述公之言而非作也睂山先生懐道含光陸沈於俗日與嵇阮賦詩飲酒談笑自足泊然若將終身焉於是潁川孺子聞而往從之躡屐擔簦破衣踵門及階而止望帷而稱曰不敏聞先生之誼敢待于下風先生矍然驚曰孺子來吾惡夫世人之保我也久矣而不能使人之無我保則戶外之屐滿焉將命歟吾無所逃此雖然孺子何爲者也孺子曰幼而多治長而屢竆遭先生乎齟齬之塗陪先生乎寂寥之事樂先生之所爲樂者以白吾首其巳乎先生啞然笑曰孺子上吾以樂而未嘗無以樂者順也羈旅于吾有時矣, WYG: ''}
