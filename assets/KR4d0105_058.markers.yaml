  - {type: variant, offset: 3148, length: 0, content: '', WYG: 欽定四庫全書雞肋集巻五十九目録啟赴揚州上太守王資政正仲啟與交代范峒啟與淮南提刑賈殿院啟與淮南監司啟答揚州教授曾旼啟上揚守王正仲啟與淮東提刑王司諫啟答揚守判官趙奉議啟答致仕劉敏大夫啟與京東漕張道順啟與京東提刑趙景仁啟答淄守啟與淄倅啟與提舉鄭彦能啟與京東漕吕直父啟答滑守李孝純啟賀知府趙待制移鎮啟謝提刑上官正言啟留臺韓朝請到狀啟答濰守啟揚州泛用賀冬啟元日賀啟元日賀啟答交代中散啟與李中大啟謝吕大夫啟答通判朝奉啟代韓太中賀徐中丞啟與淮南監司啟謝解啟公為求親啟送幣啟公似求親啟代謝求親啟許親啟送幣啟求親啟雞肋集巻五十九目録欽定四庫全書雞肋集巻五十九宋晁補之撰啟赴揚州上太守王資政正仲啟比者得請宸廷備員州佐蚤在陶鈞之内久辭牆屏之嚴寅縁庇依欣喜幸會恭惟某官道徳世範文詞儒宗龍虎之得風雲主威益重山淵之有珠玉國勢增華加以仁厚不矜直方有體倦經為於機政思宴息於藩維而補之册府後来書生孤立慙梧鼠之五技窘侏儒之一囊江海之思日縈魂夢麾符之䕃與有光榮春氷已生吳艎當具尚曹裝之未促儻荀御之可容鄉往之誠倍百常品與交代范峒啟䝉恩外補承乏後塵惟慕誼之素勤獲趨風而自慶恭以某官夙懐賢業藹有令名行已不撓而衆推居官所至而民願尚淹器幹屈佐藩維補之質薄自憐學迂寡與陪英髦於中秘非所宜堪奉甘㫖於宴閑葢其私便企青雲而雖舊繼白雪以良難行造門墻粗窺矩範欣愉幸㑹悃幅奚殫與淮南提刑賈殿院啟䝉恩外補竊禄便親望履幕以良勤去門墻之未久敢圖官守遂在部封恭惟某官道業古人之期風聲列位之冠以義出處繫時重輕雖雅意不忘於本朝而直諫自難於居内久傾公議尚屈逺猷補之質薄自憐學迂寡用糜丹鉛於􅉺府固乏毫氂佐條教於藩城足殫駑蹇趨叅良邇庇賴為榮瞻詠欣愉併深悃愊與淮南監司啟䝉恩補外竊禄便親仰風望之素隆傾誠心之固久敢圖官守遂在部封恭惟某官賢業藹聞公才屢試奉行寛大之令威亦暢於屬城愛養疲瘵之甿財不虧於成賦尚淹使指行副褒延補之質薄自憐學迂寡用糜丹鉛於􅉺府固乏毫氂佐條教於藩城足殫駑蹇趨叅良邇庇賴為榮瞻詠欣愉併湥悃愊}
