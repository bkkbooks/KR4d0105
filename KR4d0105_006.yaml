front:
  text: 濟北朝先生雞肋集目録
  hash: sha256:af71eac6dde752a2a40652d11f1b8029623a3743c0dd5aa0c8159efe7eb844af
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0105_SBCK_006-1a}
body:
  text: 第六卷古詩玉溪㱕逢甥李相如汴中送學生李公裕兄弟赴省集次韵太學舒博士堯文示同志次韻蘇翰林五日揚州石塔寺烹茶題四弟以道橫軸畫桂漿送舅氏楊通直令陽榖贈王推官允中之京師展墓同畢公叔飲城東題李成季負日軒次韻李成季感事同李主簿叔文飲北莊夏季曹州道中二首病起呈李縣令希孝贈金堤劉承制景文次韻四弟以道十二弟叔與法王唱和兼示無斁弟二首濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第六古詩玉溪㱕逢甥李相如汴中蠻鄉俟天形畏蠚復憚暑夢甥來萬里竹響風動宇如今真似夢相對别恨吐平生窘執轡白面力如虎誰令斗指日江使墮漁罟桃僵李為仆遺珮滿江渚常憂抱石死無復腳踏土那知徼時願起廢遇明主曠調已逺跡未用矜杜舉但憂世議隘亡弓不亡楚吾甥學孔子况乃父母魯如聞四門闢未信遡洄沮上書閔魃旱膏以神靈雨北海自有人髙丘豈無女爾壯觀爾能吾㱕固吾所期甥二兒上餘子不足數何以喻吾心酌此湘吳醑送學生李公裕兄弟赴省集閉門圍火談開户雪一尺黃昏具杯酒知君逺行役君家三兄弟頗謂各無敵容父學知方大道通四驛吉父尤頡頏天池觀水擊仁父少而奇乃是夜光璧李侯有此子便可臥安席家居樂與餌聊以止過客豈無一束芻空谷不可食宵人操寵利徒手捕蜴蜥公等寧復然烏黑鵠自白屠龍業有用未厭所從僻富貴念㫺時城東雪中跡次韵太學舒博士堯文示同志北門望瀛關一葦初莫渡文在髙陽頃官大名堯儒宮連案几㑹合豈非數蟬鳴幾何時庭菊下白露念當慰佳節觴酌美無度不然坐歲晚流景急飛兔區區人一馬官舍勤早草經時枉見贈彌月不能賦竹齊行茗粥寂莫當屢赴此君安可得霜雪不改故詩如戰交地髙處要先據牛羮君放飰轑鼎吾亦飫顧慙詠伐檀無補餐已素還家便却掃況乃無户屨次韵蘇翰林五日揚州石塔寺烹茶唐來木蘭寺遺跡今未滅僧鍾嘲飰後語出飢客舌今公食方丈玉茗攄噫噎當年臥江湖不泣逐臣玦中和似此茗受水不昜節輕塵散羅趜亂乳發甌雪佳辰雜蘭艾共弔楚纍潔老謙三昧手心得非口訣誰知此間妙我欲希超絶持誇淮北士湯餅供朝啜題四弟以道橫軸畫黃葉滿青山枯蒲靜寒水鳬雁下坡塍牛羊散墟里擔穫草來歸兒迎婦窺籬虎頭無骨相田野有餘思桂漿暑臥午呀呷蠲煩何所投巖桂割辛芳石蜜滋甘柔沃以火鼎沸閟之冰井幽三日出深幂明瓊盎黃流冰火離坎類意比秫麥繆辛甘既兩適不湎亦銷憂中年苦內熱歲願西風秋寒凉犯所畏發散資爾謀時時以觴客三獻不一酬緬思湘纍語啜醨終所羞北斗酌此漿違世聊逺遊恐復迷吾往僕悲道阻修淮南㱕來些憭栗令人愁百壺無此餞夙志慕林丘寧懷小山感不為桂枝留送舅氏楊通直令陽穀人言慎縣宰頗似太丘君客户有訓遣司官無訟聞外家久寂莫舅氏少辛勤一邑何足道髙名誰與羣西來馬特特冬晚雪紛紛公朝道由砥孤士跡如雲過門苦地僻下直迫日曛深泥枉窮巷寒罏對殘煴感慨說宣子飄零綴遺文麟閣窘鉛槧魚山失耕藝逺情等匏繫㱕夢劇絲棼山東接畿甸陽穀近榆枌吏㫺猛豺虎民如竄麖麏幸逢寬大時庶幾仁惠薰自笑下士策不殊野人芹愛民宜百祿本茂實當蕡贈王推官允中我生譬天星睍睆但空譽學經羞輪扁常恐老竄句南游上會稽弱冠肆逺步便當期汗漫如鳥鎩修羽入宮又獨晚謠諑遭衆嫮坐令平生交室冷氊不具君公牆東客淸鑒美無度風期山水意千載見此遇定疑丹靑仙方我以癡顧豈繄才自疏閲世真異趣伐柯理無逺要以一馬喻古人本不死方寸有佳處三年禹河曲日見車馬渡何知謝剝啄黃土衣昜汙無人尚有子獨載城下路功名喧口實簪組託肺附請看瓶罌滿取躓病不去脫黏窺本初須子遺所寓怵迫倦東西林間尚寬裕之京師展墓短轡馭羸馬馳驅曹濟間商飈折徑木蕭瑟道里寒況復慕所天惻愴摧心肝游子歎時邁慈母憐衣單來時憑窗哭五妹垂修鬟季弟主菽粟孺妻㸑茅菅悼我無令人莫奉堂上歡豈無萱草詩終日倚門闌念㫺常獨立所聞詩禮難我尚未成人遭罹此憂患歲晏念墳墓仳離百哀攢何時奉靈車辛苦向此還親寡氣力微傍人祝加餐願言薄志節茍生無形顔同畢公叔飲城東西城昔相值桃初兩三紅翩翩騖長陌春風搖馬鬃後君㱕幾日游絮已濛濛解鞍不待憩相命古原東芍藥雖俗花狂姿幸時供平生於知己千過不一逢感君欲開口清洟出霑胸君如陶淵明不為五斗恭胡為青綸上朱墨紛外䝉棄官能從我短後追田翁銅斗釀秫麥竹枝弋鳬鴻何必悲無衣縕黂聊御冬九辨太髙潔五噫苦羈窮置此無滑和天情反其中市藥非市名名聞藥何庸十漿饋五漿猶畏聞者從如何酆城畔夜夜生長虹題李秀才成季負日軒天隨子李自號盧敖遊八極末至北隂墟卒然䝉谷幽覩一奇丈夫淚注而鳶肩深目玄髭須軒軒迎風舞自得樂有餘見敖默弗言慢然下臂趨敖私躡其後若士意不愈曰子亦何為迷繆至此乎此雖窮荒北尚或逢日烏過是有玄關晦墨不可居語竟若欺魄攝身沒空虛始豫讀秦記疑是忽帝徒今聆天隨言乃與夸父俱逐日下虞谷力窮尚嗟吁陽舒固物理我亦安于于若士獨何氣幽沈山海隅渾沌死已久人生信多塗次韻李成季感事吾廬無餘他文字散堆案雖微清溪鶴蓍畫亦幽玩髙人來何疏午榻動成鼾夢聞足音喜不待搖枕喚居貧少煙火饘食尚須旰出門兀何之踉蹌從欵段吾人古遺隱鳬足閔同患負日持獻君狐白不肯換商歌叩牛角長夜安得旦颼飀滿屋風黃葉散投幔楚屈若靈龜出處思過半所從聊自知何用詹尹算不如天隨生頭幘終日岸況君擊莊缶一念腸九轉人方臥大室子獨號其畔寒山來助哭咄爾勿嗟惋同李主簿叔文飲北莊蕭條蓐收窮疏樹失穠紺北風動地起雲攬紅日暗李君邀我游肴蔌治寒檐相㩦二三子歘若符節勘愧非谷口隱佳㑹良可暫茅堂兀四壁誰識此意淡古徑無俗尋陳編有幽瞰一聆君子語粱肉幾厭啖㱕來馬河北寂寞晚舟纜吾生事逃伏優游亦何憾夏季夏季百果繁兔葵亦成實獨有野石榴幽花時熠熠熠熠非獨好芳榮賴午日翩翩彼白蝶髣佛粗采挹睡餘起對此嘉興亦蕭瑟良非阡陌麗敢競陽春出無言以成蹊上愧桃李質幸當飽霜餘萬顆富君室曹州道中二首天旱久不雨四郊多狂風蕭蕭班馬鳴落日大野中君子守宫廷至樂聖所同喟豫不逢辰足跡道里重驅馬上高原秋風吹客衣感時有所懷送目鴻雁飛羸僮惑岐道日草相際稀愧彼倦翔鳥知還良庶幾病起呈李縣令希孝次公惡醒狂得酒要自濁病聞南鄰邀不往亦踴躍空床成展轉假寐風雨惡中虛氣襲逆妄夢時可愕每慙張隱居凌旦發囊藥曉來天境清日出鳥語樂家人語南軒靑杏巳可嚼復云竹齊前階戺有迸籜欣然欲舉手紗帽未能著平生李夫子相得懷抱廓何當戒長鬚夙駕慰寂莫柸杓恐不勝快語聊一噱贈金堤劉承制景文漆園說海若稷下談神州長劎堪倚天語大世莫酬少狂豈其然及此日月流稍知畫足非萬事指顧休夫子更髙識未沫於前修乘流聊復駛得渚正須留蓋有幸遇魯何能必為周徜徉下澤車驚駭入谷騶對酒尚靑眼吟詩將白頭山隂論往事陳迹詎能收次韻四弟以道十二弟叔與法王唱和兼示無斁弟二首少時勇遊山說山喜動色中年謫南方廬阜得深歷當時不類謫忘腰帶之適怪人肝鬲異破賊喜折屐只今竄林下織衣而耕食緬懷兹兩士吾宗氣相得吾春種桃時子曉尋嵩日似聞黃面子為採烏頭出去年陟岱宗一士世莫識天門邀之下傾倒意已極斯人與人異龍虎兩超忽重尋亦無路顚雨石崖坼吾人伯仲間一語可物色氣自寡所諧窮乃足所歷家風藐五世不肯適人適意行無險昜又跣不著屐文詞如苦李慘腹人莫食猶矜不傳妙坐恐兒曹得學憐新又新老奈日復日伯以最恬愈何􅒘採之出無斁能寡言猶堪謝前識叔與氣尚豪搘頤視屋極斯文惡表襮枯魚戒所忽應如魯宮籒藏壁俟其坼濟北朝先生雞肋集卷第六
