body:
  text: 第十卷古詩題惠崇畫四首擬樂府十二辰歌二十八舍歌行路難和鮮于大夫子駿跋遮曲長安行贈郭法曹思聰悲來行哭石起職方鸞車引贈戴嗣良歌時罷洪府監兵過廣陵為東坡公出所奪西夏刀劒東坡公命作秋夜古風苕霅行和於潛令毛國華冤朐路芳儀怨五丈渠賈碩秀才得兩圭有邸閻子常攜琴入村贈余樗年試院作次韵都尉王晉卿天駟監邂逅作兼呈坐客濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第十古詩題惠崇畫四首東風回江上渚何處來雙白鷺灼灼岸間桃依俙蘭杜苗一銜湍瀨鱗一下青林梢瀟湘緑水春迢迢春老柳無嘉色紅蕖羞脉脉宛在水中洲雙鵝羽蒼白何須玩引頸顚倒寫經墨惟應一臨流當暑袗絺綌夏一雁孤風乍臨渚兩雁將飛未成舉三雁羣行依宿莽蘆花已倒江上風雲間分飛那可同秋天高靄靄雲昏江闊霏霏雪繁渚下鴨方逺泛枝間雀不聞喧鄙夫此志相依生涯稊稗同微欲具沙邊短艇波濤歲晚人稀冬擬樂府十二辰歌鼷鼠食牛牛不知牛不願騂而願犂虎噫來風皮見藉兔狡宅月肩遭胹欲兆幽烽二龍死獨微晉澤一蛇悲失馬吉凶方聚門亡羊臧穀未宣分沐猴冠帶去始愜木雞風雨漠何聞不須皎皎吠蜀狗阮子與豬同酒樽二十八舍歌戎菽有角原桑黃客愁唧嘖聞扈亢轉蓬無氐行役晚蟋蟀在房思婦惋男兒有心事弧矢十年風光隨馬尾長鬚舂米婢借箕斗酒為君聊解頤誰憐長夜飯牛苦安能臥泣羞兒女二句闕虛危平生未入君此室一廬翛然四壁立文章奎躔動圓天貧有餘富黔婁賢功名不羞爛羊胃滅昴擒胡未能計誰能簡畢老此生不用諏觜招忿爭世事參商君此行桂酒椒漿石井美山鬼幽篁衣薜荔草江老柳繫㱕船蛟宫涵星動深淵張帆自慣夕風恬九折摧輪鵠翼短他年君車當軫轉行路難和鮮于大夫子駿贈君珊瑚夜光之角枕玳瑁明月之雕床一繭秋蟬之麗縠百和更生之寶香穠華紛紛白日草紅顔寂莫無留芳人生失意十八九君心美惡那能量願君虛懷廣末照聽我一曲關山長不見班姬與陳后寧聞衰落尚專房跋遮曲君不見魯中羣兒歌跋遮跋遮跋遮何語耶吳歈越吟初不省恐自塞北傳胡笳跋遮胡為樂中華試歌河漲水漸尖車河中耕泥春種麻麻生三歲不開花腰菱兩角黑如鴉漁父笑且語誰能跋遮舞君不見前年大旱河草黃草中魚子化飛蝗又不見往年大雨雨決渠渠中朽瓜生老魚蝗飛食場穀擊鼓煩趂撲我家家具如筍束今年梁山撓濁淤兒無鋤麻姑來漁荷鋤往賣鋤買網空市無丁丁斫船斫屋櫨艇子如星喚施罛夜唱跋遮曲羣鳴起白鳬長安行贈郭法曹思聰越羅作衫烏紗幘長安青雲少年客梁門門西狹斜陌飛閣氤氳多第宅南威十五桃花色簫管哀吟動魂魄銀槽壓酒傾琥珀青絲絡頭飛赭白韓狗胡鷹快多獲少年意氣區中窄金昆玉季盈十百君獨飄翩異風格十歲鉛丹事書冊豈徒新豐困寒厄能犯龍頭請恩澤送君此行無愴惻努力功名傳炟赫它年尋我吳山側躑躅盈山禽磔磔嘗約遊吳郭雅好山水悲來行哭石起職方悲來乎石君吾何悲夫斯人婉兮河之津厖睂白面照青春朱紱斯煌映路塵翩翩者驥銀鞍新東來奇意安所伸大野既瀦唯赤墳穀垂穎麻敷芬亡逋來復瓦鱗鱗髙堂擊鮮㑹衆賓賓起舞君欣欣何人末至居客右西郭之一儒迂且貧迂且貧自隗始能招劇辛致樂毅四方遊士爭來奔户內光儀亦可論大息拖縉紳中息氣氤氳小息秀睂目天上靑秋雲朱旗畫舸長隄曲去時簫鼓黃塵覆無復當年子産㱕至今人作嬰兒哭西郭之一儒無事門生苔久雨足不行官街常時門前車馬客舊雨自來新不來聽我陳張叔卿孔巢父皆隱淪無人汲引長飢辛日午不出開衡門前侯後相安敢論憂殺口間縱理紋長慟吾邦對遺跡耿耿一心誰我識徐君已死劎不忘心已許君那復惜鸞車引詠史推鸞車伐鼉鼓從帝子迎天女天女喜立龍旗馮小寶光陸離雲斑斑覆銅山新城鳴鴂如乳烏飛來為爾棲青梧控鶴府令雲衣裾僕射竄死令公誅婦懼兒無呼兒呼驚索胡宜都內人立次且手擎何物金唾壺請為大家畫長圖徐公子譁且止卿無來明堂屢舞覆龍杯覆杯之傍戲大鼠卿欲投之梁公懼贈戴嗣良歌時罷洪府監兵過廣陵為東坡公出所獲西夏刀劎東坡公命作三郎少日如乳虎代父搏賊驚山東硬弓長箭取官職自說九戰皆先鋒將軍拳勇饋不繼痛惜靈武奇謀空城頭揶揄下俯走壯士志屈羞填胸平生山西踏霜雪洪府下溼號兒童聞名未識二十載初見長揖東坡公鋭頭短後凜八尺氣似飲井垂檐虹只令不語當陳立望見已是千夫雄往年身奪五刀劎名玉所擐犀札同晨朝㩦來一府看竊指私語驚庭中紅粧擁坐花照酒青萍拔鞘堂生風螺旋鋩鍔波起脊白蛟雙挾三蒼龍試人一縷立褫魄戲客三招森動容東坡喜為出好礪洮鴨緑石如堅銅收藏入匣人意定蛾睂稍進琉璃鍾太平君子尚小毖戒懼邾小母荓蜂舞干兩階庶可觀跳空七劎今何庸我為蘇公起揚觶雅歌緩帶聊堪同從公請礪㱕作硯聞公嘗諫求邊功秋夜古風瑶池始波縣圃風鄧林飛葉雲攪空人間櫟社幾黃落曉窗洗黛悲青銅常嗟彭祖悔杖晚不見王母桃花紅安知帝怒削龍伯輿嶠已沒㱕墟中楚人方復感時節申旦不寐同秋蟲虛堂氣入枕簟肅熟寐不復聞嗈嗈大言身塞不得仰了語無異鴻毛烘天如旋磨人蟻却更千萬日勞何功漢南種柳人笑爾江潭悽愴雕形容小樓遐觀午夜闃凉月不盡山無窮一身逆旅過萬物千古昨夢如驚蓬胡床收慮暫一息杲杲已上扶桑東苕霅行和於潛令毛國華苕溪清霅溪緑溪水灣環繞天目山間古邑三百家日出隔溪聞打衙長官長髯帽烏紗不曾執板謁大尹醉卧紫蘭花影斜紫蘭花開為誰好年年歲歲溪南道不見西陵白髮人荆江夜雪唱陽春陽春絶唱和者寡客醉聞之雙淚灑夜來魂夢海中山縹眇雲濤煙浪間雲濤煙浪不可渡睡覺秋風落桐樹秦吉了秦吉了言語無人㑹無人㑹得奈君何且向紫蘭花下醉冤朐路棠梨葉戰風騷騷紙錢窸窣鳴空郊背人獨鳥㱕寒巢豫亦投村指橫橋茅檐霜月照征袍夜冷不寐聞狐嘷悼我為生良已勞兩手如龜髀肉消青樓公子燒蘭膏雪壓屋倒飲方豪睡覺三竿紅日高芳儀怨廷雜記事見虜金陵宮殿春霏微江南花發鷓鴣飛風流國主家千口十五吹簫粉黛稀滿堂侍酒皆詞客拭汗爭看平叔白後庭一曲時事新揮淚臨江悲去國令公獻籍朝未央敕書築第優降王魏俘曾不輸織室供奉一官奔武彊秦淮潮水鍾山樹塞北江南易懷土雙燕清秋夢柏梁吹落天涯猶竝羽相隨未是斷腸悲黃河應有却還時寧知翻手明朝事咫尺人生不可期蒼黃三鼓滹沱岸良人白馬今誰見國亡家破一身存薄命如雲信流轉芳儀加我名字新教歌遣舞不􅒘人採珠拾翠衣裳好深紅退盡驚胡塵隂山射虎邊風急嘈雜琵琶酒闌泣無言遍數天河星只有南箕近鄉邑當時千指渡江來同苦不知身獨哀中原骨肉又零落寄詩黃鵠何當回生男自有四方志女子那知出門事君不見李君椎髻泣窮年丈夫飄泊猶堪憐五丈渠五丈渠河水齧堤三里餘懸流下噴水渤潏訛言相驚有怪物濼東漁子浮兩舠清晨徑流雙鬛搖驚人跳起橫觸島大鱘十尺長夭矯殺之信宿不敢言竝村稍稍聞者喧伐鱗封肉擔揭去兩日一村猫犬飫夜來水泛州西原青青百頃白波翻里巫推變咎漁子豫且賊神實為此此邦一年不穀食賣魚取錢當常職聞道相家口津人無敢慿大魚死小魚靈賈碩秀才得兩圭有邸混沌既鑿元氣痡鴻源滔天堯曰吁羽淵之化三足逋玄圭告功聞禹書姚虞班器奔九區塗山合瑞羣辟趨三朡肆伐夏寶俘下逮血祭仍疈辜饗有明德繄玉如霍山屬之醫無閭裂崖剖璞陳璠璵追琢出美山為虛兩圭禮地四望俱寸尺可識形可圖緡城之西物色古霹靂野火燒牆堵大氓築室動千杵奔泉啓鍤幽奇覩隂溪埋氷剝寒土濃氛却掃孤月吐森然􅌓立疑未舉熒熒幽光射敗筥鄰人進說田父怖張伯不敢私自取初來畫地為豫語邸圓中規圭合矩瓌奇未可一二數嬴顚劉蹶分莽鹵禮嚴登降謹仰俯牲玉不加隨豆簠餼羊之存良小補此寶豈徒周石鼓酆城尺鐵尚可神老虯躍水生䨓雨閻子常㩦琴入村閻夫子通古今家徒四壁猶一琴今年二月雨霖霪喜君壠麥如人深屋間幽默咸池音高山流水我非聽聽我說君辛苦吟薛老村西十里地旱日燎原無柳林芒鞋曵杖逐鐮籠當午未食飢燒心藝藝麥田翻黃波蝻蟲盤穗如蝸螺麥未收打催種豆屋下跡少田間多閻夫子時我過我與夫子良同科四體雖勤口餔衆煮豆然萁窮奈何人謂君琴語辛苦此曲無乃傷天和君不見夫子宋圍不糝猶弦歌贈余樗年試院作平生車軌周四方結交童齓老相忘異哉余子久彌芳吳人猶記稱周郎河豚入網荻芽長宜興罨畫煙水蒼風雩春服真少狂不愧戴崇升後堂王時樗年所最厚也平父方教授毗陵橫戈筆陳倒千槍叔鸞獨步禹出羌封第一故云樗年奏藝開世儒膠擾何足臧說食不救飢求糧瞥思振衣千仞岡空林無人一繩床五車純束不在旁欲徹梯磴排空驤鍾山春水繞城隍從師不憚白笈裝矢鋒相觸塵不揚驪黃牡牝若滅亡子嚴主簿志不償厭見朱墨紛傖囊西風雲日思帝鄉東華拜勑鳬綴行黃昏閶闔飛驌驦虛堂節候變金商閉門蟋蟀鳴我房吾君仁聖周成王屏驅虎豹開明光山龍粉米雜青黃多儒可贊至治香園檀山石豈荒涼潢汙薀藻須豆觴願君與借羽翮翔賢書蠶列升未央君如病鶻待秋霜牛衣未可悲王章公朝道闢五達莊服襄按節緩勿忙夢松生腹渠不祥莫車上儛應循牆功成㱕飲沆瀣漿發機要若黃閒張次韵都尉王晉卿天駟監邂逅作兼呈坐客平生杜元凱學問光奕世戚聮帝室未要論烜赫功高羊叔子赤霄翔舞須威蕤孔翠文章豈其纍崇臺作山池作湖富貴所要聲名俱酒樽詩句得過薄小隱山城殊未疏曹侯詞翰諸公客慣聽清歌耳傾側天間兩驥看追風晴軒忽下飲河虹拳毛妙畫不可見顔公筆精如對面鄧張不醉無攬轡燒燭林間鵲飛起第語曹侯繼張燕鄰榼如澠不憂淺濟北朝先生雞肋集卷第十
