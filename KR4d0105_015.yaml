  text: 濟北朝先生雞肋集目録
  hash: sha256:af71eac6dde752a2a40652d11f1b8029623a3743c0dd5aa0c8159efe7eb844af
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0105_SBCK_015-1a}
body:
  text: 第十五卷律詩北山道中示公為和關彥遠雪試院次韻呈兵部葉端禮并呈祠部陳元輿博士黃冕仲吳松道中二首濟州道中寄葉勛秀才原上答劉季孫病起答關景暉同魯直和普安院壁上蘇公詩次韻黃奉議序致仕作父求作魯直仲次韻履常見貽次韻鄧正字慎思秋日同文館九首聞慎思説壕塘居陪發運右司叔父集金山次韻送趙正夫京東漕次韻八弟西園課經二首千秋嶺上蒲津繫橋次李棻韻次韻練定祥符聽法自畫山水寄無斁題其上贈别張堯詢寄題寶應無斁鳬舄堂二首憶廬山示無斁弟秋夜西岡聯句凝祥池上聯句濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第十五律詩五言北山道中示公為吾方賣劒日汝正抱孫歸昭代無官守平生近釣磯青山上野艇白水到林扉曬棗日猶烈鳴枝風已威荒陂民事少迂徑客行稀傷雨蟬知默違霜雁見幾卜居南縣早收課北莊微行李牧兒識生涯田叟譏蒸嘗了嵗事簦屩息塵機反舍從爭席行衢莫振衣潛逃多落莫放浪少歔欷文字陪吾老功名許汝非和關彥逺雪春雨翻成雪朝罏未覺炎拂簷驚乍響綴袖喜初霑庭薄寧堪迹空繁詎可瞻正憐風共起終恨雨同漸疏箔光來細重扉氣入嚴形容樗櫟隱意象岱嵩添孤潔憐牆仞虛明快屋簷棲枯偶猜蝶穿隟暫疑蟾詩案間飄楮粧帷誤灑奩縈盈仙縷結瑣屑女針銛屐上長干足頤間角里髯手龜良欠藥膚粟重遭爓池憶秦龍死河懷漢馬潛三章滿嘗吊兩騎望能占有德羣汚化無威衆動恬堅凝我無必皎潔爾何嫌僵臥安非介甘餐武亦廉妍辭犬子簡拙興客兒鹽搏作隋珠燦垂為紂箸尖公車貧笑跣洹水夢憂殲氅鶴清宜繞衣狐窶莫兼且當除諷渴未暇怯樵痁戒婢當遲掃呼奴更出覘攬來真可數消去豈堪拈便洗埋灰釜行操割畞鐮它時玄尚白今嵗突應黔漕府君黃綬儒宫我絳幨寒吟無與律貧病不須砭玉飯流脂滑金羮割尾纖山隂子猷興歸去為誰淹試院次韻呈兵部葉員外端禮并呈祠部陳員外元輿太學博士黃冕仲盛世天休沓真人寶歷開太任當政闥元老位公槐莫盛官人始相從試士來鳴珂咸俊彥索米獨塵埃未歎官曹隔多慙賞鑑陪成川須􅎌澮崇厦要條枚文武中銓集丹鉛百卷堆豚魚聊可辨皮辨不應恢右選試兵䇿左選試經義虎出爭亡矢蛇成屢奪杯調鍾求雅濫烈火試珉瑰緑暗驚庭葉朱明換律灰得梟夸艾捷聞鶴悼堅摧繭緒談飛麈澠波酒挹罍賡酬皆絶韻搜索病非才半是仙槎客曾隨禹浪雷遭時魚奮角失路劒生苔膽氣衝星在詞源卷漢回聲名改閭里軒冕映輿臺諼草懷堂北燈花粲婦腮涼風吹枕夢薄雨滯城隈號奏天官近臚傳御史催康衢驥鳴躍歸簷僕歡咍華省深扄鑰衡門翳草萊尚懷休假遠别語重裴徊吳松道中二首停舟傍河滸四顧盡荒原日落狐鳴冢天寒犬吠村繫帆凌震澤搶雨入盤門悵望夫差事吳山閟楚魂曉路雨蕭蕭江鄉葉正飄天寒雁聲急嵗晚客程遙鳥避征帆却魚驚蕩槳跳孤舟宿何許霜月繫楓橋濟州道中寄葉勛秀才曉路入西郊新霜著鬢毛貧交借羸馬慈母授征袍野靜狐狸出天寒雁鵠高艱難憶親舊清淚漬平皋原上閉門遺日月原上感年華久旱無場藿重陽有野花蕭蕭幾家靜脈脈一歧賖向晚悠然去秋風馬尾斜答劉季孫高臺擷黃菊獨上憶同登灌木間相揖寒鴉偶自朋酒憐旁舍熟賦喜故人能寂莫西風裏籃輿興可勝病起答關景暉臥病車馬絶初非遺世人逍遙乍形散邂逅却情真見護屏能力相扶竹亦神間來佐歡喜漉酒用陶巾同魯直和普安院壁上蘇公詩畏暑聊尋寺追涼故繞池雨園鳩喚婦風徑燕將兒散篆縈簾額留雲暗井睂龍蛇動屋壁知有長公詩次韻黃奉議序致仕作父求作魯直仲聞道家書至山中不厭寒近臣多白髮此老獨黃冠金少從供具身輕莫據鞍勞心為功業持與世人看次韻履常見貽人皆愛陳子新雨尚能來但使門多客何嫌室自埃弓旌無逺野城郭有遺才砥日常侯舍傳聲四輩催次韻鄧正字慎思秋日同文館九首平生鄧夫子文墨晚相依臺閣佳聲在湖湘爽氣歸再入館慎思潭人詩誇束筍密髮歎耨苖稀勤苦千秋事川明水孕璣雄深張子句山水發天光黃鵠愁嚴道玄龜困呂梁愛君豪穎脫嗟我病傖囊驥尾何當附西風萬里長潛屬文蔡侯南國秀經緯耿昭回文史蛙生甑風雲蟄起隈吾君求助意之子為時來萬縷防秋費何如一士才啓屬天高堂置書几連幕與雲齊暑服猶便葛秋槃已飣梨官醪聊足醉古錦不成題空對燈花喜重城隔夜閨輟直讐書館聯裾挍藝場騰驤來萬匹挺拔出千章直釣何妨得餐風未必香搜才賴公等要助俗成康憶臥蓬萊閣同聽午唱雞星辰望天北簪組隔城西幾日宣魚鑰長驅響月題更慿催鄧子要剸玉如泥風雲日夕改秋氣襲堂闈映葉無蜩響依叢有蝶歸官壺催賜酎鄰杵急成衣留滯真何補蓴鱸興又違氣入中秋徑更傳午夜長青燈蛾舞急白月雁啼涼羈旅生來慣淹留久却忘吟詩酬鄧子畢昴出東方前世諸生選平居數路開鄉閭自相與巖穴亦時來射雉空亡矢為蛇更奪杯千金曾市骨聊用作龍媒聞愼思説豪塘居聞在豪塘飲松林日百回當年鹿何往異世鶴歸來未許茅齋並終期蠟屐陪丹留杉不死夜氣看星魁鹿蓋乘鶴仙去藏丹於杉今大十餘抱矣愼思家臨湘豪塘晉陶淡隱此山常養一白陪發運右司叔父集金山次韻報國身無用還山計欲成煙霞異塵世江海慰高情幸繼阮咸集恐慙疏受聲清詩逢絶景未覺負平生送趙正夫京東漕朝持使者節騎出大明宮霜拂蓬壺外春生海岱東清時憂國事白首問民風我亦何為者丹鉛點勘中次韻八弟西園課經二首禾熟秋原靜高蟬尚遠音半荒愁雨菊獨秀畏風林老覺田原好慵疏里巷尋心知阿連勝新向佛乘深懶曠期陶謝呼兒讀晉書葛巾傾泛瀲蠟屐上􅮟嶇回向空門舊揩磨意地初未堪朝市隱且欲去衡廬千秋嶺上永日倦高躋盤回四望迷松根危抱石嶺路曲隨溪馬腹飛雲薄山腰過雨低隂崖不可度誰此構長梯蒲津繫橋次李棻韻激箭波濤上為梁木石雄鐵牛驚陜右流馬出關東潦集連艘斷冰融一水通詢謀自誰可賢有贊皇公次韻練定祥符聽法彌天一滴水何處是曹溪若作聲來解還成瞪發迷白雲遮剎遠翠竹向簷低是物元非物莊周未可齊自畫山水寄無斁題其上湘吳昔窮覽懷抱自難忘毫素開塵牖江山入草堂寄君花縣裏虛我竹林傍何物酬斯贈清詩要一囊贈别張堯詢趣操幾前輩詞章近古風身名沈飲外生事放言中鵠鶩從龜吉船車送鬼窮支離不征戍高臥有奇功寄題寶應無斁鳬舄堂二首賓戲令朝子名堂無乃迂何為仍負弩秪合便飛鳬彭澤且市隱太丘猶世儒解嘲吾亦倦繫雁一相娛弟才方濬發兄老更疏迂君自軒軒鶴吾今泛泛鳬何方折腰具能作列仙儒鈞是亡羊事清樽稍可娛憶廬山示無斁弟湖口西江外廬山已目前太虛藏不極彭蠡浸無邉五老寧行地香罏自供天芝田隔人世應有讀書仙秋夜西岡聯句城南逺人迹蟲響最先秋河漢橫疑近之補星辰爛不收露濃枝上月耒風駛苑中籌下直身田野之補相忘世馬牛市聲城郭夜耒遙色草茅幽寂莫容還往之補文章得獻酬天依閶闔轉耒斗直未央留清洛東輸海之補夷門北拱州寒燈知苦織耒濁酒識窮愁飽食容高議之補蒼顔愧薄遊黑貂寒事早耒青史素心遒附驥容吾鈍黃金試絡頭之補凝祥池上聮句粉垣周十里之補丹碧煥神宮耒樓閣晚多雨梧桐天早風之補人來夕照外耒鳥起白蘋中之補何用厭城郭滄洲佳興同耒濟北朝先生雞肋集卷第十五
