body:
  text: 第一卷古賦求志賦澤求志附夢覿賦坐愁賦坐進庵賦濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第一古賦四首求志賦釋求志附幼余不自知憃兮願求古人而與之游髙平邑於大野兮魯東鄙而北鄒固余心其悃款兮求前聖又不逺豈無鄰莫可與謀兮冶邴氏而俗泮幽離房誠不忍兮棄此而莫能歲執徐之靑陽兮余先子乎東征橫武林之大江兮暀始寧之南邑路㑹稽以周流兮求歷山之所在㫺封嵎之世守兮以後夫而致刑越懲恥於夫椒兮進樵女而抑心懿二臣以國霸兮卒焉異夫出處行束薪而自言兮妻不忍而求去助申威於司馬兮卒隕聲以淮南盱訴死於婆娑兮悲綽約之亦殲彼章陳之詭嘯兮既􅌓眙於甲夜何仲御之清激兮而亦云駭夫觀者紛回穴其莫識兮泮千載而迹陳思苗山猶若兹兮又何悲乎曲水惟鄭公之志約兮逢神人焉靡求山􅔍峍而谷䊸兮風瀏瀏乎旦草耿吾何不可留此土兮竊悲越人之禨豈其食鮭而化音兮無所用吾之緌冬曚曚其多雨兮夏疸熱以生蠚溪水之淺深兮舟上下而擊石吾遵夏蓋之山兮聊以觀乎逺海吾先子之初服兮羌董道而不改小人之有心兮猶不假器末余從於東安兮依哲人而聞誼蜀蘇子之有􅒡兮漢遺化而多儒往者其不可及兮曷不從子之廬朝余食乎山中夕余宿乎江上悲世俗之近市兮余安能忍而與之皆往余令樓季為右兮使王陽前余世解轡而馳石兮緬余得此坦塗良吾輈使環灂兮密吾牙使撲屬攬九州而顧懷兮夫安知余力之不足遘余生之罹閔兮㱕將母乎故都伏里門而畏鄰兮幽獨守此四隅時命大謬兮吾迋迋欲何之慨永夏之宜養兮霜薆然其萃之增歔欷以啜泣兮殺身其安可宇摧榮而藩穴兮雀鼠去而不舍憯四序之不淹兮春藹藹其既菲攬卉木猶若兹兮吾獨不聊此時悲豫仲之婉孌兮饒其心以詩禮吾不能操贏而坐閭兮耘東山而自食歲旱暵而不雨兮螟又生余之場屬歲秋之有榖兮河出墳而湯湯於陵子之終褊兮井上李其猶飽服芬芳而潔腹兮夫豈不足以忘老衆虒豸而好朝兮咸得時而的㿨持衣裘而鬻暑兮余固知余賈之不售思遐舉而莫從兮心䊸軫而衋傷訊黃石以吉凶兮棊十二而星羅曰凷小基大兮何有顚沛既非初志之敢期兮曾何以知其所繫頮淸濟以去垢兮芝九莖而為華宵倚楹而悲詫兮疇獨憂余之無家蕭苑候之慷慨兮孰云非食之故濟澶淵之靈津兮橫中流而飈怒思城闕之挑達兮勉踵夫㫺之人羿之志於彀兮亦反求夫余身小人不知學禮兮畏罪罟之所尋宋七世之炳靈兮皇純佑此下土舉賢而授能兮哀焭獨此黎庶牧羊而肥兮式亦用夫有聞辟雍之洋洋兮宇干日而糾紛連衽以成雲兮汗而為雨豈余不足於同門兮獨惆悵而延竚先事而後得兮惟其食者之責舉九鼎於鯢淵兮亦人假夫一臂余張子之好修兮蹇博大而無朋雪霏霏而宇凍兮松柏不改其青固黃子嘗語余兮曰此是為明月雖工師不以佩兮保厥美亦未艾彼喔咿為已甚兮羌浮石而沈木子雲之好思兮亦衆誶其寂寞虞氏之為政兮舉五臣而與言彼霡霂之射谷兮何足以容江潭之鱣衆不察余之情兮求余初猶未沫超孤舉而逺尋兮唯夫不足而論世良恫韓而成漢兮皓保惠而悟高成功則去兮曾何足以介其一毛融躬行既卒驕兮禹服義亦太靡陳輜車與乘馬兮桓榮亦酋乎富貴蕃居室其不理兮滂之志以四海允膺之激烈兮羌不以生而昧義意豈弟神所嘏兮固何以罹此之不祥豈其莫忍鄰之捽兮紛救鬬而得傷嘉林宗之善裁兮要成敗以不失寧遵不知時之可為兮行漁瀨以畢世喟嵇康之蹈盡兮愧孫子其安補阮清舌而咎目兮潛固自識而逺去謂道不可為兮為者敗之衆窢然咸不留兮惟至人焉在之泮千祀而語鄰兮孰與至人之服意神龍之乘雲兮吾欲從焉以足士生各有遇兮吾何為侘傺乎此時曾藿菽不足以化兮求余身其庶幾滋蘭以㫖蓄兮菊以為糗修忠信以抑躁兮夫安知余時之後圖前聖吾永賴兮攬百子與竝輿時翺翔於道奧兮歷年歲以為娛釋求志求志自敘也豫從先人寓巨野又從先人仕㑹稽又從先人仕杭余仕於澶仕於魏而後仕於大學故求志所敘如此高平邑於大野謂高平巨野縣也魯人好文學而獨邴氏以冶富魯人所以去文學趨利者以邴氏故也是見地理志貨殖傳離房别房也揚雄云芳酷烈而不聞兮不如襞而幽之離房武林餘杭也始寧上虞也歷山舜所耕也封嵎防封氏禹執而戮之者也夫椒吳所棲勾踐之山而西施蓋樵家女二臣大夫種范蠡信威司馬者嚴助也曹娥父名盱章陳云者章丹陳珠二女巫夜祠詭嘯夏統見而驚走者也而仲御亦嘗見賈充叩舷吳歌致風雲豫怪之仲御夏統字也苗山即㑹稽山曲水永和諸君所集處鄭弘遇神人於若耶溪云願旦南風草北風夏蓋上虞海旁山名自此以上上虞事東安杭州新城也豫始見睂山蘇公於杭故云末豫從於東安兮依哲人而聞誼樓季古善御者王陽不馳九折坂者也豫自謂至此乃知學之所趨猶出荆棘險阻得大塗而思騖也環灂朴屬􅊲工治車說車君子之器車工而後可以致逺君子修而後可以涉世自此以上新城事將母故都豫喪先人㱕濟時也豫仲無斁也東山濟東郭豫所田處比二年不雨河決卒不穫於陵子於陵仲子也虒豸猶參差見甘泉賦趣市者平旦側肩爭門而入日草之後掉臂而不顧故云衆虒豸而好朝謂干時者也世所用卜靈棊者曰是為黃石書始豫免喪占之繇曰􅒘小至大無有顚沛豫自謂非豫志所期也頮淸濟而以芝為華以况余不敢汙以干時倚楹魯漆室女中宵悲嘯鄰人疑其欲嫁者也蕭望之嘗為小苑東門候自謂各從其志豫草之澶淵豫為掾時事挑達豫教授北京時事豫去北京為太學正故曰辟雍之洋洋鯢桓九淵名舉鼎九淵非一臂力然一臂亦有助也張子豫太學同舍文潛也文潛不茍合於人黃魯直為明月篇遺之曰天地具美兮生此明月升白虹兮貫朝日豫愛之浮石沈木無是道也而誣善者其言嘗類此大才而小使之譬霡霂非鱣所游也求斯世而莫豫知也則思古人焉孟子所謂是以論其世也故曰惟夫不足而論世自恫韓成漢至潛固自識而逺去皆論世之事也馬融張禹驕靡桓榮以車馬夸弟子皆不足言陳蕃范滂王允李膺李固以忠殺身亦可傷矣夫惟無心於為者為能為天下張良四皓所以成也知其不可而不為則若林宗淵明可矣有光武而嚴陵去之非也遵陵也阮籍在晉人中頗能自濁口不臧否人物而為靑白眼殆矣故曰阮清舌而咎目也餘子傖攘小人之中如捧土救河潰卒與之俱溺豈不痛乎故曰為者敗之懲數子之為而敗而不知時之可為又蔽矣而豫又不足為也故終欲求之豫身夢覿賦歲閼逢之涒灘兮前日至而匪思夢啾耳之薨薨兮蓊靑蠅其羾􅎝咸南徙而未逝兮遺其矢如散絲余俯避而不汙兮一媼背之淋漓吻不知其可穢兮偶竝趨於西帷媼左目之冗枯兮蓱四五其萃之旁兩媼之無言兮亦依帷而靡期朝怛寤而自診兮營營發詩而可知蹇俱翔而遺矢兮技止此其奚為惟一盲而兩默兮與目蓱為何禨豈眇視不足與明兮蓱非寄而終離羌何為而眹此兮神無心而罔私拜受神祥兮編之冊詞文女三之為姦兮比匪人而惡之微夫周公之為見兮忤若此其余衰欲徼福則安敢兮問故老其增疑茍不汚為巳免兮謝三媼之難知坐愁賦魯人閻子仲武行年七十四躬耕於鄙歲旱不入而色藜藿促鼓其琴作坐愁之聲嘗所與游朝子補之恐其傷也為作坐愁賦假翁與過者語以解之其詞曰彼何人而處廓兮匪三閭而獨醒鬢毛毶其雪糅兮眸子瞭其星明塊獨守此中野兮囷無禾而㸑清拂素琴之浮埃理坐愁之遺聲忽推几而睨天送飛鴻之杳冥或過其前曰有心哉然何求㫺林類之行歌云既老而無憂翁年運而德加翁何為乎坐愁翁偶顧而若聞猶援琴而不捨曰子非魯之儒服者耶何以不知漆室女者晝輟紝而淫思宵倚楹而悲咤彼淺哉其量人匪魯憂而欲嫁豈不誤耶吾亦傷夫魯之君子㫺在厄而不糝賜自殖而何誅顧乘軒而中紺羌同道而恥兹乃長饑乎回憲彼林類其何人雖信賢而獨善或者曰未既也請言翁之近者㫺蘇門之遁民縆枯桐之一絃匪無絃之寂默異五絃之啾喧對阮子惟長嘯為嵇生才一言人欲怒之戲排諸淵勃窣而出則又粲然彼何知夫坐愁幾躚躚乎樂天矣然聖人猶以謂樂天有憂之大者也况憂人之憂豈有既哉於是翁泛然可油然謝曰憂樂外矣吾當虛之坐進庵賦有物于此無梁無柱圓廣六尺非囷非窖粟米之宅上䝉藁秸下履瓴甋塗墁晦外中腹純白平時鼠竄俯仰不迫主人懵學敢謁之客客曰此夫外丘阜而內穴谷者歟上荷笠而下湊輻者歟首枝撐而身純束者歟有登降而無阼賔者歟混沌既死竅鑿乃張牖則有目户則有吭橧巢營窟太古所藏周旋無間病於德方邑都莫賢原野則良者歟雖然可以五人羣居宇宙有餘不可以八口次且孰知婦姑彊名坐進其實中虛聞諸博識是謂廜㢝濟北朝先生雞肋集卷第一
