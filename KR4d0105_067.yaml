body:
  text: 第六十七卷墓志銘朝請大夫致仕朝公墓志銘朝奉郎致仕陳君墓志銘朝請郎王君墓志銘仙源縣君趙氏墓志銘夀昌縣君朝氏墓志銘刑部侍郎杜公墓志銘奉議郎致仕崔君墓志銘濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第六十七墓志銘朝請大夫致仕朝公墓志銘公諱端仁字堯民世家開封後徙巨野贈工部侍郎諱迪之曾孫贈吏部尚書諱宗簡之孫而贈左銀青光祿大夫諱仲參之子也母公孫氏濟南郡太君公兒童知學問如成人通昜春秋洞達世務尤妙於詞賦曄然為山東名進士再從鄉書皆舉首聲動京師翰林學士滕甫知制誥邵必見其試文而驚時英宗諒陰罷臨軒遂􅒘别試第二擢甲科而公文實第一以宋渙知名太學而躋焉場屋洶洶為不平初調常州司理參軍聽決明甚嘗以事請逮宜興豪守王説長者吏蓋豪狀白即訊公聞走詣説告所以逮者吏猶白檄已去公怒叱吏曰檄固守出守改檄不可耶卒逮之説􅒘是知公前守陳襄大興學為東南冠至是公以掾兼廪食事而士從公講授常數百人丁銀青憂銀青精吏道恤民隱初通判舒州上書言馬當山羅剎石之險請鑿秋口浦樅陽渠以避之報可而沒公護喪浮江會王荆公在金陵遽往請銘荆公一見而知之又荆公嘗佐舒其事蓋昔所欲興而不果者也為作銘特詳銀青因益顯免喪調夀光縣主簿帥清獻趙公抃未入境即以學官薦之時熙寧四年也初遣使察訪諸路而京東以命鄧潤甫吕升卿兩人素非知公亦首辟之既見乃知出荆公意也然公詳重論數不合故已事不遷久之以定陶丞為兵部主簿改著作佐郎充河北糴便司句當公事遷祕書丞初修官制預討論者皆一時文學士而公在選中時尚書右丞黃公履為御史中丞又以御史薦公既召對而宰相王歧公以姻嫌罷之然公資抗直喜事人亦畏其在言責者會再遣使髙麗議以公為書狀官往見歧公未及語歧公曰豈以母老憚海行乎還朝為館職有故事矣公曰非為是也顧事有細而繫國體者頃豐稷嘗以此官往矣髙麗使者欲令稷庭謁稷不肯使者雖降揖而竟不客之時稷猶選人也今用朝臣往見其國主固客也而其使者欲不客之可乎願蕝此儀即往歧公難之而止除太僕丞丁濟南憂免喪充廣濟河輦運而局在巨野日從親舊宴語殫其俸為食飲費廣濟輸穀羡應賞不自列改提舉河北便糴糧草計辦如廣濟時又改提舉江淮鑄錢事以逺丐罷得知沂州治尚安靜前此民或不知吾守誰何而公治近民至耕夫牧兒皆能言吾守朝公或圖其像藏之􅊲課以最聞召對便殿哲宗迎語曰是嘗與吕大防爭河北事者耶公徐對曰臣嘗任河北便糴尚書省以白劄子改鈔法此臣職事且干邊計故嘗論列而止非與大防爭也因復從容論時事得失哲宗皆嘉納復以為提舉河北常平等事代還執政曰積粟充然不按吏何也公對以職在農役不敢以是為先執政不悅乃知夀州又改知曹州􅊲課復第一上以彰信節度即位吏民爭言吾軍上龍潛地皆求貢覬非常恩以是動公公曰吾以守臣恩任子非常矣公等自為之乃獨以上在邸時諭戒吏民之語刻石上之詔改興仁軍焉故人子得疾京師殆語僕曰以我之曹南朝守及境而死吏白應視尸公不許而為治喪還其家召為金部郎中會常計句隱伏出餘贏號稱職而論事正色數不屈其長適有江淮使者來見之愕然私謂曰郎中啓事尚書乃爾耶公曰人復有憃如我者乎即上章求去改主客郎中而公又不願留乃知徐州改襄州蔡州皆未行偶執政有不合而罷者宰相疑其異已故數徙公而公故倦遊對客時誦淵明歸去來詞浩然無意於世矣俄乞致仕得請而公亦感疾以崇寧元年七月丁亥終于家年六十有八即其年十月辛酉葬于濟州任城縣之魚山自佐著作九遷為朝請大夫勳柱國服五品娶葉氏錢唐縣君前卒五子損之兗州龔丘縣主簿泰之單州城武縣主簿謙之太廟齋郎其第二子臨之第四子渙之蚤卒渙之幼竒警公痛傷之一女適單州單父縣主簿李公濟孫男八人公美公善公序公瑾公儀公琬公惠公琰孫女四人長適曹南董𦓯次適同郡李相如次適富春孫尚賢幼在室公事親孝豈弟老於文學以糾宗睦族為志不設機械而喜導人於善人亦多愛之其亡鄉黨皆為之流涕焉有昜論十卷文集十卷而於昜尤致志其説七日來復八月有凶義特妙詞多不載初公少日與今尚書右丞范公純禮俱學許昌又與故門下侍郎李公清臣相從毗陵皆厚善范公與其善論事李公嘗謂其不愧屋漏者兩公同時秉政而公為郎終不倚以進豈非賢哉江南黃庭堅有美名尤厚公其詩曰殷勤均骨肉四海一堯民黃亦不妄與人者也銘曰楚人有言何方圓之能周孰異道而相安蓋不齊者物之情而齊之實難士有志業所蘄者時豈無其時從古異施往追吾亡歧又有歧捨旃勿從則又後之公逢世治童冠有聞欲任士責以其一身譬彼大木工師既求斫而小之則惟匠尤中和之行果逹之才濟以其學文詞孔偕召而罷之時則有命去彼取此惟恬不競惟恬不競能樂若此不施其邦亦施其里彼汙得志惟厚爾顔我忱不怍有魚彼山朝奉郎致仕陳君墓志銘陳媯姓舜後滿始封陳至完有齊其裔徙泉州仙遊者曰郁有文學事王審知為諫議大夫郁生榮緒以勇名福州歸於錢氏而儇為東府安撫使治福州奏榮緒司馬復徙明州象山世亂子孫因不仕而其四世孫曰大雅工為詩而甚好義嘗舍逆旅遇之逺官病垂死者倒囊濟之留閲月病者去乃去尤為清憲趙公抃所知而年八十有八竟不用用鍾其慶於君以君登朝纍遷通直郎配丁氏封仙源縣君繼劉氏封仁夀縣君而仙源實生君君諱輔字安國四嵗喪仙源哀慕如成人七嵗誦書百卷能為人言其意中嘉祐二年進士第授挍書郎司理濵州部使者郡守爭欲出己門下遷義烏令尉王錫輕且専一日無罪鞭其隸十輩皆不服譁然欲起君聞往候錫徐數隸罪收去錫曰微君殆不濟雙林傅大士道場嵗輸供至二百萬緡提點刑獄元積中欲盡以助公君持不可猶取七十萬然雙林賴是不為墟民有以財雄其里中私貨禁物者君忽出令曰往某民室取某物幾何民不得逃物若合契咸以為神秦固監兵潤州其子勉君妹之壻也勉死家常有怪擾人會君道潤止固家三日闃然君適登舟怪已復遷忠武軍推官知武當縣縣瀕漢數潰隄君教民以大竹絡石為岸髙五丈方冬下之明年水至無患武當山有諸葛孔明廟俗以清明數百人為社祠神以侈相夸或格鬭死君因其俗加約束爭為衰改著作佐郎知安吉縣嵗飢籍富家出粟食流民所活以千計將代民詣郡及使者言古之循吏所去見􅋠我曹於陳君不待去而􅋠􅋠其將去而不樂也使者知其才命攝華亭且俾求前令張若濟罪君不願使者怒徙攝夀昌日與其僚飲酒尋山水作詩百篇率以縣小為官樂冠之時王介守湖請使者曰安吉不可以無陳君也乃得歸道聞其繫囚衆以旦至邑遽閲牘有競渡毆人死至繫百人者且情得矣即械應法者于州餘悉遣至莫庭為虛人歡舞天目山水溉一邑其附山六鄉為防專利而下二十一鄉請決隄主簿劉璹視之千餘人擁璹鬭隄下璹走還君徐以他事至旁佛舍召六鄉老人諭散之與約決隄三日慰二十一鄉民老人唯爭趨令而溪悍猛既決則三日不能復下鄉用穰朝廷初以七十五等定家業均役錢使者屬君立浙西法而翰林沈公括方察訪二浙遽言于朝挽與俱遂推其法浙東部使者交薦監杭州市昜務兼市舶司以勞遷祕書丞太常博士服五品差通判信州未行丞相蘇公頌方尹開封引以知左軍巡判官事又差通判揚州或欲穿渠龜山南徑洪澤以避淮波者疑下有石不可鑿使者復屬君君言可鑿渠成民便之遷屯田員外郎改朝奉郎管句京東排岸司時托西疆又擢通判秦州未行權度支且用矣會有以君揚州釋寄杖事為言者由是罷去拘催兩浙市昜貸錢繼丁仁夀通直憂服除管句成都府轉運司文字有飛語井研令申宗道取井戶金會宗道在府使者遽遣􅊧橐得金盛怒欲自掠訊君言匿名書勿治而金何必井戶物茍未白以屬吏可也後所司言金有從來王子文霍唐臣張堯士趙衮以治郡亡狀得罪詔大中大夫以上以歲舉堪知州一員今門下侍郎許公將首以君應詔差知卭州事丞相吕公大防范公純仁亦寖知君復欲用矣會君以疾致仕元祐四年十一月庚午卒以某年月日葬于某縣某原娶張氏德安縣君有淑德先君二年卒二子琦瀛州推官知臨江軍録事參軍珌舉進士志藝甚修而琦問學有才智幹其蠱者也三女嫁朝請郎曹昜西頭供奉官曹暟左侍禁曹習而習妻蚤卒孫男伯羣仲實女一人君為人豈弟敏強會親族喜賔客輕財重義胸中洞然少貧賤刻意於學夜不寢牀置足水中以警寐故蚤以文辭有場屋聲東明劉溫竒之使其子槩等師焉槩後試禮部第一知名云銘曰以此其志則無不可成也命不與期以此其才則無不可能也位不得為何以信此於時耶曰有大君子者數人焉皆知之君尚何悲朝請郎王君墓志銘君王氏諱元字舜弼其先大名莘人也尚書兵部侍郎贈太師尚書令兼中書令晉國公諱祜曾祖也尚書兵部郎中贈太尉諱某祖也通議大夫贈正議大夫諱端考也正議前夫人李氏文安郡君後夫人李氏華原郡君而君文安出也王得姓於周大於漢迄今多公輔顯人而大丞相魏國文正公諱旦道德忠義勳在王室為本朝第一故家城東民慕而不姓之曰城東太尉公之從祖也其子孫蟬聨圭組文學政事直諒多聞隱然為國名臣者往往而出相望也而君幼讀書業進士以世父天章閣待制諱質任為郊社齋郎再為主簿乘氏醴泉年尚幼即以才稱故樞密副使辥公向轉運陜西首薦其能監鎮戎軍折博務鎮戎當虜要路交昜夥它郡嘉祐末以鈔法害之逮君領事入復羡以勞擢大理評事知唐縣事神宗即位遷光祿丞又遷大理丞充德清軍使兼知清豐縣事清豐介澶魏戎使往來之道故頃錫軍名以為重而部使者不察議撤其額君為言朝廷本所以命此今不可昜之意使者為沮止而君亦不嫌忤其意也浮屠甲者與婦人忿夜懷甓入其室折婦人足而婦人倉卒不知誰何也君陰訊其故物色而擒之甲伏其罪人以為神遷太子右贊善大夫熙寧中安南用師為江淮荆湖六路計置點撿催促軍器時平久東南兵備尤弛戎器取充數而已方事急詔大臣擇才吏以往而君用樞密府薦云水浮陸轉軍興得不乏以勞減磨勘月日賜五品服監在京倉遷殿中丞改奉議郎為國子監主簿遷承議郎哲宗即位遷朝奉郎通判應天府事以親老不赴改監左藏北庫遷朝散郎又監元豐庫繼遭正議華原喪服除乃以朝請郎知澤州事始至擒衣冠子之尤無良者數輩置諸法城中大聳父老憂其去也數十百人詣使者願留會歲旱躬禱于桑林既還即雨而犯暑得疾遂不起紹聖四年七月二十七日也年六十九初君之罷清豐也當塗知其可用矣顧正議華原春秋髙不可去定省即求管庫間局蓋家居二十年不外遷或勞之君曰吾以華髮奉親膝樂甚去此九遷不願也其侍親疾晝夜不解帶其庶乎傳所謂以愛孝者非耶為人敦厚疏通不設町畦博綜技藝有家集十卷所遊多一時君子長者娶趙氏仙源縣君再娶朝氏夀昌縣君仙源前君葬十一年矣初君愛其弟大理丞忖忖之亡窆近仙源卜者曰不利於君君曰我且死不可以逺吾弟也卒不改嗚呼難矣男六人曰毅朝散郎曰坦將作監主簿曰發曰通曰縠曰轂坦通皆蚤世而毅號能吏纍贈君左朝議大夫發縠轂皆舉進士自立女長適霸州判官劉唐欽次適進士焦禧次適率府率宗室子帆次適下蔡丞李士袤次適西頭供奉官賈佾次適襄州推官皇甫侁孫十一人其名在朝夫人之志將以崇寧四年十月癸酉葬于開封縣大邊村之原從晉公兆也毅以夀昌君於補之為從姑知君詳來求銘銘曰堯舜之道孝弟而已人民社稷其施如此有賢朝議生于大家積善之藴粵忱不華為親忘寵居二十年以弟愛故卜違不遷是亦為政云胡不然魏公之封名則可大惟原大邊名亦斯在何以似之惟餘慶吾賴仙源縣君趙氏墓志銘朝請郎贈左朝議大夫王公諱元之夫人趙氏開封府開封縣人參知政事諱安仁之孫司農少卿諱慎微之女生十六年歸王氏以德容稱王氏故丞相家姻黨數百而夫人亦名家女以妙齡執婦道事尊章睦姒娣撫幼卑咸適閨門愛譽無間言舅正議姑華原君年已髙而華原又多疾皆意安夫人華原非夫人所和藥不御食必夫人視甘酸節乃饗或通昔候轉側涉旬不捨匜帨因以得疾而忍不言也華原愛其季女夫人能奉其欲無不至人以為難焉嘉祐八年二月十八日以疾卒享年三十時朝議官鎮戎正議華原聞訃哭之慟後朝議通籍乃追封仙源縣君男六人毅坦發通縠轂毅今為朝散郎號才吏幹其蠱者也將以崇寧四年十月九日葬朝議于開封之大邊村以夫人祔銘曰十六而嫁在歸妹卦抑長非娣亦良其袂三十以亡在爻能常常德不凶從一而終居為淑女行為令婦亦可以無負矣夀昌縣君朝氏墓志銘朝請郎贈左朝議大夫王君諱元之夫人朝氏開封府開封人尚書祠部員外郎祕閣挍理贈金紫光祿大夫諱仲衍之女也妣潁川郡夫人王氏朝議前夫人仙源縣君趙氏而夫人為繼室朝氏自文元公以道德文章為世儀範而文莊公以忠亮位丞弼家聲燁然夫人恭順懿和為朝氏賢女王氏令婦舅正議姑華原君春秋髙朝議以親養從冷局二十年夫人躬儉素以致甘旨溫毳舅姑安之族人以其久而不倦為難也纍封夀昌縣君元祐八年三月二十日以疾卒年五十三男曰毅朝散郎曰發曰縠曰轂皆進士餘蚤卒見於朝議仙源之志云孫十二人仿蚤卒俁休伋侁俅儼普博冠隆降毅等將以崇寧四年十月九日葬朝議於開封之大邉村以夫人祔銘曰惟朝與王家大名澶文正文元卿士蟬聨以元宗女嬪正裔子生宜其家沒有後祉亦可以為榮矣刑部侍郎杜公墓志銘公杜氏諱紘字君章京兆萬年人後徙濮州鄄城曾祖尚書司封郎中兼侍御史知雜事贈刑部侍郎諱堯臣妣永安縣太君馬氏繼萬年縣太君馬氏祖尚書吏部郎中直史館贈吏部尚書諱曾妣彭城縣太君劉氏􅊲尚書虞部郎中贈特進諱彭夀妣太寧郡夫人朱氏公少穎邁知自強於學問一上中進士第調深州司法參軍丁朱夫人憂服除為永年縣令嵗飢民將徙公悉召父老語曰令不能使汝必無行若留能使汝無飢民喜曰如令言尚何行乃悉與印劵使貸於兼並家約歲豐償即不貸若償不如約令能治之於是民咸得食無徙者會明年稔民德公皆先期償時熙寧二年也神宗方側席異才即召為大理寺詳斷官兼刪定編敇改大理丞權樞密院宣旨庫撿用官未幾擢權判尚書刑部丁特進憂服除遷太子中允撿詳樞密院刑房文字兼修武經要略詳定將官敕又提舉晉汾州義勇保甲嘗從容對上曰陛下寓兵於農臣愚不足以知然臣有不能默者因條十餘事上初未俞後卒知公兼判尚書兵部兼提舉樞密院宣旨庫遷太常丞復以職事對翊日上語宰相曰杜紘論事明白朕甚嘉之然未果用也鄉人前貴溪丞馬隨來調京師病逆旅且死公聞往視即載與歸召醫冀全之隨病卒公哭之哀為治喪第中或以為嫌不恤也擢撿正中書刑房公事提舉中書制敕庫兼修羣牧司騏驥院敕復權判刑部奏事面賜服銀緋每議獄必傳經以決先是民間女幼許嫁未行而養諸壻氏者曰養婦會有殺養婦以誣人者吏議如婚法公曰禮婦三月而廟見未廟見而死歸葬于女氏之黨示未成婦也故律謂定婚夫犯同凡人養婦雖非禮律其未成婦則禮律之所有也議乃定又論天下囚應死吏懦不行法輒以疑讞且非殺人則可殺人而以疑讞是縱民為殺之道也昔羊舌職曰善人在上則國無幸民荀卿陳王道之本亦曰民無幸生夫為政而下數幸欲盜之奔秦難矣請治妄讞者不從差接送伴北朝正旦使改奉議郎除刑部郎中乘輿幸省遷承議郎哲宗即位遷朝奉郎又遷朝散郎為夏國母梁氏祭奠使時戎初修貢入其國禮猶倨迓者衣毛裘邀王人以朝服覿設王人座蒙以黲且不跪受詔公持不可戎猶自若公曰天王以國母喪遣赴甚厚今不可以不如禮戎懼悉從公言差詳定元豐敕令格式又差按成都等路茶事以修書不行會夏國以泛使來請復土疆又差公押伴而使者欲入見自有所陳公遽止之使者語頗不遜公念初不之制且生事即謂曰國主奏乞具在表章回詔必自有旨揮况此大事也朝廷豈因使人口語便為可否乎隨語隨折之意小屈畢見不復敢言擢右司郎中俄遷大理卿又論元祐德音赦文鬭殺情輕減等今寺議一切以減等法從事雖朝廷不以為然吏猶守此古者大司冦以獄之成告於王王三宥之然後制刑焉德在上也今使朝廷持殺有司主德君臣之職於是乎紊疏上不報時邉臣襲鬼章青宜結生致闕下詔公鞫問公習知戎情雖黠不能隱故其國中詭計悉得上甚説遷朝請郎丐外官除直祕閣知齊州治尚寬厚不設鈎距町畦崇善良别材能人親附之然遇事濬發故小人亦嚴憚凡訟者必呼使前為一二别白欺者輒按牒語之曰汝情若是吾知之矣不願竟者亟去太守恕亦不汝窮也欺者即以手加顙拜而走人以為神徙知鄧州兼京西南路安撫司公事治如齊人尤愛之復召為大理卿因言唐鄧土曠可積榖陜西常窘兵食若養兵唐鄧間以備西戍徑商於距邊略與陜西內州軍道里等平土昜運用以飛挽利甚博事下本道議者不達遂寢擢權刑部侍郎賜服金紫復丐外官除集賢殿修撰充江淮荆浙等路發運使先是嵗轉東南粟給京師蓋七百萬石吏習於無事弊日積公盡條上之事頗施行又言京東河北飢即轉淮南米振之清河歲涸輸常後不惟名惠實費又並受其弊可别為淺腳船隸京東轉運司而俾發運司歲以諸路上供錢和糴無問豐歉以淺腳綱輸京東沿流倉積之並待河北緩急之須豐則使兩路償如直不行改知鄆州兼京東西路安撫司公事汶號難治繫囚至三百人或歲餘未決者公下車旬日剖判立盡屬令趨府持其縣之疑事請即書尾曰如是如是情法皆當一歲中獄常空者四五吏伏聽命取充員而已再召為刑部侍郎或言公守齊時嘗坐有司失入人死罪命遽寢復知鄆州一夕有揭幟城隅著妖言其上且為變者城中大恐俄而草場白晝火幟中一事也衆益洶或請大索公笑曰賊計正在此冀因吾洶乃發爾奈何墮其計中諸公第默吾知其無能為也久之獲盜殺防送卒者驗之姦民馬安上等為此遂伏誅因急治境中盜盡得其囊槖姓名榜購之盜不得容皆遁去復徙知鄧州老稚扶攜迎於道相語曰我舊使君也請為公立生祠不行改差知應天府兼南京留守司公事感疾卒元符元年八月十二日也以二年四月二十二日葬于開封府祥符縣臨黃村之原前夫人耿氏永年縣君後夫人朱氏長安縣君子欽益前襄邑縣主簿欽晏尚幼女長適前澶州司理參軍韓璉次適新單州録事參軍王檻次適承事郎知韓城縣事張秩秩妻蚤卒公性至孝親喪毁瘠過禮與伯兄修撰公俱知名謂之二杜閨門主恩而嚴事修撰公加於人數等修撰公訃至時在汶上哭曰兄教我成我今亡不得臨死不瞑矣會以二卿召而其孤開適奉柩歸葬祥符迎于國門哀動路人既事之明日會復還汶人或以為善兄弟所感云開奉寡嫂寄潁昌公悉俸錢給之三當任子再以與其兄之子欽舜及兄之孫君溥而君溥者欽舜之孤也或謂公自有子若孫奈何公曰君恩當以長幼為序故逮公沒而次子一孫俱未命焉公為人清慎而中曠達不置纎毫與人傾倒無不可而至發於事則毅然不可干以私好酒不能劇飲而客至欣然與同醉醒喜山水為州有勝處必造行遇蟠木巨石必下取酒使客自酌悠然遐想無復軒冕意好讀書雖老不倦尤長于禮經好檀弓文常倣其語法顧喜論兵而未嘗試也詩辭贍麗尚氣格至表章述事與書記尤翩翩也有文集二十卷奏議十卷昜説數十篇既屢修敕令嘗言配隸與編管太密祥符中其科四十有六後稍益至三百四十有餘科人得自新者寡因悉裁其法蓋省四百二十有餘科初公請治讞減者論有司主德非是人皆以為深至是人更以為恕云銘曰於昭神􅊲文王之文亦不已思皇熙寧秉文之德此多士如川之增則不可既遺其嗣展也杜侯奮熙寧初為已試宜卿常伯時周士貴惟其似下猶于張龔黃愛人漢循吏其身不競以篤斯祉其在世奉議郎致仕崔君墓志銘奉議郎致仕博陵崔君承之元符二年十二月戊戌卒未葬也其孤禮來求銘曰我先君生十歲我大父母下世自傷其提孩孤也號泣三年乃日夜自學問如其親之存用以成人得科名既宦不偶即解其印紱去間居讀書勸鄉人為善以夀終魯人髙之咸謂其君子且知止其生而不遭命也其殁而不傳則禮實不肯穫也禮為亭殯側名亭曰罔極春秋祭祀哭亭上惟慢葬是懼敢以是私於下執事補之曰孝哉自補之初偕鄉書竊好與魯諸生學士遊嘗已聞崔君賢乃敘而銘之君諱貺承之字也齊丁公伋之裔食采於崔者漢以來益蕃故有雙邯宇金東西南祖中祖别派而博陵清河之崔最顯後散處四方自唐初修氏族志猶第一而君曾大父廷溫隱居安平安平蓋唐志博陵裔然不知何祖出也避胡南徙瑕丘廷溫生繼榮贈大理寺丞繼榮生子良贈朝奉大夫君􅊲也大夫與其兄之子知侍御史雜事暨俱進士起家大中祥符間至君世其科則嘉祐二年也而瑕丘之崔始大君初調沂州司理參軍再調陳州司法參軍咸以能稱用舉者遷全椒令又稱治􅊲滿不遷喟然嘆曰余不負丞而丞負余此故吾家斯立在藍田時語也吾又倦遊土􅋠安能如丞屈於不己知漫不省事即謝病去以祕書省著作佐郎致仕於時年六十也其掾沂州使者檄挍士東武東武士豪喜構場屋訟異時主司畢事出或遮道問誰何不合或裂榜相詬諑主司恐為中夕張氏名州遣衛乃得去人語君故君不恤將出闢戶衆洶而前鬨堂下索榜君徐語吏示之曰某第一某次咸相顧若厭者君即命冠帶騎而去而所取第一者後貴為宰相則故趙公挺之也其掾陳州守侍讀范公鎮最厚君君議法多附經平反范公大儒眘許可察君知書長者欲奏使教授諸王宫君辭寒士不足範宗室貴者范公歎賞乃以治劇薦之其令全椒以其家居諄諄語其子弟者語其民使知孝悌力田相親睦故訟少盜衰初君常自痛祿不及親既告休以恩遷奉議郎勳飛騎尉服五品纍贈其􅊲秩大夫妣任氏金華縣太君因愀然語人曰吾無它時捧檄歡今幸以登朝賁往者哭告吾􅊲妣墓不恨矣配馬氏仙源縣君繼時氏旌德縣君皆前卒三男子禮藻禔皆舉進士藻前卒二女子歸孔燮孔殼燮趙州司理參軍殼進士諸孫男女十四人卒後八年大觀元年閏十月壬寅葬兗州龔丘縣萬歲鄉之三埠村其先塋之南君為人敏逹莊重言行不欺為鄉閭所推許其學喜言經工為詩賦蚤有名譽所嚴事徂徠石介善薑潛顔復皆魯儒知名士與相切磋論議又自以其學教授子孫族人率有名第修立家故饒裕而淡泊無聲技娛貧無食病無醫藥死不能葬者皆從君甚有恩杜門蕭散忘懷得失年八十五乃歿故魯人髙之以此補之嘗謂士之奔競始於尚科舉唐以來士相教語曰速化俗貫習久不復止童子足始踐場屋則增其年曰可蚤入仕稍長則更損焉曰休老尚可引歲月如君蚤棄事家居二十五年死而曰不恨補之不能知天下之逺何如此吾東州所未有何必它竒節異行然後為賢徒使人相謂知止亦足以愧窘拘之士什伯矣是宜銘銘曰道何必逺入孝出悌可以為宗族師藝何必多餘力學文可以為一世資惠何必及天下修之身可以為政事施其大既師其小亦施抑八十五而歿其又何悲濟北朝先生雞肋集卷第六十七
