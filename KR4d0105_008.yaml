front:
  text: 濟北朝先生雞肋集目録
  hash: sha256:af71eac6dde752a2a40652d11f1b8029623a3743c0dd5aa0c8159efe7eb844af
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0105_SBCK_008-1a}
body:
  text: 第八卷古詩次韻閻秀才漢臣食兔和蘇翰林題李甲畫雁二首秋竹郊居與八弟無斁讀書用無斁八弟永城相迎韻寄懷次韻答葉學古次韻蘇公和南新道中二首感懷追和柳子厚郊居歲草韻次韻伯溫甥池上八首次韻彥遠相州道中二首永嘉縣君赴潁州杜丈之喪送至鹿邑境上贈別綴古詩語送無斁弟赴舉贈文潛甥楊克一學文與可畫竹求詩補樂府三首豆葉黃漁家傲御街行濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第八古詩次韻閻秀才漢臣食兔兔誠中山族中古稍分裂唐虞用大牲雖有目未瞥䨲孫能飛仙飄忽天漢決不逢昜牙試厥胄幾泯滅羿弧殞陽烏曾不弋在穴王良馬慢忌撲握幾奔掣初遭赳赳子鼎飪飫毛血中逢宋鵲窘飢吻啄原雪叔世削格多星迸失行列蹄窮不得逸如鼠限髙闑應憐蚌潛水暴腹想江月脣亡欲誰語竟死猶結舌肩凥弱昜解狼藉腥尺鐵抽毫置筠管復苦蠧魚齧論功在册府微物推爾傑剡藤光奪縑抄記良瑣屑北鄰閻夫子尚忍資杯啜得諸韓盧口實以強暴劣作詩誇芳美此舉寧所悅不如狐膏臊質賤甘棄絶冢妖老通數藤索夜空設爾曾不及彼就獲徒內熱聆聲無聳耳當學縮頸鱉吾君阜萬物沛若澤未竭誰能復古初此味儻可缺和蘇翰林題李甲畫雁二首畫寫物外形要物形不改詩傳畫外意貴有畫中態我今豈見畫觀詩雁真在尚想髙郵間湖寒沙璀璀冰霜已凌厲藻荇良瑣碎衡陽渺何處中沚若煙海蕭條新湖秋霜落洲渚潔蓮垂蘭杜死菖莆見深節慘淡沙礫姿清波侶羣鴨往時吳興守看畫憶苕霅為儀尚不汚孤髙比雲月聞在雪堂時滿堂唯畫雪秋竹秋風多煩寃竹是歲寒物朝寒階玲瓏草寒階恤勿翻然下一葉未覺瘦􅍶崒豈無陳根旁寂莫衆頭屈何時雷填填看爾射地出郊居與八弟無斁讀書坐狂得世捐作官故不了十年未弛負半世不黔竈居然顔玉雪及是鬢蓬葆碧山已焚魚白水初種稻瓜區可深隱圭竇便却掃之子懷世資行修名譽好避人本愈恬坐我亦枯稿故得監廟無斁以余頃求田野處政以城郭擾常時啜仳別幸爾晏言笑如蘭豈異臭覆瓿本均好聲去不懲范釡塵尚作韓編盜斫輪元戒疾紵絮非病少莞爾勸之休怡然守而嫪翻思南遷久秪幸北歸早三已令奚慍四至卿誠巧所欣顚木蘖莫羡姣人瞭同氣靡間言它人闕忠告貧居無酒肉窮巷有揬討葵作飽蓬蓬茗澆憂悄悄長間味更永競進念已勦目鴻天蒼蒼夢蝶日杲杲蘅皋美新雨藜杖邈髙蹈營齋直新徑創檻俯幽沼架以我園檀茨之子官草月給無斁也芻優遊聊卒歲邂逅可同調佩玉子終翔菟裘我方老囊中餐玉法櫪上追風驃能知面不靦未用心如攪平生夔契慕晚歲瞿聃妙但欲入林深子來應問道用無斁八弟永城相迎韻寄懷平生殫千金術似劉纍僻春風九軌道無我迷陽迹呼來著冠紞野貌不改昔易衣憐介弟猶有布一尺身慙崔浩短胸次儼列戟中天翥鸞鳳我自無六翮何曾客權貴見謂貧盜璧堂堂涑水翁我在此人籍不詆曲江賢寧羞九年謫囏難纍吾母鬢髮白一夕獨此負吾心敢言忠抱石方時半千運異昔陽九厄譬馳羊腸坂雙任臣子責帝王所張弛乾坤有闔闢君敷皇極言人詠蓼蕭澤鳶魚競飛躍風俗凜移昜已開公府閣又置四郊驛􅊧求逮田野欣喜到僮役雖微攜手上頗似破笯釋川塗見吾弟薪木詢我宅憐君如我固不歎玄尚白薄飲盡餘醅凝塵振鹿席我醉昜成狂欲起須君掖次韻答葉學古昔我遊武林值子長江頭我時方南轅子亦將西舟相見兩大笑典衣上髙樓樓髙不知暑五月凝清秋環觀四山明俯視萬井稠喧喧市中人日草歌吹浮忘形與子飲一醉餘無謀湖上荷花生黃鸝飛柳洲翻然搖兩槳下上逐輕鷗不覺脫塵世自謂逍遙遊晚訪城隅寺竹林森如幬斫薪煮山茗蕭灑破百憂腳懶厭􅒡闠五日成淹留肅肅太史家門闌間且幽荒亭蔭疏桐雀鬭聞啾啁其人絶世賢揶揄困時流唯我與吾子大軸更往投幸聞一諾榮不受萬户侯誰言王母桃方朔不得偷未幾子告別西賓帝王州吳船風雨夜送子不勝愁八月子獻書髙談夏商周惜哉天下馬驪牡煩推求我濫鄉老薦麻衣望前旒愧非鳴鳯祥斥去還林丘三月我度江子行窮海陬相望遂乖隔慨歎不自休逆旅善辱人虛激韓娥謳操瑟立齊門乃反怨不收嗟哉子與我不幸斯人儔有客道閩吳書詩眷綢繆開緘恍自失但覺膽氣遒有如飲貪泉海貨溢兩眸子詩益加富我句猶能裒春禽與秋蟲引腹聊相酬次韻蘇公和南新道中詩二首山園芙蓉開寂莫歲云晚公來無與同念我百里逺寒飈吟空林白日下重巘興盡還獨歸挑燈古囊滿讀公棲鴉詩歲月傷晼晚公胡不念世蠟屐行避逺羈鳥翔别林歸雲抱孤巘我才不及古歎息襟淚滿感懷追和柳子厚郊居歲草韻殘暑夜如炊曉風吹蕭索開門望林木引蔓修籬落所欣塵纍逺不恨生涯薄心事少干雲白頭成憶昨次韻閻甥伯溫池上八首文饒論百揆豪氣闊天宇歸來坐平泉草木何足數只今和文弟怪石幾風雨達生要忘纍人取應我與刻平泉字蓋文饒自題也李和文家涼堂後石甚奇上昔吾卜城東今吾卜城中秪畏盜賊迫安知􅒡市同畚鍤運渤海操蛇應未窮無乃遭此笑君如北山翁誅茅斬惡木衆卉方以朋掘沙到沮洳方復見此澄客來恍異境物象初不增以此自誑目果下能日乘池深不可臨際水作石磴塵埃攪百里得此亦差勝晨朝看雨坐蛙喜律呂應有兒不鼓篋共此疏懶興物養有得失瘠地江河隈亭檻但小草山林自奇材我有八極興聊堪一席開長嘯本造適悲風為誰來自從移居來城市益啾擾如何跬步近亦有鷺下沼朅來欲騁騖詰曲故百繞人間南柯夢方此猶復小黃冠一奇士教我潄華池茅簷夕堅坐見月柳間低水蟲時一出細浪作鱗差流觀起百慮內視失羣疑平生惟親舊相得懷抱敞寧知老田里三徑得還往結廬在人境此意陶令賞但話北窗涼何必羲皇上次韻彥逺相州道中二首自君之出矣吾居關晝橫尚有楊李來時能出門迎少日所忿慉壯年瞀雙睛涉月在一床幾成小冠盲夫子竹林趨世固溷髙明尚喜鞍馬間經阿復緣泓詩隨晚雨墮迫户有餘清便擬釀白黍相邀飰青精重惜吾楊李徂秋各南征朝入一几縱草入一几橫黃卷值昔人歡與相逢迎孫子謝口語阮生勞目睛登亦豈必喑籍猶未能盲學非經世具所貴自知明仁義有不然失時悲戰泓一生屐幾量況欲俟河清動與道彌遠靜於理逾精君能問舍往吾亦賣刀行永嘉縣君赴潁昌杜丈之喪送至鹿邑境上贈别二十年粳粃相從無靦顔尊公抱至痛白玉掩深菅送子三百里西風涕汍瀾鄰喪罷相舂況我五服間憐子一女子忘身赴憂患但恨莫攀輀賤生守微官勿為撡執悲我居不求安送死當大事丈夫良獨難綴古詩語送無斁弟赴舉鮮民之生靡瞻匪父母氏劬勞寧不我顧兄弟無逺惟豫與女執子之手此夕何夕我心蘊結兮嗟豫弟行役二之日栗烈飄風發發子之清揚麻衣如雪載馳載驅出宿於干揆之以日體無咎言既差我馬逺送于野敦彼獨宿于林之下無衣無褐不念昔者陟彼髙岡或降于阿瞻望弗及獨寐晤歌展轉反側不平謂何顯允君子洵美且異溫其如玉干祿豈弟春日載陽薇亦作止睍睆黃鳥嚶其鳴矣贈文潛甥楊克一學文與可畫竹求詩與可畫竹時胸中有成竹經營似春雨滋長地中緑興來雷出土萬籜起崖谷君今似與可神會久已熟吾觀古管葛王霸在心曲遭時見毫髮便可驚世俗文章亦技爾詎可枝葉續穿楊有先中未發猿擁木詞林君張舅此理妙觀燭君從問輪扁何用知聖讀補樂府三首豆葉黃蒹葭蒼豆葉黃南村不見岡北村十頃強東家車滿箱西家未上場豆葉黃野離離鼠窟之兔入畦豕母從豚兒豕啼豚咿咿銜角復銜萁豆葉黃穀又熟翁媼衰餔糜粥豆葉黃葉黃不獨豆白黍堪作酒瓠大棗紅皺豆葉黃穰穰何膴膴腰鐮獨健婦大男往何許官家教弓刀要汝殺賊去漁家傲漁家人言傲城市未曾到生理自江湖那知城市道晴日七八船熙然在清川但見笑相屬不省歌何曲忽然四散歸逺處滄洲微或云後車載藏去無復在至老不曲躬羊裘行澤中御街行雙闕齊紫清馳道直如線煌煌塵內客相逢不相見上有髙槐枝下有清漣漪朱欄夾兩邊貴者中道馳借問煌煌子中道誰行此且復就下論驄馬知雜事官卑有常度那得行同路相效良獨難且復東西去濟北朝先生雞肋集卷第八
