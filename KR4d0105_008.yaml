front:
  text: 濟北晁先生雞肋集目錄
  hash: sha256:221dfe13869a24a5a924bbf1455c86ba537ad199042976343042fd90ded837c3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0105_SBCK_008-1a}
body:
  text: 第八卷古詩次韵閻秀才漢臣食兔和蘇翰林題李甲畫雁二首秋竹郊居與八弟无斁讀書用无斁八弟永城相迎韵寄懷次韵荅葉學古次韵蘇公和南新道中二首感懷追和桺子厚郊居歲草韵次韵伯溫甥池上八首次韵彦遠相州道中二首永嘉縣君赴潁州杜丈之喪送至鹿邑境上贈別綴古詩語送无斁弟赴舉贈文潛甥楊克一學文與可畫竹求詩補樂府三首豆葉黄漁家傲御街行濟北晁先生雞肋集目錄終濟北晁先生雞肋集卷第八古詩次韵閻秀才漢臣食兔兔誠中山族中古稍分裂唐虞用大牲雖有目未瞥䨲孫能飛仙飄忽天漢決不逢昜牙試厥胄幾泯滅羿弧殞陽烏曾不弋在穴王良馬慢忌撲握幾奔掣初遭赳赳子鼎飪飫毛血中逢宋鵲窘飢吻啄原雪叔世削格多星迸失行列蹄竆不得逸如鼠限髙闑應憐蚌潛水㬥腹想江月脣亡欲誰語竟死猶結舌肩凥弱昜解狼藉腥尺鐵抽毫置筠管復苦蠧魚齧論功在冊府微物推爾傑剡藤光奪縑抄記良瑣屑北鄰閻夫子尚忍資盃啜得諸韓盧口實以彊㬥劣作詩誇芳美此舉寧所悦不如狐膏臊質賤甘棄絶冢妖老通數藤索夜空設爾曾不及彼就獲徒内熱聆聲無聳耳當學縮頸鼈吾君阜萬物沛若澤未竭誰能復古初此味儻可缺和蘇翰林題李甲畫雁二首畫寫物外形要物形不改詩傳畫外意貴有畫中態我今豈見畫觀詩雁眞在尚想髙郵間湖寒沙璀璀冰霜已凌厲藻荇良瑣碎衡陽渺何處中沚若煙海蕭條新湖秋霜落洲渚潔蓮垂蘭杜死菖莆見㴱節慘澹沙礫姿清波侶羣鴨往時吳興守看畫憶苕霅為儀尚不汚孤髙比雲月聞在雪堂時滿堂唯畫雪秋竹秋風多煩寃竹是歲寒物朝寒堦玲瓏草寒堦䘏勿飜然下一葉未覺痩􅍶崒豈無陳根旁寂莫衆頭屈何時雷塡塡看爾射地出郊居與八弟无斁讀書坐狂得世捐作官故不了十年未弛負半世不黔竈居然顔玉雪及是鬢蓬葆碧山已焚魚白水初種稻瓜區可㴱隱圭竇便却埽之子懷世資行脩名譽好避人本愉恬坐我亦枯槁故得監廟无斁以余頃求田野處政以城郭擾常時啜仳別幸爾晏言笑如蘭豈異臭覆瓿本均好聲去不懲范釡塵尚作韓編盜斲輪元戒疾紵絮非病少莞爾勸之休怡然守而嫪翻思南遷久秪幸北㱕早三已令奚慍四至卿誠巧所欣顚木蘖莫羨姣人瞭同氣靡間言它人闕忠告貧居無酒肉竆巷有揬討葵作飽蓬蓬茗澆憂悄悄長閑味更永競進念已勦目鴻天蒼蒼夣蝶日杲杲蘅皋美新雨藜杖邈髙蹈營齋直新徑創檻俯幽沼架以我園檀茨之子官草月給无斁也芻優游聊卒歲邂逅可同調佩玉子終翔菟裘我方老囊中餐玉法櫪上追風驃能知面不靦未用心如攪平生夔契慕晚歲瞿聃妙但欲入林㴱子來應問道用无斁八弟永城相迎韵寄懷平生殫千金術似劉累僻春風九軌道無我迷陽跡呼來著冠紞野貌不改昔易衣憐介弟猶有布一尺身慙崔浩短胸次儼列㦸中天翥鸞鳳我自無六翮何曾客權貴見謂貧盜璧堂堂涑水翁我在此人籍不詆曲江賢寧羞九年謫囏難累吾母鬢髮白一夕獨此負吾心敢言忠抱石方時半千運異㫺陽九厄譬馳羊腸坂雙任臣子責帝王所張㢮乾坤有闔闢君敷皇極言人詠蓼蕭澤鳶魚競飛躍風俗澟移昜已開公府閤又置四郊驛􅊧求逮田野欣喜到僮役雖微攜手上頗似破笯釋川塗見吾弟薪木詢我宅憐君如我固不歎玄尚白薄飲盡餘醅凝塵振鹿席我醉昜成狂欲起須君掖次韵荅葉學古㫺我遊武林値子長江頭我時方南轅子亦將西舟相見兩大笑典衣上髙樓樓髙不知暑五月凝清秋環觀四山明俯視萬井稠喧喧市中人日草歌吹浮忘形與子飲一醉餘無謀湖上荷花生黄鸝飛桺洲飜然搖兩槳下上逐輕鷗不覺脱塵世自謂逍遙遊晚訪城隅寺竹林森如幬斫薪煑山茗蕭洒破百憂腳嬾厭􅒡闠五日成淹畱肅肅太史家門闌閑且幽荒亭䕃疎桐雀鬭聞啾啁其人絶世賢揶揄困時流唯我與吾子大軸更往投幸聞一諾榮不受萬户侯誰言王母桃方朔不得偷未幾子告別西賓帝王州吳舩風雨夜送子不勝愁八月子獻書髙談夏商周惜哉天下馬驪牡煩推求我濫鄉老薦麻衣望前旒愧非鳴鳯祥斥去還林丘三月我度江子行竆海陬相望遂乖隔慨歎不自休逆旅善辱人虛激韓娥謳操瑟立齊門乃反怨不収嗟哉子與我不幸斯人儔有客道閩吳書詩眷綢繆開緘恍自失但覺膽氣遒有如飲貪泉海貨溢兩眸子詩益加富我句猶能裒春禽與秋蟲引腹聊相酬次韵蘇公和南新道中詩二首山園芙蓉開寂莫歲云晩公來無與同念我百里逺寒飈吟空林白日下重巘興盡還獨㱕挑燈古囊滿讀公棲鴉詩歲月傷晼晩公胡不念世蠟屐行避逺羈鳥翔别林㱕雲抱孤巘我才不及古歎息襟淚滿感懷追和桺子厚郊居歲草韵殘暑夜如炊曉風吹蕭索開門望林木引蔓修籬落所欣塵累逺不恨生涯薄心事少干雲白頭成憶昨次韵閻甥伯溫池上八首文饒論百揆豪氣闊天宇㱕來坐平泉草木何足數只今和文弟怪石幾風雨達生要忘累人取應我與刻平泉字葢文饒自題也李和文家涼堂後石甚奇上昔吾卜城東今吾卜城中秪畏盜賊迫安知􅒡市同畚鍤運渤海操蛇應未竆無乃遭此笑君如北山翁誅茅斬惡木衆卉方以朋掘沙到沮洳方復見此澄客來恍異境物象初不增以此自誑目果下能日椉池㴱不可臨際水作石磴塵埃攪百里得此亦差勝晨朝看雨坐蛙喜律呂應有兒不鼓篋共此疎嬾興物養有得失瘠地江河隈亭檻但小草山林自奇材我有八極興聊堪一席開長嘯本造適悲風為誰來自從移居來城市益啾擾如何跬步近亦有鷺下沼朅來欲騁騖詰曲故百遶人間南柯夢方此猶復小黄冠一奇士敎我潄華池茅檐夕堅坐見月桺間低水蟲時一出細浪作鱗差流觀起百慮内視失羣疑平生惟親舊相得懷抱敞寧知老田里三徑得還往結廬在人境此意陶令賞但話北窗凉何必羲皇上次韵彥逺相州道中二首自君之出矣吾居關晝横尚有楊李來時能出門迎少日所忿慉壯年瞀雙睛涉月在一床幾成小冠盲夫子竹林趨世固溷髙明尚喜鞍馬間經阿復縁泓詩隨晩雨墮迫户有餘清便擬釀白黍相邀飰青精重惜吾楊李徂秋各南征朝入一几縱草入一几横黄巻値㫺人歡與相逢迎孫子謝口語阮生勞目睛登亦豈必喑籍猶未能盲學非經世具所貴自知明仁義有不然失時悲戰泓一生屐幾量況欲竢河清動與道彌遠靜於理逾精君能問舍往吾亦賣刀行永嘉縣君赴潁昌杜丈之喪送至鹿邑境上贈别二十年糠粃相從無靦顔尊公抱至痛白玉掩㴱菅送子三百里西風涕汍瀾鄰喪罷相舂況我五服間憐子一女子忘身赴憂患但恨莫攀輀賤生守微官勿爲撡執悲我居不求安送死當大事丈夫良獨難綴古詩語送无斁弟赴舉鮮民之生靡瞻匪父母氏劬勞寧不我顧兄弟無逺惟予與女執子之手此夕何夕我心蘊結兮嗟予弟行役二之日栗烈飄風發發子之清揚麻衣如雪載馳載驅出宿於干揆之以日體无咎言既差我馬逺送于野敦彼獨宿于林之下無衣無褐不念㫺者陟彼髙岡或降于阿瞻望弗及獨寐晤歌展轉反側不平謂何顯允君子洵美且異温其如玉干禄豈弟春日載陽薇亦作止睍睆黄鳥嚶其鳴矣贈文潛甥楊克一學文與可畫竹求詩與可畫竹時胸中有成竹經營似春雨滋長地中緑興來雷出土萬籜起崖谷君今似與可神㑹久已熟吾觀古管葛王霸在心曲遭時見毫髮便可驚世俗文章亦技爾詎可枝葉續穿楊有先中未發猿擁木詞林君張舅此理妙觀燭君從問輪扁何用知聖讀補樂府三首荳葉黄蒹葭蒼荳葉黄南村不見岡北村十頃彊東家車滿箱西家未上塲荳葉黄野離離鼠窟之兔入畦豕母從豚兒豕啼豚咿咿銜角復銜萁荳葉黄穀又熟翁媼衰餔糜粥荳葉黄葉黄不獨荳白黍堪作酒瓠大棗紅皺荳葉黄穰穰何膴膴腰鐮獨健婦大男往何許官家敎弓刀要汝殺賊去漁家傲漁家人言傲城市未曾到生理自江湖那知城市道晴日七八舩熙然在清川但見笑相屬不省歌何曲忽然四散㱕逺處滄洲微或云後車載藏去無復在至老不曲躬羊裘行澤中御街行雙闕齊紫清馳道直如線煌煌塵内客相逢不相見上有髙槐枝下有清漣漪朱欄夾兩邊貴者中道馳借問煌煌子中道誰行此且復就下論驄馬知雜事官卑有常度那得行同路相效良獨難且復東西去濟北晁先生雞肋集卷第八
