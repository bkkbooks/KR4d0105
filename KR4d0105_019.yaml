body:
  text: 第十九卷絶句國子監草㱕答李令身世謾悠哉禱雨宿九曲池三首譙國嘲提壺書周開祖子抱一發願文後和答魯復一高士讀易題宗室大年畫扇四首閻子常求琴絃濵州道中四首館宿季夏即事濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第十九絶句六言國子監草㱕杖屨清晨往縑囊薄草㱕間官㕔事冷蝴蝶上階飛答李令知音慙李令問我復何為道義惟添睡功名只有詩身世謾悠哉身世謾悠哉田園首重回春來亦何事忽忽歎庭槐禱雨宿九曲池上三首微月淡蕪城飛螢縱復橫蛙魚凉亦樂跳港觸荷聲荒城孤絶處猶指玉鉤亭凉月偏宜上江南山更青同輦笙歌地荒池風露天無心更懷古凉夜正甘眠譙國嘲提壺何處提壺鳥荒園自叫春夕陽深樾裏持此勸何人書周開祖豫抱一發願文後欲愛生諸穢俱盛一革囊應從持犯入當發紫金光和答魯復一髙士四觀以為鄰朝霞以為竈贈我不知名千古巖下草讀易學不到忘言崇朝守韋編使我能解化此物為蛇蟬題宗室大年畫扇四首柳動燕初來波生雁將去惟有小嵩高蒼蒼自如故鸜之仍鵒之爾名今是非人言不踰濟何事滿苔磯西風入叢竹慘淡帶秋隂驚起中汦雁衡陽萬里心王孫蘊奇意紈素淡雲煙借與王摩詰含毫思邈然閻子常求琴絃先生三尺琴斷絶絃上音欲求鳳喙膠弱水毛猶沈濵州道中四首六言身隨符檄塞壘家與琴書鄴都白酒清談憶汝黃花佳節愁豫月墮孤村露合日出高原霧開道逐故河西去人將新雁南來三徑蔣生里第再見虞君客卿多病增豫㱕思少年許子高名林下囊裝夙興雲間鴻雁悲鳴行役正嗟豫弟言旋當復諸兄館宿殘雪封條未乾蘭臺襆被春寒斜日房櫳吏散鳴鳩飛下欄干季夏即事紅葵有雨長穗青棗無風壓枝溼礎人霑汗際蒸林蟬烈號時濟北朝先生雞肋集卷第十九
