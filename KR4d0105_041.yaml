body:
  text: 第四十一卷雜論春秋左氏傳雜論二十一篇濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第四十一春秋左氏傳雜論楚子囊曰今吾不能與晉爭晉君類能而使之韓厥老矣知罃禀焉以為政范丐少於中行偃而上之使佐中軍韓起少於欒黶士魴上之使佐上軍君明臣忠上讓下競右襄九年天下有達尊三爵一齒一德一孟子以謂烏得有其一以慢其二哉蓋貴老敬長所以訓孝弟而賢能所在不必老長是以晉政類能少者位上羣臣樂推彊國罷爭才之所在不繫乎年也公送晉侯晉侯以公宴于河上問公年季武子對曰㑹于沙隨之歲寡君以生晉侯曰十二年矣是謂一終一星終也國君十五年而生子冠而生子禮也君可以冠矣大夫盍為冠具武子對曰君冠必以祼享之禮行之以金石之樂節之以先君之祧處之今寡君在行未可具也請及兄弟之國而假備焉晉侯曰諾公還及衛冠于成公之廟假鍾磬焉禮也右襄九年國君十五而冠而魯君以年則十二年耳未及冠也武子對晉侯之言則是而迫於盟主之威不暇守其言至汲汲焉即它國之廟假同姓之器而行禮若不及俟返國者以謂禮耶非禮矣盜殺子駟子國子耳云云子西聞盜不警而出尸而追盜盜入於北宫乃㱕授甲臣妾多逃器用多喪子産聞盜為門者庀羣司閉府庫愼閉藏完守備成列而後出兵車十七乘尸而攻盜於北宫盜衆盡死右襄十年子西子駟子也子産子國子也子西之才不及子産不待此而知也均人子也盜戕其父聞難匍匐遑遽而往猶恐不及而責子西以不警善子産以庀完此豈雍容時耶傳失之矣且言國事則三執政喋血朝廷言家事則父㬥尸衢巷而咎臣妾之逃悼器用之喪豈但鄙細不知務而已哉宋華閲卒華臣弱皋比之室使賊殺其宰華吳云云宋公聞之曰臣也不惟其宗室是㬥大亂宋國之政必逐之左師曰臣也亦卿也大臣不順國之恥也不如蓋之乃舍之左師為己短策茍過華臣之門必騁右襄十七年大臣擅相賊君欲討而卿不忍非國恥蓋國弱也國弱斯恥矣左師向戌為賢乎則欲靖國而縱有罪何哉既謂君舍之矣而過必騁以示惡之奚補荀偃疸疽生瘍於頭濟河及著雍病目出二月甲寅卒而視不可含宣子盥而撫之曰事吳敢不如事主猶視欒懷子曰其為未卒事於齊故也乎乃復撫之曰主茍終所不嗣事於齊者有如河乃瞑受含宣子出曰吾淺之為丈夫也右襄十九年宣子以事其子吳自誓而猶視而懷子以嗣事於齊禱之則瞑故宣子自以為淺期偃也然宣子懷子皆晉之望也譬巫覡妾婦撫尸喋囁何其妖且鄙哉桓談言病而目出初死日未含尸冷乃含非其有所知也談言是矣吳人為楚舟師之役故召舒鳩人舒鳩人叛楚楚子師于荒浦使沈尹壽與師祁犂讓之舒鳩子敬逆二子而告無之且請受盟二子復命王欲伐之薳子曰不可彼告不叛且請受盟而又伐之伐無罪也姑㱕息民以待其卒卒而不二吾又何求若猶叛我無辭有庸乃還滅舒鳩注明年楚右襄二十四年舒鳩實叛楚楚責之急僞逆二子欺言無之楚王欲伐其欺亦可矣而子馮不可其意曰君子可欺以其方難罔以非其道彼以不叛來請盟斯受之而已如是而復叛楚雖滅之楚可無罪昜曰田有禽利執言無咎子馮以之吳子諸樊伐楚以報舟師之役門于巢巢牛臣曰吳王勇而輕若啓之將親門我獲射之必殪是君也死彊其少安從之吳子門焉牛臣隱於短牆以射之卒右襄二十五年吳人輕而無謀自古記之矣孫堅孫策皆無王霸器堅輕騎從敵策暫出遇仇俱以輕敗雖賴周瑜魯肅輩輔權嗣立亦權稍持重故卒建吳國也鄭子展卒子皮以子展之命餼國人粟戶一鍾是以得鄭國之民故罕氏常掌國政以為上卿宋司城子罕聞之曰鄰於善民之望也宋亦飢請於平公出公粟以貸使大夫皆貸司城氏貸而不書為大夫之無者貸宋無飢人叔向聞之曰鄭之罕宋之樂其後亡者也二者其皆得國乎民之㱕也施而不德樂氏加焉其以宋升降乎右襄二十九年展皮私施以收民而取國政罪也司城慕而效之皆權臣自培祿去公室之道也夫請於公出公粟以貸可也貸而不書以獨取一家之譽其可乎使大夫皆貸可也為大夫之無者貸以家擅一國之名其可乎子貢贖人而不受金於府仲尼曰魯自此不復贖人則貸而不書使後不貸之道也或乞醯焉乞諸其鄰而與之仲尼曰孰謂微生高直則為大夫之無者貸不直之類也又田常驟施以有齊國古之姦臣多託此以收衆幸而不亡而叔向以謂其後亡者何哉施而不直其干民譽多矣君子以謂不免於罪而叔向以謂樂氏加焉何哉不然彼皆不知此特誠心憂民而恤之可矣然君子猶避是名伯有既死使大史命伯石為卿辭大史退則請命焉復命之又辭如是三乃受策入拜子産是以惡其為人也使次已位亂故寵之注畏其作右襄三十年以子産之賢察伯石之僞而惡之可以廢矣顧乃寵之使次己位何也以謂廢之則力未可為若恥與同列而已自去耶則鄭不可以無子産故寧少假焉且與之偕而不自失為鄭國慮故也嗚呼君子之馭小人有道抑孔子所謂人而不仁疾之已甚亂也子産其懼此矣鄭徐吾犯之妹美公孫楚聘之矣穆公孫注子南公孫黑又使彊委禽焉犯懼告子産子産曰是國無政非子之患也適子南氏子晳怒公孫黑注子晳既而櫜甲以見子南欲殺之而取其妻子南知之執戈逐之及衝擊之以戈子晳傷而歸云云子産曰直鈞幼賤有罪罪在楚也乃執子南而數之放游楚於吳鄭為游楚亂故公孫黑彊與於盟子産弗討公孫黑將作亂欲去游氏而代其位傷疾作而不果諸大夫欲殺之子産使吏數之曰以大國之事而未爾討也云云昆弟爭室而罪二也不速死司寇將至七月壬寅縊右昭元年子産為鄭叔向為晉晏嬰為齊皆三國之季世而晉齊甚焉初子皮授子産政辭曰國小而逼族大寵多不可為也及為政有事伯石賂與之邑子大叔曰國皆其國也奚獨賂焉子産曰無欲實難卒與之夫為政而令不行於公族至有所欲使而用賂國於何有哉然子産之所以為此抑可言矣子南子晳之爭子南直也若罪其用戈則子晳先櫜甲往殺子南矣子南用戈但應之也而曰直鈞幼賤有罪罪在子南杜預以謂力未能討而㱕罪於楚非權也不得已而用最下之策也雖後子晳彊與於盟亦弗即討則其忍可知矣及子晳獲罪然後方數以大國之事未爾討而摘其昆弟爭室至此則晳之直安在哉以至乘遽而至迫以縊死則子産之夲心可見矣故曰為政而令不行於公族國於何有哉然子産之所以為此抑可言者惟初忍而后決始逆而終伸事定國靖而衆方知其心是乃子産以為賢而稱於孔子也昭元年齊侯使晏嬰請繼室於晉叔向從之宴相與語曰齊其何如晏子曰此季世也吾弗知齊其為陳氏矣云云叔向曰然雖吾公室亦季世也政在家門民無所依夫以鄭晉齊三國有臣若是然至世微政去皆不能救鄭未裂於彊臣子産其猶區區焉因事正之晉齊將亡賢如叔向平仲特相與私語而太息豈不哀哉雖然二國所以未遽亡亦曰有兩人者在宋寺人柳有寵太子佐惡之華合比曰我殺之柳聞之乃坎用牲埋書而告公曰合比將納亡人之族云云合比奔衛於是華亥欲代右師得合比處合比弟欲乃與寺人柳比從為之徵公使代之見於左師左師曰女夫也必亡女喪而宗室於人何有人亦於女何有詩曰宗子惟城云云右昭六年向戌知柳與亥之詐亥又徵其兄而戌身為左師不能為國討罪既許亥代之矣尚面誚責陳詩揚義亦何為哉前此宋華臣亦㬥其宗公欲逐之而左師不逐但過門必騁而已與此事終始意同傳載其言不足賢也楚子享公於新臺好以大屈既而悔之薳啓疆聞之見公公語之拜賀公曰何賀對曰齊與晉越欲此久矣寡君無適與也而傳諸君君其備禦三鄰公懼乃反之右昭七年薳啓疆諫楚君以毋辱宣子叔向而恥晉國道聖王所以務行禮陳誼甚高蓋賢大夫也抑兩君相見問以弓矢物之至末者也何足道哉楚子悔焉而啓疆詐魯以還之君吝臣欺何以為國彼哉彼哉楚王縊于芋尹申亥氏子干子晳皆自殺弃疾即位也平王使枝如子躬聘于鄭且致犫櫟之田鄭邑注夲取之楚中事畢弗致鄭人請曰聞諸道路將命寡君以犫櫟敢請命對曰臣未聞命既復王問犫櫟降服而對曰臣過失命未之致也王執其手曰子毋勤姑㱕不榖有事其告子也有權注善其右昭十三年春秋之時諸侯以詐謀相並不可勝言弃疾從于亂以得楚無異於篡未可以正義責也然始即位而知楚取鄭邑之過欲㱕之設非其夲心猶為詐善枝如子躬忠耶王弗致猶將勸之遣致而弗致違君命以濟其諛欲誣鄰國以開其怨隙何以善其後哉諸侯是以知楚之不競也傳言弃疾令德有民然不足以知枝如之為罪執手而悅且親之異於得原失信逺矣商於六里張儀之徒所以誤鄰國攜人心而杜預善其有權預亦非也晉成虒祁之宫諸侯朝而㱕者皆有二心為取郠故晉將以諸侯來討叔向曰諸侯不可以不示威欲以威服之注知晉德薄乃竝徵㑹告于吳云云邾人莒人訴于晉曰魯朝夕伐我晉侯不見使叔向來辭云云子服惠伯對曰君信蠻夷之訴以絶兄弟之國寡君聞命矣叔向曰寡君有甲車四千乘在雖以無道行之必可畏也况其率道其何敵之有牛雖瘠僨於豚上其畏不死魯人懼聽命右昭十三年子産鑄刑書自謂以救弊而叔向貽書切責以謂三辟之興皆叔向也其辭甚美子産屈之夫子産之治雖愧先王以權一時良不得已而叔向尚以叔世過舉誚而非之若晉之衰又甚於鄭侈成虒祁而不能諫諸侯皆叛而不知圖合衆示威以誣先王朝㑹之意而不知恥似非叔向之為也杜預云自昭公即位邾魯同好又不朝夕伐莒無故怨訴晉人信之所謂謲慝弘矣而叔向不惟信邾莒之厚誣沮子服之正論至耀車甲之多曰雖以無道行之而可畏夫紂豈車甲之不多而亡哉蓋無道而可行自古蔑有且晉誠已衰不可復興為叔向者尚當區區以道維之姑教其君儉以守巳信以待鄰雖微未亡也若侈內而㬥外以暫屈人而為彊所謂攘臂而仍之其技窮矣二月己丑日南至梓愼望氛曰今兹宋有亂國幾亡三年而後弭蔡有大喪叔孫昭子曰然則戴桓也桓向氏注戴華氏汰侈無禮已甚亂所在也右昭二十年傳曰通天地人曰儒通天地而不通人曰伎至哉言也術如梓愼望氣而知它國之祥蓋天地不能隱其情然不足以知其人孰當之也至昭子聞梓愼之占則知其禍在華向竟如昭子言然則吉凶由人氛能兆之非氛所為也抑昭子可謂儒矣伍員如吳言伐楚之利於州于公子光曰是宗為戮而欲反其讎不可從也員曰彼將有他志余姑為之求士而鄙以待之乃見鱄設諸焉而耕於鄙右昭二十年世皆罪楚平王之信讒奪婦賊殺不辜而多伍員之忍詬含恥卒報平王蓋聲烈光於百世而如存而獨申包胥謂為已甚揚子雲亦論而非之然以員事言之鞭尸藉館未為已甚而始干吳王僚以伐楚而病公子光之不從若退而别求所以報楚尚或可也而知光欲篡至進刺客陷人殺君成已報父人誰無父僚何辜焉㫺之人求子者曰不以人子吾子其可得乎其言悲矣員誠以其父故不假避此而罪則當為世大戮晉士彌牟逆叔孫于箕叔孫使梁其脛待于門內曰余左顧而咳乃殺之右顧而笑乃止士伯曰寡君以為盟主之故是以久子不腆敝邑之禮將致諸從者使彌牟逆吾子叔孫禮而歸右昭二十四年晉以邾人之訴執叔孫婼館諸箕自以不敢廢周制不肯與邾大夫坐禮也恥以貨免而為不解獻子之求冠進其兩冠外弗與吏人之請犬殺而與食至於申豐以貨如晉將欲免巳尚已計留豐見而不出觀其意蓋義重於死如此以謂巳行人耳何所獲罪不幸而死顧不失義可矣其所館也一日必葺去之日如始至蓋處死者素定其暇豫又如此也及士彌牟將逆已而㱕而已不知謂將殺已陰戒其脛幾害彌牟異哉夫能忍無罪以死而不忍以計自全可謂義矣至疑彌牟來害已而欲戕之義安在哉始則不畏死終則欲拒命以死嗚呼其終始相忤不可知也已楚郤宛之難國言未已進胙者莫不謗令尹沈尹戌言於子常曰夫無極楚之讒人也民莫不知去朝吳出蔡侯朱喪大子建殺連尹奢云云鄢將師矯子之命以滅三族云云知者除讒以自安也今子愛讒以自危也子常曰是瓦之罪敢不良圖殺費無極鄢將師盡滅其族以說于國謗言乃止右昭二十七年詩稱取彼讒人投畀豺虎豺虎不食投畀有北有北不受投畀有昊讒人之可嫉而難去如是而沈尹戌一言以殺二讒安子常靖楚國於舜之功二十而二矣鄭駟歂殺鄧析而用其竹刑君子謂子然於是不忠茍有可以加於國家者弃其邪可也云云故用其道不弃其人詩曰蔽芾甘棠勿翦勿伐召伯所茇右定九年鄭自子産鑄刑書而叔向難子産固自以救世鄧析又改焉其不得已而用可知矣鄧析春秋時亂人之雄也破律改作王制之所誅夫天下無王而諸侯有政能使亂人不得作是乃駟歂之所以為賢也君子不以人廢言故鄧析雖邪竹刑有時而或用不以言取人故鄧析雖能為竹刑不足以救死而傳載君子之言謂子然不忠夫子然可為忠矣誅一邪臣不過忠於鄭去一亂人之雄忠於先王後世之人多矣而又以謂茍可已加於國家者弃其邪可也夫謂之邪矣何可以加於國家哉召伯之惠政在民其人賢故民愛而存其甘棠用其道不弃其人若召伯可也以比竹書異哉李斯為秦立法漢滅秦亦因之不害於治然漢用李斯可存之法則善使李斯而在漢雖欲不弃得乎哉又列子載鄧析被殺事異而意同曰鄧析操兩可之說設無窮之詞當子産為政數難子産子産屈之俄而誅之以謂鄧析非能屈子産不得不屈子産非能誅鄧析不得不誅雖不云駟歂殺之要鄧析之不可不誅列子亦云爾也初衛侯游于郊子南僕郢也靈公子公曰余無子將立女無大子蒯聵奔不對他日又謂之對曰郢不足以辱社稷君其改圖君夫人在堂三揖在下君命祗辱靈公卒夫人曰命公子郢為大子君命也對曰郢異於他子且君沒於吾手若有之郢必聞之且亡人之子輒在乃立輒右哀二年自古諸侯之子不當立無妄而求者多矣夫郢父在許之而不敢承父沒母立之而不肯立郢之賢且智蓋子臧季札之義也或曰畏禍夫一臂重於一國身貴於天下昜知也利在於目前禍伏於事後難知也孟子曰茍非其人以簞食豆羮見於色至蒯聵與輒父子爭國而郢超然立於無過之地郢之賢且智蓋子臧季札之義也師及齊師戰于郊右師奔齊人從之孟之側後入以為殿抽矢策其馬曰馬不進也林不狃之伍曰走乎不狃曰誰不如曰然則止乎不狃曰惡賢徐步而死右哀十一年杜預注魯非無壯士季孫不能使是也雖然不狃當伍非將師也恥誰不如而不走可也言惡足為賢而不止亦可也徐步而死以為勇乎則不戰以為怯乎則不走勇怯無當特怨乎不以而捐軀非以為名也是役也孔子得三人焉孟之反殿而䇿其馬曰馬不進也孔子曰不伐公為與嬖其僮取汪錡乘皆死皆殯孔子曰能執干戈而衛社稷可無殤也冉有用矛於齊師故能入其軍孔子曰義也汪錡死孟之反冉有不死皆見於聖人不狃之死亦義乎孔子將稱之不然不若不死矣故曰非死之難處死則難也濟北朝先生雞肋集卷第四十一
