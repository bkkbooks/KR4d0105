body:
  text: 第五十六卷啓謝授館職啓揚州謝執政啓齊州謝執政啓湖州謝執政啓上曾樞密啓南京謝李中書啓亳州謝執政啓亳州上李中書啓賀中書韓相公啓賀門下李侍郎啓河中府謝執政啓賀許左丞啓濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第五十六啓謝授館職啓誤緣公舉既不能引分而終辭濫俾試言又不獲竭愚而小補自宜汰斥尚玷題評秪有矜慙安知榮觀竊以挍讐之設始于漢氏之購書員品之增盛于唐室之好士故二代禮樂聲明之為備亦一時衣冠人物之使然惟麒麟延閣之華近閶闔鉤陳之邃至謂道家羣玉之府蓋象天官東壁之藏近稽有宋之隆専號育材之地故招來於間暇之日而官使於成就之時職非要而地嚴欲知其可貴祿已優而責寡使得以自修恭惟治平之初湥有講求之意詔四三輔選二十人當時彬彬最號得士厥後往往奮為名臣逮神􅊲之末年起治官之廢典是正蘭臺之秩以延虎觀之儒而龍胡莫攀風御已逺欽文母思齊之聖當成王求助之初咨謀大臣修舉故事繄詔書所以取之之意則欲其有行義政事好學而能文至策問所以考之之方又欲其知忠厚勵精扶衰而救溢竊思在上詳延之若是則觀異時施設之謂何宜得譽髦以副側席如補之者系出簮紱單平之後才非丘園耿介之良不意姓名之無聞乃煩丞弼之過聽昭回地近英俊朋來閲九奏於洞庭徒知神駭飛雙鳬於渤海更覺身微加以陟岵永悲臥漳久薾孤將五千之卒空有壯心立解十二之牛曾無敏手雖欲自勉竟不能奇考古不究其本根議政終成於迂闊主父屢困九事敢期於八收公孫太疏十䇿乃微於一得正使焦頭而爛額猶足為功真成毁瓦而畫墁尚容見食服訓辭之甚厚預刊緝以為榮非止見黃香未見之書以資雜博亦欲正劉晏不正之字固有愚衷靜言所遭良出於幸斯蓋伏遇某官幾微謀國忠藎致君湥明致治之原要在得人之盛不待文王而興自任伊尹之重蘇公即云傳百聖道為一世師大儒之效吾道方興多士以寧斯文永賴顧容淺陋亦誤采收昔班超以秉筆得令史而不慙陽城以愛書從院吏而自給彼皆慷慨有志之士敦朴可用之才茍得以文墨而效官則雖為卑賤而可喜而况加以樂育借之美名方朝廷耆艾之具來與巖穴幽奇之咸在世逢有道之會人望大平之期屬當是時乃在此選雖復中才之難強猶將奮發於有為補之願治氣養心修辭居業粗希前輩豈惟文字之末流未負平生儻以功名而自致揚州謝執政啓囊空坐笑輒傾將母之誠鈞播無私偶遂佐州之請意雖甘於逺外迹終涉於干摩伏自思惟良湥震栗竊以聖人在上孰不懷利見之心君子處躬蓋亦有常分之守智足以圖則當畢慮力可以任則宜竭能固有掃曹相之門而藉以求通客常侯之舍而因兹得召志義有在夤緣不嫌其次實事未聞虛名可貴所以樊英聘而漢稱得衆禰衡棄而魏為失人雖非車輿輗軏之利行猶曰園林鴻鵠之為觀凡是二者必居一焉如補之者質薄自憐學迂寡用陛下纂極之日羣公入輔之初旁􅊧廢捐不間疏逖亦預諸生之選入陪三館之遊朝廷清明官省間暇鵷鸞逸翮競髙舉於丹霄麋鹿野心終自懷於豐草仰慙教載之惠未知補報之期願試米鹽且親甘旨魏君幞被非見汰於盛時蕭子抱關亦各從其私好此蓋伏遇某官引君以道附衆以文養材無一介之遺建官必羣議之與發為久大故能贊於乾坤馴致中和蓋將興於禮樂夫何小醜首玷至公江陽故都民俗信美矧備倅二足竭疲駑尚假歲時不慙刻鵠之類鶩庶幾平昔未忍轉衣而為裳誓殫勤勞粗有寸尺仰酬覆燾之德次納甄陶之仁齊州謝執政啓擢躋中祕九換歲華丐補外官兩從私便惟愚疏之何有實幸會之已多弛負云初拊躬以惕伏念補之總角之歲粗習義方始冠之年即嬰家難奮飢寒而自立信詩禮以無師偶塵科名遂列學校至預讐書之選悉緣試藝而升蓬蒿仲蔚之園風雨子桑之屋技無庸而常佚老將至而自驚是以陪羣俊而蹲循思古人而緬邈自請試事庶幾食功還朝適已踰年於法又當為郡遂上煩於聽察因俯徇於悃悰假以名城榮其將母既無烹鮮製錦可採之譽滋有羸瓶脫輻不勝之憂斯蓋伏遇某官以道事君有功及物推明先朝典章文物之具崇養在位靖恭正直之心蓋欲羣工助成纍盛故茲優寄猥逮非宜忘朽木之難雕責駑馬以勿舍人安其分事可以興况復此邦素稱難治某自顧無術但知用心豈惟鄉飮盥洗才薄不足以化民亦恐柱後惠文威克未可以濟務尚稍寬於轡策得小假於歲時倘有秋毫上酬鈞造湖州謝執政啓承流已幸昜地更優荷平施之每加撫中情而屢愧伏念補之稟生鄙滯逢世盛明學術素疏入必更文字之選吏能何取出猶當民社之行且復數奇寡偶孤煢未隕之餘而幸刮垢磨光寬大兼容之際蕭條起廢局蹐臨官常欲隨其所遇而必竭筋力之能儻可無歉於心而粗塞廪食之責而况河東股肱要害之郡吳興山水清逺之邦不緣丐求繼用付畀未覺川塗之邈但知舟楫之安自顧何人所蒙若此斯蓋伏遇某官夔龍著業丙魏揚聲般役衆工雖各趨而皆當醫調百藥蓋異用而咸宜故此下材尚叨器使受恩必報思擁篲以無從陳力不能念乞身而未可上曾樞密啓召還禁闥擢二樞庭凡在陶鎔舉增慶幸恭以某官忠良舊望經濟閎才被遇先朝回翔近列文章潤色豈徒詔令之間樽爼折衝蓋出精神之動偉聖謨之獨運藹賢德以具來果膺揀圖首預機政某蚤緣世舊實被甄收悵坐縶於守麾阻趍承於台屏歡欣踴躍倍萬常情南京謝李中書啓不虔法守致速人言尚賴原情姑從降秩馳驅就道局蹐臨官荷天地之曲成玷鈞衡之平施重叨安便幾至涕洟補之聞大匠取材無不可施於繩墨中材見遇悉能自附於功名從古以然惟人所任而補之稟資朽薄處已拙疏被蒙國士之知塵汚文館之選未嘗試用於一事徒茲廩食者十年羣飛刺天自乘時而遇合決起控地獨揣分而退安蓋當庚午之冬即請廣陵之佐居然充數坐及成資以彼大邦凡更四守既憃愚之無補又施設之不専乃廢城闉有故亭榭數里而近歷年于茲至于昜弊為新增小使大以職事束於為二在人情或所不爭而又􅊲李宗諤祥符之圖稽皇甫湜長慶之記蓋莭使遊觀之舊有玉鈎摘星之名郡當水衝人昔目覩似聞杜牧之句別有雷唐之基明月揚州誰家水調此詩具在此地可求惟昧周防罔思輟止謂經營不急實牽連佐守之時然斧斤未加皆成就還朝之後文撿良在歲月可推非門牆髙誼已湥察其無它則菅蒯賤生亦安得有今日仍偶去官而會赦乃煩善貸而兼收第解藩麾旋霑祿養仰聖時之忠厚俯小已以驚惶斯蓋伏遇某官以道事君推誠與下無私足以助元化有容足以撫羣倫發為久大之圖馴致中和之盛故寬罪戾未遂棄捐失官與官從近得近使自為計不過若斯已幸匿瑕敢同車馬之不受尚為躍冶湥慙桃李之無言固當克謹官針益修士操信於知己雖後世淺夫慕義感遇之詞亦不失人蓋自昔君子成功立名之本補之願不忘舊德常在下風亳州謝執政啓以罪貶官偷安為幸因嫌易地得近已多每煩造物之仁秪劇中情之愧伏念補之本由寒鄙偶在選掄舍矢盡遲識野麋之至弱運斤不顧知社櫟之無堪同時館中最下郡守竊謂追羣髦則不足營一職其庶幾不圖迂疏尚罣咎悔量才揣分力如虎以安能計事言功食無魚而敢歎蓋既釋耒耜而在此則欲去斗筲而何之賴蒙矜憐不逺移徙斯蓋伏遇某官引君于道附衆以文方薰陶乎大和以積纍於至治故記嵬瑣不終棄捐某敢不慎跣之傷念鞭其後淹留抑末時亹亹而過中亮直敢云心怦怦其何極猶有異日寧忘至恩亳州上李中書啓夙被採收久知幸會訏俞地重敢復恃於門牆奔走位卑自宜疏於竿牘載寢興而念此終震疊而怛然蓋以十年之遇未酬一切之儀又闕坐恐魚鳥池林莫還遂令階庭踵武長掃飄零自力企慕更勤恭惟邇來調燮燕間神明勞相伏以某官贊天化育為士宗師學隘囷倉曠山川之受納文非纂繡耿經緯之昭回既剛毅以有容亦柔嘉而維則此老氏嘗稱君子之盛德抑仲尼所謂善人之為邦加以遵正􅊲父之益恭兼萬石君之至慎良法美政世但見於持循密議逺圖中已殫於裨補要使禮刑達而內敘兵食足而外賓副上主求舊之心終先朝用儒之效此大雅意寧衆人知而補之幸逢休明偶脫泥滓亦欲憤發自見毫毛孤植難伸良辰不與平生狂狷之尚中年期待之私一事莫諧三歎何補獨竊比漢臣之自誦忘本則難豈徒如魏虜之感恩必報而去第以賦分薄而造物不能厚稟資拙而匠石無由工開籠鵠失而始驚捩手羮空而自笑迷塗未返壯日已賒惟激烈之素懷則蕭條而長在每羞王密謁楊震之意猶鄙谷永謝王鳳之詞使愚無似有宣光不比之稱則賢我公乃獻子可賀之舉然而志闊事忤才疏效遲下若戰國公子之市名當時羣豪之赴義猶可蒯緱彈鋏預三千客而有魚或能左手捧槃招十九人而俱歃此自不果它復何言第依庇存姑逭疵悔念虛死不如立節而止謗莫若自修鶴鳴逺而終聞蘭生幽而亦佩誠足動金石則有不誠無不動信可行蠻貃則有不信無不行奔踶可馴千里要煩於良馭鉛刀且弊一割更繄於善操重惟左右以主張吾道之公有識拔後輩之譽取人以恕得士多賢彚茹而升簮履皆在醫門容疾富績仁鄰寧其中棄之乎既已辱收之矣用此自信獨無介然若唐兩生奏記當路至願為燎供席蒸芝效祥顧有義焉何至是也更望日崇令問益被眷圖早正台衡大庇倫品不惟一士獨荷至私方屆寒涼尚賒侍省伏乞為上自夀副人所瞻下情無任鄉往傾頌懇切之至賀中書韓相公啓伏自頃者初膺眷任入預政機屬時三館之虛已在諸生之選間因造請似辱收憐然闕門之外已疏而朝廷之間甚密絶編志墮越俎義慙言不獲伸事無所試上辜期待分絶激昂既流落於州麾旋顛危于管庫伏遇左右卷舒以道從違在公雖均佚於留居尚倚平於世論慮以罪衊仰玷生成故門牆之問莫修而魚鳥之情愈闊側聞枚卜峻陟鼎司遐徼同音歡呼共慶即日伏惟圖國有道自天降休恭以某官剛大直溫柔嘉寬栗山嶽不動江海有容蹈君子之中庸知古人之出處皇天祚聖治世立賢煒仁祖之規摹有魏公之風烈大數已得末流易防一昨初聞命行繼覩章下忠合上慮義激士心豈惟以千秋一言而取封蓋將試元崇十事而後入以謂可否分年而異處忠邪指類而並驅米斗至於千錢民室幾於九去此方今公患之至急與當寧軫憂之最湥乃大臣先已究知則天下夫復何慮然可否但繄於審訪而忠邪正懼於難分虞氏豈非用大中成周可謂建皇極既憂讒説之震亦病叨懫之欽嘗聞去蟻以培隄未有留蠧而蕃木母疾之已甚則固可姑存而勿論則實難彰疸不淆勸沮乃立理有萬慮行非一歧同何必親疏豈皆異魏舒始似無取鄭朋初若可通安得遽知要因久見必使左右皆正直內外無欺誣則可否自陳於前是非不核而定成周虞氏乃得庶幾皇極大中于焉攸敘憂糴恤莩尚何足言休兵務農便可無患然補之處疏逺而謀近懷蹇淺而計湥亦恃十年嘗承一盼重念補之稟資頑鄙賦命奇窮勤苦幼能乖違壯日憂虞晚節摧絶盛時不别不白以得嫌無拳無勇以蒙垢遭譴逺徙重罹閔喪終亡僅存再被竄逐邅回五六年內往返九千里餘未省蹊田亦遇奪牛之罰何嘗盜肉猥逢鬭犬之還不死濤淵稍佐民社世當至德之運人望太平之功拾穗行歌問百年而如此飯蔬沒齒甘一介之當然豈敢謀身尚懷報主耿耿自信昭昭實臨更願尊所聞之髙明躋斯民以仁夀造次啓沃終始持循然後朝廷四海蒙逺猷大夫庶士無遺患國是永建家聲益隆以副上之倚毗以慰人之頌望旅瑣方困閽髙莫親賀門下李侍郎啓伏自頃者端亮得讒留居均佚旋失芘休之賴即懷顛沛之憂茫無事倪若有期會滄溟不改歎自蕩之波臣天雨何心笑流行之木偶單舟將母逺道遘凶忠兼孝以兩虧影與形而相弔人理斯酷生望莫蘄矧未至於怨仇仍重罹於竄辱實虞罪垢更纍已知故卵翼之惠山隆而寒暄之儀響闃諒惟大雅闊此細圖不然孤生安取今日再聆柄任增激歡悰伏惟即日鼎燮勞心天休助順恭以某官江河致逺柱石扶危文能附而武能威剛不吐而柔不茹體和為決以厲濟溫中正而通優遊以法謀議逺而始驗誠信久而後彰故於仁聖之勃興復以勳賢而首用雲行雨施魚躍鳶飛九重開皇極之言三事起協恭之慮不為巳甚乃見至平民誦斯言士知此意然有道也由是廣之而補之稟資甚頑賦命至薄駑駕難企龍門誤登垂十五年間挽推已至行五十歲矣跋疐奈何抱瑟自憐毁車欲去奪蹊田尚為有罪況乃初不蹊田赦食馬猶足求功而又未嘗食馬滌器不慙市上受經自所獄中粳核而肥卑溼亦夀似梟集者多矣何必更占異雞鳴者有之惟知不應既非意可以遣者亦往事安足論哉第以少嘗妄計於進為老欲不虛於期待屬重光之撫運與百執以同升偶脫濤淵稍佐民社起死之恩既厚捐生之誓益堅且緣心困而慮衡更識言難而行訒噎因戒食折自知醫審曲則全悟孫以出正爾局促轅下何由頴脫囊中重惟左右學窮象先識際綿炳固曰有容所以大無私謂之王而惟危故能論心非幾何以成務且事有可否易辨乃人有忠邪難分則欲開大中無忽近慮疏豈皆異同未必親袁盎始議絳侯後更獲助鄭朋初通蕭傅卒反見傷若此實繁胡可槩視察就義若渴之故審應問如響之情借曰比常好先亦意隨必有事造次啓沃終始持循顯則欲馬不敗羣隱則欲木無藏蠧公是若建朋黨必消如此而後天下國家蒙遠猷大夫卿士無遺患觀海恐漫睨柯足知雖未乏戴崇宴見後堂之頃然可無陸賈微言湥念之間竊自比龜智能靈人誠不思蠺飽不為己乃曹丘顧金掠美則安敢若魯連解紛無取其庶幾亦有命焉非所期也更望日崇令問益被眷圖蚤正冢司大庇羣品豈惟一士獨荷至私方戒寒涼尚賒待省河中府謝執政啓明恩起廢首玷劇曹衰疾便私尚叨名閫盡出鈞陶之巨賜寧同草木之無知引分每踰撫躬湥愧竊以讀書非無用之具固將圖試而求行事君當有為之時孰不願知而幸遇賢者奮身而任大中材隨類以效長寸隂尺璧之匪輕贏糧躍馬而恐後又如出蔀見日去盆望天所宜欣對亨嘉鮮明注目安有自為連蹇俯默向隅惟能技之不同故會逢之相邈如補之者稟生至薄涉世又疏違道德之初心獲聲名而過實畫蛇之足嘗奪飲而固宜蒙虎之皮或得攻而何怪一昨初湔謫籍即備史官以半生文字之中而白首江湖之遠忽蒙此選豈是素期故始榮所得而冒居終揣不能而知止屬饜為請與郡復優使自為謀不過如是此蓋伏遇某官柱石扶遠蓍龜見微直方大以正邦周遍咸而濟物雖良樂所過絶足為已空然和扁一經沉痼猶皆起將益收羣俊之助與共砥太平之功况補之嘗履閨臺今守民社未負韲鹽之學敢忘卵翼之私賀許左丞啓再膺制命入秉政機仁賢類升華夏均福恭惟某官徽猷甚遠廣譽早施文能附而武能威濟之以學剛不吐而柔不茹蓋出於中徇公滅私以退為進故能使兩朝而一節冠百吏而獨先上方總攬權綱詢謀治體務進中和之士以期久大之功民俗利疚之悉知人材能鄙之素識欽惟圖舊靡不蒙休而補之書生後來曲士寡與同形骸於樗櫟寄蹤迹於萍蓬伏念門下召還坤維之年再升鼇禁之日實緣典挍嘗蒞諸儒眷言賤疏以備三館不以年輩官聨之敻隔每于勞問與進而甚溫旋躋廟堂復在甄冶困屢空於甘旨求自效于米鹽似蒙奬憐不忍棄外藏中心而敢廢報知巳以未遑而素拙少思緣公獲坐尚以頃年之眚復更數赦之餘上煩貸全猶竊安便奪麾符者彌歲徙佐二者兩邦尤悔寧追省循已屢長鞭莫及固駑蹇之難驅大厦方成亦飛鳴而自喜悵坐縻於官守阻趨奉于鈞閎濟北朝先生雞肋集卷第五十六
