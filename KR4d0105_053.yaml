body:
  text: 第五十三卷奏狀辭免著作佐郎狀辭免實録撿討官狀足疾乞外任狀辭免國史編修官狀再辭免國史編修官狀奏舉趙元緒狀太學博士正録薦布衣陳師道狀濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第五十三奏狀辭免著作佐郎狀臣十月二十二日至開封府界準都進奏院送到敕一道伏蒙聖恩特授臣依前朝奉郎行祕書省著作佐郎承命非據踧踖以慙恭惟陛下膺圖之初上奉天心中考古道旁詢國論下酌民言其本在於正朝廷以正百官而其極蓋欲四方逺近莫敢不一於正者大明至公示以好惡故陟降始序畏慕立行則越百工庶位一事之虛茍非其人安得在此而臣才薄名晦方時起廢皆國之良顧臣何人流落之餘亦誤收録碎首糜軀無以報稱伏念臣頃當先朝初政之際已預諸生三館之遊今所除官亦臣舊職況千載一時人思自效雖臣器小用近猶知欣喜激昻不應僭瀆妄有辭避第昨坐譴斥無它指名秪緣非才竊處清貫加以素寡學問憂虞積年凌雜米鹽益加荒陋豈可復爾濫迹書林不懷梁鵜濡翼之羞以重澤麋蒙皮之誚又臣飄零寒窶私計百為實難黽勉遽處京局伏望聖慈俯察螻蟻悃款之情特寢成命且令臣赴河南府新任或賜别除京東沿流一合入差遣誓殫駑蹇仰答生成見迤邐赴闕聽候指揮干冒宸嚴臣無任惶懼隕越之至辭免實録撿討官狀臣今月十八日準閣門告報奉敕除臣尚書禮部員外郎充哲宗皇帝實録撿討官聞命踧踖不知所裁恭以先朝大典千載之傳豈臣淺陋可備纂述伏望聖慈特錫寢罷所有敇命臣未敢祗受足疾乞外任狀右臣被蒙器使兩更郎曺未有秋毫可圖報稱而臣舊苦腳氣春夏加劇湥懼職事或致曠闕伏望聖慈察臣誠懇特賜除一外任合入差遣辭免國史編修官狀右臣四月四日準閣門告報奉敕除臣神宗皇帝國史編修官選掄誤及局蹐難勝恭惟神宗皇帝盛德大業光映百王將欲發揮潤色傳諸千載必得名儒碩學參備討論而臣才識卑冗詞技淺薄使預筆削誠非所宜兼臣先以疾病奏乞外任伏望聖慈特賜寢罷成命除臣一外任差遣再辭國史編修官狀右臣昨奏乞寢罷國史編修官除一外任差遣尋準尚書省劄子奉聖旨不許辭免臣以位卑人微不敢於浹日之間屢瀆天聽黽勉就職載惟神宗皇帝稽古制作跨唐軼漢形容巨美史臣司之如臣自視恐殫竭不足以塞責昔倪寬有言使羣臣得人自盡終莫能成惟天子建中和之極金聲而玉振之況今陛下並建羣才可試者衆臣誠何人敢獨昧冒伏望聖慈特賜指揮撿會前奏施行臣無任惶懼隕越待罪之至再辭免國史編修官狀右臣先於三月中以疾奏乞外任繼蒙聖恩自實録撿討官除國史編修官臣聞命局蹐不遑寧處既具奏乞賜寢罷成命撿會前奏施行尋準尚書省劄子奉聖旨不許辭免臣懼久稽敕命黽勉就職然夙夜恐懼終不敢安遂再曾具奏亦是乞賜撿會前奏除一外任差遣未蒙指揮恭以神宗皇帝國史紬繹嵗久未奏成書聖謨王制天髙海闊方兹分命諸儒參稽全美豈可以臣淺知猥預其間加有負薪之憂犬馬力殫躊躇難強若臣不揣分量茍貪榮選蕪纍信史辜奉明恩則異時雖填委溝壑何以塞責伏望聖慈矜閔臣下才無堪早賜撿會纍奏除一外任差遣臣不勝隕越待命激切之至謹録奏聞伏候敕旨奏舉趙元緒狀伏見本府居住朝奉郎新差監在京物料庫趙元緒父故太子少師致仕槩在仁宗朝與韓琦曾公亮歐陽修同執政時仁宗初命英宗領宗正槩言宗正非所以為重乞立為皇子後預顧命定䇿立英宗嗣大寶功施社稷同時勳臣之子皆蒙次第褒擢多已通顯而槩之嗣子獨沈常調簪組之傳不絶如線元緒刻意承家學問自立吏事足稱勘會知揚州蘇頌知應天府何正臣權京東轉運副使吕溫卿皆嘗論槩之功薦元緒之才可備任使未蒙施行臣竊覩神宗在東宫答槩書云首定大䇿固已措時於久安世蒙顯休方當與國而長懋槩之有勳王室事固灼著其墳墓居第在宋嵗時闕人照管伏望聖慈撿會前後臣僚奏乞特賜甄録其子元緒與一南京差遣庶以廣國家求舊念功之美意而勸臣子之為忠孝者太學博士正録薦布衣陳師道狀竊以朝廷患庠序不本於教而糾禁是先學者不根於古而浮剽是競故選置舊學削去苛規為之表儀使有趣向所以助成風化實繄得人伏見徐州布衣陳師道年三十五孝弟忠信聞於鄉閭學知聖人之意文有作者之風懷其所能湥恥自售恬淡寡欲不干有司隨親京師身給勞事蛙生其釜愠不見色方朝廷振起滯才風勸多士謂如師道一介亦當褒采不遺伏覩太學録五員係差學生見今有闕師道雖不在學籍而經行詞藝宜充此選某等職預考察不敢蔽而不陳伏乞選差師道充太學録儻不任職某等同其罪罰謹具申國子監乞謄申禮部施行濟北朝先生雞肋卷第五十三
