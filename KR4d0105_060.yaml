body:
  text: 第六十卷祭文北京為神宗靈駕發引告祭文河北轉運司告祭文河北提舉司告祭文禮部為欽慈皇后發引百官告祭文北京祭留守王太尉文北京國子監奉詔封孟荀揚韓告先聖文詔封孟荀揚韓告先師文筮地告先考著作文告六叔父寺丞文北京祭措置李宣德文除夕祭北京教授廨土地神文罷齊州先塋焚黃告祭文代澶州韓諫議祭河文代祭龍女文國子監祭司馬溫公文館閣祭呂申公文代尚書侍郎兩制祭魏王文祭歐陽文忠公夫人嶭氏文同李昭玘陳察祭贈太師李公文代王資政祭李少保文祭陜州二叔父文祭外舅兵部杜侍郎文祭南京留守刑部杜侍郎文濟北朝先生雞肋集目録終濟北朝先生雞肋集卷第六十祭文北京為神宗靈駕發引告祭文薤露朝晞歎九齡之夢闃宫車晏出驚七月之期臻崩天增𣏌國之􅋠喪􅊲切堯人之慕因山克就同軌具來羮牆痛劇於中宸弓劒哀纒於羣辟安知帝所逍遙廣樂之觀空有人間惆悵汾河之詠戒塗雒鞏接軫大伾竊守提封是䖍告享風雲改色羽衛無暉背通汴之神皋指清伊之吉壤惟宗祧傳聖謳歌訟獄以咸㱕而功德在人禮樂政刑之未悖不顯亦世無疆惟休臣等祗奉官針阻瞻牆翣攀號莫逮灑血摧心河北轉運司告祭文昊穹不弔仙馭難追爰諏七月之期是届萬方之軌邈鼎湖之龍去天上景長空汾水之雁飛人間事改纘服懋重熙之化見牆昭大孝之􅋠矧茲臣鄰以逮黎庶仰瞻何所劈踊寧堪法仗載嚴悲笳互咽乘白雲而安往刪黃鳥以無從惟夫神功莫大而難知固與景命俱傳而不息臣等各縻官守阻望靈輴徒有忠誠攀號灑血河北提舉司告祭文因山之制七月遄臻同軌之期萬方咸在弓劒留鼎湖之慕衣冠餘渭水之􅋠憭栗徂秋已變風雲之慘凄凉入夜更增笳鼓之悲虞牆徒劇於見堯夏服仍勤於纘禹蓍龜告吉陵寢即安刪黃鳥以無從訴蒼穹而何所惟神功不宰固妙物以難知且聖祚有㱕宜與天而俱永臣等孤忠徒切行奠莫追西望靈輴攀號雨血禮部為欽慈皇后發引百官告祭文媯為舜氏本明德之方興陳以滿封實故家之始大豈特活千人而有祚固當流八世而莫京允屬盛期篤生碩媛葛之為綌儉可化於女工雞則匪蠅庶無憎於朝事是用膺天眷命開國慶基肇鳥至之禋郊肆龍飛之澤㝢而不逮東朝之養已驚仙馭之遙抱泣珠襦初啓南阡之宅伸哀寶册載嚴西寢之封邈永裕之真游靄欽慈之徽號雲章五字忍聞追逺之聲風動萬人咸識因親之化將以貽休有煒垂佑無疆臣等陳力官聨羞誠祖奠靈輴莫駐摧隕何堪北京祭留守王大尉文維元豐八年八月某日某官某等謹以清酌庶羞之奠致祭于故留守彰武莭度王公之靈曰書載箕子為武王陳洪範嚮用五福竊嘗有言天不能畀人福也曰有嚮用者焉惟君子好德故能受福于天㫺賈誼以能誦詩書屬文起家洛陽生十八年豈如公孫區區春秋雜說白紛始也如推上乎菑川惟仁祖以仁覆天下天下含餔鼓腹不知上德之然其文章爾雅同風漢氏繄公所以潤色公不有而誰先其入翰林丞御史尹開封使三司而士相與賀者公且執天下之權其領十五州守三都以使南院班二府者公雖不大用而位亦益遷粵主上稽古􅋠道未有命戒先耆艾者將以乞言乃方叔元老維曰壯猷豈其驒驒久董夫戎旃謂公當促舍人之裝而公方且導引辟榖欲棄人間之陋從赤松以翛然奄乎不知何往意者以形為蜩甲其不與物盡者固已飄乎委去而登仙躋公堂以縮酒猶髣佛乎平日而僾然帷几莫我覿而悲填若夫勤勞啓沃心存天下垂五十載者則豈惟其僚屬之所私詠而燦然不泯有旗常兮茲傳北京國子監奉詔封孟荀揚韓告先聖文維元豐七年月日河南府左軍巡判官充北京國子監教授朝補之謹以清酌庶羞之奠敢昭告于至聖文宣王曰㫺周失厥道紀綱用微惟時夫子杲杲出日披其重祲為萬世明夫子既沒揚墨是肆爰有孟氏詞而闢之荼蓼既薅嘉苗孔殖于今其功人以配禹俾遇夫子蓋顔淵徒自時百家􅑣午竝作承孟氏後荀况揚雄降秦終漢教用不隕俾夫子道炳然復彰魏晉而還文事滋落學不為已其舌肆好猗歟韓愈始以文顯厦屋將覆勇於敢扶唐三百年斯人惟偉天啓我宋咸秩無文追求四賢崇以爵號從夫子後不瑕有光更千萬年學者咸仰今有司承詔封孟軻為鄒國公與兖國公同配食荀况為蘭陵伯揚雄為成都伯韓愈為昌黎伯竝從祀謹撰吉日以告尚饗詔封孟荀揚韓告先師文維元豐七年月日河南左軍巡判官充北京國子監教授朝補之謹以清酌庶羞之奠敢昭告于先師兖國公曰㫺我夫子有徒三千惟公好學未達一間爰有孟氏聞而知之與公異時合若符莭孟氏既沒荀揚嗣興是三大儒吐詞為經末流至唐篆刻是騖有賢韓氏奮而學古達道之塞于儒有功微言賴茲不絶如線粵宋七世咸秩無文卷龍鷩冕曰公若伯從我夫子興吾先師洋洋俱傳百世不熄今有司承詔封孟子為鄒國公配食文宣王荀子為蘭陵伯楊子為成都伯韓子為昌黎伯竝從祀謹撰吉日以告尚饗筮地告先􅊲著作文維元豐七年十月日男補之將之謹以清酌庶羞之奠告于先􅊲著作之靈曰㫺我先人率德顧弗永年乃不肖子補之將之不能必成葬不以時乃尚宦學四方惟歲時望祭有靦肆卜我先祖魚山故兆唯吉土十月乙酉是堋用大定我先人之宅遣車既飭惟不肖子補之將之悽愴怵惕殞越于地則亦靡及尚饗告六叔父寺丞文維元豐七年十月日姪濠州團練推官知壽州夀春縣事充北京國子監教授補之謹以清酌庶羞之奠告于六叔父寺丞之靈曰㫺我叔父事親竭力夙以孝聞薰然慈仁見謂鄉黨宜貴宜富宜夀􅊲多子位祿弗究以不永年承其後者藐然一女補之念此常痛于心惡衣菲食用克㱕匶于魚山之宅十月乙酉是堋前我先祖後我先人筮曰宅此惟安乃歲時薦享則有先人之不肖子補之在乃先人之祀未墜于地則我叔父飲食如生惟我先祖先人實聞斯言尚饗北京祭措置李宣德文維元豐七年月日具官朝補之謹以清酌庶羞之奠致祭于故措置司句當公事李君漢舉宣德之靈曰嗚呼漢舉志如鴻鶴可使戾空而弊羽毛乎汚澤才如泉阿可用剸玉而頓鋩刃乎腥膻仕弗充乎其位夀弗究乎其年理有是而更非喟誰者其使然抑造化之範人亡豫奪之或偏謂人心其不平分薄厚乎愚賢嗚呼漢舉別幾何時黃葉在戶而車而馬翣者稱遽酤酸肴昲君往不御惟有涕洟東門之路何以遣哀㱕安其故尚饗除夕祭北京教授廨土地神文維元豐七年十二月晦具官朝補之謹以清酌庶羞之奠祭于土地之神曰聞之福莫長於無禍故古之君子祭不欲祈補之不才承乏三年于茲將代而去矣賴神壅培弗罹于咎祈則何敢報可忘乎恭薦菲詞惟神鑒此尚饗罷齊州先塋焚黃告祭文紹聖二年二月八日男左承議郎充祕閣挍理新就差通判應天府南京留守司畿內勸農事武騎尉補之謹以清酌庶羞之奠敬祭告於先君著作朝公之墓曰補之不肖始葬先君之三日還官于魏其後忝命入館登朝為州逮茲謫官凡十一年而後始獲拜奠墓下楸柏盡拱而不肖子補之尚宦遊四方不能反田里奉灑掃怵惕隕心今天子以元祐壬申十一月甲子冬至郊見天地凡在庭之士皆得追榮其先人初以左奉議郎告于第恭承光命既慙以哀惟是先君之潜德隱行天其或者尚將大之在它子孫非不肖子補之獨能致此謹撰日以告尚饗代澶州韓諫議祭河文維年月日具官韓某謹以牢醴之奠告祭于靈源王之神曰天子以季秋祗見合宮禮成告祭及河喬嶽罔不率舉而某位古諸侯境內之祭得預行焉惟神聰明正直國有典祀靈長之性並千七百載厚地而不泄坎德既平則惟神祥以茂昭聖天子之功神之血食終古豈不韙歟尚饗代祭龍女文維年月日某官韓某謹遣某奉命服詔敕以牲酒之奠告于神濟夫人之神曰有天下者祭百神故五嶽四瀆古有典祀而山川之靈其福足以仁其一方者則天子亦為之崇禮秩嚴貌像所以為施報甚美也惟神聰明産德于幽其亦歆天子之嘉命允翕巨川砥寧北方則神之名號惠澤洋洋與河亡窮豈不休哉尚饗國子監祭司馬溫公文維元祐元年九月日具官某等謹以清酌庶羞之奠致祭于故丞相司馬公之靈曰嗚呼公乎寬栗柔立根于明誠進禮退義世為重輕千乘不居古稱好名公乎不然志合則行布被脫粟他人為詐公乎不然則以身化公臥洛師閉關却掃深衣講道將以是老公㱕朝廷路車乘馬扶攜襁負民拜于野聖母神孫在宫載祗公率其官正人具來誠心行義令出而聽國安九鼎大勢已定民以法治法勝則煩譬如魚噞則清其源賣刀緣畝盜豈得發茍無欲之雖賞不竊裴公處內如不勝衣問其貌年威行四夷楊公入輔曾未幾何毁第減騶人去其華忘身憂國晚以骨立生非其厚所愛民力有來逺縣廢食與言問民而沒反席未安帝祗合宫公薨訃聞徹尊往臨追胙故溫公薨季秋甲戌暮雪民憂歲寒相諺未褐聞諸道路信有斯言曰公在天胡俾我寒以勞定國人曰宜享何以知之家有公像生為民望其沒亦神公乎何憾悲者世人尚饗館閣祭吕申公文維元祐四年月日具官某等謹以清酌庶羞之奠致祭于故平章司空吕公之靈曰嗚呼大人之德如山如川作鎮九州經營幅員國有大人君尊而榮地有山川氣傑以靈豈惟寶藏百貨所養惟其髙深物則固往善觀國者庶其在茲無象太平望而知之季札觀樂興衰以喻見蘧伯玉知衛無故秦使入楚楚寶為陳昭奚恤在知楚有人楚衛區區何足與謀有是二臣以雄諸侯如虎在林如龍在淵何必風雲其威自然小才近用則不若此方圓殊施文武異事一官得人則一事行比事得失非國重輕嗚呼公乎敦大中和代天之工道固逶陀處厚持滿彊者莫先清心守默辨者莫前是惟元宰三公之德豈如淺智物我異職魏公典籌初不自矜既執弓矢人服其能徐公行義亦既有常世自奢儉吾無低昂巍巍兩朝盛德髙名內則國幹外則長城沈幾入告成敗先定家人不知矧復百姓羣言竝進不尸其德使公議安人享其澤二聖統臨公秉政機垂紳搢笏百辟是儀征繇不興盜賊先改商賈阜通九河輸海謂法未具滋章已除謂財未充民氣已舒謂人未用忠賢既立謂逺未賓羌戎貢入太平之功可指日冀人之無祿天不憖遺兩宮震悼庶民嗟咨哀榮典冊禮盛一時某等在廷辱公品職陶冶之公無所㱕德旗斿簫鼓送公國門攄詞隕涕侑此酒尊尚饗代尚書侍郎兩制祭魏王文維元祐四年月日某官某等謹以清酌庶羞之奠致祭於故魏王之靈曰周建同姓錫之山川康叔伯禽魯衛惟賢漢懲秦餘非劉不王矯枉過中尾大股彊魏之宗盟禮勝恩疏給羸卒百徒隸與居粵千載來以州郡理宗子維城名存實廢作蕃于國匪地惟賢惟賢有德亦國之蕃漢於孝王欲常常來以家人禮燕喜且諧兄弟無逺曰親親仁留不之國亦以厚親嗚呼魏王仁孝忠誠威儀卒獲近其性成豈惟河間講禮修樂豈惟東平為善最樂惟神母子惟帝叔父尊無與隆恩何可二在人之情再命儛車貴極富溢以勤儉娛作邸于京實親賢宅俾宗室良咸有矜式玉帶魚金顔如渥丹云何不淑而不永年兩宮悼驚豈惟在廷詔追榮之以魏大名使河山微與國永寧五月而葬禮則有制卜逺歲宜以恩奪禮衣裳在堂旗斿在門詞以伸哀侑此一尊尚饗祭歐陽文忠公夫人辥氏文維元祐四年月日某官某等謹以清酌庶羞之奠致祭於故文忠歐陽公夫人辥氏之靈曰嗚呼夫人慶纍世儲簡肅惟父文忠惟夫象服委蛇湯沐大都世間所乏豈富有貴髙門鼎食里屬垣比惟有德者愈久彌長或微或興微興有光惟㫺文忠名擅一時于今學者孰不仰之矧夫人子聨職文館升堂拜母恨相從晚生乎可拜沒饗亦禮庶幾誠心歆此醪醴鳴呼哀哉尚饗同李昭玘陳察祭贈太師李公文維元祐四年月日某官某等謹遣某以清酌庶羞之奠致祭于贈太師李公之靈曰自㫺布衣起家之士必其學可用德可立而才可為近可以利當世而逺可以遺後人兼是三者公侯之器至其莫施時則不暨公魏大姓世豪以資散其千金負笈求師爰以進士得官天聖抱其所能而止一令造物報人微與之期是生左丞出秉政機河齧其原用改斯卜襚以龍章西山之麓曰子曰孫有公及士服其命服承此祭事生雖莫施而沒顯名有表其阡邦人所榮某等於公其生既後咸以賤貧左丞所厚不獲相事一官所攖馳詞侑奠亦以抒情嗚呼哀哉尚饗代王資政祭李少保文維元祐六年月日具官某謹遣某以清酌庶羞之奠致祭于故致政少保李公之靈曰天之生才初罔不艱既畀之才其施復難王侯戚里兒童綺紈豈無其人鴆毒宴安宴安不懷於公見之非此其賢其才足施真宗之甥冀國之子五朝三世恩無與比鳳雛驥駒其生固竒置樊櫪間世寧識之仁宗恭儉四十二年峩冠大羽文武竝肩知公於親欲任心膂匪親則嫌或以嫌沮英宗退託未攬萬機公不自嫌語祕莫知念先朝意滋欲分政知而不以時則有命何以樂之樓觀池園退老于家虹霓屈蟠嗚呼哀哉自㫺和文折節好士人賢其賢不榮其侈公生又似好善有能富貴益恭人以是稱交游滿國搢紳有聞髙堂擊鍾驪駒在門尚想孟公投轄拒戶庶見聲子班荆道路嗚呼哀哉別幾何時人事變昜蘭亭觴詠俯仰陳迹褒終之典時則有加豈惟故人出涕咨嗟寓詞千里侑此尊俎衣裳在筵髣佛一舉嗚呼哀哉尚饗祭陜州二叔父文紹聖二年十月四日從姪承議郎充祕閣挍理通判亳州軍州管內勸農事武騎尉補之謹遣人以清酌庶羞之奠敬致祭于二叔父故知陜州祕監學士之靈曰我宗之牒鼻祖澶淵起國之初大于文元務德不華中微以囏自我先君諸仲叔季蟬聨世科將隕而起先君嘗謂叔父溫文捨叔父賢孰知先君施及不肖如親父子匪瓞之私自為知己嗚呼哀哉天禍我家先君早世孰憐其孤亦叔父志教之譽之人莫間之誤意先君鳴隂必和不知其子弱不克荷乃爾代匱丞中祕書叔父為監聨驂竝裾貧得守齊亦既陛遣病休不省臥憂展轉愚觸罪悔佐守宋京書來九返勞撫于行仕何足云匪姑息故愛緣其私則以尊祖今年在宋聞疾請州問安六輩信無報郵謂㫺不然知憊莫勉如何不淑隕命候館痛我家世善人日微非此其承其來益衰念此如焚血溢為泣怛然寐哭寤追靡及一官所攖奠不撫筵孰知此哀彼蒼者天尚曰幸哉其子如此不鄙為兄猶同父弟誓當與約彌逺益親如我叔父與先君存往不其亡此舌不吞嗚呼哀哉尚饗祭外舅兵部杜侍郎文紹聖二年十一月二十八日第五女壻承議郎充祕閣挍理通判亳州軍州兼管內勸農事武騎尉朝補之謹遣外孫女朝氏十五姐湘以清酌庶羞之奠敬致祭于故修撰侍郎丈人杜公之靈曰補之少日愚無師聞聞詩與禮子我先君先君為言公孝而賢汝長而師則公莫先從先君南年十有五方舟蘭陵遇公于旅會先君出出拜侍公籠鳬于階翛然異容曰此何為玩物喪志若斯其年一日千里念先君語竦然起驚公嚴而和導我以情却後五年初隨鄉舉過公濮陽與坐笑語謂為可教而不瑕疵申以婚姻眷言自茲㱕宜其家惟公淑女使寡悔尤亦公女助公仕浸顯官常百秩祿仁其宗逮孤與疾堂堂在廷如皋如夔至其胸中百不一施謂公仁人宜夀宜貴何辜于天而不憖遺國士之喪國士之哭失聲相駭逮於僮僕嗚呼哀哉人誰不死死誰則哀哀在哲人匪婚姻懷念公自養後己先人公疾而憂公非愛身衆雛墯地則各有命矧公賢子而憂不競生無世纍穅秕紛華沒反其真孰為我家謂公之知進乎此矣此言之聞公悲可止念公之女毁不圖生去五百里勉之使行一官所攖奠不親傴有孌其䈂公外孫女庶幾平生御此酒脯嗚呼哀哉尚饗祭南京留守刑部杜侍郎文維元符元年四月日第五姪壻孤子朝補之謹以清酌庶羞之奠敬致祭於故南京留守修撰侍郎七丈人杜公之靈曰嗚呼公乎如金如玉如松如竹雜於物而不變稟諸天之所獨而一旦毁折遂不可作耶移孝於事君移家於為治賢勞記於先朝名譽流於當世而竟不大任遂止於是耶惠故民愛之如父母敬故士戚之如兄弟而堂堂去此惟民與士驚心而隕涕嗚呼哀哉㫺我先君與公元昆義均同産人靡間言施及諸稚申以世婚兩宗一家無復彼此矧公與我自為知己我始筮仕教授北京公為主知而有盛名數言我才于公于卿自謂內舉退無愧情我後登朝亦官京師同衢接屋十歲於茲宴休戒我游觀載我忘年比義良朋待我而我少公十有六歲匪其志同于公敢輩公于學問尤長禮經至談百家顧嘗喜兵間同我論挺出崢嶸能賦與銘文章爾雅書記翩翩致足樂也自為餘事故罕知者年垂六十侍郎秋官平生經緯虹霓屈蟠白頭不召竟死為藩嗚呼哀哉我守濟南後公五載問民所安流風固在前有范李後有曾王粵有杜公于前有光嗚呼哀哉惟我不孝獲罪于天奉親南徙中罹禍還唁我弔我五書竝馳期我自逺匪婚姻私如何堊室泣血未殞斬焉縗絰承公凶問嗚呼哀哉自今以往我無知己雖其知者亦從風靡傾腸倒胃舌可捫矣尚想山立英姿傑氣庶幾神交百世之外嗚呼哀哉公喜我文喜同酒尊尚舉此尊尚聞此言嗚呼哀哉尚饗濟北朝先生雞肋集卷第六十
